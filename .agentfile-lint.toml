# AGENTS.md 的規則與上限（ADR backend/docs/adr/2026-10-31-agents-md-layering-consolidated.md）。
# 本機 hook（.pre-commit-config.yaml）與 CI（.github/workflows/repo-hygiene.yml）跑同一份。
# 模組 AGENTS.md 的七節以 R2 shape 為唯一來源；CI 用 new-module 產生一個模組再跑檢查（repo-hygiene）。
# preset:strict 保留 0.4.0 預設開著的啟發式規則（R3b、R4a、R4b、R5b、R6、C1 為 warn，重複比對任兩檔）；
# 0.4.0 起新增、沿用 preset 等級的：R1b 每檔 200 行與 R1e（warn）、R1c 一條路徑上合計 32 KiB（error）、
# SKILL.md（S）、settings hooks（H）、.mcp.json（M）。
extends = ["preset:strict"]

[discover]
globs = ["AGENTS.md", "**/AGENTS.md"]

# `next dev` 會寫回這個區塊，不算進大小。
[shared.size]
excluded_blocks = [
  { begin = "<!-- BEGIN:nextjs-agent-rules -->", end = "<!-- END:nextjs-agent-rules -->" },
]

[[rules.R1a.limits]]
glob = "AGENTS.md"
max_bytes = 12000

[[rules.R1a.limits]]
glob = "*/AGENTS.md"
max_bytes = 10000

[[rules.R1a.limits]]
glob = "**/AGENTS.md"
max_bytes = 6000

[rules.R1d]
level = "error"
max_chars = 500

[rules.R2]
level = "error"

[[rules.R2.shapes]]
glob = "backend/internal/modules/*/AGENTS.md"
sections = ["職責", "擁有的資料", "發布的讀取介面", "模組內部結構", "不變量", "不負責", "決策紀錄"]
mode = "exact"
title = true

[[rules.R2.shapes]]
glob = "backend/internal/modules/*/internal/*/AGENTS.md"
sections = ["不變量"]
mode = "exact"
title = true
purpose = true
bullets_only = ["不變量"]

[rules.R3a]
level = "error"

[rules.R3b]
base_dirs = ["backend", "website", "admin", "buyer-app", "seller-app", "packages/*", ".github/workflows"]
source_roots = ["src"]
resolve_extensions = [".ts", ".tsx"]
ignore_negated_words = ["沒有", "尚無", "不存在", "已移除"]

[rules.R3c]
ignore_before = ['設計書\s*$']

[[rules.R3c.specs]]
glob = "backend/internal/modules/*/AGENTS.md"
spec = "backend/docs/modules/{1}.md"

[[rules.R3c.specs]]
glob = "backend/internal/modules/*/internal/*/AGENTS.md"
spec = "backend/docs/modules/{1}.md"

[rules.R4a]
level = "error"

[rules.R5a]
level = "error"

[rules.C1]
level = "error"
mode = "forbid"

[allowlist]
max_days = 90
