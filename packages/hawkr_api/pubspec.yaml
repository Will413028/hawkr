name: hawkr_api
description: 對外 API（根目錄 api/ 的 Protobuf＋Connect）的 Dart 生成物，buyer-app 與 seller-app 共用。
publish_to: none

environment:
  sdk: ^3.8.0

# 生成器與 runtime 的版本一起固定：生成物依賴 runtime 的 API，升級時兩者一起升、重新生成。
dependencies:
  connectrpc: 2.0.0
  fixnum: 1.1.1
  # 分辨「沒收到回應」要認得 http2 的 TransportException（errors.dart）；版本與 connectrpc 解析到的相同。
  http2: 2.3.1
  protobuf: 6.1.0

dev_dependencies:
  protoc_plugin: 25.1.0
  test: 1.26.3
