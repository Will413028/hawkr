# repo 管理的本機 git hook。clone 之後執行一次：pre-commit install
# 既有 clone 要重跑一次，才會裝上 commit-msg 與 pre-push 的 hook type。
# CI 用同一支腳本檢查推上來的 commit（.github/workflows/commit-messages.yml）。
default_install_hook_types: [commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: conventional-commit-message
        name: Conventional Commits
        entry: python3 scripts/check-commit-msg.py
        language: system
        stages: [commit-msg]
      # 只掃要推的範圍，離線且很快；沒裝 gitleaks 時只警告（CI 掃完整歷史）。
      - id: gitleaks-pre-push
        name: gitleaks（要推的 commit）
        entry: bash scripts/pre-push-gitleaks.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
