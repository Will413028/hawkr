# repo 管理的本機 git hook。clone 之後執行一次：pre-commit install
# 既有 clone 要重跑一次，才會裝上 pre-commit、commit-msg 與 pre-push 的 hook type。
# CI 用同一支腳本檢查推上來的 commit（.github/workflows/commit-messages.yml）。
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # 規則與上限在 .instruction-lint.toml；掃全部追蹤的 AGENTS.md，所以不傳檔名。CI 同一份：.github/workflows/repo-hygiene.yml。
  - repo: https://github.com/Will413028/instruction-lint
    rev: a0078a45712c941f83a9516d0306c2a1706d0b3b # v0.3.0
    hooks:
      - id: instruction-lint
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: conventional-commit-message
        name: Conventional Commits
        entry: python3 scripts/check-commit-msg.py
        language: system
        stages: [commit-msg]
      # 只掃要推的範圍，離線且很快；沒裝 gitleaks 時只警告（CI 掃完整歷史）。
      - id: gitleaks-pre-push
        name: gitleaks（要推的 commit）
        entry: bash scripts/pre-push-gitleaks.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
