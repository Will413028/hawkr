syntax = "proto3";

// 對店家的檢舉（檢舉與食安通報同一種資源，ADR 2026-10-18-seller-governance-consolidated、step10e-reports-brief R2、R7）：登入的買家送出與查自己的
// 檢舉（SellerReportAppService）。這個 service 不要求賣家能力：
// 檢舉人是買家，不是店家。食品安全事件也由登入的買家以 CreateReport（類別 FOOD_SAFETY）檢舉，沒有匿名入口（ADR 2026-10-27-general-ecommerce-scope-cut D3）。後台的分案、設定結果與結案在 hawkr.admin.seller.v1alpha1 的 SellerGovernanceAdminService
// （後台稱「通報」與「案件」，檢舉人看到的是這裡的「檢舉」與結果）。
package hawkr.seller.v1alpha1;

import "hawkr/common/v1alpha1/accepted_values.proto";
import "hawkr/common/v1alpha1/policy_category.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/error_details.proto";

// SellerReportAppService 是登入的買家的檢舉。
service SellerReportAppService {
  // CreateReport 以呼叫者的買家身分檢舉一家店。店家必須是曾經公開過的店（BatchGetStores 回得到的；已關閉的也可以），否則回
  // not_found；店家屬於呼叫者的帳號時回 invalid_argument（store_id）。同一個買家對同一家店、同一個類別，一個台北日曆日內、
  // 還沒有結果的那一筆存在時，這次的內容補充到它（supplemented 為 true，report 是原本那一筆，notice 說明發生了什麼）；原本那一筆
  // 已經有結果時，這次是新的檢舉。原本那一筆已有 10 則補充時回 failed_precondition。每個帳號 10 分鐘最多 5 次、1 小時最多 10 次，
  // 超過回 resource_exhausted（帶 RetryInfo）。
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse);

  // GetMyReport 讀呼叫者自己的一筆店家檢舉：檢舉本身、補充與佐證。別人的或不存在的 report_id 一律回 not_found（不洩漏存在與否）。
  // 呼叫者的全部檢舉（社群與店家）的清單是 hawkr.moderation.v1alpha1.ModerationAppService.ListMyReports。
  rpc GetMyReport(GetMyReportRequest) returns (GetMyReportResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // AddReportSupplement 為呼叫者自己、還沒有結果的一筆店家檢舉補充內容。與 CreateReport 去重時併入的補充是同一串、同一個上限
  // （每筆檢舉合計最多 10 則），admin 看到的是同一串補充。別人的或不存在的 report_id 回 not_found；檢舉已經有結果，或補充已
  // 達 10 則時回 failed_precondition。每個帳號 10 分鐘最多 5 次、1 小時最多 10 次（與 CreateReport 同樣的額度，各自計數），超過回
  // resource_exhausted（帶 RetryInfo）。
  rpc AddReportSupplement(AddReportSupplementRequest) returns (AddReportSupplementResponse);
}

// ReportOutcome 是一筆檢舉的結果（step10e-reports-brief R2）。還沒有結果時，使用它的 optional 欄位不設值；UNSPECIFIED 不帶意義，伺服器不回。
enum ReportOutcome {
  REPORT_OUTCOME_UNSPECIFIED = 0;
  // 平台採取了措施（只會是案件裡的檢舉）。
  REPORT_OUTCOME_ACTION_TAKEN = 1;
  // 查過之後沒有違規。
  REPORT_OUTCOME_NO_VIOLATION = 2;
  // 內容不足，無法判斷。
  REPORT_OUTCOME_INSUFFICIENT = 3;
  // 與另一筆檢舉重複。
  REPORT_OUTCOME_DUPLICATE = 4;
  // 濫用檢舉。
  REPORT_OUTCOME_ABUSIVE = 5;
}

// StoreReport 是檢舉人看到的自己的店家檢舉。平台內部的分案（案件、嚴重度、處理的管理員）與轉報主管機關的紀錄不在這裡；
// 店名與 logo 由 client 以 store_id 呼叫 SellerPublicService.BatchGetStores。
message StoreReport {

  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string store_id = 2;
  // 空字串表示沒有提供。
  string product_id = 3;
  // 空字串表示沒有提供。
  string order_no = 4;
  // 檢舉人選的類別。
  hawkr.common.v1alpha1.PolicyCategory category = 5;
  string description = 6;
  // 平台給檢舉人的結果說明；還沒有結果或結果沒有說明時是空字串。
  string resolution_note = 7;
  google.protobuf.Timestamp create_time = 8;
  // 結果設定的時間；還沒有結果時不設。
  google.protobuf.Timestamp resolve_time = 9;
  // 結果；還沒有結果時不設（與 resolve_time 不設同時成立）。
  optional ReportOutcome outcome = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreateReportRequest {
  // 被檢舉的店家 id（店家卡片的 id，不是 store_code）。
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 檢舉的類別：只接受 accepted_policy_categories 列出的值，其他值（含 UNSPECIFIED）回 invalid_argument。
  hawkr.common.v1alpha1.PolicyCategory category = 2 [
    (google.api.field_behavior) = REQUIRED,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_FOOD_SAFETY,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_PROHIBITED_GOODS,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_UNLICENSED_SALE,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_MISLEADING_INFO,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_FAKE_CERTIFICATION,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_COUNTERFEIT,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_IP_INFRINGEMENT,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_FRAUD,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_OFF_PLATFORM_TRADE,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_PRIVACY,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_IMPERSONATION,
    (hawkr.common.v1alpha1.accepted_policy_categories) = POLICY_CATEGORY_OTHER
  ];
  // 檢舉內容，最多 2000 字。
  string description = 3 [(google.api.field_behavior) = REQUIRED];
  // 相關的商品 id，最多 64 字；可以不填。
  string product_id = 4;
  // 相關的訂單編號，最多 64 字；可以不填。
  string order_no = 5;
  // 佐證圖片的 staged token，最多 5 張。
  repeated string evidence_staged_tokens = 6;
}

message CreateReportResponse {
  // 新的檢舉；supplemented 時是原本那一筆（去重的鍵含買家，所以一定是呼叫者自己的）。
  StoreReport report = 1;
  // 這次的內容補充到同一個台北日、同一家店、同一個類別、還沒有結果的那一筆。
  bool supplemented = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // supplemented 時給檢舉人看的那一句（伺服器的句子：它說的是伺服器的去重規則）；沒有補充時不設。
  google.rpc.LocalizedMessage notice = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetMyReportRequest {
  // 檢舉的 id。
  string report_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetMyReportResponse {
  StoreReport report = 1;
  // 補充（去重併入的與檢舉人主動補充的合在一起），舊到新。
  repeated ReportSupplement supplements = 2;
  // 原檢舉與全部補充的佐證，依送出的順序。
  repeated ReportEvidence evidence = 3;
  // 檢舉人此刻能不能補充（還沒有結果，且補充數未達 supplement_max）；由伺服器判斷，與 AddReportSupplement 的前置檢查是同一個規則，client 不自己從結果與補充數推導。
  bool can_supplement = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 每筆檢舉最多的補充數（伺服器的上限，達到後 AddReportSupplement 回 failed_precondition）；client 用它顯示「n/上限」。
  int32 supplement_max = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ReportSupplement 是檢舉的一則補充；只新增，每筆檢舉最多 10 則。
message ReportSupplement {
  string id = 1;
  string description = 2;
  google.protobuf.Timestamp create_time = 3;
  // 這則補充帶來的佐證在 GetMyReportResponse.evidence 的 position。
  repeated int32 evidence_positions = 4;
}

// ReportEvidence 是檢舉的一張佐證。佐證是機敏檔：回應只帶它在這筆檢舉裡的順序，不帶檔案的網址。
message ReportEvidence {
  // 佐證在這筆檢舉裡的順序（從 0 起）。
  int32 position = 1;
}

message AddReportSupplementRequest {
  // 要補充的檢舉 id。
  string report_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 補充內容，最多 2000 字（規則同 CreateReport 的 description）。
  string description = 2 [(google.api.field_behavior) = REQUIRED];
  // 佐證圖片的 staged token，最多 5 張（同 CreateReport）。
  repeated string evidence_staged_tokens = 3;
}

message AddReportSupplementResponse {
  // 補充之後的檢舉、全部補充與佐證（同 GetMyReportResponse）。
  StoreReport report = 1;
  repeated ReportSupplement supplements = 2;
  repeated ReportEvidence evidence = 3;
  // 檢舉人此刻能不能補充（還沒有結果，且補充數未達 supplement_max）；由伺服器判斷，與 AddReportSupplement 的前置檢查是同一個規則，client 不自己從結果與補充數推導。
  bool can_supplement = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 每筆檢舉最多的補充數（伺服器的上限，達到後 AddReportSupplement 回 failed_precondition）；client 用它顯示「n/上限」。
  int32 supplement_max = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}
