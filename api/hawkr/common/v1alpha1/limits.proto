syntax = "proto3";

package hawkr.common.v1alpha1;

import "google/protobuf/descriptor.proto";

// Limits 是一個欄位的內容上限。max_items 用在 repeated 欄位（元素個數），max_runes 用在 string 欄位（Unicode code point 數，
// 不是位元組也不是 UTF-16 單位）。兩者擇一，必須大於 0。
message Limits {
  // 元素個數上限。
  int32 max_items = 1;
  // code point 數上限。
  int32 max_runes = 2;
}

extend google.protobuf.FieldOptions {
  // limits 宣告這個欄位的內容上限。伺服器照樣驗證，儲存端的 CHECK 與上限一致（由測試守）。
  // uitext-gen 讀它並生成 Go、TS、Dart 的常數，client 不再手寫數字。
  Limits limits = 50002;
}
