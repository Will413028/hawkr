syntax = "proto3";

package hawkr.common.v1alpha1;

import "hawkr/common/v1alpha1/image.proto";
import "google/api/field_behavior.proto";

// StoreCardStatus 是店家卡片上的營運狀態。
enum StoreCardStatus {
  STORE_CARD_STATUS_UNSPECIFIED = 0;
  // 營業中：此刻可以公開曝光（營運中、沒有停權、身分認證與 PayUni 審核通過、店名與 logo 與所在地齊全），有公開的店面頁，
  // 也可以被追蹤。
  STORE_CARD_STATUS_OPEN = 1;
  // 暫停：沒有關閉，但此刻不可公開曝光（停權、等待刪除、PayUni 被拒絕、身分認證改回草稿、缺店名或 logo 或所在地）。
  STORE_CARD_STATUS_PAUSED = 2;
  // 已關閉。
  STORE_CARD_STATUS_CLOSED = 3;
}

// StoreCard 是各處（訂單、聊天、收藏、追蹤、會員卡、推薦排行、BatchGetStores）顯示一家店的同一張卡片
// （ADR 2026-10-03-public-store-identity-and-visibility）。
//
// 可見性：只有「曾經公開過」（曾經可以公開曝光）的店家有卡片；從沒公開過與不存在的店家沒有，持有卡片的訊息以 store 欄位不設
// 表示「這家店不顯示」，client 不區分兩者（store_id 在過渡期連號、可列舉，沒公開過的店名不能被讀出）。
//
// 評分（review_count、rating_average）由伺服器批次組裝，每個回應只讀一次評價來源；讀不到時兩欄都不設，不讓整張卡片或呼叫它的 RPC 失敗。
message StoreCard {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // 店家網址的路徑段；只有營業中（OPEN）的店家有公開的店面頁。
  string store_code = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 個資清除之後（店家關閉滿保留期，6 個月）不設，client 顯示「已關閉的店家」。
  optional string name = 3;
  // 沒有設定時不設；已關閉的店家沒有。
  Image logo = 4;
  // 沒有設定時不設；已關閉的店家沒有。
  Image cover_image = 5;
  StoreCardStatus status = 6;
  // 內政部的 8 碼鄉鎮市區代碼（縣市是前 5 碼）；空字串表示不設（沒有填，或個資清除之後）。
  string town_code = 7;
  // 評價數；0 是確實沒有評價，讀取失敗時不設。
  optional int32 review_count = 8;
  // 平均評分，1 到 5；沒有評價或讀取失敗時不設。
  optional float rating_average = 9;
}
