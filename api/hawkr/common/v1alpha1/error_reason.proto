syntax = "proto3";

package hawkr.common.v1alpha1;

// ErrorReason 是錯誤 details 裡 google.rpc.ErrorInfo.reason 可以用的值，domain 是 hawkr
// （ADR 2026-09-25-api-error-model）。reason 放的是值名，所以值名不加 ERROR_REASON_ 前綴，與 googleapis 的
// google/api/error_reason.proto 相同（api/buf.yaml 只對本檔排除 ENUM_VALUE_PREFIX）。
//
// 只為 client 會分支的情境新增，而且只搭配 4xx 的錯誤碼。client 遇到不認得的 reason 時照錯誤碼處理。
// 上線（v1）之後值名就是契約：可以新增，不得改名、刪除或改變搭配的錯誤碼。
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // 依據的版本已經過時：修改時帶的 etag 與目前的不符（搭配 aborted），或以 key 建立時那筆已經存在
  // （搭配 already_exists）。client 保留使用者的輸入，並顯示最新的版本讓使用者對照後再送出
  // （ADR 2026-09-25-optimistic-concurrency-etag）。ErrorInfo.metadata 的 conflictTarget 可以說是哪一個物件過時，值由各 API 定義、
  // client 不認得時照一般版本衝突處理。
  // 商家治理（SellerGovernanceAdminService）：`report` 是請求帶的通報 etag 過時，`case` 是案件指令帶的案件 etag 過時，
  // `target_case` 是分案或移動要加入的案件不成立（版本前進或已關閉），`category_case_opened` 是分案或移動要開新案件、而這個類別剛有了進行中的案件。`authority_order` 是主管機關來函的指令（完成、延長保存、記下告知）帶的來函 etag 過時。
  // 採購（BuyerProcurementAppService、SellerProcurementAppService）：`request_revision` 是需求已被改版（expected_revision_id 過時），`candidate_set` 是候選集已不是需求現行有效的那一個，`publication_approval` 是發布核准已過時（已執行、已過期、版本不符、對應的需求版本或回價期限已不能發布），`publication` 是買家畫面上的詢價內容與賣家報價時依據的那份不同，`seller_response` 是賣家回價的版本已不是目前的（改價、撤回，或帶「尚無正式回價」卻已有一版；client 必須明確告知使用者報價已變動，不得靜默改用最新版重送），`run` 是取消用的 run 版本過時。
  VERSION_CONFLICT = 1;
  // 賣家帳號停權中，這個操作不在停權時仍可做的範圍（搭配 permission_denied）。client 轉成賣家的停權狀態：
  // 顯示停權通知，並以 GetMyStore 讀停權的來源與原因。
  SELLER_SUSPENDED = 2;
  // 商家名單的聯絡方式與其他未封存（進行中或已入駐）的業者相同、而且沒有標記為不是同一家（搭配 failed_precondition）。ErrorInfo.metadata 的
  // prospectIds 是相符的業者 ID（十進位，由小到大以逗號連接）。client 顯示相符的業者，讓管理員選擇合併，或確認不是同一家後
  // 在請求帶上 confirmed_distinct_prospect_ids 再送一次（ADR 2026-10-04-prospect-contact-points-and-matching）。
  PROSPECT_MATCH_FOUND = 3;
  // 商家名單的統一編號已由另一筆未封存（進行中或已入駐）的業者持有：建立搭配 already_exists，修改與還原搭配
  // failed_precondition。ErrorInfo.metadata 的 prospectIds 是持有者的 ID（十進位，只有一筆，格式同
  // PROSPECT_MATCH_FOUND）。修改時持有者是進行中的，client 可以讓管理員與它合併；還原時是同一家就不需要還原
  // （ADR 2026-10-04-prospect-contact-points-and-matching）。
  PROSPECT_TAX_ID_HELD = 4;
  // 賣家同意的入駐文件版本不是現行版本（搭配 failed_precondition）。client 重讀
  // seller.v1alpha1.SellerPublicService.GetSellerAgreements，顯示新版本，請賣家重新勾選後再送出。
  AGREEMENT_OUTDATED = 5;
  // 賣家做這個操作需要的前置條件沒有滿足（搭配 failed_precondition）：身分認證未核准，或店家正在隨帳號刪除。停權不用它，
  // 停權是 SELLER_SUSPENDED。ErrorInfo.metadata 的 missingRequirements 是缺的條件，值是
  // seller.v1alpha1.SellerRequirement 的值名（不加 SELLER_REQUIREMENT_ 前綴，例如 ONBOARDING_COMPLETE），依列舉的數字由小到大以逗號連接。client 先看 GetMyStore 的能力狀態，這個 reason 只是
  // 伺服器逐方法檢查的後備：重讀 GetMyStore，依缺的條件顯示。
  SELLER_REQUIREMENT_MISSING = 6;
  // 帳號停權中，不能申請開店（搭配 failed_precondition）；解除停權後可以再申請。client 顯示 LocalizedMessage，並導向措施與申覆。帳號同時有生效中的終止合作時是
  // STORE_OPENING_TERMINATED。
  STORE_OPENING_SUSPENDED = 7;
  // 帳號有生效中的終止合作（條款第 21.3 條；終止撤銷之前同一個帳號不能再開店），不能申請開店（搭配 failed_precondition）。client 顯示 LocalizedMessage，
  // 並導向措施與申覆。換身分認證被另一個帳號的終止擋下的情形不用它（隱私：不透露命中的帳號或欄位），那條路徑維持通用的 failed_precondition 與文字。
  STORE_OPENING_TERMINATED = 8;
  // 帳號擁有商店，不能被停權（搭配 failed_precondition）：停權對店家、未結訂單與撥款的效果由賣家條款決定，條款定出之前有店的帳號不停權。
  // 只出現在後台與內部的處分路徑；client 顯示 LocalizedMessage，請營運先處理店家（措施或關店），再停權帳號。
  ACCOUNT_HAS_STORE = 9;
  // 帳號停權中，這個操作是寫入，不在停權時仍可做的範圍（搭配 permission_denied）。停權的帳號仍能登入、讀取與刪除帳號：
  // client 轉成帳號的受限狀態，顯示停權通知，並以 identity.v1alpha1.IdentityAppService.GetSession 的 suspension 讀停權的狀態。
  // 舊 gateway 的 REST 路徑（/api/v1）沒有 ErrorInfo，停權的非 GET／HEAD 請求只回 403。
  ACCOUNT_SUSPENDED = 10;
  // 要連結的登入方式（Google、LINE 的身分）已經連結到另一個帳號，包含已刪除帳號留下的身分（搭配 already_exists）；什麼都沒有改。
  // client 顯示 LocalizedMessage，請使用者改用那個帳號登入，或換一個登入方式。
  // IdentityAppService.LinkIdentity（web 的連結走 /api/auth，不在 Connect）。
  IDENTITY_ALREADY_LINKED = 11;
  // 這個操作要求最近重新驗證過，而目前的 session 沒有（搭配 failed_precondition）：IdentityAppService.RevokeSession 要求目前的 session
  // 在 15 分鐘內以 provider 驗證過。client 引導使用者重新走一次登入（web 的 /api/auth/{provider}/start、App 的 ExchangeIdToken，
  // 登入會換發新 session），再重送。
  REAUTHENTICATION_REQUIRED = 12;
  // 帳號沒有聯絡信箱（沒有 provider 驗證過的 email，也沒有自填的），不能送出 KYC 申請（搭配 failed_precondition）：SellerAppService.SubmitKYC。
  // client 引導使用者在 IdentityAppService.SetContactEmail 填一個，再重送。
  CONTACT_EMAIL_REQUIRED = 13;
  // 要建立內容下架措施的內容已經有生效中的內容下架措施（搭配 failed_precondition）：一則內容同時只有一個生效中的下架措施，恢復時才不會撤銷一個、
  // 另一個仍讓內容維持下架。client 顯示 LocalizedMessage 並重新讀取列表（列表會顯示既有的下架）。
  // AdminSellerService.CreateMeasure 的內容下架；moderation 的 DecideCase TAKEDOWN 遇到時不報錯，改綁定既有措施。
  CONTENT_TAKEDOWN_ACTIVE = 14;
  // 這個訂單項目已經有評價（搭配 already_exists）：一個訂單項目至多一則評價，評價建立後不能修改。已有的評價可能已被平台隱藏，
  // 隱藏的評價不在 ReviewAppService.ListMyReviews 的結果中：client 顯示「已評價」並不再提供寫評價入口，不要再開寫評價，也不要依賴 ListMyReviews 找回那則評價。
  // ReviewAppService.CreateReview。
  REVIEW_ALREADY_EXISTS = 15;
  // 訂單目前不能評價（搭配 failed_precondition）：只有已完成的訂單能評價。client 顯示 LocalizedMessage，不提供評價入口。
  // ReviewAppService.CreateReview。
  ORDER_NOT_REVIEWABLE = 16;
  // 訂單已超過評價期限（搭配 failed_precondition）：訂單完成後 30 天內才能評價。client 顯示 LocalizedMessage，不再提供評價入口。
  // ReviewAppService.CreateReview。
  REVIEW_WINDOW_EXPIRED = 17;
  // 這則評價目前不能回覆（搭配 failed_precondition）：被平台隱藏、作者已離開，或店家的回覆被下架。client 顯示 LocalizedMessage，重讀評價列表。
  // ReviewAppService.ReplyReview。
  REVIEW_NOT_REPLYABLE = 18;
  // 不能傳訊息給自己（搭配 invalid_argument）：買家帳號與店家帳號是同一個帳號。client 不提供對自己的店傳訊息的入口，顯示 LocalizedMessage。
  // ChatAppService.SendMessageToStore、SendMessageToBuyer。
  SELF_MESSAGE_NOT_ALLOWED = 19;
  // 這家店已停業，無法傳送訊息（搭配 failed_precondition）：店家狀態是已關閉；等待刪除的店仍可聊天。client 顯示 LocalizedMessage，輸入框改為唯讀。
  // ChatAppService.SendMessage、SendMessageToStore、SendMessageToBuyer、StreamStoreEvents（店家串流重新驗證時店已不在或換了一家）。
  STORE_CLOSED = 20;
  // 買家與店家之間任一方向有封鎖，而且沒有進行中的訂單或售後（搭配 failed_precondition）。client 顯示 LocalizedMessage，輸入框改為唯讀。
  // ChatAppService.SendMessage、SendMessageToStore、SendMessageToBuyer。
  CHAT_BLOCKED = 21;
  // 對方的帳號已刪除（買家已關閉或店家已退場，搭配 failed_precondition）。client 顯示 LocalizedMessage，輸入框改為唯讀。
  // ChatAppService.SendMessage、SendMessageToStore、SendMessageToBuyer。
  RECEIVER_DELETED = 22;
  // 同店已有同名標籤（搭配 already_exists）：標籤名稱在一家店內不能重複。client 顯示 LocalizedMessage，留在輸入框讓店家改名。
  // CrmAppService.CreateTag、UpdateTag。
  CRM_TAG_NAME_TAKEN = 23;
  // 標籤數量已達上限（搭配 failed_precondition）：每家店最多 200 個標籤、每位客戶最多 20 個標籤。client 顯示 LocalizedMessage，不再提供新增入口。
  // CrmAppService.CreateTag、AddCustomerTags。
  CRM_TAG_LIMIT = 24;
  // 串流的 cursor 早於伺服器保留的事件範圍（搭配 failed_precondition）：procurement 的 server streaming（WatchRun）。
  // client 放棄接續，改讀 GetRuntimeSnapshot 重建畫面。assistant 的 WatchAssistantTurn 不用這個值：輪次被清除回 not_found。
  REPLAY_CURSOR_EXPIRED = 25;
  // 串流的 cursor 超前於最新的事件（搭配 failed_precondition）：assistant 與 procurement 的 server streaming（WatchAssistantTurn、WatchRun）。
  // client 帶了不是伺服器發出的 cursor；放棄接續，procurement 改讀 GetRuntimeSnapshot，助理重新送出。
  REPLAY_CURSOR_AHEAD = 26;
  // 採購需求的必填欄位還沒有填滿，不能搜尋候選（搭配 failed_precondition）：StartCandidateSearch。client 回到釐清問答。
  REQUIREMENT_NOT_READY = 27;
  // 需求有一個待回覆的中斷（run 停在等待輸入）（搭配 failed_precondition）：SubmitAnswer、Rewind 在這期間不能寫入，
  // 否則中斷會被孤立。client 改用 ResumeRun 回覆，或 CancelRun 取消。
  APPROVAL_PENDING = 28;
  // 要回覆的中斷已經被回覆過（搭配 failed_precondition）：ResumeRun。client 重讀 GetSnapshot。
  APPROVAL_ALREADY_RESOLVED = 29;
  // run 的狀態不允許這個命令，因為它已不在進行中（搭配 failed_precondition）：ResumeRun。client 重讀 GetSnapshot。
  RUN_NOT_ACTIVE = 30;
  // 被接受的賣家回價版本已過有效期（搭配 failed_precondition）：AcceptSellerQuote。不可接受，也不自動改接受別版。
  RFQ_RESPONSE_EXPIRED = 31;
  // 賣家對這筆詢價已經不能再寫入（搭配 failed_precondition）：賣家已婉拒，或詢價已結案、他人已成交。
  // SellerProcurementAppService 的 SubmitSellerResponse、WithdrawSellerResponse、UpsertSellerResponseDraft。
  RFQ_RECIPIENT_CLOSED = 32;
  // 同一張需求已經有進行中的成交（搭配 failed_precondition）：AcceptSellerQuote。ErrorInfo.metadata 的 orderNo 是既有訂單，
  // client 引導買家去付款，不是叫他重新接受。
  RFQ_CHECKOUT_ALREADY_ACTIVE = 33;
  reserved 34;
  reserved "RFQ_ALREADY_AWARDED";
  // 本期的採購額度已用完（搭配 resource_exhausted）：BuyerProcurementAppService.SubmitTurn，以及串流裡 run 失敗的 error 事件。
  // ErrorInfo.metadata 的 remaining 是剩餘次數（此時是 0），resetTime 是下一期開始的時間（RFC 3339，UTC）。
  AGENT_MONTHLY_QUOTA_EXCEEDED = 35;
  // 本週的 AI 修圖額度已用完（搭配 resource_exhausted）：ImageAiAppService.TransformImage。client 顯示額度用完、
  // 不提供重試。ErrorInfo.metadata 的 remaining 是剩餘次數（此時是 0），resetTime 是下一期開始的時間（RFC 3339，UTC）。
  // 同時進行的修圖超過上限也回 resource_exhausted，但沒有這個 reason，帶 RetryInfo，稍後可再試。
  IMAGE_QUOTA_EXCEEDED = 36;
  // 圖片或提示詞被安全性檢查擋下（搭配 invalid_argument）：TransformImage。同一份輸入重送結果相同，
  // client 請使用者換一張圖或改提示詞，不自動重試。額度退回。
  IMAGE_SAFETY_BLOCKED = 37;
  // 圖片涉及著作權複誦而被擋下（搭配 invalid_argument）：TransformImage。同一份輸入重送結果相同，
  // client 請使用者換一張圖，不自動重試。額度退回。
  IMAGE_RECITATION_BLOCKED = 38;
  // 模型沒有產出圖片（搭配 unavailable）：TransformImage。這是模型的非決定性行為，同一份輸入重送可能成功，
  // client 可以讓使用者直接重試。額度退回。
  IMAGE_NOT_PRODUCED = 39;
  // 這個對話已經有一輪助理回覆進行中（搭配 failed_precondition）：AssistantAppService.SendAssistantMessage。同一個對話同時只允許一輪，
  // 兩輪交錯會把事件寫進同一段歷史。client 等這一輪的串流收到 finished 或 error 後再送出，或改開新的對話（session_id 空字串）。
  ASSISTANT_TURN_IN_PROGRESS = 40;
  // 助理這一輪失敗（用於 AssistantStreamError.reason）：WatchAssistantTurn 串流裡 error 事件的原因，沒有搭配的 Connect code
  // （事件在串流內）。失敗的細分（沒有任何輸出、已輸出部分文字後中斷）只進伺服器 log。client 顯示 localized_message，
  // 可以讓使用者重新送出。
  ASSISTANT_TURN_FAILED = 41;
  // 這個採購需求已經有一個 run 在進行中（搭配 failed_precondition）：SubmitTurn、StartCandidateSearch、ResumeRun。同一個需求同時只允許一個進行中的 run
  // （排隊、執行中、取消中）。client 等目前的 run 收到 finished 後再送出；等待輸入的 run 不算進行中。
  PROCUREMENT_RUN_IN_PROGRESS = 42;
  // 優惠券活動不是進行中（搭配 failed_precondition）：尚未發布、已被結束。CouponAppService.ClaimCoupon。client 顯示 LocalizedMessage，重讀活動列表。
  COUPON_CAMPAIGN_NOT_ACTIVE = 43;
  // 現在不在優惠券活動的時間窗內（搭配 failed_precondition）：還沒開始或已經結束。CouponAppService.ClaimCoupon。
  COUPON_OUTSIDE_WINDOW = 44;
  // 買家不符合活動的資格（搭配 failed_precondition）：不在指定名單、在該店沒有消費紀錄。CouponAppService.ClaimCoupon。
  COUPON_NOT_ELIGIBLE = 45;
  // 發行活動的店家停權中（搭配 failed_precondition）：領取與鎖定（結帳選用）暫停，解除後自動恢復；已鎖定的券照常核銷或釋放。CouponAppService.ClaimCoupon。
  COUPON_STORE_SUSPENDED = 46;
  // 活動已經領完（搭配 failed_precondition）：總發行量已達上限。CouponAppService.ClaimCoupon。client 顯示已領完。
  COUPON_ISSUE_LIMIT_REACHED = 47;
  // 店家同時進行的活動數已達上限（搭配 failed_precondition）：CouponAppService.CreateCampaign。client 提示先結束一個活動。
  COUPON_QUOTA_EXCEEDED = 48;
}
