syntax = "proto3";

// identity 模組給前台的 API：登入的帳號與它的角色（行為規格在 backend/docs/modules/identity.md）。後台的 API 在 hawkr.admin.identity.v1alpha1。
//
// 登入、登出與 session 由 identity 模組自己管（ADR 2026-10-30-identity-self-hosted-federated-login）：session 是不透明的 token，
// 以 Authorization: Bearer 帶（App），或在 web 以 `__Host-hk_session` cookie 帶（web 的登入走 /api/auth/{provider}/start，不在這個 API）。
// App 以原生 SDK 取得 Google 或 LINE 的 ID token，經 IdentityPublicService 換成 session。收到 unauthenticated 就回到登入。
// 以 cookie 認證的請求，只有標 NO_SIDE_EFFECTS 的方法能用 GET，其他方法必須是同源的 POST（D6）。
//
// 每個帳號都是買家（帳號活著就是買家，ADR 2026-09-30-account-created-provisions-buyer）；角色只有要另外申請的賣家。
// 買家或賣家「正在看哪個工作區」是 client 的 UI 狀態，Connect 不讀：服務名稱（BuyerAppService、SellerAppService）本身就表示
// 以哪個身分呼叫，只有賣家能做的事由模組檢查帳號有沒有 ROLE_SELLER（ADR 2026-10-07-connect-without-perspective）。
package hawkr.identity.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// IdentityPublicService 是登入之前的方法：App 把原生 SDK 取得的 ID token 換成 session。兩個方法都是 POST，回應一律不可快取。
// 每個來源 IP 有額度，超過回 resource_exhausted（帶 RetryInfo）。
service IdentityPublicService {
  // IssueAppLoginNonce 發一個單次使用、5 分鐘內有效的 nonce：App 把它交給原生 SDK（Google 的 nonce、LINE 的 nonce），
  // SDK 簽發的 ID token 的 nonce claim 必須等於它，再交給 ExchangeIdToken 或 LinkIdentity。
  rpc IssueAppLoginNonce(IssueAppLoginNonceRequest) returns (IssueAppLoginNonceResponse);

  // ExchangeIdToken 以原生 SDK 取得的 ID token 登入並換發 session（App 種類，閒置 14 天、絕對 90 天）：驗證簽章、issuer、audience、
  // nonce（必須是 IssueAppLoginNonce 發的、尚未用過）；Google 另外要求 azp 在允許的 App client 清單。已有這個身分就登入它的帳號，
  // 否則依規則自動連結或建立帳號（ADR 同上 D4）。請求已帶 Authorization: Bearer 的舊 session 時一併撤銷。
  // ID token 或 nonce 無效回 unauthenticated；身分屬於已刪除的帳號也回 unauthenticated；這個 provider 沒有設定回 unavailable。
  rpc ExchangeIdToken(ExchangeIdTokenRequest) returns (ExchangeIdTokenResponse);
}

// IdentityAppService 是登入的買家、賣家的方法。
service IdentityAppService {
  // GetSession 回傳目前登入的帳號；web 以它判斷是否仍在登入。
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // LinkAppleCredential 交出 Sign in with Apple 的憑證（App Store 審核準則 5.1.1(v)）：App 每次以 Apple 原生登入成功後呼叫。
  // 伺服器驗證 identity token（簽章、issuer、audience），之後在背景以 authorization code 換成 refresh token；Apple 換 token
  // 簽發的 ID token 必須與這個 identity token 是同一個身分才加密保存（取代舊的），成功只表示已經排入。帳號最終刪除時
  // 伺服器自動撤銷保存的 token。可以安全重送。identity token 無效時回 invalid_argument；Apple 沒有設定（本機開發）時回
  // unavailable。
  rpc LinkAppleCredential(LinkAppleCredentialRequest) returns (LinkAppleCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SignOut 撤銷目前的 session。web 的回應另以 Set-Cookie 清掉 `__Host-hk_session`。session 已經不存在時也成功。停權的帳號也能呼叫。
  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  // LinkIdentity 把 App 以原生 SDK 取得的 Google 或 LINE 身分連結到呼叫者的帳號（web 走 GET /api/auth/{provider}/start?link=1）。
  // ID token 與 nonce 的驗證同 IdentityPublicService.ExchangeIdToken，不換發 session。這個身分已連結到別的帳號（含已刪除帳號
  // 留下的身分）回 already_exists 與 ErrorReason IDENTITY_ALREADY_LINKED，什麼都不改；已連結到呼叫者自己時成功。
  rpc LinkIdentity(LinkIdentityRequest) returns (LinkIdentityResponse);

  // ListSessions 列出呼叫者的有效 session（新到舊），標出目前這一個。停權的帳號也能呼叫。
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RevokeSession 終止呼叫者自己的一個 session（包含目前這個）。目前的 session 必須在 15 分鐘內以 provider 驗證過
  // （重新走一次登入），否則回 failed_precondition 與 ErrorReason REAUTHENTICATION_REQUIRED，client 引導重新登入後再送。
  // 沒有這個 session 或屬於別的帳號回 not_found。停權的帳號也能呼叫。
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // DeleteAccount 刪除呼叫者的帳號（App Store 審核準則 5.1.1(v)）。沒有未完成的訂單時立即刪除；有的話進入刪除流程，
  // 最後一筆訂單完成後自動刪除，期間不能新增收藏與追蹤；流程中再呼叫回目前的狀態。帳號有店家時店家是
  // 參與者：同一個 transaction 關閉買家、店家並刪除帳號，店家有未結訂單時與買家一起等待到兩側都結清。保存的 Apple 授權由伺服器在最後刪除時撤銷，client 不需要任何前置步驟。
  // 刪除之後 token 不再有效，所以 client 不自動重送：沒收到回應時以 GetSession 確認，unauthenticated 表示已刪除。
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

// Role 是帳號另外申請的角色。買家不是角色：每個帳號都是買家。
enum Role {
  ROLE_UNSPECIFIED = 0;
  // 1 是刪掉的 ROLE_BUYER（買家由「帳號活著」推導，不再存成角色）。
  reserved 1;
  reserved "ROLE_BUYER";
  ROLE_SELLER = 2;
}

// Account 是登入的帳號。
message Account {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // 帳號另外申請的角色（目前只有 ROLE_SELLER）；沒有時是空的。買家不列出：每個帳號都是買家。
  repeated Role roles = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 3 是刪掉的 active_role（Role 同時表示擁有的角色與視角，視角之後拆成 roles 與 perspective）。4 是刪掉的 phone（新帳號
  // 不驗證手機，ADR 2026-09-27-identity-clerk）。5 是刪掉的 perspective（視角是 client 的 UI 狀態，ADR
  // 2026-10-07-connect-without-perspective）。
  reserved 3, 4, 5;
  reserved "active_role", "perspective";
}

// LoginProvider 是聯合登入的 provider。值名去掉前綴等於資料庫與 identity 模組的 provider 值。
enum LoginProvider {
  LOGIN_PROVIDER_UNSPECIFIED = 0;
  LOGIN_PROVIDER_GOOGLE = 1;
  LOGIN_PROVIDER_LINE = 2;
}

// ClientKind 是 session 的 client 種類，決定閒置逾時（web 7 天、App 14 天）。
enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_WEB = 1;
  CLIENT_KIND_APP = 2;
}

message IssueAppLoginNonceRequest {}

message IssueAppLoginNonceResponse {
  // 單次使用的 nonce：不透明的字串，client 不解析。
  string nonce = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // nonce 的到期時間（發出後 5 分鐘）。
  google.protobuf.Timestamp expire_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ExchangeIdTokenRequest {
  LoginProvider provider = 1 [(google.api.field_behavior) = REQUIRED];
  // 原生 SDK 簽發的 ID token。
  string id_token = 2 [(google.api.field_behavior) = REQUIRED];
  // IssueAppLoginNonce 發的 nonce，必須等於 ID token 的 nonce claim。
  string nonce = 3 [(google.api.field_behavior) = REQUIRED];
}

message ExchangeIdTokenResponse {
  // 新 session 的 token，只在這裡出現一次：client 保存在安全儲存，之後以 Authorization: Bearer 帶。
  string session_token = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // session 的絕對到期時間（建立後 90 天），到期一定要重新登入。
  google.protobuf.Timestamp absolute_expire_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 閒置逾時（App 14 天）：這麼久沒有請求 session 就失效；使用中的 session 每天最多續期一次。
  google.protobuf.Duration idle_timeout = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message SignOutRequest {}

message SignOutResponse {}

message LinkIdentityRequest {
  LoginProvider provider = 1 [(google.api.field_behavior) = REQUIRED];
  string id_token = 2 [(google.api.field_behavior) = REQUIRED];
  string nonce = 3 [(google.api.field_behavior) = REQUIRED];
}

message LinkIdentityResponse {}

message ListSessionsRequest {
  // 預設 20，上限 100。
  int32 page_size = 1;
  string page_token = 2;
}

message ListSessionsResponse {
  repeated LoginSession sessions = 1;
  string next_page_token = 2;
}

message RevokeSessionRequest {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RevokeSessionResponse {}

// LoginSession 是帳號的一個登入中的 session。id 不是憑證：token 不會出現在任何回應（除了建立它的那一次）。
message LoginSession {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  ClientKind client_kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 最後一次使用的時間；使用中的 session 每天最多更新一次。
  google.protobuf.Timestamp last_use_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 這是不是送出這個請求的 session。
  bool current = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetSessionRequest {}

message GetSessionResponse {
  // 1 是刪掉的 session（token 與期限由 Clerk 管理）。
  reserved 1;
  Account account = 2;
  // 帳號被停權時的狀態；沒有停權時不設。停權的帳號仍能登入、讀取與刪除帳號，寫入回 permission_denied 與
  // hawkr.common.v1alpha1.ErrorReason.ACCOUNT_SUSPENDED。
  Suspension suspension = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Suspension 是帳號的停權狀態。
message Suspension {
  // 停權的時間。
  google.protobuf.Timestamp suspended_at = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message LinkAppleCredentialRequest {
  // Sign in with Apple 這次給的 identity token：驗證它的簽章與 audience；伺服器之後確認 Apple 換 token 簽發的 ID token 是同一個身分。
  string id_token = 1 [(google.api.field_behavior) = REQUIRED];
  // 同一次給的 authorization code，伺服器在背景以它換 refresh token 保存。
  string authorization_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message LinkAppleCredentialResponse {}

message DeleteAccountRequest {}

message DeleteAccountResponse {
  // DeletionState 是申請之後帳號的狀態。
  enum DeletionState {
    DELETION_STATE_UNSPECIFIED = 0;
    // 帳號已刪除，client 登出。
    DELETION_STATE_DELETED = 1;
    // 還有未完成的訂單，最後一筆完成後自動刪除。
    DELETION_STATE_PENDING_ORDERS = 2;
  }
  DeletionState state = 1;
}
