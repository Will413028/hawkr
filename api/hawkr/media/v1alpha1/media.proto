syntax = "proto3";

// media 模組給前台的 API：登入的買家與賣家上傳公開圖片（MediaAppService）。
//
// 上傳是三步：BeginUpload 取得預簽的 PUT 網址與 staged token，client 以回應列出的標頭把檔案直接 PUT 到物件儲存，
// 再 CompleteUpload 通知伺服器；伺服器非同步處理（辨認格式、重新編碼、去除 metadata），client 以 GetUpload 輪詢到 READY 或 REJECTED。
// READY 的 staged token 交給擁有該圖片的 API（例如更新頭像）轉正；轉正前的暫存只有上傳者本人能續用。
// 機敏檔案：BeginSecureUpload 開分段會話，段本身走單體的 /api/files/secure_uploads 端點（不經 Connect）。處理被拒絕不是錯誤：GetUpload 以 state REJECTED 與 reject_reason 回報。
// 代行營運（MediaDelegatedService）：管理員代行店家時開機敏檔的分段上傳會話，段走後台的 /api/files/admin/secure_uploads 端點。
// 設計：ADR docs/adr/2026-11-22-media-upload-channels.md；代行上傳 plan B1-D16。
package hawkr.media.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// MediaAppService 是登入的買家與賣家上傳公開圖片；管理員等非顧客帳號的身分不能呼叫（permission_denied）。
service MediaAppService {
  // BeginUpload 宣告要上傳的檔案，回傳預簽的 PUT 網址、client 必須原樣帶上的標頭與 staged token。
  // 回 invalid_argument 且不發網址的情況：size 不大於零或超過伺服器的上限（訊息是在地化文字，說明上限）；content_type 不是 image/jpeg、
  // image/png、image/webp、image/gif 之一（HEIC 等由 client 先轉換）；md5 不是 16 位元組的標準 base64。
  // 每次呼叫建立新的一筆暫存；網址與 staged token 只在這個回應出現一次，沒有用到的暫存由伺服器回收。
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse);

  // CompleteUpload 在 client 把檔案 PUT 完之後呼叫，伺服器開始非同步處理。可重送：已經完成的重送一律成功。
  // staged token 不存在或不是呼叫者的回 not_found（兩者不可區分）；暫存已過期回 failed_precondition。
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetUpload 讀暫存的處理狀態。staged token 是憑證，所以不標 NO_SIDE_EFFECTS（以 POST 呼叫、不放進網址；規範第三節）；client 輪詢，失敗下一輪再讀。
  // staged token 不存在或不是呼叫者的回 not_found（兩者不可區分）。
  rpc GetUpload(GetUploadRequest) returns (GetUploadResponse);

  // BeginSecureUpload 開一個機敏檔案的分段上傳會話（B1-D17）。回傳 staged token、段大小與段總數；client 依段大小把檔案切段，
  // 從第 0 段起依序以 `PUT /api/files/secure_uploads/{staged_token}/chunks/{index}`（原始位元組 body，不經 Connect；規範第十三節）送出。
  // size 小於一或超過伺服器的上限回 invalid_argument 指向 size（訊息是在地化文字）；伺服器沒有設定加密金鑰回 unavailable。
  // 每次呼叫建立新的會話；沒有送完的由伺服器回收。
  rpc BeginSecureUpload(BeginSecureUploadRequest) returns (BeginSecureUploadResponse);
}

// MediaDelegatedService 是代行營運中的平台管理員為代行店家上傳機敏檔：憑證是 X-HK-Operation-Session 標頭裡的代行 session（由 admin 的 BFF 轉送，不放在請求訊息），
// 不讀顧客或管理員的身分；擁有者是 session 建立當下綁定的那一家店，請求不帶 store_id。
// 需要能力 media.upload（B1-D16）：憑證缺少或無效回 unauthenticated；session 已結束、到期或撤銷回 failed_precondition；session 沒有 media.upload 回 permission_denied；
// 店家此刻不可代行回 failed_precondition，只拒絕、不撤銷 session。回應一律不可快取（private, no-store）。
//
// 稽核：上傳只產生會過期的暫存，不改賣家看得到的資料，所以成功的 BeginSecureUpload 與段上傳都不寫代行稽核；稽核留在擁有者確認時的寫入。被拒絕的請求另寫一列 FAILED。
// 會話的上傳者是管理員本人（與 Java 一致），並綁定被代行的那一家店：段上傳與暫存預覽（`GET /api/files/admin/secure_uploads/{staged_token}`）都要帶同一個 X-HK-Operation-Session，session 此刻有效、帶 media.upload 且屬於這位管理員；擁有者確認時 token 也只對同一家店成立。不保留原始檔名。
service MediaDelegatedService {
  // BeginSecureUpload 為代行店家開一個機敏檔案的分段上傳會話，回傳與 MediaAppService.BeginSecureUpload 相同的 staged token、段大小與段總數。
  // 段以 `PUT /api/files/admin/secure_uploads/{staged_token}/chunks/{index}` 送出（後台路由，原始位元組 body，不經 Connect；規範第十三節），只有開會話的管理員、在綁定的同一家店的代行 session 之下（請求帶 X-HK-Operation-Session）能續傳。
  // size 小於一或超過伺服器的上限回 invalid_argument 指向 size；伺服器沒有設定加密金鑰回 unavailable。需要能力 media.upload。
  rpc BeginSecureUpload(MediaDelegatedServiceBeginSecureUploadRequest) returns (MediaDelegatedServiceBeginSecureUploadResponse);
}

// UploadState 是一筆暫存上傳的狀態。client 遇到 UNSPECIFIED 或不認得的值走「未知」的呈現。
enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;
  // 已發網址，還沒收到 CompleteUpload。
  UPLOAD_STATE_PENDING = 1;
  // 已收到 CompleteUpload，等待處理。
  UPLOAD_STATE_UPLOADED = 2;
  // 處理完成，staged token 可以交給擁有者轉正。
  UPLOAD_STATE_READY = 3;
  // 處理被拒絕，原因在 GetUploadResponse.reject_reason；要重新 BeginUpload。
  UPLOAD_STATE_REJECTED = 4;
  // 已被擁有者轉正。
  UPLOAD_STATE_CONFIRMED = 5;
  // 正在回收（過期或被放棄）。
  UPLOAD_STATE_DELETING = 6;
  // 已回收。
  UPLOAD_STATE_DELETED = 7;
}

// RejectReason 是處理拒絕一筆暫存上傳的原因。
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  // 辨認不出是支援的圖片格式。
  REJECT_REASON_UNRECOGNIZED_FORMAT = 1;
  // 實際大小與宣告的不符。
  REJECT_REASON_SIZE_MISMATCH = 2;
  // 實際內容與宣告的 MD5 不符。
  REJECT_REASON_CHECKSUM_MISMATCH = 3;
  // 處理失敗（例如圖片損毀或超過像素上限），重試不會成功。
  REJECT_REASON_PROCESSING_FAILED = 4;
  // 暫存在處理完成前過期。
  REJECT_REASON_EXPIRED = 5;
}

message BeginUploadRequest {
  // 檔案的位元組數；必須大於零且不超過伺服器的上限，超過回 invalid_argument 指向 size，訊息是在地化文字。
  int64 size = 1 [(google.api.field_behavior) = REQUIRED];
  // 檔案的 MIME 型別，只能是 image/jpeg、image/png、image/webp、image/gif；伺服器依內容辨認，宣告的型別只用來簽網址。
  string content_type = 2 [(google.api.field_behavior) = REQUIRED];
  // 檔案內容 MD5 的標準 base64（16 位元組）；簽進網址，內容不符時物件儲存拒收。
  string md5 = 3 [(google.api.field_behavior) = REQUIRED];
}

message BeginUploadResponse {
  // 不透明的憑證，交給 CompleteUpload、GetUpload 與擁有者的 API；只出現這一次。
  string staged_token = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 預簽的 PUT 網址。
  string upload_url = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // PUT 時必須原樣帶上的請求標頭（已簽入網址的值）；少帶、改值或多帶簽章以外的內容被物件儲存拒收。不含 Content-Length（瀏覽器不允許腳本設定）：
  // 請求本文必須恰好是 BeginUploadRequest.size 位元組，由傳輸層帶 Content-Length；長度不符被物件儲存拒收。
  map<string, string> upload_headers = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 暫存的到期時間；過了之後 staged token 不能再用。預簽網址的有效期短於它。
  google.protobuf.Timestamp expire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CompleteUploadRequest {
  // BeginUpload 回傳的 staged token。
  string staged_token = 1 [(google.api.field_behavior) = REQUIRED];
}

message CompleteUploadResponse {}

message GetUploadRequest {
  // BeginUpload 回傳的 staged token。
  string staged_token = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetUploadResponse {
  UploadState state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 只在 state 是 REJECTED 時設值。
  optional RejectReason reject_reason = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 暫存的到期時間。
  google.protobuf.Timestamp expire_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message BeginSecureUploadRequest {
  // 檔案的明文位元組數；必須大於零且不超過伺服器的上限，段總數由它算出。
  int64 size = 1 [(google.api.field_behavior) = REQUIRED];
}

message BeginSecureUploadResponse {
  // 不透明的憑證，放在段上傳與暫存預覽的網址路徑裡，交給擁有者的 API 轉正；只出現這一次。
  string staged_token = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 每段的位元組數；除最後一段外每段剛好這個大小，最後一段是餘數。client 不寫死。
  int32 chunk_size = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 段總數；段序號是 0 到 chunk_count - 1。
  int32 chunk_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 會話的到期時間；過了之後 staged token 不能再用。
  google.protobuf.Timestamp expire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// MediaDelegatedServiceBeginSecureUploadRequest 與 BeginSecureUploadRequest 的欄位與意義相同（buf 要求每個 RPC 有自己的訊息）；沒有 store_id：店家由代行 session 決定。
message MediaDelegatedServiceBeginSecureUploadRequest {
  // 檔案的明文位元組數；必須大於零且不超過伺服器的上限，段總數由它算出。
  int64 size = 1 [(google.api.field_behavior) = REQUIRED];
}

// MediaDelegatedServiceBeginSecureUploadResponse 與 BeginSecureUploadResponse 的欄位與意義相同。
message MediaDelegatedServiceBeginSecureUploadResponse {
  // 不透明的憑證，放在後台段上傳的網址路徑裡，交給擁有者的 API 轉正；只出現這一次。
  string staged_token = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 每段的位元組數；除最後一段外每段剛好這個大小，最後一段是餘數。client 不寫死。
  int32 chunk_size = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 段總數；段序號是 0 到 chunk_count - 1。
  int32 chunk_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 會話的到期時間；過了之後 staged token 不能再用。
  google.protobuf.Timestamp expire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
