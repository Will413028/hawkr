syntax = "proto3";

// review 模組給前台的 API：商品與店家的公開評價與商品、店家的評價統計（ReviewPublicService，未登入可讀），以及登入者的評價（ReviewAppService：買家寫評價與讀自己的評價歷史，
// 店家回覆與讀自己店的評價）。
//
// ID 是不透明的字串（評價是 UUID，商品與店家是過渡期的十進位整數字串），client 不解析、不轉數字
// （ADR 2026-09-25-row-identity-by-data-kind D5）。圖片是 hawkr.common.v1alpha1.Image。
//
// 帶登入憑證的請求，公開列表依觀看者過濾（觀看者與作者任一方向有個人封鎖的買家、觀看者封鎖的店家的評價不出現），整個回應是 private, no-store；
// 不帶憑證的請求才是可共享快取的版本（API 設計規範（Connect）第九節）。停權的帳號與無效的憑證以訪客讀取。評價統計不依觀看者過濾。
package hawkr.review.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "hawkr/common/v1alpha1/image.proto";

// ReviewPublicService 是任何人都能讀的評價與統計，不需要登入。
service ReviewPublicService {
  // ListProductReviews 列出商品的公開評價，新到舊（建立時間，相同時以 ID 排序）。公開可讀：沒有未還原的平台隱藏、作者仍在營運中。
  // 帶登入憑證時套用觀看者的封鎖，過濾在分頁之前，所以一頁可以少於 page_size，結束只看 next_page_token。可以用 rating 與 with_images 篩選；
  // page_token 只能用在同一組 product_id 與篩選。商品沒有評價是空的一頁。
  rpc ListProductReviews(ListProductReviewsRequest) returns (ListProductReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListStoreReviews 列出店家的公開評價，規則同 ListProductReviews。店家自己讀自己店的評價用 ReviewAppService.ListOwnStoreReviews（不套觀看者）。
  rpc ListStoreReviews(ListStoreReviewsRequest) returns (ListStoreReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetStoreReviewStats 是店家的評價統計：公開可讀的評價數、平均與各星等的數量。統計不依觀看者過濾，公開與店家自己看到的數字相同。
  rpc GetStoreReviewStats(GetStoreReviewStatsRequest) returns (GetStoreReviewStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetProductReviewStats 是商品的評價統計：公開可讀的評價數與平均（與 ListProductReviews 同一個公開述詞：沒有未還原的平台隱藏、作者仍在營運中）。
  // 統計不依觀看者過濾，不套封鎖。商品沒有評價（或商品不存在）是 count 0、average 0，不是 not_found。
  rpc GetProductReviewStats(GetProductReviewStatsRequest) returns (GetProductReviewStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ReviewAppService 是登入者的評價。評價是買家與店家共用的資源（買家寫、店家回）：CreateReview 與 ListMyReviews 是買家；
// ListOwnStoreReviews 的店家身分由伺服器從 session 推導（呼叫者此刻的店），ReplyReview 的店家由評價所屬的店推導，請求都不帶 store_id。
service ReviewAppService {
  // GetReview 讀一則公開可讀的評價，套用觀看者的封鎖；其他一律回 not_found，不區分原因。
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ReplyReview 回覆一則評價，已有回覆時覆蓋；店家由評價所屬的店推導，請求不帶 store_id。需要賣家能力 CAP_MARKETING。評價不存在回 not_found。呼叫者不是那間店的店主（包含沒有店）時：評價公開可讀回 permission_denied，
  // 評價不公開（被隱藏、作者已離開）回 not_found，不洩漏存在性。店主回覆此刻不能回覆的評價（被隱藏、作者已離開、回覆被下架）回 failed_precondition 與 REVIEW_NOT_REPLYABLE。
  rpc ReplyReview(ReplyReviewRequest) returns (ReplyReviewResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // CreateReview 以呼叫者的買家身分對一個已完成的訂單項目寫評價。商品、規格、價格與商品圖取自訂單項目。訂單不是呼叫者的或不存在回 not_found；
  // 同一個訂單項目已有評價（可能已被平台隱藏而不在 ListMyReviews 的結果中）回 already_exists 與 REVIEW_ALREADY_EXISTS，client 顯示「已評價」；訂單還不能評價回 failed_precondition 與 ORDER_NOT_REVIEWABLE；
  // 超過評價期限回 failed_precondition 與 REVIEW_WINDOW_EXPIRED。
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse);

  // ListMyReviews 列出呼叫者自己寫的評價，新到舊；被平台隱藏的不列（作者看不到被隱藏的評價）。order_item_id 只列那個訂單項目的可見評價（至多一則）；沒有結果不代表沒寫過，被隱藏的評價仍占著該訂單項目（CreateReview 會回 REVIEW_ALREADY_EXISTS）。
  // page_token 只能用在同一個 order_item_id。
  rpc ListMyReviews(ListMyReviewsRequest) returns (ListMyReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListOwnStoreReviews 列出呼叫者此刻的店的公開可讀評價，新到舊，不套觀看者的封鎖（店家看得到被它封鎖的買家的評價）。呼叫者沒有店回 not_found。
  // 不檢查賣家能力：停權的店家仍可讀自己店的評價。
  rpc ListOwnStoreReviews(ListOwnStoreReviewsRequest) returns (ListOwnStoreReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ReviewAuthor 是評價的作者，名稱與頭像在讀取時由 buyer 補。
message ReviewAuthor {
  // 買家的暱稱；沒有設定時不設。
  optional string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  hawkr.common.v1alpha1.Image avatar = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ReviewReply 是店家的回覆。
message ReviewReply {
  string content = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp reply_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Review 是一則評價。評價建立後不變，只有店家的回覆可以新增或覆蓋。
message Review {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string product_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string store_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 1 到 5。
  int32 rating = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 評價內文；沒有文字時是空字串。
  string content = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 附圖，依上傳順序，最多 4 張。
  repeated hawkr.common.v1alpha1.Image images = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 下單當時的規格名稱。
  string sku_name = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 訂單項目當時的商品圖；沒有時不設。
  hawkr.common.v1alpha1.Image item_image = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 下單當時的單價，新台幣元。
  int64 price = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 店家的回覆；還沒有回覆或回覆被下架時不設。
  optional ReviewReply reply = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  ReviewAuthor author = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 訂單編號。只有作者本人（CreateReview、ListMyReviews）與店家自己讀自己店的評價（ListOwnStoreReviews、ReplyReview）的回應才設，公開讀取不設。
  optional string order_no = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 訂單項目 ID，設定的條件同 order_no。
  optional string order_item_id = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListProductReviewsRequest {
  string product_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 預設 20，上限 100。
  int32 page_size = 2;
  string page_token = 3;
  // 只列這個星等（1 到 5）；不設是不篩選。
  optional int32 rating = 4;
  // 為真時只列有附圖的評價。
  bool with_images = 5;
}

message ListProductReviewsResponse {
  repeated Review reviews = 1;
  string next_page_token = 2;
}

message ListStoreReviewsRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 預設 20，上限 100。
  int32 page_size = 2;
  string page_token = 3;
  // 只列這個星等（1 到 5）；不設是不篩選。
  optional int32 rating = 4;
  // 為真時只列有附圖的評價。
  bool with_images = 5;
}

message ListStoreReviewsResponse {
  repeated Review reviews = 1;
  string next_page_token = 2;
}

message GetStoreReviewStatsRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// RatingCount 是一個星等的評價數。
message RatingCount {
  // 1 到 5。
  int32 rating = 1;
  int32 count = 2;
}

message GetStoreReviewStatsResponse {
  // 公開可讀的評價數。
  int32 count = 1;
  // 平均星等，四捨五入到小數第二位；沒有評價是 0。
  double average = 2;
  // 1 到 5 星各一項，沒有評價的星等是 0。
  repeated RatingCount distribution = 3;
}

message GetProductReviewStatsRequest {
  string product_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetProductReviewStatsResponse {
  // 公開可讀的評價數。
  int32 count = 1;
  // 平均星等，四捨五入到小數第二位；沒有評價是 0。
  double average = 2;
  // 1 到 5 星各一項，沒有評價的星等是 0；與店家統計同形。
  repeated RatingCount distribution = 3;
  // 公開可讀且帶圖的評價數（與 ListProductReviews 的 with_images 篩選同一個條件）。
  int32 with_images_count = 4;
}

message GetReviewRequest {
  string review_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetReviewResponse {
  Review review = 1;
}

message ReplyReviewRequest {
  string review_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 回覆內文，去除首尾空白後 1 到 1000 個字元（以 Unicode 字元計）。
  string content = 2 [(google.api.field_behavior) = REQUIRED];
}

message ReplyReviewResponse {
  Review review = 1;
}

message CreateReviewRequest {
  // 訂單編號。
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  // 要評價的訂單項目 ID，必須屬於這張訂單。
  string order_item_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 1 到 5。
  int32 rating = 3 [(google.api.field_behavior) = REQUIRED];
  // 選填的評價內文，去除首尾空白後最多 1000 個字元（以 Unicode 字元計）。
  string content = 4;
  // 附圖的 staged token（media 上傳完成後拿到的），最多 4 個，不能重複。
  repeated string image_staged_tokens = 5 [(google.api.field_behavior) = INPUT_ONLY];
}

message CreateReviewResponse {
  Review review = 1;
}

message ListMyReviewsRequest {
  // 預設 20，上限 100。
  int32 page_size = 1;
  string page_token = 2;
  // 只列這個訂單項目的評價；不設是全部。
  optional string order_item_id = 3;
}

message ListMyReviewsResponse {
  repeated Review reviews = 1;
  string next_page_token = 2;
}

message ListOwnStoreReviewsRequest {
  // 預設 20，上限 100。
  int32 page_size = 1;
  string page_token = 2;
  // 只列這個星等（1 到 5）；不設是不篩選。
  optional int32 rating = 3;
  // 為真時只列有附圖的評價。
  bool with_images = 4;
}

message ListOwnStoreReviewsResponse {
  repeated Review reviews = 1;
  string next_page_token = 2;
}
