message ListStoreCommentsRequest {
  // 預設 20，上限 50。
  int32 page_size = 1;
  string page_token = 2;
  // 設了只列這一篇（必須是本店的貼文，否則 not_found）；不設是本店所有貼文。
  optional string post_id = 3;
  // 為真只列未回覆的留言（定義見 ListStoreComments）。
  bool unreplied = 4;
}

message ListStoreCommentsResponse {
  repeated Comment comments = 1;
  string next_page_token = 2;
}

message GetStoreSocialSummaryRequest {}

// SocialDelegatedServiceGetStoreSocialSummaryRequest 沒有欄位：店家由代行 session 決定。
message SocialDelegatedServiceGetStoreSocialSummaryRequest {}

// SocialDelegatedServiceGetStoreSocialSummaryResponse 與 GetStoreSocialSummaryResponse 的欄位與意義相同（buf 要求每個 RPC 有自己的訊息）。
message SocialDelegatedServiceGetStoreSocialSummaryResponse {
  repeated PostStatusCount post_counts = 1;
  int64 scheduled_post_count = 2;
}

message GetStoreSocialSummaryResponse {
  // 每個貼文狀態一項（DRAFT、PUBLISHED、UNPUBLISHED 都會有，沒有貼文時是 0），不含已刪除的貼文。
  repeated PostStatusCount post_counts = 1;
  // 有待發布排程的貼文篇數；它們的狀態是 DRAFT 或 UNPUBLISHED，所以也算在 post_counts 裡。
  int64 scheduled_post_count = 2;
}

// PostStatusCount 是一個貼文狀態與店家在這個狀態的貼文篇數。
message PostStatusCount {
  PostStatus status = 1;
  int64 count = 2;
}

// SocialDelegatedService 是代行營運中的平台管理員讀寫代行店家的貼文：憑證是 X-HK-Operation-Session 標頭裡的代行 session（由 website 的 BFF 轉送，不放在請求訊息），
// 不讀顧客或管理員的身分；目標店家是 session 建立當下綁定的那一家，請求不帶 store_id。商品與訂單由各自模組的 `<模組>DelegatedService` 在 A10 提供。
// 回應一律不可快取（private, no-store）。
//
// 能力（posts.read、posts.write、posts.publish）依方法宣告：憑證缺少或無效回 unauthenticated；session 已結束、到期或撤銷回 failed_precondition；
// session 沒有授予對應的能力回 permission_denied；店家此刻不可代行（不存在、已關閉、等待刪除、停權）回 failed_precondition，只拒絕、不撤銷 session。
//
// 稽核：成功的寫入在同一個 transaction 內留下一列 SUCCEEDED（寫入失敗時一併 rollback）；被拒絕的請求（含讀取）與寫入的業務失敗另開 transaction 留下一列 FAILED；
// 成功的讀取不稽核。
service SocialDelegatedService {
  // GetStoreSocialSummary 是代行工作區的動態數：代行店家的貼文依狀態的篇數（已刪除的不算），以及待發布排程的篇數；內容與 SocialAppService.GetStoreSocialSummary 相同，
  // 目標店家是 session 綁定的那一家。需要能力 posts.read。
  rpc GetStoreSocialSummary(SocialDelegatedServiceGetStoreSocialSummaryRequest) returns (SocialDelegatedServiceGetStoreSocialSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListStorePosts 列出代行店家自己的貼文（含草稿與下架，不含已刪除），依建立時間新到舊（同一時間以 ID 排序）；可依 status 篩選。需要能力 posts.read。
  rpc ListStorePosts(ListStorePostsRequest) returns (ListStorePostsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetStorePost 讀代行店家的一篇貼文（任何狀態，不含已刪除）；別家的貼文與不存在一樣回 not_found。回應帶 status 與 etag。需要能力 posts.read。
  rpc GetStorePost(GetStorePostRequest) returns (GetStorePostResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CreateStorePost 以代行店家建立草稿貼文（建立一律是草稿；要發布再呼叫 PublishStorePost）。同一個 session 以同一個 request_id 重送回第一次建立的貼文目前的樣子，
  // 不重複建立、不重複寫稽核；內容不同回 failed_precondition。需要能力 posts.write。
  rpc CreateStorePost(CreateStorePostRequest) returns (CreateStorePostResponse);

  // UpdateStorePost 修改代行店家的貼文（update_mask 列 body、image_staged_token、product_id、hashtag_inputs 的子集）；etag 必填，與目前版本不符回 aborted 與
  // VERSION_CONFLICT，不寫入也不留稽核。重送規則同 CreateStorePost。需要能力 posts.write。
  rpc UpdateStorePost(UpdateStorePostRequest) returns (UpdateStorePostResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PublishStorePost 立即發布草稿或下架的貼文；etag 必填。重送規則同 CreateStorePost。需要能力 posts.publish。
  rpc PublishStorePost(PublishStorePostRequest) returns (PublishStorePostResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // UnpublishStorePost 下架已發布的貼文；etag 必填。重送規則同 CreateStorePost。需要能力 posts.publish。
  rpc UnpublishStorePost(UnpublishStorePostRequest) returns (UnpublishStorePostResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ScheduleStorePost 排程發布：貼文要是草稿或已下架，publish_time 距現在 5 分鐘到 90 天；貼文已有待發布的排程時，舊的被取代。排程屬於店家，session 結束後仍會
  // 在到點時重驗授權並發布（授權已撤回則取消）。稽核寫 POST_SCHEDULE，到點發布時另寫一列 POST_PUBLISH。重送規則同 CreateStorePost。需要能力 posts.publish。
  rpc ScheduleStorePost(ScheduleStorePostRequest) returns (ScheduleStorePostResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// DelegatedOperation 是每個代行寫入都要帶的稽核資料。
message DelegatedOperation {
  // UUIDv4（AIP-155）：同一個代行 session 內以同一個 request_id 重送，回第一次的結果，不重做寫入也不再寫稽核；同一個 request_id 用在不同的請求內容回 failed_precondition。必填。
  string request_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // 操作原因，去除首尾空白後 1 到 100 個字元，不得含控制字元；寫進稽核，必填。
  string operation_reason = 2 [(google.api.field_behavior) = REQUIRED];
  // 是否在完成後通知店主；不設是通知。
  optional bool notify_seller = 3;
}

message ListStorePostsRequest {
  // 預設 20，上限 50。
  int32 page_size = 1;
  string page_token = 2;
  // 只列這個狀態的貼文；不設（UNSPECIFIED）是全部。page_token 只能用在同一個 status。
  PostStatus status = 3;
}

message ListStorePostsResponse {
  repeated Post posts = 1;
  string next_page_token = 2;
}

message GetStorePostRequest {
  // 貼文 ID。
  string post_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetStorePostResponse {
  Post post = 1;
}

message CreateStorePostRequest {
  DelegatedOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
  // 內文，去除首尾空白後最多 2200 個字元；草稿可以是空的。
  string body = 2;
  // 圖片的 staged token（media 上傳完成後拿到的）。
  string image_staged_token = 3 [(google.api.field_behavior) = INPUT_ONLY];
  // 貼文帶的商品 ID；商品要存在、上架中而且屬於這家店。
  optional string product_id = 4;
  // 標籤（使用者輸入的樣子，可帶開頭的 #）。
  repeated string hashtag_inputs = 5;
}

message CreateStorePostResponse {
  Post post = 1;
  // 這次寫入的稽核列 ID（重送時是第一次的）。
  string audit_log_id = 2;
}

message UpdateStorePostRequest {
  DelegatedOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
  // id 與 etag 必填。可以修改的欄位是 body、image_staged_token、product_id、hashtag_inputs，update_mask 要列至少一個；沒列的欄位保留目前的值。
  Post post = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateStorePostResponse {
  Post post = 1;
  string audit_log_id = 2;
}

message PublishStorePostRequest {
  DelegatedOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
  // 貼文 ID。
  string post_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 讀取時拿到的 etag，必填。
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
}

message PublishStorePostResponse {
  Post post = 1;
  string audit_log_id = 2;
}

message UnpublishStorePostRequest {
  DelegatedOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
  // 貼文 ID。
  string post_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 讀取時拿到的 etag，必填。
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
}

message UnpublishStorePostResponse {
  Post post = 1;
  string audit_log_id = 2;
}

message ScheduleStorePostRequest {
  DelegatedOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
  // 貼文 ID。
  string post_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 讀取時拿到的 etag，必填。
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
  // 發布的時間點，距現在 5 分鐘到 90 天。
  google.protobuf.Timestamp publish_time = 4 [(google.api.field_behavior) = REQUIRED];
}

message ScheduleStorePostResponse {
  // 排程後的貼文（含新的 etag）。
  Post post = 1;
  // 排定的發布時間。
  google.protobuf.Timestamp publish_time = 2;
  string audit_log_id = 3;
}

// SanctionKind 是社群處分的種類。
enum SanctionKind {
  SANCTION_KIND_UNSPECIFIED = 0;
  // 警告。
  SANCTION_KIND_WARNING = 1;
}

// HiddenContentKind 是被隱藏的內容的種類。
enum HiddenContentKind {
  HIDDEN_CONTENT_KIND_UNSPECIFIED = 0;
  HIDDEN_CONTENT_KIND_COMMENT = 1;
  HIDDEN_CONTENT_KIND_FORUM_ENTRY = 2;
}

message ListMySanctionsRequest {
  // 預設 20，上限 50。
  int32 page_size = 1;
  string page_token = 2;
}

message ListMySanctionsResponse {
  repeated Sanction sanctions = 1;
  string next_page_token = 2;
}

// Sanction 是買家收到的一筆社群處分。
message Sanction {
  string id = 1;
  SanctionKind kind = 2;
  // 政策分類；不設表示沒有對應的分類。
  hawkr.common.v1alpha1.PolicyCategory category = 3;
  // 給作者看的理由；沒有補充說明時是空字串。
  string reason = 4;
  google.protobuf.Timestamp create_time = 5;
}

message ListMyHiddenContentRequest {
  // 預設 20，上限 50。
  int32 page_size = 1;
  string page_token = 2;
}

message ListMyHiddenContentResponse {
  repeated HiddenContent hidden_contents = 1;
  string next_page_token = 2;
}

// HiddenContent 是買家被隱藏的一則內容與隱藏的理由。
message HiddenContent {
  // 隱藏紀錄的 ID。
  string id = 1;
  HiddenContentKind kind = 2;
  // 留言或討論區留言的 ID。
  string content_id = 3;
  // 留言所屬的貼文；討論區留言沒有。
  optional string post_id = 4;
  // 內容所屬的店家 ID（過渡期的十進位整數字串）；留言沒有時不設。
  optional string store_id = 5;
  // 被隱藏的本文，只有作者讀得到。
  string body = 6;
  google.protobuf.Timestamp create_time = 7;
  hawkr.common.v1alpha1.PolicyCategory category = 8;
  // 給作者看的理由；沒有補充說明時是空字串。
  string reason = 9;
  google.protobuf.Timestamp hide_time = 10;
}
