syntax = "proto3";

// payment 模組給後台的 API（收款開通 ADR D28、D30）：收款帳戶的讀取、重新整理、重試建立，以及清理無法完成時的重試關閉與刪除對應；付款、轉帳與退款的查詢，以及 ANOMALY 的人工結案。收款帳戶由 payment 模組擁有，擁有者現階段是店家
// （store_id）；賣家自己的收款帳戶讀取與開通 session 留在 SellerAppService（seller 確認店家擁有者之後呼叫 payment）。狀態與收件方式的列舉沿用
// hawkr.payment.v1alpha1 的定義（賣家與後台看到同一組值）。
package hawkr.admin.payment.v1alpha1;

import "hawkr/payment/v1alpha1/payment.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// PaymentAdminService 只有管理員能呼叫。
service PaymentAdminService {
  // GetPaymentAccount 讀店家的收款帳戶（外部帳戶的本地快取：狀態、轉帳與撥款能力、待補條件的原始內容、停用原因）。店家還沒有收款帳戶
  // （平台審核還沒核准，或沒有設定收款開通）時回 not_found。
  rpc GetPaymentAccount(GetPaymentAccountRequest) returns (GetPaymentAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RefreshPaymentAccount 同步向金流商重讀外部帳戶並回最新帳戶（營運工具；與賣家端的重讀同一條路徑、同一個名額：同一帳戶上次讀取在 10 秒內就不向金流商讀，
  // 快取已涵蓋該次讀取時回成功，否則回 resource_exhausted 並帶剩餘秒數（RetryInfo）；重讀失敗原樣回 unavailable）。
  // 沒有設定收款開通、外部帳戶還沒有建立或帳戶在等待關閉時回 failed_precondition，店家沒有收款帳戶回 not_found。
  rpc RefreshPaymentAccount(RefreshPaymentAccountRequest) returns (RefreshPaymentAccountResponse);

  // RetryPaymentAccountCreate 對建立失敗（重試用完，後台待辦 PAYMENT_ACCOUNT_CREATE_FAILED）的收款帳戶重新排入建立。沒有 etag，由狀態檢查保護：
  // 帳戶不是建立失敗的狀態回 failed_precondition，店家沒有收款帳戶回 not_found。建立結果不明（呼叫過、沒有外部 ID）時，金流商保存冪等鍵的期間（30 天）內重試以同一把鍵重送，
  // 不會多出帳戶，不需要確認；帳戶的 create_unresolved 為真時（超過保存期），重試會換新的冪等鍵、建立新的收款帳戶，請求必須帶 acknowledge_no_provider_account = true（管理員聲明金流商那邊沒有這家店的帳戶），否則回 failed_precondition。
  // 同一個交易寫一筆後台紀錄（platform admin audit log，動作是這支 RPC 的程序名）。
  rpc RetryPaymentAccountCreate(RetryPaymentAccountCreateRequest) returns (RetryPaymentAccountCreateResponse);

  // RetryPaymentAccountPurge 對清理進了終局（後台待辦 PAYMENT_ACCOUNT_PURGE_STUCK：金流商拒絕關閉，或等待清理超過 7 天仍關不掉）的收款帳戶重試關閉：
  // 清除終局、期限從現在重新計算，並重新排入清理。終局原因是 unresolved_creation（建立結果不明、沒有外部 ID）時看金流商保存冪等鍵的期間（30 天）：保存期內以同一把鍵重送取回
  // 外部 ID，取回後清除終局並關閉；帳戶的 create_unresolved 為真（超過保存期）時回 failed_precondition，只能刪除對應。同一個交易寫一筆後台紀錄。
  // 帳戶不是終局的狀態、或帳戶的 purge_replay_pending 為真（重送進行中）時回 failed_precondition，店家沒有收款帳戶回 not_found。
  rpc RetryPaymentAccountPurge(RetryPaymentAccountPurgeRequest) returns (RetryPaymentAccountPurgeResponse);

  // DeletePaymentAccountMapping 是「已在金流商處理，刪除對應」：只有清理進了終局的收款帳戶可以做，管理員確認金流商那邊的帳戶已另行處理。
  // 不呼叫金流商；同一個交易寫一筆只增不改的紀錄（店家、金流商、外部帳戶 ID、操作的管理員與時間）並刪除帳戶列。帳戶不是終局的狀態回 failed_precondition，
  // 店家沒有收款帳戶回 not_found。帳戶的 purge_replay_pending 為真（重送取回外部 ID 進行中）時回 failed_precondition。需要權限 payment.accounts.delete_mapping。
  rpc DeletePaymentAccountMapping(DeletePaymentAccountMappingRequest) returns (DeletePaymentAccountMappingResponse);

  // ListPayments 列付款，建立時間新的在前（營運查詢；取代舊後台的付款交易列表）。篩選條件都可省略；page_token 只能用在同一組篩選。需要權限 payment.payments.list。
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListPaymentTransfers 列付款轉給賣家的轉帳，建立時間新的在前（取代舊後台的撥款列表）。篩選條件都可省略；page_token 只能用在同一組篩選。需要權限 payment.transfers.list。
  rpc ListPaymentTransfers(ListPaymentTransfersRequest) returns (ListPaymentTransfersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListPaymentRefunds 列退款，建立時間新的在前，每筆附撤回列（人工結案撤回要用撤回列 ID）。篩選條件都可省略；page_token 只能用在同一組篩選。需要權限 payment.refunds.list。
  rpc ListPaymentRefunds(ListPaymentRefundsRequest) returns (ListPaymentRefundsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ResolvePaymentAnomaly 是對 ANOMALY 的付款、轉帳、退款、撤回或補差額轉帳的人工結案：管理員核對金流商之後結案成成功（附金流商物件 ID 為證據）或失敗。
  // 必填結案原因代碼（reason）與備註（note，去除首尾空白後 1 到 255 個字元），連同領域變更寫進同一個交易的一筆後台紀錄。物件不存在回 not_found；缺原因、原因與結果不相容、備註空白或過長回 invalid_argument（指到出錯的欄位）；物件不在 ANOMALY 或證據不合回 failed_precondition 或 invalid_argument（依模組）。需要權限 payment.anomalies.resolve。
  rpc ResolvePaymentAnomaly(ResolvePaymentAnomalyRequest) returns (ResolvePaymentAnomalyResponse);
}

// PaymentAccount 是後台看到的店家收款帳戶（payment 模組擁有，擁有者是店家）。
message PaymentAccount {
  string store_id = 1;
  // provider 的代碼（例如 stripe）。
  string provider = 2;
  // 外部帳戶 ID；還沒有建立時是空字串。
  string external_account_id = 3;
  hawkr.payment.v1alpha1.PaymentAccountStatus status = 4;
  hawkr.payment.v1alpha1.RequirementCollection requirement_collection = 5;
  bool transfers_active = 6;
  bool payouts_active = 7;
  // 金流商回報的待補條件原始內容（物件）。
  google.protobuf.Struct requirements = 8;
  // 導出目前狀態的金流商原因碼（只給後台）；沒有時是空字串。
  string status_reason = 9;
  // 最近一次向金流商讀取帳戶的時間；還沒讀過時不設。
  google.protobuf.Timestamp fetch_time = 10;
  // 建立重試用完的時間；只有還沒有外部帳戶而且建立失敗的帳戶才有。
  google.protobuf.Timestamp create_failed_time = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp update_time = 13;
  // 清理進終局的時間（待辦 PAYMENT_ACCOUNT_PURGE_STUCK 的開始時間）；沒有進終局時不設。
  google.protobuf.Timestamp purge_blocked_time = 14;
  // 清理被擋下的原因（原因代碼，冒號之後是金流商的說明；只給後台）；沒有進終局時是空字串。
  string purge_blocked_reason = 15;
  // 建立結果不明（呼叫過、沒有外部 ID）的建立失敗帳戶（待辦 PAYMENT_ACCOUNT_CREATE_FAILED）已超過金流商保存冪等鍵的期間（30 天）時為真：重試建立前要先請管理員確認
  // 金流商那邊沒有這家店的收款帳戶（RetryPaymentAccountCreateRequest.acknowledge_no_provider_account）。保存期內為假，即使已超過自動重送的 7 天，重試只是以同一把鍵重送。
  // 清理終局的原因是 unresolved_creation（待辦 PAYMENT_ACCOUNT_PURGE_STUCK）而且已超過保存期時同樣為真：同一把鍵不能再重送，重試關閉不會有結果（RetryPaymentAccountPurge
  // 回 failed_precondition），後台隱藏「重試關閉」，只剩刪除對應。
  bool create_unresolved = 16;
  // 清理已要求、還沒完成（等待關閉）的時間（D63）；沒有等待清理時不設。等待清理而還沒進終局時，卡片顯示「關閉中」並隱藏其他動作；進了終局（purge_blocked_time）改顯示被擋下的原因。
  google.protobuf.Timestamp purge_pending_time = 17;
  // 管理員對清理終局（unresolved_creation）要求的「以同一把鍵重送」排隊中或進行中時為真：重送取回的外部帳戶 ID 在帳戶列被刪之後無人關閉，所以這段期間
  // RetryPaymentAccountPurge 與 DeletePaymentAccountMapping 都回 failed_precondition，後台隱藏「重試關閉」與「已在金流商處理，刪除對應」。重送結束（不論結果）後為假。
  bool purge_replay_pending = 18;
}

message GetPaymentAccountRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetPaymentAccountResponse {
  PaymentAccount account = 1;
}

message RefreshPaymentAccountRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RefreshPaymentAccountResponse {
  PaymentAccount account = 1;
}

message RetryPaymentAccountCreateRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 管理員聲明金流商那邊沒有這家店的收款帳戶；只有帳戶的 create_unresolved 為真時才需要（見 RetryPaymentAccountCreate），其餘狀態忽略。
  bool acknowledge_no_provider_account = 2 [(google.api.field_behavior) = OPTIONAL];
}

message RetryPaymentAccountCreateResponse {
  PaymentAccount account = 1;
}

message RetryPaymentAccountPurgeRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RetryPaymentAccountPurgeResponse {
  PaymentAccount account = 1;
}

message DeletePaymentAccountMappingRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeletePaymentAccountMappingResponse {}

// PaymentOrder 是付款底下一張訂單的應收：退款上限與轉帳都以它為單位。
message PaymentOrder {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string order_no = 2;
  string store_id = 3;
  // 這張訂單的應收金額（訂單的整數金額，不帶幣別）。
  int64 amount = 4;
}

// Payment 是後台看到的付款（含金流商的外部 ID 與失敗原因）：一筆付款（一個金流商付款物件）對 orders 底下 N 張訂單應收（過渡期 N 是 1）。
message Payment {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // 第一張訂單的訂單編號與店家：N 是 1 時就是這筆付款的訂單；N 大於 1 時看 orders。
  string order_no = 2;
  string store_id = 3;
  string buyer_id = 4;
  // 付款金額（各訂單應收的總額，不帶幣別）。
  int64 amount = 5;
  // 金流商的代碼（例如 stripe）。
  string provider = 6;
  hawkr.payment.v1alpha1.PaymentStatus status = 7;
  // 金流商的付款物件 ID；還沒建立時是空字串。
  string external_payment_id = 8;
  // 入帳時間；沒有入帳時不設。
  google.protobuf.Timestamp paid_time = 9;
  // 最近一次嘗試失敗的金流商原因碼（只給後台）；沒有時是空字串。
  string last_error = 10;
  // 進入 CREATE_FAILED 或 ANOMALY 的原因；其餘狀態是空字串。
  string failure_reason = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp update_time = 13;
  // 付款底下的訂單應收，依建立順序，至少一張。
  repeated PaymentOrder orders = 14;
}

// PaymentTransfer 是後台看到的轉帳（付款轉給賣家）。
message PaymentTransfer {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string payment_id = 2;
  string order_no = 3;
  string store_id = 4;
  int64 amount = 5;
  // 已向賣家收回（撤回）的金額。
  int64 reversed_amount = 6;
  hawkr.payment.v1alpha1.PaymentTransferStatus status = 7;
  // 金流商的轉帳物件 ID；還沒有時是空字串。
  string external_transfer_id = 8;
  // 失敗或 ANOMALY 的原因；其餘狀態是空字串。
  string failure_reason = 9;
  google.protobuf.Timestamp create_time = 10;
  // 這筆轉帳所屬的訂單應收（一張訂單應收最多一筆有效轉帳）。
  string payment_order_id = 11;
}

// PaymentReversal 是退款向賣家收回款項的一次金流商撤回呼叫。
message PaymentReversal {
  // 撤回列 ID（人工結案撤回用）。
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  int64 amount = 2;
  hawkr.payment.v1alpha1.PaymentReversalStatus status = 3;
  // RELEASED 或 ANOMALY 的原因；其餘狀態是空字串。
  string reason = 4;
  // 金流商的撤回物件 ID；還沒有時是空字串。
  string external_id = 5;
  google.protobuf.Timestamp create_time = 6;
}

// PaymentRefund 是後台看到的退款。
message PaymentRefund {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  string payment_id = 2;
  string order_no = 3;
  int64 amount = 4;
  // 是否為自動退款（訂單已不可付時由系統發起）。
  bool auto = 5;
  hawkr.payment.v1alpha1.PaymentRefundStatus status = 6;
  // 這筆退款要向賣家收回的金額。
  int64 reversal_amount = 7;
  hawkr.payment.v1alpha1.PaymentReversalStatus reversal_status = 8;
  hawkr.payment.v1alpha1.PaymentTopupStatus topup_status = 9;
  // 金流商的退款物件 ID；還沒有時是空字串。
  string external_refund_id = 10;
  // 失敗或 ANOMALY 的原因；其餘狀態是空字串。
  string failure_reason = 11;
  // 呼叫端（售後或自動退款）建立退款時給的冪等鍵。
  string request_key = 12;
  repeated PaymentReversal reversals = 13;
  google.protobuf.Timestamp create_time = 14;
  // 這筆退款所屬的訂單應收（退款上限以它的應收金額計）。
  string payment_order_id = 15;
}

message ListPaymentsRequest {
  // 只列這個狀態的付款；不設是不篩。
  optional hawkr.payment.v1alpha1.PaymentStatus status = 1;
  // 只列這張訂單的付款（完全比對）；空字串是不篩。
  string order_no = 2;
  // 每頁筆數：預設 20，上限 100；負數回 invalid_argument。
  int32 page_size = 3;
  string page_token = 4;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  string next_page_token = 2;
}

message ListPaymentTransfersRequest {
  optional hawkr.payment.v1alpha1.PaymentTransferStatus status = 1;
  // 只列這張訂單的轉帳（完全比對）；空字串是不篩。
  string order_no = 2;
  // 每頁筆數：預設 20，上限 100；負數回 invalid_argument。
  int32 page_size = 3;
  string page_token = 4;
}

message ListPaymentTransfersResponse {
  repeated PaymentTransfer transfers = 1;
  string next_page_token = 2;
}

message ListPaymentRefundsRequest {
  optional hawkr.payment.v1alpha1.PaymentRefundStatus status = 1;
  // 只列這張訂單的退款（完全比對）；空字串是不篩。
  string order_no = 2;
  // 為真時只列退款、收回或補差額任一個在 ANOMALY 的退款（人工結案的待辦）。
  bool anomaly_only = 3;
  // 每頁筆數：預設 20，上限 100；負數回 invalid_argument。
  int32 page_size = 4;
  string page_token = 5;
}

message ListPaymentRefundsResponse {
  repeated PaymentRefund refunds = 1;
  string next_page_token = 2;
}

message ResolvePaymentAnomalyRequest {
  hawkr.payment.v1alpha1.PaymentAnomalyKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  // 物件 ID：付款、轉帳、退款的 ID；撤回是撤回列 ID；補差額轉帳是退款 ID。
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  hawkr.payment.v1alpha1.PaymentAnomalyOutcome outcome = 3 [(google.api.field_behavior) = REQUIRED];
  // 結案成功時必填：核對到的金流商物件 ID；結案成失敗時可省略。
  string evidence = 4 [(google.api.field_behavior) = OPTIONAL];
  // 結案原因代碼，必填（不得是 UNSPECIFIED）。PROVIDER_EXECUTED_NOT_RECORDED 只搭配結果 SUCCEEDED，PROVIDER_NOT_EXECUTED 只搭配 FAILED；
  // DUPLICATE 與 OTHER 搭配任一結果。
  hawkr.payment.v1alpha1.PaymentAnomalyResolutionReason reason = 5 [(google.api.field_behavior) = REQUIRED];
  // 結案備註，必填：去除首尾空白後 1 到 255 個字元（以 Unicode 字元計）；與原因代碼一起寫進後台動作紀錄。
  string note = 6 [(google.api.field_behavior) = REQUIRED];
}

message ResolvePaymentAnomalyResponse {}
