syntax = "proto3";

// payment 模組給後台的 API（Stripe 計畫 D28、D30）：收款帳戶的讀取、重新整理、重試建立，以及清理無法完成時的重試關閉與刪除對應。收款帳戶由 payment 模組擁有，擁有者現階段是店家
// （store_id）；賣家自己的收款帳戶讀取與開通 session 留在 SellerAppService（seller 確認店家擁有者之後呼叫 payment）。狀態與收件方式的列舉沿用
// hawkr.payment.v1alpha1 的定義（賣家與後台看到同一組值）。
package hawkr.admin.payment.v1alpha1;

import "hawkr/payment/v1alpha1/payment.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// PaymentAdminService 只有管理員能呼叫。
service PaymentAdminService {
  // GetPaymentAccount 讀店家的收款帳戶（外部帳戶的本地快取：狀態、轉帳與撥款能力、待補條件的原始內容、停用原因）。店家還沒有收款帳戶
  // （平台審核還沒核准，或沒有設定收款開通）時回 not_found。
  rpc GetPaymentAccount(GetPaymentAccountRequest) returns (GetPaymentAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RefreshPaymentAccount 同步向金流商重讀外部帳戶並回最新帳戶（營運工具；與賣家端的重讀同一條路徑、同一個名額：同一帳戶上次讀取在 10 秒內就不向金流商讀，
  // 快取已涵蓋該次讀取時回成功，否則回 resource_exhausted 並帶剩餘秒數（RetryInfo）；重讀失敗原樣回 unavailable）。
  // 沒有設定收款開通、外部帳戶還沒有建立或帳戶在等待關閉時回 failed_precondition，店家沒有收款帳戶回 not_found。
  rpc RefreshPaymentAccount(RefreshPaymentAccountRequest) returns (RefreshPaymentAccountResponse);

  // RetryPaymentAccountCreate 對建立失敗（重試用完，後台待辦 PAYMENT_ACCOUNT_CREATE_FAILED）的收款帳戶重新排入建立。沒有 etag，由狀態檢查保護：
  // 帳戶不是建立失敗的狀態回 failed_precondition，店家沒有收款帳戶回 not_found。
  rpc RetryPaymentAccountCreate(RetryPaymentAccountCreateRequest) returns (RetryPaymentAccountCreateResponse);

  // RetryPaymentAccountPurge 對清理進了終局（後台待辦 PAYMENT_ACCOUNT_PURGE_STUCK：金流商拒絕關閉，或等待清理超過 7 天仍關不掉）的收款帳戶重試關閉：
  // 清除終局、期限從現在重新計算，並重新排入清理。帳戶不是終局的狀態回 failed_precondition，店家沒有收款帳戶回 not_found。
  rpc RetryPaymentAccountPurge(RetryPaymentAccountPurgeRequest) returns (RetryPaymentAccountPurgeResponse);

  // DeletePaymentAccountMapping 是「已在金流商處理，刪除對應」：只有清理進了終局的收款帳戶可以做，管理員確認金流商那邊的帳戶已另行處理。
  // 不呼叫金流商；同一個交易寫一筆只增不改的紀錄（店家、金流商、外部帳戶 ID、操作的管理員與時間）並刪除帳戶列。帳戶不是終局的狀態回 failed_precondition，
  // 店家沒有收款帳戶回 not_found。需要權限 payment.accounts.delete_mapping。
  rpc DeletePaymentAccountMapping(DeletePaymentAccountMappingRequest) returns (DeletePaymentAccountMappingResponse);
}

// PaymentAccount 是後台看到的店家收款帳戶（payment 模組擁有，擁有者是店家）。
message PaymentAccount {
  string store_id = 1;
  // provider 的代碼（例如 stripe）。
  string provider = 2;
  // 外部帳戶 ID；還沒有建立時是空字串。
  string external_account_id = 3;
  hawkr.payment.v1alpha1.PaymentAccountStatus status = 4;
  hawkr.payment.v1alpha1.RequirementCollection requirement_collection = 5;
  bool transfers_active = 6;
  bool payouts_active = 7;
  // 金流商回報的待補條件原始內容（物件）。
  google.protobuf.Struct requirements = 8;
  // 導出目前狀態的金流商原因碼（只給後台）；沒有時是空字串。
  string status_reason = 9;
  // 最近一次向金流商讀取帳戶的時間；還沒讀過時不設。
  google.protobuf.Timestamp fetch_time = 10;
  // 建立重試用完的時間；只有還沒有外部帳戶而且建立失敗的帳戶才有。
  google.protobuf.Timestamp create_failed_time = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp update_time = 13;
  // 清理進終局的時間（待辦 PAYMENT_ACCOUNT_PURGE_STUCK 的開始時間）；沒有進終局時不設。
  google.protobuf.Timestamp purge_blocked_time = 14;
  // 清理被擋下的原因（原因代碼，冒號之後是金流商的說明；只給後台）；沒有進終局時是空字串。
  string purge_blocked_reason = 15;
}

message GetPaymentAccountRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetPaymentAccountResponse {
  PaymentAccount account = 1;
}

message RefreshPaymentAccountRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RefreshPaymentAccountResponse {
  PaymentAccount account = 1;
}

message RetryPaymentAccountCreateRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RetryPaymentAccountCreateResponse {
  PaymentAccount account = 1;
}

message RetryPaymentAccountPurgeRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RetryPaymentAccountPurgeResponse {
  PaymentAccount account = 1;
}

message DeletePaymentAccountMappingRequest {
  string store_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeletePaymentAccountMappingResponse {}
