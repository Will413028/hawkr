  CaseInquiryReplyChannel channel = 2 [(google.api.field_behavior) = REQUIRED];
  // 收到的時間：不早於詢問建立、不晚於現在。精確度是秒：與詢問建立同一秒的時間視為建立當下（伺服器記為建立時間），不會因為詢問建立時間有微秒而被擋。
  google.protobuf.Timestamp receive_time = 3 [(google.api.field_behavior) = REQUIRED];
  // 回覆內容，1 到 4000 字。
  string body = 4 [(google.api.field_behavior) = REQUIRED];
  // 附件的 staged token（機敏上傳），最多 5 份。
  repeated string evidence_tokens = 5;
}

