}

message CreateCaseNoteResponse {
  GovernanceNote note = 1;
}

message ListCaseNotesRequest {
  // 案件的 id。
  string case_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 每頁筆數：0 用預設值 20，上限 100。
  int32 page_size = 2;
  string page_token = 3;
}

message ListCaseNotesResponse {
  // 舊到新。
  repeated GovernanceNote notes = 1;
  string next_page_token = 2;
}

message GetViolationRequest {
