message EndMeasureRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // 讀到的措施的 etag。
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
}

message EndMeasureResponse {
  Measure measure = 1;
}

message RevokeMeasureRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // 管理員可以選的撤銷原因；不能是 UNSPECIFIED。
  AdminRevokeReason reason = 2 [(google.api.field_behavior) = REQUIRED];
  // 是否一併撤銷這個措施自己建立的認定（並連帶撤銷引用它們的其他措施）；只在措施的 can_revoke_findings 為 true 時可以設，否則回 invalid_argument。
  bool revoke_findings = 3;
  // 讀到的措施的 etag。
  string etag = 4 [(google.api.field_behavior) = REQUIRED];
