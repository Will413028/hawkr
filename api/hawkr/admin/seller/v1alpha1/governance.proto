message ScheduleMeasureReviewRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // 新的複審期限：現在之後、30 天以內。
  google.protobuf.Timestamp review_by = 2 [(google.api.field_behavior) = REQUIRED];
  // 內部註記（為什麼延後），1 到 2000 字。
  string note = 3 [(google.api.field_behavior) = REQUIRED];
  // 讀到的措施的 etag。
  string etag = 4 [(google.api.field_behavior) = REQUIRED];
