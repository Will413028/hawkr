// GovernanceNote 是措施或案件的一則內部註記：平台人員之間的說明，賣家看不到。只新增，不能改也不能刪。
message GovernanceNote {
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // 註記的內容；最多 2000 字。
  string body = 2 [(google.api.field_behavior) = REQUIRED];
  string created_by_admin_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 這則註記是改嚴重度時寫的：改前與改後。只有案件的註記可能有，措施的註記不設。
  SeverityChange severity_change = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

