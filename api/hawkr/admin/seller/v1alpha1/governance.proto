message CreateMeasureRequest {
  reserved 3, 5, 6, 8, 9, 10;
  reserved "kind", "end_time", "review_by", "violation", "risk";

  // 選填，UUIDv4：同一位管理員的重送用它辨識。同樣的 request_id 與同樣的內容回傳原本的措施（目前的狀態與 etag）；內容不同回
  // invalid_argument。請求的內容在措施建立之後不論店家、認定、期限怎麼變，重送都先於這些檢查。
  string request_id = 1 [(google.api.field_info).format = UUID4];
  string store_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 給賣家的理由，1 到 2000 字。
  string statement = 4 [(google.api.field_behavior) = REQUIRED];
  // 第一則內部註記，1 到 2000 字。
  string note = 7 [(google.api.field_behavior) = REQUIRED];
  // 措施的種類：設定的是哪一支就是哪一種，必須設定其中一支。各種類專屬的欄位在那一支裡面，所以不會有跨欄位的種類對應。
  oneof measure {
    WarningInput warning = 11;
    SuspensionInput suspension = 12;
    TerminationInput termination = 13;
  }
  // 選填：從案件建立時帶案件 id。任何種類與依據都可以帶；措施的店家必須是案件的店家（invalid_argument），案件必須進行中（failed_precondition）。
  // 之後這個措施算是案件導出的措施（ListMeasuresRequest.source_case_id）。同一個 request_id 帶不同的案件是不同的請求。
  string source_case_id = 14;
  // 選填：從主管機關來函建立時帶來函 id。任何種類與依據都可以帶；來函必須指名這個措施的帳號（invalid_argument；指名店家時只算那一家）。
  // 來函已完成也可以。之後這個措施算是來函導出的措施（ListMeasuresRequest.source_authority_order_id）。同一個 request_id 帶不同的來函是不同的請求。
  string source_authority_order_id = 15;
}

// WarningInput 是警告：依據違規的認定，沒有結束時間。
message WarningInput {
  ViolationBasis violation = 1 [(google.api.field_behavior) = REQUIRED];
}

// SuspensionInput 是停權：依據違規的認定或風險類型。
message SuspensionInput {
  oneof basis {
    ViolationBasis violation = 1;
    RiskBasis risk = 2;
  }
  // 結束時間，必須晚於現在。VIOLATION 依據的停權必填；RISK 選填（不設是沒有固定期間，由平台定期複審）。
  google.protobuf.Timestamp end_time = 3;
  // RISK 必填：複審期限，必須晚於現在、不超過 30 天；VIOLATION 依據不可以設。
  google.protobuf.Timestamp review_by = 4;
}

// TerminationInput 是終止合作（賣家合作條款第 21.2、21.3 條）的事由與依據。措施的依據（Measure.basis）由伺服器推導：有 violation 是 VIOLATION，
// 否則是 CONTRACT（NOTICE 與 LINKED_ACCOUNT 一定是 CONTRACT，不可以帶 violation）。終止沒有 end_time 與 review_by。
message TerminationInput {
  hawkr.seller.v1alpha1.TerminationGround ground = 1 [(google.api.field_behavior) = REQUIRED];
  // 依據的認定。需求依事由而定（TerminationOption.violation_requirement：必填、選填或不可以設），條件寫在該選項的 explanation；
  // 不符回 invalid_argument 指 termination.violation.cited_finding_ids（必填而沒有引用，或引用的認定不符條件）。
  ViolationBasis violation = 2;
  // LINKED_ACCOUNT 必填、其他事由不可以設：來源措施的 id。來源必須是另一個帳號、未撤銷、事由不是 NOTICE 或 LINKED_ACCOUNT 的終止合作，
  // 而且本措施的帳號與來源的身分快照命中（Measure.linked_accounts 列出命中的帳號，伺服器再驗證一次）；同一個來源對同一個帳號只能有一筆生效中的關聯終止
  // （already_exists）。來源撤銷時這筆一併撤銷。
  string source_measure_id = 3;
}

// ViolationBasis 是措施依據的認定：新的認定與引用的既有認定，合計至少一筆。引用的認定必須是同一個帳號、仍生效的。
// cited_finding_ids 是集合，順序沒有意義（同一組不論怎麼排都是同一個請求）。主要依據由伺服器的規則決定，不看清單的位置：有新的認定時是新的認定，
// 否則是引用的認定中最嚴重的（CRITICAL > HIGH > MEDIUM > LOW），同嚴重度取最新建立的。
message ViolationBasis {
  NewFinding finding = 1;
  repeated string cited_finding_ids = 2;
}

message NewFinding {
  // 認定的類別：政策分類中平台判定與認定可用的值，OTHER 不行（OTHER 只給檢舉人選）；UNSPECIFIED 與 OTHER 回 invalid_argument。
  hawkr.common.v1alpha1.PolicyCategory category = 1 [(google.api.field_behavior) = REQUIRED];
  hawkr.seller.v1alpha1.ViolationSeverity severity = 2 [(google.api.field_behavior) = REQUIRED];
  // 成立這個認定的通報，最多 20 筆、不可重複，是集合（順序沒有意義）；每一筆都必須是同一家店、而且結果不是未違規、內容不足或濫報
  // （Report.can_cite_as_source 為 true 的那些）。可以不填。
  repeated string source_report_ids = 3;
  // 成立這個認定的主管機關來函，最多 5 筆、不可重複，是集合（順序沒有意義）；每一筆都必須指名這個措施的帳號（指名店家時只算那一家）。可以不填。
  repeated string source_authority_order_ids = 4;
}

message RiskBasis {
  hawkr.seller.v1alpha1.RiskGround ground = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateMeasureResponse {
  Measure measure = 1;
}

message GetMeasureRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetMeasureResponse {
  Measure measure = 1;
}

message ListMeasuresRequest {
  // 每頁筆數：0 用預設值 20，上限 100。
  int32 page_size = 1;
  string page_token = 2;
  // 只列這家店的措施；空字串不篩選。
  string store_id = 3;
  // 只列這個帳號的措施（含舊店的）；空字串不篩選。
  string account_id = 4;
  // 只列此刻是這個狀態的措施；UNSPECIFIED 不篩選。
  hawkr.seller.v1alpha1.MeasureState state = 5;
  // 只列這個依據的措施；UNSPECIFIED 不篩選。
  hawkr.seller.v1alpha1.MeasureBasis basis = 6;
  reserved 7, 9;
  reserved "appeal_state", "remediation_state";
  // true 只列複審中的措施：RISK、生效中、現在不早於 review_by 前 24 小時（與 Measure.review_deadline 同一個定義，review_by 過了之後仍在），依 review_by 舊到新；false 與不設不篩選。
  bool review_due = 8;
  // 只列有任一筆請求（申覆或解除請求，一個措施可以有多筆不同狀態的）是這個狀態的措施，狀態是伺服器推導的 MeasureRequest.state：措施已不在
  // 生效中而仍待處理的解除請求算 CLOSED，不算 PENDING。PENDING 是待處理請求的收件匣，依請求提出時間舊到新（優先序在 review_due 之後）；
  // UNSPECIFIED 不篩選。
  hawkr.seller.v1alpha1.MeasureRequestState request_state = 10;
  // 只列有任一筆這個種類且（有 request_state 時）符合該狀態的請求的措施；UNSPECIFIED 不篩選種類。
  hawkr.seller.v1alpha1.MeasureRequestKind request_kind = 11;
  // 只列這個案件導出的措施：source_case_id 是這個案件，或依據的認定（含引用的既有認定）以這個案件的通報為來源；空字串不篩選。
  string source_case_id = 12;
  // 只列依據的認定（含引用的既有認定）以這筆通報為來源的措施；空字串不篩選。設定結果的對話框用它提示「這筆通報已是措施的依據來源」。
  string source_report_id = 13;
  // 只列這份來函導出的措施：source_authority_order_id 是它，或依據的認定（含引用的既有認定）引用了它；空字串不篩選。
  string source_authority_order_id = 14;
}

message ListMeasuresResponse {
  repeated Measure measures = 1;
  string next_page_token = 2;
}

message UpdateMeasureRequest {
  // id 與 etag 必填；只有 statement、end_time 會被採用。
  Measure measure = 1 [(google.api.field_behavior) = REQUIRED];
  // 必填，只能列 statement、end_time。
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateMeasureResponse {
  Measure measure = 1;
