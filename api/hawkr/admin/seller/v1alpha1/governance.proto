  // 給賣家的說明，1 到 2000 字。要同時要紀錄又要說明，寫在同一則說明裡，種類選主要的那個。
  string message = 3 [(google.api.field_behavior) = REQUIRED];
  // 選填：期限。不設時是建立後 72 小時；設定時必須在建立後 24 小時到 14 天之間。
  google.protobuf.Timestamp due_time = 4;
  // 選填，UUIDv4（AIP-155）：同一位管理員以同一個 request_id 重送回原本那一筆；內容不同回 invalid_argument。範圍是（建立的管理員, request_id），同 CreateMeasure。
