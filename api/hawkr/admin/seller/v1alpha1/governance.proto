message ListMeasureNotesResponse {
  // 舊到新。
  repeated GovernanceNote notes = 1;
  string next_page_token = 2;
}

message CreateCaseNoteRequest {
  // 案件的 id。
  string case_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 只有 body 會被採用。
