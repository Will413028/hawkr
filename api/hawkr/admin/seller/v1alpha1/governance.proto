message DecideAppealRequest {
  // 措施的 id。
  string measure_id = 1 [(google.api.field_behavior) = REQUIRED];
  // ACCEPTED 或 REJECTED。
  hawkr.seller.v1alpha1.MeasureRequestState decision = 2 [(google.api.field_behavior) = REQUIRED];
  // 裁定的理由，1 到 2000 字；接受與駁回都必填，賣家看得到。
  string reason = 3 [(google.api.field_behavior) = REQUIRED];
  // ACCEPTED 時是否一併撤銷這個措施自己建立的認定（並連帶撤銷引用它們的其他措施）；只在措施的 can_revoke_findings 為 true 時可以設，REJECTED 時不可以設，否則回 invalid_argument。
  bool revoke_findings = 4;
  // 讀到的措施的 etag。
  string etag = 5 [(google.api.field_behavior) = REQUIRED];
}

message DecideAppealResponse {
