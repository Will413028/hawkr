syntax = "proto3";

// reviewqueue 模組給後台的待辦 API（step10e-3d-design.md §1.3）：所有模組中等待營運處理的事項，依期限由急到緩。
// 待辦不是儲存的資源：每一項由擁有它的模組的領域狀態推導（成員、開始與期限的規則只在擁有者），所以沒有 Get；
// 處理一項待辦在它所屬的頁面（通報、案件、來函、措施、食品業者登錄、商家認證），項目帶對象的 ID 讓 client 連過去。
// 每一項都有期限（Deadline.start_time、due_time 都由伺服器給）；client 只拿現在和它們比較，不重建起算規則。
package hawkr.admin.reviewqueue.v1alpha1;

import "hawkr/common/v1alpha1/deadline.proto";
import "google/api/field_behavior.proto";

// ReviewQueueAdminService 只有管理員能呼叫。
service ReviewQueueAdminService {
  // ListReviewQueue 列出此刻等待營運處理的事項，依期限由急到緩：期限、開始時間、種類、對象鍵的全序（同期限同開始時間的項目順序固定，翻頁不重複也不漏）。
  // 權限 reviewqueue.items.list 只決定能不能呼叫；看得到哪些種類由呼叫者對各來源（通報與案件、來函、措施、食品業者登錄、商家認證）的讀取權決定：
  // 沒有讀取權的種類不出現，kinds 空的時候就是有權的全部，全部都沒有權限時回空清單（不是 PERMISSION_DENIED）。
  // 翻頁途中被營運自己改過排序鍵的項目（改案件嚴重度、延後複審、暫不告知換成仍已到期的確認日期），可能在後面的頁重複或不出現，重新整理就正確。
  rpc ListReviewQueue(ListReviewQueueRequest) returns (ListReviewQueueResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ReviewQueueItemKind 是待辦的種類。值的順序不是排序依據：排序是期限。
enum ReviewQueueItemKind {
  REVIEW_QUEUE_ITEM_KIND_UNSPECIFIED = 0;
  // 待分案的通報（subject 是 report_id）。
  REVIEW_QUEUE_ITEM_KIND_REPORT_TRIAGE = 1;
  // 待決定的案件（subject 是 case_id）。
  REVIEW_QUEUE_ITEM_KIND_CASE_DECISION = 2;
  // 案件裡逾期未回覆的詢問，營運要跟進（subject 是 case_inquiry）。
  REVIEW_QUEUE_ITEM_KIND_CASE_INQUIRY_OVERDUE = 3;
  // 待轉報主管機關的案件（subject 是 case_id）。
  REVIEW_QUEUE_ITEM_KIND_CASE_FDA_REFERRAL = 4;
  // 處理中的主管機關來函（subject 是 authority_order_id）。
  REVIEW_QUEUE_ITEM_KIND_AUTHORITY_ORDER = 5;
  // 來函中暫不告知的對象，確認日期已到，要確認是否可以告知（subject 是 authority_target）。
  REVIEW_QUEUE_ITEM_KIND_AUTHORITY_TARGET_NOTICE = 6;
  // 待裁定的申覆（subject 是 measure_request）。
  REVIEW_QUEUE_ITEM_KIND_MEASURE_APPEAL = 7;
  // 待裁定的解除請求（subject 是 measure_request）。
  REVIEW_QUEUE_ITEM_KIND_MEASURE_LIFT_REQUEST = 8;
  // 複審期限將到的風險停權（subject 是 measure_id）。
  REVIEW_QUEUE_ITEM_KIND_MEASURE_REVIEW = 9;
  // 待審核的食品業者登錄（subject 是 food_registration_id）。
  REVIEW_QUEUE_ITEM_KIND_FOOD_REGISTRATION = 10;
  // 待審核的商家認證（subject 是 kyc_application）。
  REVIEW_QUEUE_ITEM_KIND_KYC_APPLICATION = 11;
  // 重試用完的 PayUni 綁定失敗，等管理員重新綁定（subject 是 kyc_application）。
  REVIEW_QUEUE_ITEM_KIND_PAYUNI_BIND_RETRY = 12;
}

message ListReviewQueueRequest {
  // 每頁筆數：0 用預設值 50，上限 100（超過以 100 計）；負數回 INVALID_ARGUMENT。
  int32 page_size = 1;
  // 上一頁回的 next_page_token；token 綁住 kinds（順序不同但集合相同算相同），其他不符或無法解讀回 INVALID_ARGUMENT。
  string page_token = 2;
  // 只列這些種類（任一相符就列出）；空的不篩，列出呼叫者有權的全部。含 UNSPECIFIED 或不認得的值回 INVALID_ARGUMENT。
  repeated ReviewQueueItemKind kinds = 3;
}

message ListReviewQueueResponse {
  repeated ReviewQueueItem items = 1;
  // 空字串表示最後一頁。
  string next_page_token = 2;
}

// ReviewQueueItem 是一件待辦。
message ReviewQueueItem {
  ReviewQueueItemKind kind = 1 [(google.api.field_behavior) = REQUIRED];

  // 待辦的對象；設定的是哪一支由 kind 決定（見 ReviewQueueItemKind 各值的註解）。
  oneof subject {
    string report_id = 2;
    string case_id = 3;
    CaseInquiryRef case_inquiry = 4;
    string authority_order_id = 5;
    AuthorityTargetRef authority_target = 6;
    MeasureRequestRef measure_request = 7;
    string measure_id = 8;
    string food_registration_id = 9;
    KYCApplicationRef kyc_application = 10;
  }

  // 對象所屬的店家；空字串表示這個項目沒有單一店家（例如來函）。
  string store_id = 20;
  // 店名；沒有店家或店家的個資已清理時是空字串（client 顯示「店家 {id}」）。
  string store_name = 21;
  // 這件待辦的開始時間與期限。
  hawkr.common.v1alpha1.Deadline deadline = 22 [(google.api.field_behavior) = REQUIRED];
}

// CaseInquiryRef 指到案件裡的一筆詢問。
message CaseInquiryRef {
  string case_id = 1;
  string inquiry_id = 2;
}

// AuthorityTargetRef 指到來函的一個被指名的對象。
message AuthorityTargetRef {
  string order_id = 1;
  // 對象在來函的位置（從 0 起，同 AuthorityOrder.targets 的順序）。
  int32 position = 2;
  // 被指名的帳號 ID（對象沒有指定店家時，client 以「帳號 {id}」顯示）。
  string account_id = 3;
}

// MeasureRequestRef 指到措施的一筆請求（申覆或解除請求）。
message MeasureRequestRef {
  string measure_id = 1;
  string request_id = 2;
}

// KYCApplicationRef 指到店家的一筆商家認證申請。
message KYCApplicationRef {
  string store_id = 1;
  string application_id = 2;
}
