# gitleaks 設定：沿用內建規則，只對「明確是誤報」的樣式放行。
# .gitleaks-baseline.json 放待人工確認的歷史命中（只擋新增的外洩），目前為空。
title = "hawkr gitleaks"

[extend]
useDefault = true

# 新增放行前先確認那一筆真的不是機敏資料，並寫明理由。
[[allowlists]]
description = "依賴與遷移的雜湊／摘要檔：內容是 checksum，不是金鑰"
paths = [
  '''(^|/)atlas\.sum$''',
  '''(^|/)Podfile\.lock$''',
]

[[allowlists]]
description = "buf 模組的 BSR 摘要（googleapis:<digest>），公開的模組版本 pin"
paths = [
  '''(^|/)buf(\.gen)?\.yaml$''',
]

[[allowlists]]
description = "website-e2e 用的假 Clerk key（內容是 base64 的保留網域 example.org，沒有對應的 Clerk application；檔內有說明）"
condition = "AND"
paths = ['''^\.github/workflows/website-e2e\.yml$''']
regexTarget = "line"
regexes = ['''NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:''']

[[allowlists]]
description = "設計書的範例：Idempotency-Key 是請求標頭範例值，不是機敏資料"
condition = "AND"
paths = ['''^backend/docs/詳細設計書/56-ADM''']
regexTarget = "line"
regexes = ['''[Ii]dempotency-?[Kk]ey''']

[[allowlists]]
description = "設計書的文字說明 PEM 檔頭格式（BEGIN PRIVATE KEY），沒有金鑰本體"
condition = "AND"
paths = ['''^backend/docs/詳細設計書/05-支付服務''']
regexTarget = "line"
regexes = ['''PKCS#8|PKCS#1|BEGIN (RSA )?PRIVATE KEY''']

[[allowlists]]
description = "AMEGO 電子發票 API 文件的範例：廠商公開的測試帳號 AppKey（搭配測試統編 12345678），不是正式憑證"
condition = "AND"
paths = ['''^backend/docs/第三方整合/AMEGO 電子發票 API 總覽\.md$''']
rules = ["generic-api-key"]

[[allowlists]]
description = "代行 BFF 測試的假 Idempotency-Key：固定的 UUIDv4 十六進位測試值，不是機敏資料"
condition = "AND"
paths = ['''^website/tests/delegated-bff-routes\.test\.ts$''']
regexTarget = "line"
regexes = ['''const KEY_HEX = ''']

[[allowlists]]
description = "Stripe log 遮蔽測試的假金鑰（SECRETKEY123 之類的固定字串，沒有對應的 Stripe 帳戶），測試要確認它們不會出現在 log"
condition = "AND"
paths = ['''^backend/internal/platform/stripe/redact_test\.go$''']
rules = ["stripe-access-token", "generic-api-key"]

[[allowlists]]
description = "notification 停寄名單 integration 測試的假 Resend webhook 簽章密鑰：只在測試裡簽與驗自己產生的 payload，沒有對應的 Resend 帳號"
condition = "AND"
paths = ['''^backend/internal/modules/notification/suppression_integration_test\.go$''']
regexTarget = "line"
regexes = ['''const resendSecret = ''']

[[allowlists]]
description = "代行操作測試裡的 Idempotency-Key 是固定 UUID 或操作識別值，不是授權憑證；只放行對應欄位與格式"
condition = "AND"
paths = [
  '''^admin/tests/delegated-operation-upstream\.test\.ts$''',
  '''^backend/gateway/internal/handler/admin_delegation_contract_test\.go$''',
  '''^backend/services/invoice-service/internal/usecase/admin_manual_unlock_test\.go$''',
  '''^backend/services/invoice-service/internal/usecase/seller_write_test\.go$''',
  '''^website/lib/api/delegated\.unit\.test\.ts$''',
]
regexTarget = "line"
regexes = [
  '''(?i)(idempotencyKey|IdempotencyKey):\s*"[A-Za-z0-9-]{1,36}"''',
  '''Header\.Set\("Idempotency-Key", "[0-9a-fA-F-]{36}"\)''',
  '''const goodKey = "[0-9a-fA-F-]{36}"''',
]
rules = ["generic-api-key"]

[[allowlists]]
description = "gateway logger integration 測試中的 20 字元 auth 遮蔽 canary；只在斷言未洩漏的測試行放行"
condition = "AND"
paths = ['''^backend/gateway/internal/middleware/logger_integration_test\.go$''']
regexTarget = "line"
regexes = ['''strings\.Contains\(auth,\s*"[A-Za-z0-9_-]{20}"\)''']
rules = ["generic-api-key"]

[[allowlists]]
description = "rate limit subject 測試的 CI secret 明確標成 for-tests 並用數字尾碼，不是 CI 憑證"
condition = "AND"
paths = ['''^backend/gateway/internal/middleware/ratelimit_subject_test\.go$''']
regexTarget = "line"
regexes = ['''testOriginCISecret\s*=\s*"[a-z-]*tests-[0-9]{10}"''']
rules = ["generic-api-key"]

[[allowlists]]
description = "logger URL redaction 測試用 18 字元、帶連續序列的 Google-key 樣式 canary；此測試不發出網路請求"
condition = "AND"
paths = ['''^backend/pkg/logger/redact_test\.go$''']
regexTarget = "line"
regexes = ['''input:.*[?&]key=AIza[A-Za-z0-9_-]{14}''']
rules = ["generic-api-key"]

[[allowlists]]
description = "PayUni client 測試中的固定 32 位十六進位 hash key fixture"
condition = "AND"
paths = ['''^backend/pkg/payuni/client_test\.go$''']
regexTarget = "line"
regexes = ['''testHashKey\s*=\s*"[0-9a-fA-F]{32}"''']
rules = ["generic-api-key"]

[[allowlists]]
description = "AMEGO sign 測試引用廠商官方文件的公開 AppKey fixture；此規則只匹配該測試常數與 20 位字母數字格式"
condition = "AND"
paths = ['''^backend/services/invoice-service/internal/client/amego/sign_test\.go$''']
regexTarget = "line"
regexes = ['''officialAppKey\s*=\s*"[A-Za-z0-9]{20}"''']
rules = ["generic-api-key"]
