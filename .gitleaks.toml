# gitleaks 設定：沿用預設規則，只排除內容是雜湊或模組參照的檔。
# 個別的測試值以行內 `gitleaks:allow` 標註；文件裡的公開範例值列在 .gitleaksignore。
[extend]
useDefault = true

[[allowlists]]
description = "雜湊：Atlas migration checksum 與 CocoaPods lockfile；BSR 模組參照"
paths = [
  '''(^|/)atlas\.sum$''',
  '''(^|/)Podfile\.lock$''',
  '''(^|/)buf(\.gen)?\.yaml$''',
]
