# =============================================================================
# 本地開發環境（唯一入口 ./dev.sh，容器只跑在 OrbStack）
# =============================================================================
# Go 服務 dev container 契約（issue #2025，勿隨意還原）：
#
#   Go 服務跑 `target: dev`（Air hot-reload）——go.mod / pkg/ 皆由 bind mount 掛進去、
#   在容器內即時 `go build`。因此 dev container **必須能連 module proxy**：
#     • GOPROXY 一律 `https://proxy.golang.org,direct`，**嚴禁 "off"**。
#       k8s/values/*.yaml 的 `GOPROXY: "off"` 是給 prod builder 用的（go-base image
#       已含全 monorepo deps、無 egress），不適用本地 dev container；此處刻意與 k8s
#       不一致，check-compose-k8s-align.sh 白名單已放行 GOPROXY。
#     • `go-mod-cache:/go/pkg/mod` 具名 volume：module cache 必須活在 volume 而非
#       image layer，才不會隨 image 老化而過期。
#   為何（#2025 實測）：dev image 的 /go/pkg/mod 是 build 時 `go mod download` 烘進
#   layer 的快照，而 `./dev.sh rebuild` 過去只重建 Java 服務 → Go dev image 可放置
#   數月不動（實測 review/social/buyer 停留在 2026-03-10）。之後 pkg/go.mod 新增任一
#   依賴（如 miniredis），容器內 go build 就解不了 module graph；GOPROXY=off 使其
#   無法補抓 → Air build 失敗 → /app/tmp/main 不存在 → exit 127。此時 Air 本身仍活著，
#   容器維持 `Up`（僅 unhealthy），實測 6 個 Go 服務就這樣「Up 但沒在服務」8~9 天。
#   對照組：gateway 與 buyer-service 的 image 一樣舊（2026-04-02 / 2026-03-10），
#   但因 GOPROXY 未關而全程 healthy。
# =============================================================================

include:
  # 基礎設施（postgres、redis、rabbitmq、otel-collector）與 network 定義在這裡。
  - docker-compose-infra.yml

services:

  # ==========================================
  # API Gateway (9900)
  # ==========================================

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      target: dev
      args:
        GO_VERSION: ${GO_VERSION:?用 ./dev.sh 執行（從 .go-version 帶入）}
    image: hawkr/gateway:latest
    container_name: gateway
    restart: unless-stopped
    # gateway 只聽 9900（debug 9901、metrics 9902 不對外）。host 的 8080 留給在本機跑的
    # 單體（HTTP_ADDR 預設 :8080），兩者可以同時跑。
    ports:
      - "9900:9900"
    # Linux 的 Docker Engine 沒有內建 host.docker.internal（Docker Desktop 有），補上才連得到本機的單體。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: UTC
      GIN_MODE: release
      APP_ENV: local
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_URL: ${GATEWAY_URL:-http://127.0.0.1:9900}

      # 入口是在本機跑的單體（make serve，:8080）：認證、CORS、CSRF 都在單體，gateway 信任單體帶的
      # 身分 header。這份清單只剩 chat 的 WebSocket upgrade 檢查 Origin 用（handler/chat.go），
      # 到 IM 搬進單體（遷移計畫 A6）為止。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3000}

      # Service Discovery (Direct connection for local dev)
      ACCOUNT_SERVICE_HOST: host.docker.internal
      ACCOUNT_SERVICE_GRPC_PORT: 9941
      CART_SERVICE_HOST: cart-service
      CART_SERVICE_GRPC_PORT: 9927
      BUYER_SERVICE_HOST: host.docker.internal
      BUYER_SERVICE_GRPC_PORT: 9941
      SELLER_SERVICE_HOST: host.docker.internal
      SELLER_SERVICE_GRPC_PORT: 9941
      CRM_SERVICE_HOST: crm-service
      CRM_SERVICE_GRPC_PORT: 10030
      PRODUCT_SERVICE_HOST: product-service
      PRODUCT_SERVICE_PORT: 9912
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 9914
      SOCIAL_SERVICE_HOST: social-service
      SOCIAL_SERVICE_GRPC_PORT: 9918
      COUPON_SERVICE_HOST: coupon-service
      COUPON_SERVICE_GRPC_PORT: 9951
      REVIEW_SERVICE_HOST: review-service
      REVIEW_SERVICE_GRPC_PORT: 10033
      AFTERSALES_SERVICE_HOST: aftersales-service
      AFTERSALES_SERVICE_GRPC_PORT: 9923
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 9924
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_GRPC_PORT: 9931
      IM_SERVICE_HOST: im-service
      IM_SERVICE_GRPC_PORT: 9933
      IM_CHAT_STREAM_JWT_SECRET: ${IM_CHAT_STREAM_JWT_SECRET:-}
      IM_CHAT_STREAM_JWT_SECRET_PREV: ${IM_CHAT_STREAM_JWT_SECRET_PREV:-}
      MEDIA_SERVICE_HOST: media-service
      MEDIA_SERVICE_PORT: 9936
      # 圖片 objectKey → 顯示 URL 的域名唯一來源（49 號 §6.1）；Gateway 組 {語意}Url 欄位
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL 必填：媒體公開網域，如 https://media.example.com}
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_GRPC_PORT: 9939
      # Task 12：doc 57 §13 的 gateway 側 capability flag，gate GET
      # /app/buyers/me/procurement/runs/:runId/events（run ledger 事件重播／
      # 即時訂閱 SSE）。預設 false。
      PROCUREMENT_REPLAY_SSE_ENABLED: ${PROCUREMENT_REPLAY_SSE_ENABLED:-false}
      PAYUNI_WEBHOOK_SERVICE_HOST: payuni-webhook-service
      PAYUNI_WEBHOOK_SERVICE_PORT: 9946
      PRODUCT_IMPORT_SERVICE_HOST: product-import-service
      PRODUCT_IMPORT_SERVICE_GRPC_PORT: 9961
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_GRPC_PORT: 10037
      # invoice-service（58 號設計書 §12.1.2 F）。三個 INVOICE_SERVICE_* 必須一起加：
      # 只漏第三個 ⇒ 發票查得到、PDF 下載不了，其餘全正常。
      INVOICE_SERVICE_HOST: invoice-service
      INVOICE_SERVICE_GRPC_PORT: 10041
      INVOICE_SERVICE_FILE_PORT: 10042
      INVOICE_GRPC_DEADLINE_MS: 3000
      # 憑證測試連線要打 AMEGO 一趟；用 3000 會把我方逾時說成賣家的 AppKey 有問題。
      INVOICE_GRPC_DEADLINE_CREDENTIAL_TEST_MS: 15000

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026

      # RabbitMQ — Gateway SSE platform 首次成為 consumer（41 號設計書 §5.6）
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F

      # Gateway SSE Hub tunables（41 號設計書 §15）— 未設用預設
      SSE_HEARTBEAT_INTERVAL: 30s
      SSE_RING_BUFFER_SIZE: 200
      SSE_RING_BUFFER_TTL: 5m
      SSE_BATCH_WINDOW_MS: 50
      SSE_MAX_CONN_PER_POD: 5000
      SSE_MAX_CONN_PER_SUBJECT: 5
      SSE_MAX_CONN_PER_USER: 3
      SSE_MAX_CONN_LIFETIME: 8m
      SSE_EVICT_WINDOW: 30s

      # 分層限流（#1416 / #2022 / #2264）— 值等同 k8s/values/gateway.yaml 與 code
      # default，讓本地重現 dev/prod 的限流行為。各層上限 = 每
      # RATE_LIMIT_WINDOW_SECONDS 秒、每個「限流身分」允許的請求數（身分不是
      # client IP，見 01 設計書 §3.2.4）；auth-failure 軸則是 401 次數上限
      # （0 = 整條軸關閉）。
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MODERATE_PER_WINDOW: 600
      RATE_LIMIT_MODERATE_SSR_PER_WINDOW: 12000
      RATE_LIMIT_MODERATE_CI_PER_WINDOW: 300
      RATE_LIMIT_DEFAULT_PER_WINDOW: 300
      RATE_LIMIT_FALLBACK_CAPACITY: 10000
      RATE_LIMIT_AUTH_FAILURE_PER_WINDOW: 100

      # ── ADM 代行營運：per-hop gRPC deadline（56 號設計書 §8.5.1 (A)）──
      # 分組以 §8.5.1 的 (A)(B) 為準、不以名稱前綴為準：
      # 這裡的 _STORE_STATE_MS 是 Gateway 讀店家狀態的逾時；單體的 DelegationService 讀店家狀態是同行程呼叫 seller 模組，
      # 沒有逾時設定。
      # 三環境同值是刻意的——這組是逾時預算，不是環境資源差異的函式。
      DELEGATION_GRPC_DEADLINE_PREFLIGHT_MS: 3000
      DELEGATION_GRPC_DEADLINE_CREATE_MS: 2000
      DELEGATION_GRPC_DEADLINE_CURRENT_MS: 800
      DELEGATION_GRPC_DEADLINE_STORE_STATE_MS: 800
      DELEGATION_GRPC_DEADLINE_DOMAIN_READ_MS: 800
      DELEGATION_GRPC_DEADLINE_AUDIT_INTENT_MS: 800
      DELEGATION_GRPC_DEADLINE_AUDIT_CONFIRM_MS: 400
      DELEGATION_GRPC_DEADLINE_DOMAIN_WRITE_MS: 4000
      DELEGATION_GRPC_DEADLINE_BATCH_DOMAIN_READ_MS: 3000
      DELEGATION_GRPC_DEADLINE_BATCH_AUDIT_INTENT_MS: 4000
      DELEGATION_GRPC_DEADLINE_BATCH_DOMAIN_WRITE_MS: 20000
      DELEGATION_GRPC_DEADLINE_BATCH_AUDIT_CONFIRM_MS: 3000
      DELEGATION_AUDIT_CONFIRM_BATCH_TOTAL_BUDGET_MS: 10000
      # confirm 的重試迴圈跑在 Gateway 的 orchestrator；單體的 DelegationService 沒有對應的處理上界
      DELEGATION_AUDIT_CONFIRM_TOTAL_BUDGET_MS: 2000

      # 來源簽章密鑰（#2264）。本地留空即可 —— 空值 = 停用該把密鑰的簽章驗證，
      # 請求落回 per-ClientIP，不會啟動失敗。要在本地測 SSR / CI 軸才需要填。
      ORIGIN_AUTH_SECRET: ${ORIGIN_AUTH_SECRET:-}
      ORIGIN_AUTH_SECRET_PREV: ${ORIGIN_AUTH_SECRET_PREV:-}
      ORIGIN_AUTH_CI_SECRET: ${ORIGIN_AUTH_CI_SECRET:-}

      # 文件檢視器 /docs：三個都填才啟用，空值 = 路由不註冊（404）
      DOCS_USERNAME: ${DOCS_USERNAME:-}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}
      DOCS_SIGN_KEY: ${DOCS_SIGN_KEY:-}

      # Dev Configs
      NACOS_ENABLED: "false"
      TRACING_ENABLED: "true"
      GOPROXY: "https://proxy.golang.org,direct"
      GONOSUMDB: "*"

      # OpenTelemetry（Go shared pkg/otel 使用 OTLP gRPC）
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      ENV: ${APP_ENV:-dev}

      # 測試模式：跳過角色檢查（JWT 驗證仍有效）
      SKIP_ROLE_CHECK: ${SKIP_ROLE_CHECK:-true}

      # Health Check Configuration
      # Gateway 只負責自身 liveness；各 gRPC-only service 由自己的 gRPC health
      # probe 驗證，不能再從這裡依賴 service-local management HTTP。
      HEALTH_SERVICES: >-
        product-service=http://product-service:9912/actuator/health,
        order-service=http://order-service:9914/actuator/health,
        aftersales-service=http://aftersales-service:9922/actuator/health,
        payment-service=http://payment-service:9924/actuator/health,
        shipping-service=http://shipping-service:9930/actuator/health,
        media-service=http://media-service:9936/health

    volumes:
      - ./gateway:/app/gateway
      - ./pkg:/app/pkg
      - ./docs:/app/docs
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9900/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - hawkr-network

  # ==========================================
  # Product Service (9912/9913)
  # ==========================================

  product-service:
    build:
      context: .
      dockerfile: services/java/product-service/Dockerfile
    image: hawkr/product-service:latest
    container_name: product-service
    restart: unless-stopped
    ports:
      - "9912:9912"
      - "9913:9913"
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL 必填：媒體公開網域，如 https://media.example.com}
      TZ: UTC
      SERVER_PORT: 9912
      GRPC_PORT: 9913

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_product
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /

      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Dev Configs
      NACOS_ENABLED: "false"
      TRACING_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENABLED: "true"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.environment=${APP_ENV:-dev}

      # Media Service gRPC（供商品圖片轉正 FinalizeImages + LinkImages）
      MEDIA_SERVICE_HOST: media-service
      MEDIA_SERVICE_GRPC_PORT: 9937

      # Shipping Service gRPC（運費計算）
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_GRPC_PORT: 9931

      # Seller Service gRPC（賣家元資料）
      SELLER_SERVICE_HOST: host.docker.internal
      SELLER_SERVICE_GRPC_PORT: 9941

      # Buyer Service gRPC（subscribed_only filter 取收藏 ID 列表，02 §4.2.4）
      BUYER_SERVICE_HOST: host.docker.internal
      BUYER_SERVICE_GRPC_PORT: 9941

      # 農業部開放資料 API Key
      GOV_API_KEY_1: ${GOV_API_KEY_1}

      # 冪等鍵清理排程（application.yml product.cleanup.idempotency.*）
      CLEANUP_IDEMPOTENCY_ENABLED: ${CLEANUP_IDEMPOTENCY_ENABLED:-true}

      JAVA_OPTS: ${JAVA_OPTS}
      SKIP_ACCOUNT_TYPE_CHECK: ${SKIP_ACCOUNT_TYPE_CHECK:-true}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9912/actuator/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      media-service:
        condition: service_healthy
    networks:
      - hawkr-network

  # ==========================================
  # Order Service (9914/9915)
  # ==========================================

  order-service:
    build:
      context: .
      dockerfile: services/java/order-service/Dockerfile
    image: hawkr/order-service:latest
    container_name: order-service
    restart: unless-stopped
    ports:
      - "9914:9914"
      - "9915:9915"
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL 必填：媒體公開網域，如 https://media.example.com}
      TZ: UTC
      SERVER_PORT: 9914
      GRPC_PORT: 9915

      # gRPC clients
      BUYER_SERVICE_HOST: host.docker.internal
      BUYER_SERVICE_GRPC_PORT: 9941
      PRODUCT_SERVICE_HOST: product-service
      PRODUCT_SERVICE_GRPC_PORT: 9913
      CART_SERVICE_HOST: cart-service
      CART_SERVICE_GRPC_PORT: 9927
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_GRPC_PORT: 9925
      # 58 號 §6.2.4「order-service ①」：checkout preview／confirm 打 invoice-service。
      # application.yml 的 default 是 127.0.0.1（供 IDE 直跑），在 compose 網路裡那是
      # order-service 自己 ⇒ 這兩行必須明列，與同區塊其他 peer 同慣例。
      INVOICE_SERVICE_HOST: invoice-service
      INVOICE_SERVICE_GRPC_PORT: 10041
      SELLER_SERVICE_HOST: host.docker.internal
      SELLER_SERVICE_GRPC_PORT: 9941
      COUPON_SERVICE_HOST: coupon-service
      COUPON_SERVICE_GRPC_PORT: 9951
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_GRPC_PORT: 9931
      MEDIA_SERVICE_HOST: media-service
      MEDIA_SERVICE_GRPC_PORT: 9937
      AFTERSALES_SERVICE_HOST: aftersales-service
      AFTERSALES_SERVICE_GRPC_PORT: 9923

      # §2A.2 訂單最低金額（CheckoutService L1 檢查）
      PAYMENT_MIN_AMOUNT: ${PAYMENT_MIN_AMOUNT:-15}

      # 代理商 PayUni MerID（多賣家和單代收，20 設計書 §4.13）
      # 空字串時 CheckoutPreview 接到 consolidated=true 會拒絕（INVALID_PARAM）
      PAYUNI_AGENT_MER_ID: ${PAYUNI_AGENT_MER_ID:-}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_order
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F

      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Dev Configs
      NACOS_ENABLED: "false"
      TRACING_ENABLED: "true"
      MANAGEMENT_OTLP_TRACING_ENABLED: "true"

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.environment=${APP_ENV:-dev}

      # 自動完成排程配置
      AUTO_COMPLETE_INTERVAL_MS: ${AUTO_COMPLETE_INTERVAL_MS:-3600000}
      AUTO_COMPLETE_BATCH_SIZE: ${AUTO_COMPLETE_BATCH_SIZE:-100}

      # 付款期限與超時掃描（application.yml hawkr.order.*）
      PAYMENT_DEADLINE_SECONDS: ${PAYMENT_DEADLINE_SECONDS:-86400}
      # 64 號 §6.4.11：RFQ 成交建單的付款期限 = 建單 +12h，與結帳路徑刻意不同
      RFQ_PAYMENT_DEADLINE_SECONDS: ${RFQ_PAYMENT_DEADLINE_SECONDS:-43200}
      CANCEL_SCAN_INTERVAL_MS: ${CANCEL_SCAN_INTERVAL_MS:-15000}
      # 付款後建單保證：Outbox + Backstop（03 §8.10/§8.11）
      ORDER_OUTBOX_PUBLISH_INTERVAL_MS: ${ORDER_OUTBOX_PUBLISH_INTERVAL_MS:-5000}
      ORDER_PAYOUT_HOLD_RECHECK_SECONDS: ${ORDER_PAYOUT_HOLD_RECHECK_SECONDS:-600}
      ORDER_SHIPMENT_BACKSTOP_ENABLED: ${ORDER_SHIPMENT_BACKSTOP_ENABLED:-true}
      ORDER_SHIPMENT_BACKSTOP_INTERVAL_MS: ${ORDER_SHIPMENT_BACKSTOP_INTERVAL_MS:-300000}
      ORDER_SHIPMENT_BACKSTOP_GRACE_MINUTES: ${ORDER_SHIPMENT_BACKSTOP_GRACE_MINUTES:-30}
      ORDER_SHIPMENT_BACKSTOP_MAX_ATTEMPTS: ${ORDER_SHIPMENT_BACKSTOP_MAX_ATTEMPTS:-5}
      ORDER_SHIPMENT_BACKSTOP_BACKOFF_MINUTES: ${ORDER_SHIPMENT_BACKSTOP_BACKOFF_MINUTES:-30}

      FLYWAY_ENABLED: "true"
      JAVA_OPTS: ${JAVA_OPTS}
      SKIP_ACCOUNT_TYPE_CHECK: ${SKIP_ACCOUNT_TYPE_CHECK:-true}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9914/actuator/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

  # ==========================================
  # Aftersales Service (9922/9923)
  # ==========================================

  aftersales-service:
    build:
      context: .
      dockerfile: services/java/aftersales-service/Dockerfile
    image: hawkr/aftersales-service:latest
    container_name: aftersales-service
    restart: unless-stopped
    ports:
      - "9922:9922"
      - "9923:9923"
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
