      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

  # ==========================================
  # Payment Service (9924/9925)
  # ==========================================

  payment-service:
    build:
      context: .
      dockerfile: services/java/payment-service/Dockerfile
    image: hawkr/payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "9924:9924"
      - "9925:9925"
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      TZ: UTC
      SERVER_PORT: 9924
      GRPC_PORT: 9925

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_payment
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F

      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # gRPC clients
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_GRPC_PORT: 9915

      PAYUNI_AGENT_ID: ${PAYUNI_AGENT_ID}
      # 代理商出入帳商店代號（agent_fee 的 AgentMerID）。空 ＝ 依平台預設，是官方定義的合法行為。
      PAYUNI_AGENT_MER_ID: ${PAYUNI_AGENT_MER_ID:-}
      PAYUNI_AGENT_KEY: ${PAYUNI_AGENT_KEY}
      PAYUNI_AGENT_IV: ${PAYUNI_AGENT_IV}
      PAYUNI_SANDBOX: ${PAYUNI_SANDBOX}
      # 平台自有 PayUni 商家 MerID，供買家訂閱計費（60 號設計書）；值待平台商家帳號核准後填入，
      # 訂閱計費引擎本身尚未實作，此值目前未被任何程式碼讀取
      PAYUNI_SUBSCRIPTION_MER_ID: ${PAYUNI_SUBSCRIPTION_MER_ID:-}

      # §2A.2 / §2A.5 金額與 ATM 期限
      PAYMENT_MIN_AMOUNT: ${PAYMENT_MIN_AMOUNT:-15}
      PAYMENT_ATM_EXPIRE_DAYS: ${PAYMENT_ATM_EXPIRE_DAYS:-2}

      # Gateway URL（ngrok URL，由 dev.sh 注入）
      GATEWAY_URL: ${GATEWAY_URL:-}

      # PayUni 回調 URL（從 .env 讀取，本地開發用 ngrok 時只需改 .env）
      # 帶值 = 覆蓋 PayUni 後台設定，空值 = 使用後台設定
      PAYUNI_NOTIFY_URL: ${PAYUNI_NOTIFY_URL:-}
      PAYUNI_RETURN_URL: ${PAYUNI_RETURN_URL:-}
      PAYUNI_API_URL: ${PAYUNI_API_URL:-https://sandbox-api.payuni.com.tw}
      PAYUNI_STORE_MAP_RETURN_URL: ${PAYUNI_STORE_MAP_RETURN_URL:-}

      # Web 前端 base URL（client_type=WEB_BROWSER 時組 redirect_url 用，§5.9）
      WEB_FRONTEND_URL: ${WEB_FRONTEND_URL:-}

      # L2 待付款補收排程（application.yml hawkr.payment.reconcile.pending.*）
      RECONCILE_PENDING_ENABLED: ${RECONCILE_PENDING_ENABLED:-true}
      RECONCILE_PENDING_FIXED_DELAY_MS: ${RECONCILE_PENDING_FIXED_DELAY_MS:-300000}
      RECONCILE_PENDING_BATCH_SIZE: ${RECONCILE_PENDING_BATCH_SIZE:-50}
      RECONCILE_PENDING_INITIAL_DELAY_MIN: ${RECONCILE_PENDING_INITIAL_DELAY_MIN:-3}
      RECONCILE_PENDING_RETRY_INTERVAL_MIN: ${RECONCILE_PENDING_RETRY_INTERVAL_MIN:-5}
      RECONCILE_PENDING_GRACE_MIN: ${RECONCILE_PENDING_GRACE_MIN:-30}
      RECONCILE_PENDING_PER_ITEM_SLEEP_MS: ${RECONCILE_PENDING_PER_ITEM_SLEEP_MS:-100}

      # Apple Pay on Web Merchant Validation（05 號設計書 §5.11）
      APPLE_PAY_MERCHANT_ID: ${APPLE_PAY_MERCHANT_ID:-}
      APPLE_PAY_DISPLAY_NAME: ${APPLE_PAY_DISPLAY_NAME:-Hawkr}
      APPLE_PAY_MERCHANT_CERT_PATH: ${APPLE_PAY_MERCHANT_CERT_PATH:-}
      APPLE_PAY_MERCHANT_KEY_PATH: ${APPLE_PAY_MERCHANT_KEY_PATH:-}
      APPLE_PAY_DOMAIN_ALLOWLIST: ${APPLE_PAY_DOMAIN_ALLOWLIST:-}
      APPLE_PAY_CONNECT_TIMEOUT_SEC: ${APPLE_PAY_CONNECT_TIMEOUT_SEC:-5}
      APPLE_PAY_REQUEST_TIMEOUT_SEC: ${APPLE_PAY_REQUEST_TIMEOUT_SEC:-10}

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.environment=${APP_ENV:-dev}
      SKIP_ACCOUNT_TYPE_CHECK: ${SKIP_ACCOUNT_TYPE_CHECK:-true}

    volumes:
      # Apple Pay Merchant Identity Certificate + Private Key（mount 整個目錄保留原檔名）
      # 未設定 APPLE_PAY_CERT_DIR 時 fallback 到 repo 內空目錄（避免暴露宿主機 /tmp，
      # validator lazy-load 時找不到 cert/key 回 8029，不影響其他結帳流程）
      - "${APPLE_PAY_CERT_DIR:-./infra/apple-pay-empty}:/secrets/apple-pay:ro"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:9924/actuator/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

  # ==========================================
  # Shipping Service (9930/9931) — Java/Spring Boot
  # Host ports 9930/9931 避免與 inventory-service(9928/9929) 衝突
  # 本地開發不走 Docker 時使用 application.yml 預設 9928/9929
  # ==========================================

  shipping-service:
    build:
      context: .
      dockerfile: services/java/shipping-service/Dockerfile
    image: hawkr/shipping-service:latest
    container_name: shipping-service
    restart: unless-stopped
    ports:
      - "9930:9930"
      - "9931:9931"
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      TZ: UTC
      SERVER_PORT: 9930
      GRPC_PORT: 9931
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_shipping
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /

      # gRPC clients
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_GRPC_PORT: 9915
      SELLER_SERVICE_HOST: host.docker.internal
      SELLER_SERVICE_GRPC_PORT: 9941
      MEDIA_SERVICE_HOST: media-service
      MEDIA_SERVICE_GRPC_PORT: 9937
      BUYER_SERVICE_HOST: host.docker.internal
      BUYER_SERVICE_GRPC_PORT: 9941

      # PayUni
      PAYUNI_AGENT_KEY: ${PAYUNI_AGENT_KEY}
      PAYUNI_AGENT_IV: ${PAYUNI_AGENT_IV}
      # ── Uber Direct（66 §8.5）──
      # 🔴 UBER_ENABLED 本地也維持 false：切成 true 而程式還在上一階段 ＝ 陷阱 A1
      #    （買家付錢、建出沒人送的單、零告警）。
      UBER_ENABLED: ${UBER_ENABLED:-false}
      UBER_BASE_URL: ${UBER_BASE_URL:-https://api.uber.com/v1}
      UBER_AUTH_URL: ${UBER_AUTH_URL:-https://auth.uber.com/oauth/v2/token}
      UBER_SCOPE: ${UBER_SCOPE:-eats.deliveries}
      # 機敏值一律 ${VAR:-}，禁止寫死明文。留空 ＝ Uber 未啟用（fail-closed）。
      UBER_CLIENT_ID: ${UBER_CLIENT_ID:-}
      UBER_CLIENT_SECRET: ${UBER_CLIENT_SECRET:-}
      # 🔴 一組不是一個：JSON map {webhookId: key}
      UBER_WEBHOOK_SIGNING_KEYS: ${UBER_WEBHOOK_SIGNING_KEYS:-}
      PAYUNI_API_URL: ${PAYUNI_API_URL:-https://sandbox-api.payuni.com.tw}
      # 空值 = 使用 PayUni 後台設定；帶值 = 覆蓋後台設定
      PAYUNI_SHIPPING_NOTIFY_URL: ${PAYUNI_SHIPPING_NOTIFY_URL:-}
      # 門市地圖
      PAYUNI_STORE_MAP_MER_ID: ${PAYUNI_STORE_MAP_MER_ID:-HAWK9}
      PAYUNI_STORE_MAP_RETURN_URL: ${PAYUNI_STORE_MAP_RETURN_URL:-}
      GATEWAY_URL: ${GATEWAY_URL:-}
      # §5.14 store_map appType=web 路徑最終 302 出口（與 payment / aftersales 共用同一環境變數值）
      WEB_FRONTEND_URL: ${WEB_FRONTEND_URL:-}

      # CDN
      # shipping-service 是 MediaUrlProperties 的四個消費端之一（ShippingAdminQueryService /
      # BuyerGrpcClient），本機也要有域名才組得出圖片 URL（backend#2283）。
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL 必填：媒體公開網域，如 https://media.example.com}

      # §5.19 物流貨態補收排程（L2 補救路徑）
      SHIPPING_RECONCILE_ENABLED: ${SHIPPING_RECONCILE_ENABLED:-true}
      SHIPPING_RECONCILE_INTERVAL_MS: ${SHIPPING_RECONCILE_INTERVAL_MS:-600000}
      SHIPPING_RECONCILE_BATCH_SIZE: ${SHIPPING_RECONCILE_BATCH_SIZE:-100}
      SHIPPING_RECONCILE_MAX_AGE_DAYS: ${SHIPPING_RECONCILE_MAX_AGE_DAYS:-7}
      SHIPPING_RECONCILE_BACKOFF_MINUTES: ${SHIPPING_RECONCILE_BACKOFF_MINUTES:-15}
      # §5.2.2 / §5.3.2 批次列印參數
      SHIPPING_BATCH_MAX_SIZE: ${SHIPPING_BATCH_MAX_SIZE:-50}
      SHIPPING_HOME_LABEL_CONCURRENCY: ${SHIPPING_HOME_LABEL_CONCURRENCY:-10}
      # §5.19.3.C 黑貓叫件 REQUESTED 卡死 ops 告警
      SHIPPING_ALERT_TCAT_STUCK_ENABLED: ${SHIPPING_ALERT_TCAT_STUCK_ENABLED:-true}
      SHIPPING_ALERT_TCAT_STUCK_INTERVAL_MS: ${SHIPPING_ALERT_TCAT_STUCK_INTERVAL_MS:-600000}
      SHIPPING_ALERT_TCAT_STUCK_BATCH_SIZE: ${SHIPPING_ALERT_TCAT_STUCK_BATCH_SIZE:-30}
      SHIPPING_ALERT_TCAT_STUCK_GRACE_MINUTES: ${SHIPPING_ALERT_TCAT_STUCK_GRACE_MINUTES:-3}
      SHIPPING_ALERT_TCAT_STUCK_MAX_AGE_HOURS: ${SHIPPING_ALERT_TCAT_STUCK_MAX_AGE_HOURS:-24}
      # §5.19.3.D 建店送審 REQUESTED 卡死 ops 告警
      SHIPPING_ALERT_SUBMIT_STUCK_ENABLED: ${SHIPPING_ALERT_SUBMIT_STUCK_ENABLED:-true}
      SHIPPING_ALERT_SUBMIT_STUCK_INTERVAL_MS: ${SHIPPING_ALERT_SUBMIT_STUCK_INTERVAL_MS:-600000}
      SHIPPING_ALERT_SUBMIT_STUCK_BATCH_SIZE: ${SHIPPING_ALERT_SUBMIT_STUCK_BATCH_SIZE:-20}
      SHIPPING_ALERT_SUBMIT_STUCK_GRACE_MINUTES: ${SHIPPING_ALERT_SUBMIT_STUCK_GRACE_MINUTES:-5}
      SHIPPING_ALERT_SUBMIT_STUCK_MAX_AGE_HOURS: ${SHIPPING_ALERT_SUBMIT_STUCK_MAX_AGE_HOURS:-24}

      # Dev Configs
      NACOS_ENABLED: "false"
      FLYWAY_ENABLED: "true"
      JAVA_OPTS: ${JAVA_OPTS}
      SKIP_ACCOUNT_TYPE_CHECK: ${SKIP_ACCOUNT_TYPE_CHECK:-true}

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.environment=${APP_ENV:-dev}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9930/actuator/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

  # ==========================================
  # PayUni Webhook Service (9946)
  # ==========================================

  payuni-webhook-service:
    build:
      context: .
      dockerfile: services/java/payuni-webhook-service/Dockerfile
    image: hawkr/payuni-webhook-service:latest
    container_name: payuni-webhook-service
    restart: unless-stopped
    ports:
      - "9946:9946"
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      TZ: UTC
      SERVER_PORT: 9946
      GRPC_PORT: 9947

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_webhook
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin

      # Redis（application.yml 的 spring.data.redis 有引用；缺這些會 fallback 連
      # 容器內 127.0.0.1 空密碼，連不到 redis 容器。值對齊其他 Java 服務）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest

      # PayUni SDK
      PAYUNI_AGENT_KEY: ${PAYUNI_AGENT_KEY}
      PAYUNI_AGENT_IV: ${PAYUNI_AGENT_IV}
      # 🔴 Uber webhook 驗簽金鑰。ingress 這一側必須有它：驗簽要發生在寫進
      #    webhook_inbox **之前**，否則未驗簽的偽造事件會先佔住 uq_inbox_event 的鍵位，
      #    讓真正的 Uber 事件被判為重複而丟棄。
      UBER_WEBHOOK_SIGNING_KEYS: ${UBER_WEBHOOK_SIGNING_KEYS:-}

      # Shipping gRPC（模擬器查詢 ShipTradeNo 用）
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_GRPC_PORT: 9931

      # 環境識別（webhook 模擬器白名單）
      APP_ENV: ${APP_ENV:-dev}

      # Dev Configs
      NACOS_ENABLED: "false"
      FLYWAY_ENABLED: "true"
      JAVA_OPTS: ${JAVA_OPTS}

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.environment=${APP_ENV:-dev}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9946/actuator/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

