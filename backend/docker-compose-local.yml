      # 全部字面值：這組沒有任何一支是「本機測試會調」的（要調就直接改這裡）。
      # Config.Validate() 的三條斷言比的是這組彼此之間的不等式，全部吃程式碼預設值時
      # 三條照樣成立、boot 照樣綠 —— 斷言擋得住「調錯」，擋不住「沒設」，所以要列全。
      SCHEDULED_POST_PUBLISH_POLL_INTERVAL_SECONDS: 30
      SCHEDULED_POST_PUBLISH_BATCH_SIZE: 50
      SCHEDULED_POST_PUBLISH_LEASE_SECONDS: 120
      SCHEDULED_POST_PUBLISH_MAX_RETRY: 5
      SCHEDULED_POST_PUBLISH_BACKOFF_BASE_SECONDS: 60
      SCHEDULED_POST_PUBLISH_BACKOFF_MAX_SECONDS: 1800
      SCHEDULED_POST_PUBLISH_AUDIT_INTENT_DEADLINE_MS: 800
      SCHEDULED_POST_PUBLISH_AUDIT_CONFIRM_DEADLINE_MS: 400
      SCHEDULED_POST_PUBLISH_AUDIT_CONFIRM_MAX_ATTEMPTS: 3
