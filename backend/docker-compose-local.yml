      context: .
      dockerfile: services/java/product-import-service/Dockerfile
    image: hawkr/product-import-service:latest
    container_name: product-import-service
    restart: unless-stopped
    ports:
      - "9960:9960"
      - "9961:9961"
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      TZ: UTC
      SERVER_PORT: 9960
      GRPC_PORT: 9961
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_product_import
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      FLYWAY_ENABLED: "true"
      NACOS_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS}
      SKIP_ACCOUNT_TYPE_CHECK: ${SKIP_ACCOUNT_TYPE_CHECK:-true}
      # 下游依賴
      MEDIA_SERVICE_HOST: media-service
      MEDIA_SERVICE_GRPC_PORT: 9937
      PRODUCT_SERVICE_HOST: product-service
      PRODUCT_SERVICE_GRPC_PORT: 9913
      SHIPPING_SERVICE_HOST: shipping-service
      SHIPPING_SERVICE_GRPC_PORT: 9931
      # 儲存後端 R2（49 號設計書 §8.5）；CSV upload 沿用 media-service 同一 R2 bucket。
      # 修正歷史 ALIYUN_OSS_* 變數名 drift（application.yml 實際讀 STORAGE_BACKEND / R2_* / OSS_*）
      STORAGE_BACKEND: ${STORAGE_BACKEND:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      # Product Import 配置（設計書 §9.2）
      PRODUCT_IMPORT_JOB_TTL_DAYS: ${PRODUCT_IMPORT_JOB_TTL_DAYS:-7}
      PRODUCT_IMPORT_CSV_INVALID_TTL_DAYS: ${PRODUCT_IMPORT_CSV_INVALID_TTL_DAYS:-3}
      PRODUCT_IMPORT_COMMITTED_RETENTION_DAYS: ${PRODUCT_IMPORT_COMMITTED_RETENTION_DAYS:-7}
      PRODUCT_IMPORT_EXPIRED_RETENTION_DAYS: ${PRODUCT_IMPORT_EXPIRED_RETENTION_DAYS:-7}
      PRODUCT_IMPORT_ORPHAN_ASSET_GRACE_HOURS: ${PRODUCT_IMPORT_ORPHAN_ASSET_GRACE_HOURS:-24}
      PRODUCT_IMPORT_CALLBACK_INBOX_RETENTION_DAYS: ${PRODUCT_IMPORT_CALLBACK_INBOX_RETENTION_DAYS:-14}
      PRODUCT_IMPORT_MAX_ACTIVE_JOBS_PER_SELLER: ${PRODUCT_IMPORT_MAX_ACTIVE_JOBS_PER_SELLER:-5}
      PRODUCT_IMPORT_MAX_DAILY_JOBS_PER_SELLER: ${PRODUCT_IMPORT_MAX_DAILY_JOBS_PER_SELLER:-10}
      PRODUCT_IMPORT_CSV_MAX_FILE_SIZE_BYTES: ${PRODUCT_IMPORT_CSV_MAX_FILE_SIZE_BYTES:-2097152}
      PRODUCT_IMPORT_CSV_MAX_ROWS: ${PRODUCT_IMPORT_CSV_MAX_ROWS:-500}
      PRODUCT_IMPORT_ASSET_MAX_CONCURRENT: ${PRODUCT_IMPORT_ASSET_MAX_CONCURRENT:-8}
      PRODUCT_IMPORT_ASSET_CALLBACK_TIMEOUT_MINUTES: ${PRODUCT_IMPORT_ASSET_CALLBACK_TIMEOUT_MINUTES:-30}
      PRODUCT_IMPORT_CONFIRMATION_TOKEN_TTL_SECONDS: ${PRODUCT_IMPORT_CONFIRMATION_TOKEN_TTL_SECONDS:-300}
      PRODUCT_IMPORT_GC_ENABLED: ${PRODUCT_IMPORT_GC_ENABLED:-true}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9960/actuator/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

  # ==========================================
  # Notification Service (gRPC 10037；final architecture，無 HTTP management port)
  # ==========================================

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      target: dev
      args:
        GO_VERSION: ${GO_VERSION:?用 ./dev.sh 執行（從 .go-version 帶入）}
    image: hawkr/notification-service:latest
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "10037:10037"
    volumes:
      - ./services/notification-service:/app/services/notification-service
      - ./pkg:/app/pkg
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗，本地可於 .env 設 secret 測試簽章。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      TZ: UTC
      GRPC_PORT: 10037

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_notification
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin

      # RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F

      # Buyer/Seller Service gRPC（chat-notification PII 清除流程列舉帳號歷史
      # buyer_id/store_id surrogate；見 internal/client/buyer、internal/client/seller）
      BUYER_SERVICE_GRPC_ADDR: host.docker.internal:9941
      SELLER_SERVICE_GRPC_ADDR: host.docker.internal:9941

      # 媒體域名基底（渲染 push imageUrl 時把 objectKey 組顯示 URL；49 §5.3 #10）
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL 必填：媒體公開網域，如 https://media.example.com}

      # Vendor Portal 邀請信（#2539 E1，pkg/mail）：log provider 不寄真信，只寫 log。
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: supports@example.com
      # 預設留空：log provider 寄不到任何人，不強制政策，維持「本機免設定即可跑」。
      # 一旦本機把 MAIL_PROVIDER 切成 resend，缺政策就會啟動失敗（這是刻意的）。
      MAIL_RECIPIENT_POLICY: ${MAIL_RECIPIENT_POLICY:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      MAIL_ALLOWED_RECIPIENTS: ${MAIL_ALLOWED_RECIPIENTS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      VENDOR_PORTAL_BASE_URL: http://localhost:3000

      # Firebase（推播用）
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}

      # Dev Configs
      GOPROXY: "https://proxy.golang.org,direct"   # 見檔頭「Go 服務 dev container 契約」：dev 嚴禁 off
      GONOSUMDB: "*"
      TRACING_ENABLED: "true"

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.environment=${APP_ENV:-dev}

    healthcheck:
      test: ["CMD-SHELL", "cd /app/services/notification-service && go run ./cmd/grpc-healthcheck -addr 127.0.0.1:10037"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

  # ==========================================
  # Invoice Service (10040 HTTP / 10041 gRPC / 10042 PDF 下載通道)
  # 58 號設計書：電子發票服務。10042 是獨立的第三個面，不遵守 HTTP = gRPC - 1 的配對慣例。
  # ==========================================

  invoice-service:
    build:
      context: .
      dockerfile: services/invoice-service/Dockerfile
      target: dev
      args:
        GO_VERSION: ${GO_VERSION:?用 ./dev.sh 執行（從 .go-version 帶入）}
    image: hawkr/invoice-service:latest
    container_name: invoice-service
    restart: unless-stopped
    ports:
      - "10040:10040"
      - "10041:10041"
      - "10042:10042"
    volumes:
      - ./services/invoice-service:/app/services/invoice-service
      - ./pkg:/app/pkg
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    environment:
      # 內部身分 HMAC 簽章（#1366）；permissive 過渡期缺 secret 不簽/不驗。
      INTERNAL_AUTH_MODE: ${INTERNAL_AUTH_MODE:-permissive}
      INTERNAL_SERVICE_HMAC_SECRET: ${INTERNAL_SERVICE_HMAC_SECRET:-}
      INTERNAL_SERVICE_HMAC_SECRET_PREV: ${INTERNAL_SERVICE_HMAC_SECRET_PREV:-}
      TZ: UTC
      HTTP_PORT: 10040
      GRPC_PORT: 10041
      # PDF 授權下載通道（§6.1.4）。與 gateway block 的同名變數必須同值。
      INVOICE_SERVICE_FILE_PORT: 10042

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hawkr_invoice
      DB_USER: dbadmin
      DB_PASSWORD: Hawkr2024Admin

      # Redis（不放冪等記錄，見 58 號 §12.1.2 E）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: HawkrRedis2026

      # RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

      # Downstream peer gRPC（key 名與 k8s/values/invoice-service.yaml + config.go 一致）
      ORDER_SERVICE_ADDR: order-service:9915
      SELLER_SERVICE_ADDR: host.docker.internal:9941
      PAYMENT_SERVICE_ADDR: payment-service:9925
      BUYER_SERVICE_ADDR: host.docker.internal:9941
      SHIPPING_SERVICE_ADDR: shipping-service:9931
      MEDIA_SERVICE_HOST: media-service
      MEDIA_SERVICE_GRPC_PORT: "9937"
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL 必填：媒體公開網域，如 https://media.example.com}

      # ── A. 加密與憑證 ──
      # 機敏值一律 ${VAR:-}，禁止寫死明文。本地要跑起來就在 .env 填
      # INVOICE_ENCRYPTION_MASTER_KEY / INVOICE_LOOKUP_HMAC_KEY（.env.template 有 local-only 佔位值）；
      # 留空是刻意的 fail-closed：空金鑰一樣加得動，會讓「憑證有被加密」變成假的。
      INVOICE_ENCRYPTION_MASTER_KEY: ${INVOICE_ENCRYPTION_MASTER_KEY:-}
      INVOICE_ENCRYPTION_MASTER_KEY_VERSION: 1
      INVOICE_ENCRYPTION_MASTER_KEY_PREV: ${INVOICE_ENCRYPTION_MASTER_KEY_PREV:-}
      INVOICE_ENCRYPTION_MASTER_KEY_PREV_VERSION: ${INVOICE_ENCRYPTION_MASTER_KEY_PREV_VERSION:-}
      INVOICE_LOOKUP_HMAC_KEY: ${INVOICE_LOOKUP_HMAC_KEY:-}

      # ── B. AMEGO 連線 ──
      # 本地與 dev 一律 ALLOW_REAL=false ＋ 測試統編：AMEGO 測試與正式共用同一個網域、
      # 回應無環境標記，打錯環境不會連不上，只會靜默開出真發票。
      AMEGO_BASE_URL: ${AMEGO_BASE_URL:-https://invoice-api.amego.tw}
      AMEGO_ALLOW_REAL_INVOICE: "false"
      AMEGO_TEST_INVOICE: "12345678"
      AMEGO_PLATFORM_INVOICE: "12345678"
      AMEGO_PLATFORM_APP_KEY: ${AMEGO_PLATFORM_APP_KEY:-}
      AMEGO_PROXY_CALLER_KEY_FILE: ${AMEGO_PROXY_CALLER_KEY_FILE:-}
      AMEGO_HTTP_TIMEOUT_ISSUE_MS: 30000
      AMEGO_HTTP_TIMEOUT_QUERY_MS: 10000
      AMEGO_CLIENT_RATE_LIMIT_QPS: 5
      AMEGO_CB_FAILURE_THRESHOLD: 5
      AMEGO_CB_TIMEOUT_SECONDS: 10
      AMEGO_CB_MAX_REQUESTS: 3

      # ── C. 排程與租約（值與 k8s/values/invoice-service.yaml 逐格同值）──
      INVOICE_ISSUE_POLL_INTERVAL_SECONDS: 10
      INVOICE_ISSUE_BATCH_SIZE: 50
      INVOICE_ISSUE_LEASE_SECONDS: 120
      INVOICE_ISSUE_MAX_RETRY: 13
      INVOICE_BACKOFF_BASE_SECONDS: 30
      INVOICE_BACKOFF_MAX_SECONDS: 1800
      INVOICE_RECHECK_LEASE_SECONDS: 60
      INVOICE_RECHECK_MAX_ATTEMPTS: 12
      INVOICE_ROTATION_TIMEOUT_MINUTES: 30
      INVOICE_PDF_MAX_BYTES: 4194304
      INVOICE_TRACK_BALANCE_CHECK_HOUR_UTC: 1
      INVOICE_TRACK_BALANCE_WARN_THRESHOLD: 200
      INVOICE_MQ_PUBLISH_TIMEOUT_SECONDS: 10

      # ── D. 業務治理參數 ──
      INVOICE_TAX_REVIEW_GRACE_DAYS: 60
      INVOICE_TAX_REVIEW_PENDING_MAX_ORDERS: 50
      INVOICE_TAX_REVIEW_PENDING_MAX_AMOUNT: 100000
      INVOICE_REAPPLY_COOLDOWN_DAYS: 7
      INVOICE_COMPLAINT_SLA_WORKING_DAYS: 3
      INVOICE_VIOLATION_WINDOW_DAYS: 90
      INVOICE_VIOLATION_SUSPEND_THRESHOLD: 3
      INVOICE_SUSPENSION_DAYS: 14
      INVOICE_DOCUMENT_RETENTION_DAYS: 1826
      INVOICE_AUDIT_RETENTION_DAYS: 1826
      INVOICE_MANUAL_CAPACITY_PER_DAY: 20
      INVOICE_TRACK_GROWTH_HEADROOM: "0.5"
      INVOICE_ALLOWANCE_B2C_SPLIT_TAX: "true"

      # Dev Configs
      NACOS_ENABLED: "false"
      TRACING_ENABLED: "true"
      GOPROXY: "https://proxy.golang.org,direct"   # 見檔頭「Go 服務 dev container 契約」：dev 嚴禁 off
      GONOSUMDB: "*"

      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.environment=${APP_ENV:-dev}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10040/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - hawkr-network

volumes:
  go-build-cache:
  # Go module cache：跨容器共用、跨 image 重建存活（#2025）
  go-mod-cache:
