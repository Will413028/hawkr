      AUTO_CONFIRM_RECEIPT_HOURS: ${AUTO_CONFIRM_RECEIPT_HOURS:-48}
      AUTO_CONFIRM_SCHEDULER_CRON: ${AUTO_CONFIRM_SCHEDULER_CRON:-0 */10 * * * ?}
      # 2026-05-22 逆物流退貨政策修訂：超商待取 72h + 24h 預警（application.yml aftersales.return.*）
      STORE_PICKUP_TIMEOUT_HOURS: ${STORE_PICKUP_TIMEOUT_HOURS:-72}
      STORE_PICKUP_SCHEDULER_CRON: ${STORE_PICKUP_SCHEDULER_CRON:-0 */10 * * * ?}
      WARN_SCHEDULER_CRON: ${WARN_SCHEDULER_CRON:-0 */5 * * * ?}
      # §5.21 RETURN_STUCK 偵測（application.yml hawkr.aftersales.return-stuck-alert.*）
