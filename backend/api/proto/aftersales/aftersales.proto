syntax = "proto3";

package hawkr.aftersales;

option go_package = "github.com/Will413028/hawkr/go-pkg/proto/aftersales";
option java_multiple_files = true;
option java_package = "io.github.will413028.hawkr.aftersales.grpc";
option java_outer_classname = "AftersalesProto";

// AfterSales Service — 售後服務（售後申請 + 取消出貨）
service AfterSalesService {
    // ==================== 買家端 ====================

    // 申請售後
    rpc CreateAfterSaleCase(CreateAfterSaleCaseRequest) returns (CreateAfterSaleCaseResponse);

    // 我的售後列表
    rpc GetMyAfterSaleCases(GetMyAfterSaleCasesRequest) returns (GetMyAfterSaleCasesResponse);

    // 售後詳情
    rpc GetAfterSaleCaseDetail(GetAfterSaleCaseDetailRequest) returns (GetAfterSaleCaseDetailResponse);

    // 補件
    rpc SupplementEvidence(SupplementEvidenceRequest) returns (SupplementEvidenceResponse);

    // 取消售後
    rpc CancelAfterSaleCase(CancelAfterSaleCaseRequest) returns (CancelAfterSaleCaseResponse);

    // ATM 退款：取得 PayUni 退款頁面 URL（通用：售後退款 + 賣家取消出貨）
    rpc GetRefundPageUrl(GetRefundPageUrlRequest) returns (GetRefundPageUrlResponse);

    // ==================== 賣家端 ====================

    // 賣家售後列表
    rpc GetSellerAfterSaleCases(GetSellerAfterSaleCasesRequest) returns (GetSellerAfterSaleCasesResponse);

    // 售後詳情（賣家視角）
    rpc GetSellerAfterSaleCaseDetail(GetSellerAfterSaleCaseDetailRequest) returns (GetSellerAfterSaleCaseDetailResponse);

    // 提交決策
    rpc ResolveAfterSaleCase(ResolveAfterSaleCaseRequest) returns (ResolveAfterSaleCaseResponse);

    // 確認收貨
    rpc ConfirmReturnReceipt(ConfirmReturnReceiptRequest) returns (ConfirmReturnReceiptResponse);

    // 取消出貨（從 Order Service 遷移，API 路徑不變）
    rpc CancelShipment(CancelShipmentRequest) returns (CancelShipmentResponse);

    // 7-11 退貨出貨便代碼人工重試列印（§5.3.6 admin/ops 介入用）
    rpc RetryPrintReturnLabel(RetryPrintReturnLabelRequest) returns (RetryPrintReturnLabelResponse);

    // ==================== 申訴與平台裁決（§10） ====================

    // 買家提交申訴
    rpc SubmitAppeal(SubmitAppealRequest) returns (SubmitAppealResponse);

    // 買家查詢裁決進度 / 結果
    rpc GetArbitration(GetArbitrationRequest) returns (GetArbitrationResponse);

    // 賣家 read-only 查裁決
    rpc GetSellerArbitration(GetSellerArbitrationRequest) returns (GetArbitrationResponse);

    // Admin 待裁決列表
    rpc ListAppealsForAdmin(ListAppealsForAdminRequest) returns (ListAppealsForAdminResponse);

    // Admin 裁決
    rpc DecideAppealForAdmin(DecideAppealForAdminRequest) returns (DecideAppealForAdminResponse);

    // Admin 單案詳情（§10.6.6）：含買家申訴理由 / 證據照片 / 賣家原始拒絕理由
    rpc GetAppealDetailForAdmin(GetAppealDetailForAdminRequest) returns (GetAppealDetailForAdminResponse);

    // ==================== 內部 RPC ====================

    // PayUni ATM 退款頁面完成回調（Gateway 接收 Form POST 後呼叫）
    // 解密（委派 Payment Service）→ 更新退款任務 → 組裝 Deep Link
    rpc HandleRefundPageReturn(HandleRefundPageReturnRequest) returns (HandleRefundPageReturnResponse);

    // 訂單是否有活躍 case（Order Service 訂單自動完成倒數恢復前反查，03 §5.8 / 09 §4.4.1）
    rpc HasActiveCase(HasActiveCaseRequest) returns (HasActiveCaseResponse);

    // 確認收貨時同步處置進行中售後 case（Order Service confirmReceipt 於完成訂單前同步呼叫，09 §2.1.1 / §8.2.1，#1225）
    // 單事務內依該訂單唯一活躍 case 階段分桶：A 桶(PENDING) CAS 終結至 CANCELLED_BY_CONFIRM_RECEIPT(71) → TERMINATED；
    // B 桶(已退貨/退款/申訴中) → BLOCKED + blocking_status；無活躍 case → NO_ACTIVE_CASE
    rpc CancelActiveCaseOnConfirmReceipt(CancelActiveCaseOnConfirmReceiptRequest) returns (CancelActiveCaseOnConfirmReceiptResponse);

    // 訂單撥款資格反查（Order Service GrantPaymentWorker 撥款前同步呼叫，backend#3262）
    // 回答的是「這張訂單**還會不會再生出退款**」，與 HasActiveCase（「賣家工作台要不要顯示 / 訂單倒數要不要 hold」）
    // 語意不同：兩者在 {REJECTED(60), AUTO_COMPLETED_RETURN_PENDING_TIMEOUT(33)} ＋ 未申訴上分歧——
    // 該狀態下 case 不活躍（倒數該恢復、訂單該完成），但買家仍在申訴窗內 ⇒ 退款仍可能成立 ⇒ 不得撥款。
    // deny-by-default：只有「確定結束」與「申訴窗＋grace 已過」兩類放行，其餘一律 hold。
    rpc GetOrderPayoutHold(GetOrderPayoutHoldRequest) returns (GetOrderPayoutHoldResponse);

    // 賣家工作台 Dashboard 四桶 count 用：一次取該賣家售後分類（active case 數 + 需從訂單生命週期排除/覆蓋的 orderNo set）
    // 分類規則 = AfterSaleCaseStatusRules（09 §2.1 canonical）；對應訂單 count 規則見 03 §2.1 賣家工作台 Dashboard SSOT
    rpc GetSellerCaseClassification(GetSellerCaseClassificationRequest) returns (GetSellerCaseClassificationResponse);

    // ==================== Admin 異常查詢 API（§29 Admin 異常訂單管理）====================

    // 列售後異常（REFUND_FAILED / RETURN_SHIPPING_FAILED 等，含批次聚合 provider_*）
    rpc ListAfterSaleCasesForAdmin(ListAfterSaleCasesForAdminRequest) returns (ListAfterSaleCasesForAdminResponse);

    // ==================== Admin 強制操作 ====================

    // Admin 強制確認收貨（PayUni 漏發送達 / 物流失敗 / 賣家失聯時介入）
    // 允許 status ∈ {RETURN_PENDING(20), RETURN_SHIPPING(25), RETURN_DELIVERED(27), RETURN_FAILED(28)}
    rpc ForceConfirmReceiptForAdmin(ForceConfirmReceiptForAdminRequest) returns (ForceConfirmReceiptForAdminResponse);
}

// ==================== 買家端 Request/Response ====================

message CreateAfterSaleCaseRequest {
    int64 buyer_id = 1;                  // Gateway buyerid resolver 注入（現任 buyer_id surrogate）
    string order_no = 2;
    string reason = 3;                   // RefundReason code
    string description = 4;
    repeated string photo_tokens = 5;    // Media staged_token（最多 3 張）
}

message CreateAfterSaleCaseResponse {
    int32 code = 1;
    string message = 2;
    AfterSaleCaseSummary data = 3;
}

message GetMyAfterSaleCasesRequest {
    int64 buyer_id = 1;
    string page = 2;
    string page_size = 3;
    string status = 4;                   // 可選篩選
}

message GetMyAfterSaleCasesResponse {
    int32 code = 1;
    string message = 2;
    AfterSaleCaseListData data = 3;
}

message GetAfterSaleCaseDetailRequest {
    int64 buyer_id = 1;
    string case_no = 2;
}

message GetAfterSaleCaseDetailResponse {
    int32 code = 1;
    string message = 2;
    AfterSaleCaseDetailView data = 3;
}

message SupplementEvidenceRequest {
    int64 buyer_id = 1;
    string case_no = 2;
    repeated string photo_tokens = 3;
    string additional_description = 4;
}

message SupplementEvidenceResponse {
    int32 code = 1;
    string message = 2;
}

message CancelAfterSaleCaseRequest {
    int64 buyer_id = 1;
    string case_no = 2;
}

message CancelAfterSaleCaseResponse {
    int32 code = 1;
    string message = 2;
}

message GetRefundPageUrlRequest {
    int64 buyer_id = 1;
    string order_no = 2;
    string client_type = 3;              // CodeMeta ClientType value（MOBILE_APP / WEB_BROWSER）；空字串視為 MOBILE_APP（向下相容）
    string app_type = 4;                 // CodeMeta AppType value（BUYER / SELLER）；空字串視為 BUYER（向下相容）。Gateway 由 JWT AccountType 推導後注入
}

message GetRefundPageUrlResponse {
    int32 code = 1;
    string message = 2;
    RefundPageUrlData data = 3;
}

message RefundPageUrlData {
    string redirect_url = 1;             // PayUni 退款頁面 URL（前端用 WebView 開啟）
}

// ==================== 賣家端 Request/Response ====================

message GetSellerAfterSaleCasesRequest {
    int64 store_id = 1;
    string page = 2;
    string page_size = 3;
    string status = 4;
}

message GetSellerAfterSaleCasesResponse {
    int32 code = 1;
    string message = 2;
    AfterSaleCaseListData data = 3;
}

message GetSellerAfterSaleCaseDetailRequest {
    int64 store_id = 1;
    string case_no = 2;
}

message GetSellerAfterSaleCaseDetailResponse {
    int32 code = 1;
    string message = 2;
    AfterSaleCaseDetailView data = 3;
}

message ResolveAfterSaleCaseRequest {
    int64 store_id = 1;
    string case_no = 2;
    string resolution_type = 3;        // AfterSaleResolutionType value（1=退貨退款, 2=部分退款, 3=全額退款免退貨, 4=補償券, 5=拒絕）
    // 退款相關
    string refund_amount = 4;
    string return_shipping_method = 5;   // 3001 / 3002
    // 優惠券相關
    string coupon_amount = 6;
    string coupon_min_spend = 7;
    string coupon_message = 8;
    // 拒絕相關
    string reject_reason = 9;            // AfterSaleRejectReason code
    string reject_message = 10;
    // 通用
    string negotiation_reason = 11;
}

message ResolveAfterSaleCaseResponse {
    int32 code = 1;
    string message = 2;
    ResolveResultData data = 3;
}

message ResolveResultData {
    string case_no = 1;
    string status = 2;
    string return_shipment_no = 3;
    bool need_refund_page = 4;
}

message ConfirmReturnReceiptRequest {
    int64 store_id = 1;
    string case_no = 2;
    // 驗貨扣款（optional）。未傳 actual_refund_amount = 全額退款（向後相容）
    string actual_refund_amount = 3;              // 實際退款金額（元）；傳則必須 > 0 且 ≤ resolution.refund_amount
    string deduction_reason = 4;                   // 扣款原因（actual < original 時必填）
    repeated string inspection_photo_tokens = 5;  // 驗貨照片 Media stagedToken（最多 5 張）
    string inspection_note = 6;                    // 驗貨備註（選填）
}

message ConfirmReturnReceiptResponse {
    int32 code = 1;
    string message = 2;
}

// 人工介入重試 7-11 退貨列印（§5.3.6，ADMIN 權限）
message RetryPrintReturnLabelRequest {
    int64 account_id = 1;                // Gateway 注入（admin）
    string case_no = 2;
}

message RetryPrintReturnLabelResponse {
    int32 code = 1;
    string message = 2;
}

message CancelShipmentRequest {
    int64 store_id = 1;
    string order_no = 2;
    string reason = 3;                   // SellerCancelReason code
    string remark = 4;
}

message CancelShipmentResponse {
    int32 code = 1;
    string message = 2;
    CancelShipmentResultData data = 3;
}

message CancelShipmentResultData {
    string order_no = 1;
    string refund_amount = 2;
    bool need_refund_page = 3;
}

// ==================== 共用 Data Message ====================

message AfterSaleCaseSummary {
    string case_no = 1;
    string order_no = 2;
    string status = 3;
    string reason = 4;
    string refundable_amount = 5;
    string created_at = 6;
    bool need_refund_page = 7;
    string buyer_name = 8;
    string buyer_avatar_key = 9;              // 買家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 buyerAvatarUrl）
    string shipping_address = 10;
    string return_shipping_method = 11;
    string temperature_code = 12;
    // §10 申訴狀態（AfterSaleAppealState value：0=NONE / 10=APPEALED / 20=INVESTIGATING / 30=RESOLVED）
    string appeal_state = 13;
    // §2.2 退款任務欄位（snapshot from refund_tasks，前端依此顯示 UX 情境；無 refund_task 時全部為空字串）
    string refund_task_status = 14;              // WorkerTaskStatus value（"5"/"10"/"15"/"20"/"31"/"40"...）
    string refund_failure_message = 15;          // 退款失敗訊息，直接透傳 refund_tasks.payuni_message（PayUni 原話）
    string estimated_refund_date = 16;           // 預計扣款日 ISO 8601 YYYY-MM-DD（僅 ATM 受理後有值）
    string bank_date = 17;                       // 實際到帳日 ISO 8601 YYYY-MM-DD（僅 ATM 成功匯款後有值）
    string provider_status = 18;                 // 聚合 PayUni 原始狀態碼（收斂規範 §6.2 / §9.4；依 case status 取自 refund_tasks.payuni_status 或 shipments.provider_status）
    string provider_message = 19;                // 聚合 PayUni 原始訊息
    string auto_confirm_at = 20;                 // 自動確認收貨截止時間 ISO 8601 UTC（僅 status=27 RETURN_DELIVERED 時有值，scheduler 到期自動完成）
    // 2026-05-22 逆物流退貨政策修訂新增欄位
    string store_pickup_deadline_at = 21;        // 超商待取逾時截止 ISO 8601 UTC（僅 status=26 RETURN_AT_STORE 時有值，72h scheduler 到期自動完成）
    reserved 22, 23;                              // 2026-05-22 移除：auto_complete_reason / auto_complete_reason_label（原因改由 status 31/32 直接表達）
    // 2026-06-15 待寄回逾時政策修訂新增欄位
    string ship_back_deadline_at = 24;           // 買家寄回退貨逾時截止 ISO 8601 UTC（僅 status=20 RETURN_PENDING 時有值，預設 7 天；逾時 ReturnTimeoutWorker 自動推進至 status=33 AUTO_COMPLETED_RETURN_PENDING_TIMEOUT）
}

message AfterSaleCaseListData {
    repeated AfterSaleCaseSummary records = 1;
    string total = 2;
    string page = 3;
    string page_size = 4;
}

message AfterSaleCaseDetailView {
    string case_no = 1;
    string order_no = 2;
    string buyer_id = 3;
    string store_id = 4;
    string status = 5;
    string reason = 6;
    string description = 7;
    string refundable_amount = 8;
    reserved 9;                                  // reopen_count 已於 #1228 淘汰，tag 保留不重用
    repeated AfterSaleCaseItemView items = 10;
    repeated EvidenceView evidence = 11;
    repeated ResolutionView resolutions = 12;
    string return_shipment_no = 13;              // 後端內部 shipment ID（RS{9位}），非對外顯示
    string return_shipping_method = 14;
    repeated string shipment_photo_keys = 15;    // 出貨照片 objectKey（49 §6.6：Gateway 組 shipmentPhotoUrls）
    bool need_refund_page = 16;
    string created_at = 17;
    string closed_at = 18;
    string ship_trade_no = 19;                   // PayUni 物流序號（7-11 退貨可選顯示）
    string partner_id = 20;                      // 7-11 出貨便母代碼（3 碼，Print Webhook 回填）
    string odno = 21;                            // 7-11 出貨便單編號（8 碼，Print Webhook 回填）
    string validation_no = 22;                   // 7-11 出貨便 C2C 驗證碼（4 碼，Print Webhook 回填）
    // §10 申訴狀態與期限
    string appeal_state = 23;                    // AfterSaleAppealState value
    string appeal_deadline = 24;                 // ISO 8601 UTC；僅 status=REJECTED && appeal_state=NONE（'0'）時有值
    bool can_appeal = 25;                        // service layer compute 結果
    // §2.2 退款任務欄位（snapshot from refund_tasks，前端依此顯示 UX 情境；無 refund_task 時全部為空字串）
    string refund_task_status = 26;              // WorkerTaskStatus value（"5"/"10"/"15"/"20"/"31"/"40"...）
    string refund_failure_message = 27;          // 退款失敗訊息，直接透傳 refund_tasks.payuni_message（PayUni 原話）
    string estimated_refund_date = 28;           // 預計扣款日 ISO 8601 YYYY-MM-DD（僅 ATM 受理後有值）
    string bank_date = 29;                       // 實際到帳日 ISO 8601 YYYY-MM-DD（僅 ATM 成功匯款後有值）
    string provider_status = 30;                 // 聚合 PayUni 原始狀態碼（收斂規範 §6.2 / §9.4；依 case status 取自 refund_tasks.payuni_status 或 shipments.provider_status）
    string provider_message = 31;                // 聚合 PayUni 原始訊息
    // §5.10 賣家處理期限自動升級
    string process_deadline = 32;                // ISO 8601 UTC；僅 status=PENDING 才有值
    bool auto_escalated = 33;                    // 是否系統自動升級（PROCESS_TIMEOUT）
    int32 process_deadline_hours = 34;           // 配置的處理期限小時數（前端顯示用，例 24）
    // §5.3.10 退貨送達自動確認收貨
    string auto_confirm_at = 35;                 // 自動確認收貨截止時間 ISO 8601 UTC（僅 status=27 RETURN_DELIVERED 時有值，scheduler 到期自動 confirm）
    string return_delivered_at = 36;             // 退貨送達賣家時間 ISO 8601 UTC（status>=27 時有值，PayUni webhook 觸發 25→27 流轉時 stamp）
    string return_provider_status = 37;          // PayUni 退貨物流原始狀態碼（status=28 RETURN_FAILED 時填入；2026-05-22 起碼 55 也會 stamp 不變狀態）
    string return_provider_message = 38;         // PayUni 解密後錯誤訊息原文
    // 2026-05-22 逆物流退貨政策修訂新增欄位
    string store_arrived_at = 39;                // 超商到店時間 ISO 8601 UTC（PayUni 碼 32 觸發 25→26 stamp）
    string store_pickup_deadline_at = 40;        // 超商待取逾時截止 ISO 8601 UTC（僅 status=26 有值）
    string seller_picked_up_at = 41;             // 超商賣家實際取貨時間 ISO 8601 UTC（PayUni 碼 11 觸發 26→27 stamp）
    reserved 42, 43, 45;                          // 2026-05-22 移除：auto_complete_reason / auto_complete_reason_label（原因改由 status 31/32 直接表達）/ can_confirm_receipt（冗餘 boolean，前端直接判 status === "27"）
    string auto_complete_at_stamp = 44;          // 系統實際自動完成的時間戳 ISO 8601 UTC（status=31/32 時有值）
    // 2026-06-15 待寄回逾時政策修訂新增欄位（新增欄位請從 tag 47 起）
    string ship_back_deadline_at = 46;           // 買家寄回退貨逾時截止 ISO 8601 UTC（僅 status=20 RETURN_PENDING 時有值，預設 7 天；逾時 ReturnTimeoutWorker 自動推進至 status=33）
}

message AfterSaleCaseItemView {
    string order_item_id = 1;
    string sku_id = 2;
    string sku_name = 3;
    string quantity = 4;
    string original_price = 5;
    string actual_pay_amount = 6;
    string image_key = 7;                    // 商品圖 objectKey（49 §6.6：Gateway 組 imageUrl）
}

message EvidenceView {
    string asset_id = 1;
    string image_key = 2;                    // 佐證圖 objectKey（49 §6.6：Gateway 組 imageUrl）
    string evidence_type = 3;
    string created_at = 4;
}

message ResolutionView {
    string resolution_type = 1;
    string refund_amount = 2;
    string coupon_amount = 3;
    string coupon_min_spend = 4;
    string coupon_message = 5;
    string reject_reason = 6;
    string reject_message = 7;
    string negotiation_reason = 8;
    string created_at = 9;
    // 驗貨扣款（僅 INSPECTION_DEDUCTION 填值，其他類型留空）
    string deduction_reason = 10;
    string inspection_note = 11;
}

// ==================== 內部 RPC Message ====================

message HandleRefundPageReturnRequest {
    string encrypt_info = 1;             // PayUni Form POST 的 EncryptInfo（AES 加密）
    string hash_info = 2;               // PayUni Form POST 的 HashInfo（SHA256 簽章）
    reserved 3;                          // 原 app_type 已移除：service 端從 refund_tasks DB lookup 取得 client_type / app_type（SoT 在 DB），詳見設計書 09 §5.4.2
    string order_no = 4;                // Gateway fallback：從 return_url query param 取，PayUni 失敗時 MerTradeNo 可能為空，用此欄位 lookup refund_task
}

message HandleRefundPageReturnResponse {
    int32 code = 1;
    string message = 2;
    string redirect_url = 3;            // 完整 Deep Link URL（Gateway 302 redirect 用）
}

message HasActiveCaseRequest {
    string order_no = 1;
}

message HasActiveCaseResponse {
    int32 code = 1;
    string message = 2;
    bool has_active = 3;                // AfterSaleCaseStatusRules.isActive（09 §2.1）：status NOT IN (33,50,60,70,71) OR (status=60 AND appeal_state=10) OR (status=33 AND appeal_state=10)
    int32 active_count = 4;             // 觀測用
}

message CancelActiveCaseOnConfirmReceiptRequest {
    string order_no = 1;               // 訂單號
    int64 buyer_id = 2;        // 買家 buyer_id（內部 RPC，order-service 已驗證訂單歸屬；供 audit actor 與防越權）
}

message CancelActiveCaseOnConfirmReceiptResponse {
    int32 code = 1;
    string message = 2;
    // 處置結果：NO_ACTIVE_CASE=無活躍 case（訂單可完成）/ TERMINATED=A 桶已 CAS 終結至 71（訂單可完成）/ BLOCKED=B 桶擋住（訂單不可完成）
    Result result = 3;
    string case_no = 4;                // result=TERMINATED / BLOCKED 時帶該 case
    string blocking_status = 5;        // result=BLOCKED 時帶擋住的 case status（AfterSaleCaseStatus value），供 order-service 組裝訊息
    enum Result {
        RESULT_UNSPECIFIED = 0;
        NO_ACTIVE_CASE = 1;
        TERMINATED = 2;
        BLOCKED = 3;
    }
}

message GetOrderPayoutHoldRequest {
    string order_no = 1;
}

message GetOrderPayoutHoldResponse {
    int32 code = 1;
    string message = 2;
    // true = 該訂單仍可能生出退款，禁止撥款
    bool hold = 3;
    // hold=true 且**有時間界**時帶（ISO 8601 UTC，= 申訴截止 + grace）；
    // 無時間界（申訴審理中 / 退款處理中）與 hold=false 一律留空。
    // 呼叫端據此把撥款任務推遲到該時點，到期自動重問——因此不會永久卡住賣家款項。
    string hold_until = 4;
    Reason reason = 5;                 // 觀測用
    string case_no = 6;                // 造成 hold 的 case（觀測用；hold=false 留空）
    enum Reason {
        REASON_UNSPECIFIED = 0;
        NONE = 1;                      // 無 hold，可撥款
        ACTIVE_CASE = 2;               // 售後案件進行中（含申訴審理中、退款處理中）——無時間界
        APPEAL_WINDOW_OPEN = 3;        // 案件已駁回 / 自動關案，但買家仍可申訴——有時間界
        // backend#3262 P0：申訴窗（含 grace）看似已過，但該 case 正被別的交易持鎖
        // ——可能是一筆已通過資格檢查、尚未 commit 的申訴 ⇒ fail-closed，無時間界（推遲後重問）
        APPEAL_IN_FLIGHT = 4;
    }
}

message GetSellerCaseClassificationRequest {
    int64 store_id = 1;              // 賣家 store_id（order-service / Gateway 注入）
}

message GetSellerCaseClassificationResponse {
    int32 code = 1;
    string message = 2;
    string active_case_count = 3;                     // active 售後 case 數（= Dashboard「售後處理」卡；§6 response 數字 string）
    repeated string active_order_nos = 4;             // 有 active 售後的 distinct orderNo（生命週期三桶排除用）
    repeated string completed_override_order_nos = 5; // 有 terminal-override 售後（case status∈{33,50} 無申訴）且無 active 售後的 distinct orderNo（歸「已完成」用）
}

// ==================== 申訴與平台裁決（§10）Messages ====================

message SubmitAppealRequest {
    int64 buyer_id = 1;                        // Gateway buyerid resolver 注入（BUYER）
    string case_no = 2;
    string reason = 3;                         // 申訴理由分類或簡述（Phase 1 自由文字）
    string description = 4;                    // 詳細說明（選填）
    repeated string evidence_photo_tokens = 5; // Media staged_token（最多 5 張，選填）
}

message SubmitAppealResponse {
    int32 code = 1;
    string message = 2;
    SubmitAppealData data = 3;
}

message SubmitAppealData {
    string appeal_id = 1;          // = case_no（一案一申訴）
    string appeal_state = 2;       // AfterSaleAppealState value（提交後 = APPEALED，即 '10'）
}

message GetArbitrationRequest {
    int64 buyer_id = 1;            // Gateway buyerid resolver 注入（BUYER，Service 驗 buyer_id 相符）
    string case_no = 2;
}

message GetSellerArbitrationRequest {
    int64 store_id = 1;          // Gateway JWT 注入（SELLER，Service 驗 store_id 相符）
    string case_no = 2;
}

message GetArbitrationResponse {
    int32 code = 1;
    string message = 2;
    ArbitrationData data = 3;
}

message ArbitrationData {
    string state = 1;                          // AfterSaleAppealState value（10=APPEALED / 20=INVESTIGATING / 30=RESOLVED）
    repeated AppealEventView timeline = 2;
    PlatformDecisionView decision = 3;         // state != 30（RESOLVED）時為預設空 message
}

message AppealEventView {
    string event_type = 1;         // AfterSaleAppealEventType value
    string timestamp = 2;          // ISO 8601 UTC
    string label = 3;
    string description = 4;
}

message PlatformDecisionView {
    string outcome = 1;            // AfterSalePlatformDecisionOutcome value
    string refund_amount = 2;      // 整數字串；PARTIAL_REFUND 有值，其他 "0"
    string reason = 3;
    string decided_at = 4;         // ISO 8601 UTC
    // 不含 decided_by_admin_id（§10.7.3 可見性原則）
}

message ListAppealsForAdminRequest {
    int64 account_id = 1;          // Gateway JWT 注入（ADMIN）
    string appeal_state = 2;       // AfterSaleAppealState value：10（APPEALED）/ 20（INVESTIGATING）/ 30（RESOLVED），或 all（不限）；空字串視為 10。Gateway 對其餘輸入一律 400
    string page = 3;               // 預設 "1"
    string page_size = 4;          // 預設 "20"（最大 "100"）
}

message ListAppealsForAdminResponse {
    int32 code = 1;
    string message = 2;
    ListAppealsForAdminData data = 3;
}

message ListAppealsForAdminData {
    repeated AppealSummaryView records = 1;
    string total = 2;
    string page = 3;
    string page_size = 4;
}

message AppealSummaryView {
    string case_no = 1;
    string order_no = 2;
    string buyer_id = 3;
    string store_id = 4;
    string appeal_state = 5;
    string appeal_submitted_at = 6;    // ISO 8601 UTC
    string last_rejected_at = 7;       // ISO 8601 UTC
    string refundable_amount = 8;
    // §10.6.6 Admin 列表補 profile 欄位
    string buyer_name = 9;             // 從 aftersale_cases.buyer_name 快照
    string buyer_avatar_key = 10;      // 買家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 buyerAvatarUrl）
    string seller_name = 11;           // 向 SellerService 查 SellerInfo.name，失敗回空字串
    string seller_avatar_key = 12;     // 賣家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 sellerAvatarUrl）
}

message DecideAppealForAdminRequest {
    int64 account_id = 1;          // Gateway JWT 注入（ADMIN，記錄為 decided_by_admin_id）
    string case_no = 2;
    string outcome = 3;            // AfterSalePlatformDecisionOutcome value
    string refund_amount = 4;      // 僅 PARTIAL_REFUND 必填；整數字串
    string reason = 5;
}

message DecideAppealForAdminResponse {
    int32 code = 1;
    string message = 2;
    DecideAppealForAdminData data = 3;
}

message DecideAppealForAdminData {
    string case_no = 1;
    string outcome = 2;
    string refund_amount = 3;      // echo back，便於 admin console 確認
}

// §10.6.6 Admin 單案詳情
message GetAppealDetailForAdminRequest {
    int64 account_id = 1;          // Gateway JWT 注入（身分為 ADMIN）
    string case_no = 2;
}

message GetAppealDetailForAdminResponse {
    int32 code = 1;
    string message = 2;
    AppealDetailForAdminData data = 3;
}

message AppealDetailForAdminData {
    AfterSaleCaseDetailView case_detail = 1;   // 重用既有（含 items / evidence / resolutions / shipment_photo_keys / 7-11 代碼）
    ArbitrationData arbitration = 2;            // 重用（state / timeline / decision）
    AdminContextView admin_context = 3;         // Admin-only 欄位
    AdminProviderContext provider_context = 4;  // §29 Admin 對帳明細（依 case 當下 status 取自 Payment / Shipping SoT，null 時代表該狀態無 provider 聚合）
}

// Admin 對帳 provider 資訊（§29）
message AdminProviderContext {
    string provider_source = 1;         // CodeMeta ProviderSource 子集：PAYMENT_REFUND / SHIPPING；"" = 無第三方環節可對帳
    string provider_status = 2;          // PayUni 原始狀態碼
    string provider_message = 3;         // PayUni 原始訊息
    string provider_refund_no = 4;       // 僅 PAYMENT_REFUND 有值
    string ship_trade_no = 5;            // 僅 SHIPPING 有值
}

message AdminContextView {
    string decided_by_admin_id = 1;       // 僅 appeal_state=30（RESOLVED）有值
    string buyer_appeal_reason = 2;       // 從 aftersale_cases.appeal_reason 直讀
    string buyer_appeal_description = 3;  // 從 aftersale_cases.appeal_description 直讀
    string seller_reject_reason = 4;      // 最新一筆 resolution_type=REJECT 的 reject_reason
    string seller_reject_message = 5;     // 最新一筆 resolution_type=REJECT 的 reject_message
    string buyer_name = 6;                // 快照
    string buyer_avatar_key = 7;          // 買家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 buyerAvatarUrl）
    string seller_name = 8;               // live lookup，失敗回空
    string seller_avatar_key = 9;         // 賣家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 sellerAvatarUrl）
}

// ==================== Admin 異常列表 Messages（§29）====================

message ListAfterSaleCasesForAdminRequest {
    int64 account_id = 1;
    string page = 2;
    string page_size = 3;
    bool abnormal_only = 4;
    string provider_status = 5;
    string status = 6;                      // AfterSaleCaseStatus value，可多值逗號分隔
    string buyer_id = 7;
    string store_id = 8;
    string order_no = 9;
    string created_from = 10;
    string created_to = 11;
    string sort = 12;
}

message ListAfterSaleCasesForAdminResponse {
    int32 code = 1;
    string message = 2;
    ListAfterSaleCasesForAdminData data = 3;
}

message ListAfterSaleCasesForAdminData {
    repeated AdminAfterSaleCaseSummary records = 1;
    string total = 2;
    string page = 3;
    string page_size = 4;
}

message AdminAfterSaleCaseSummary {
    string case_no = 1;
    string order_no = 2;
    string buyer_id = 3;
    string store_id = 4;
    string status = 5;                     // AfterSaleCaseStatus value
    string refundable_amount = 6;
    string payment_method = 7;
    string provider_status = 8;            // 依 case.status 聚合（§29 §8.3）
    string provider_message = 9;
    string created_at = 10;
    string updated_at = 11;
}

// ==================== Admin 強制操作 Messages（§5.3.12）====================

message ForceConfirmReceiptForAdminRequest {
    int64 account_id = 1;                  // Admin 帳號，Gateway 注入
    string case_no = 2;                    // 售後單編號
    string reason = 3;                     // Admin 強制確認理由（必填，寫入 audit log extra）
    string actual_refund_amount = 4;       // 選填，預設全額退款（= resolution.refund_amount）
    string deduction_reason = 5;           // 選填，actual < original 時必填
}

message ForceConfirmReceiptForAdminResponse {
    int32 code = 1;
    string message = 2;
    ForceConfirmReceiptForAdminData data = 3;
}

message ForceConfirmReceiptForAdminData {
    string case_no = 1;
    string prior_status = 2;               // 強制前的 status，audit 用
    string refund_task_id = 3;             // 建立的退款任務 ID
    string final_refund_amount = 4;        // 實際退款金額
}
