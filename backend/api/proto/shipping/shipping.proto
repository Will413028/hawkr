}

// ==================== 超商門市地圖 ====================

message GetStoreMapParamsRequest {
    int64 account_id = 1;             // Gateway JWT 注入（E.5.5 例外）
    string app_type = 2;              // "buyer" 或 "seller"，決定回調時的 Deep Link Scheme
    string mobile_tag = 3;            // "Y"=手機版(預設), "N"=PC版
}

message GetStoreMapParamsResponse {
    int32 code = 1;
    string message = 2;
    StoreMapFormData data = 3;
}

// PayUni 門市地圖 Form POST 所需參數
message StoreMapFormData {
    string form_action = 1;           // PayUni 門市地圖 URL
    string mer_id = 2;                // 平台商店代號（HAWK）
    string version = 3;               // API 版本（固定 "1.1"）
    string encrypt_info = 4;          // AES 加密字串
    string hash_info = 5;             // SHA256 簽章
    string redirect_url = 6;          // 完整的 WebView 開啟 URL（含 base64 編碼表單資料，由 Shipping Service 組裝）
}

// 以 opaque redirect_id 取回門市中轉表單 canonical 欄位（#1394）
message GetStoreMapRedirectFormRequest {
    string redirect_id = 1;           // 不可猜的 opaque id（後端產生，一次性消費）
}

message GetStoreMapRedirectFormResponse {
    string form_action = 1;           // PayUni 門市地圖 Form POST action URL
    string mer_id = 2;                // 平台商店代號（HAWK）
    string version = 3;               // API 版本
    string encrypt_info = 4;          // AES 加密字串
    string hash_info = 5;             // SHA256 簽章
}

message DecryptStoreMapResultRequest {
    string encrypt_info = 1;          // PayUni 回傳的 AES 加密字串
    string hash_info = 2;             // PayUni 回傳的 SHA256 簽章
    string app_type = 3;              // "buyer" 或 "seller"，決定 Deep Link Scheme
}

message DecryptStoreMapResultResponse {
    int32 code = 1;
    string message = 2;
    StoreMapResult data = 3;
    string redirect_url = 4;          // Deep Link URL（由 Shipping Service 組裝），Gateway 直接 302 redirect
}

// PayUni MapJson 解密後的門市資訊
message StoreMapResult {
    string store_id = 1;              // 門市代碼（6 碼，如 "916712"）
    string store_name = 2;            // 門市名稱（如 "敦安門市"）
    string address = 3;               // 門市地址
    string insular_area = 4;          // "I"=本島, "O"=離島
    string store_type = 5;            // 門市類型（固定 "SEVEN"）
}

// ==================== 賣家物流設定查詢（服務間）====================

message GetSellerShippingConfigRequest {
    int64 store_id = 1;      // 賣家 store_id（內部服務間呼叫）
}

message GetSellerShippingConfigResponse {
    int32 code = 1;
    string message = 2;
    repeated SellerShippingConfigItem configs = 3;
}

// 賣家單一配送方式的開通狀態與寄件資訊
message SellerShippingConfigItem {
    string shipping_method = 1;       // 3001 / 3002
    string goods_type = 2;            // 3201 / 3203（宅配為空字串）
    bool available = 3;               // 是否已開通且啟用（onboarding_status=ACTIVE && enabled=true）
    string sender_postal_code = 4;    // 寄件郵遞區號（僅宅配有值，供運費路線推導）
    string sender_city = 5;           // 寄件城市（訂單快照用）
    string sender_district = 6;       // 寄件地區（訂單快照用）
}

// ==================== 運費計算 ====================

// --- 取得全部運費配置 ---

message GetShippingFeeConfigsRequest {}

message GetShippingFeeConfigsResponse {
    int32 code = 1;
    string message = 2;
    repeated ShippingMethodConfigProto method_configs = 3;  // 配送方式設定清單
    repeated ShippingFeeTierProto fee_tiers = 4;            // 費率級距清單
}

message ShippingMethodConfigProto {
    string shipping_method = 1;         // 配送方式
    string delivery_temp = 2;           // 配送溫層
    string max_dimension_sum_cm = 3;    // 材積上限（cm）
    string max_single_side_cm = 4;      // 最長邊上限（cm）
    string max_weight_grams = 5;        // 重量上限（g）
    string estimated_days = 6;          // 預計到貨天數
    string settlement_days = 7;         // 撥款天期
    string commission_rate = 8;         // 代收手續費率
    string commission_min = 9;          // 代收手續費最低金額
}

message ShippingFeeTierProto {
    string shipping_method = 1;         // 配送方式
    string delivery_temp = 2;           // 配送溫層
    string delivery_zone = 3;           // 配送區域（DOMESTIC / OFFSHORE / INTER_ISLAND）
    string max_dimension_cm = 4;        // 材積上限（cm），"0" 表示統一價
    string fee = 5;                     // 運費（元）
}

// --- 查詢單一運費 ---

message LookupShippingFeeRequest {
    string shipping_method = 1;         // 配送方式
    string delivery_temp = 2;           // 配送溫層
    string delivery_zone = 3;           // 配送區域
    string dimension_sum = 4;           // 材積總和（cm，數字字串）
}

message LookupShippingFeeResponse {
    int32 code = 1;
    string message = 2;
    string fee = 3;                     // 運費（元，數字字串），不可用時為空
    string estimated_days = 4;          // 預計到貨天數
    string settlement_days = 5;         // 撥款天期
}

// --- 計算可用配送選項 ---

message CalculateShippingOptionsRequest {
    string length_cm = 1;           // 包裝長度（cm）
    string width_cm = 2;            // 包裝寬度（cm）
    string height_cm = 3;           // 包裝高度（cm）
    string weight_grams = 4;        // 重量（公克）
    string delivery_zone = 5;       // 配送區域（DOMESTIC / OFFSHORE / INTER_ISLAND），空字串預設 DOMESTIC
    int64 store_id = 6;              // 賣家 store 代理鍵（選填；有傳入時只回傳賣家已開通的配送方式）；命名債改名，原 seller_account_id，field number 不變
}

message CalculateShippingOptionsResponse {
    int32 code = 1;
    string message = 2;
    repeated ShippingOptionGroup temperature_groups = 3;  // 依溫層分組的配送選項
    string weight_grams = 4;        // 轉換後重量（g）
    string dimension_sum = 5;       // L+W+H 材積總和（cm）
    string longest_side = 6;        // 最長邊（cm）
}

message ShippingOptionGroup {
    string temperature = 1;                         // 溫層 value（3201=常溫 / 3202=冷藏 / 3203=冷凍）
    string display_name = 2;                        // 溫層顯示名（常溫/冷藏/冷凍）
    repeated ShippingOptionDetail methods = 3;      // 可用配送方式
}

message ShippingOptionDetail {
    string shipping_method = 1;         // 配送方式 value（3001/3002/3003）
    string display_name = 2;            // 配送方式顯示名
    string fee = 3;                     // 運費（元）
    string estimated_days = 4;          // 預計到貨天數
    string settlement_days = 5;         // 撥款天期
    string max_dimension_sum = 6;       // 材積上限 L+W+H（cm），"0" 表示無特定限制
    string max_longest_side = 7;        // 最長邊上限（cm），"0" 表示無特定限制
    string max_weight_grams = 8;        // 重量上限（g）
}

// ==================== 商品配送驗證（Product Service 呼叫）====================

message ValidateProductShippingRequest {
    int64 store_id = 1;                                    // 賣家 store 代理鍵（內部服務呼叫）；命名債改名，原 seller_account_id，field number 不變
    repeated ValidateShippingItem items = 2;              // 待驗證的 SKU 配送項目
}

message ValidateShippingItem {
    string sku_name = 1;              // SKU 名稱（用於錯誤訊息識別）
    string shipping_method = 2;       // 3001 / 3002 / UBER_INSTANT
    string temperature = 3;           // AMBIENT / CHILLED / FROZEN
    string length_cm = 4;
    string width_cm = 5;
    string height_cm = 6;
    string weight_grams = 7;          // 已轉換為公克
}

message ValidateProductShippingResponse {
    int32 code = 1;
    string message = 2;
    bool all_valid = 3;                                    // 全部通過 = true
    repeated ValidateShippingResult results = 4;           // 各項目的驗證結果
}

message ValidateShippingResult {
    string sku_name = 1;
    string shipping_method = 2;
    string temperature = 3;
    bool valid = 4;
    string rejection_reason = 5;      // 拒絕原因代碼：NOT_ONBOARDED / METHOD_NOT_SUPPORTED / DIMENSION_SUM_EXCEEDED / SINGLE_SIDE_EXCEEDED / WEIGHT_EXCEEDED
    string rejection_message = 6;     // 人類可讀的拒絕訊息（繁體中文）
    string max_dimension_sum_cm = 7;  // 材積上限（L+W+H cm），僅超出時有值
    string max_single_side_cm = 8;    // 單邊上限（cm），僅超出時有值
    string max_weight_grams = 9;      // 重量上限（g），僅超出時有值
}

