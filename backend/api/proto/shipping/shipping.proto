    string label_company_name = 10;   // 標籤公司名稱（超商才有）
    string enabled = 11;              // 是否啟用（"true" / "false"）
    string created_at = 12;           // ISO 8601
    string updated_at = 13;           // ISO 8601
    string return_store_name = 14;    // 退貨門市名稱（超商才有）
    string return_store_address = 15; // 退貨門市地址（超商才有）
    // 寄件人/退貨資訊（物流設定獨立化）
    string sender_name = 16;          // 寄件人/退貨聯絡人姓名
    string sender_phone = 17;         // 寄件人/退貨聯絡人電話
    string sender_city = 18;          // 寄件城市（宅配用）
    string sender_district = 19;      // 寄件地區（宅配用）
    string sender_address_detail = 20; // 寄件詳細地址（宅配用）
