// ==================== Uber 即時報價（66 §6.2；Stage 8B W2-2）====================

// 🔴 一件待報價的商品。
//
// 為什麼要逐項而不是像 CalculateShippingOptions 那樣先聚合成一個長寬高重：
// Uber 的 manifest_items[] 是逐項的，而分箱（66 §5.1.8）要知道每一件的尺寸才算得出箱數。
// 聚合之後那些資訊就回不來了。
message UberQuoteItem {
    string sku_id = 1;              // 進 manifest_items[].external_id，也是 payload_hash 的排序鍵
    string name = 2;                // 品名
    string quantity = 3;            // 件數
    string length_cm = 4;
    string width_cm = 5;
    string height_cm = 6;
    string weight_gram = 7;
    string unit_price = 8;          // 單價（元整數）
}

// 收件地址。
//
// 🔴 三個欄位分開傳，**不是**一個字串。
// 權威來源 hawkr_buyer.shipping_addresses 本來就是 city／district／detail_address
// 三欄（buyer.proto 的 AddressInfo 原樣暴露）。攤平成字串再讓 shipping 反解，
// 等於自己製造一個解析率問題——而每一筆解不出來的，就是一個看不到選項的買家。
message UberQuoteDropoff {
    string receiver_name = 1;
    string receiver_phone = 2;
    string county = 3;              // 第一級行政區（shipping_addresses.city）
    string district = 4;            // 第二級行政區（shipping_addresses.district）
    string detail_address = 5;      // 門牌與樓層（shipping_addresses.detail_address）
}

message GetUberQuoteForCheckoutRequest {
    int64 buyer_id = 1;             // 業務鍵（buyers PK），不是 account_id
    int64 seller_store_id = 2;      // 賣家業務鍵（sellers PK），不是 account_id
    string delivery_temp = 3;       // 溫層 value（3201／3202／3203）
    UberQuoteDropoff dropoff = 4;
    repeated UberQuoteItem items = 5;
}

// 🔴 available=false 時 quote_id／fee 一律為空，理由在 unavailable_reason。
//    不要用「fee 為 0」表示不可用——0 元運費是一個合法的業務狀態（平台補貼）。
message UberQuoteData {
    bool available = 1;
    string unavailable_reason = 2;  // available=false 時必填，可寫進 UI 的理由碼
    string quote_id = 3;            // Uber 的報價 id（dqt_ 前綴）
    string fee_amount = 4;          // 運費（元整數；🔴 string，response 側無原生數值豁免）
    string currency = 5;
    string expires_at = 6;          // ISO 8601 UTC。🔴 前端據此判斷要不要重報
}

message GetUberQuoteForCheckoutResponse {
    int32 code = 1;
    string message = 2;
    UberQuoteData data = 3;
}

// 🔴 accept=false ⇒ 只重驗不落狀態（preview／confirm 前）；
//    accept=true  ⇒ capture 成功後把報價標成 CHECKOUT_ACCEPTED，此時 order_no 必填。
message ValidateUberQuoteForCheckoutRequest {
    string quote_id = 1;
    int64 buyer_id = 2;
    int64 seller_store_id = 3;
    string delivery_temp = 4;
    UberQuoteDropoff dropoff = 5;
    repeated UberQuoteItem items = 6;
    bool accept = 7;
    string order_no = 8;            // accept=true 時必填
}

// 🔴 price_changed=true ⇒ 呼叫端**不得** capture（66 §6.1.4／INV-U1）。
//    自動接受新價＝補收（違約）；自動用舊價＝我方吃差額且無上限。兩個都不能默默做。
message ValidateUberQuoteData {
    bool valid = 1;                 // false ⇒ 看 unavailable_reason 或 price_changed
    bool price_changed = 2;
    string unavailable_reason = 3;
    string quote_id = 4;            // 重驗後應採用的那一筆（可能與送進來的不同）
    string fee_amount = 5;          // price_changed=true 時，這是 data.newFee
    string expires_at = 6;
}

message ValidateUberQuoteForCheckoutResponse {
    int32 code = 1;
    string message = 2;
    ValidateUberQuoteData data = 3;
}

// ==================== Uber 配送查詢 Messages（66；Stage 8B W6-3／W6-4）====================
//
// 資料來源三張表：shipments（normalized 狀態與歸屬的 SSOT）、uber_deliveries（provider 側事實）、
// uber_quotes／uber_pod_artifacts（報價與送達憑證）。
//
// 🔴 **驅動表是 shipments 不是 uber_deliveries**：建單失敗（990）與建單結果未知（991）的單
//    根本沒有 uber_deliveries 列（66 §5.1.5：建單成功才寫入），而那兩類正是 W6-4 明列要查的
//    「failure」與「unknown」。以 uber_deliveries 當驅動表 = 最需要被看見的那些單一筆都不在列表裡。

// 一筆 Uber 配送的摘要（列表列，賣家面與 Admin 面共用）。
message UberDeliverySummary {
    // 🔴 本列的**可定址鍵**：有 uber_deliveries 列時是 provider delivery id，
    //    沒有時退回我方 shipment_no。兩個值域不相交（del_／ret_ 前綴 vs SH 前綴），
    //    而「每一列都打得開」是這個欄位存在的理由——建單失敗的單沒有 delivery_id，
    //    若以 delivery_id 當唯一鍵，Admin 點不開的正好是他最需要點開的那幾筆。
    string delivery_no = 1;
    // provider reference（66 §5.1.5）。建單失敗／結果未知時為空字串。
    // ⚠️ del_／ret_ 前綴**只用於健全性檢查，不用於分辨 leg**——leg 的真相在 is_return。
    string delivery_id = 2;
    string shipment_id = 3;          // shipments.id（TSID 數字字串）
    string shipment_no = 4;
    string order_no = 5;
    string store_id = 6;             // 賣家 store 代理鍵（不是 account_id）
    string shipping_method = 7;      // 恆 "3003"（ShippingMethod.UBER_INSTANT）
    string is_return = 8;            // "true" / "false"
    // 🔴 normalized 狀態，SSOT = shipments.status（ShippingStatus value）。
    string status = 9;
    string status_label = 10;        // ShippingStatus.label()，CodeMeta SoT，Gateway 純透傳
    // 🔴 **raw provider status**：Uber 原生 7 值（pending／pickup／pickup_complete／dropoff／
    //    delivered／canceled／returned），照抄不映射。與 status 是**兩個不同的欄位**，
    //    W6-4 明列它們要分開查（66 §7.3.1：未知值 fail-closed，不猜測式映射）。
    string provider_status = 11;
    // UberDeliveryOutcome（66 附錄 C.2 ④）：PROVIDER_UNDELIVERABLE／PROVIDER_CANCELED／
    // SELLER_CANCELED／ADMIN_CANCELED／CREATE_FAILED。
    // 🔴 它是「41 這一格的錢與責任歸誰」的唯一判準（66 §7.3.4）⇒ W6-3 的 responsibility 一格看它。
    string outcome = 12;
    string undeliverable_reason = 13; // Uber 原生值照抄（66 C.4 不納管）
    string cancelation_reason = 14;   // Uber 原生值照抄；與 delivery_id 同為月結對帳的鍵
    string eta_dropoff_at = 15;       // ISO 8601 UTC
    string courier_name = 16;
    // ⚠️ **boolean 不是狀態**（U-I／66 §7.3.1）：它不映射任何 normalized 值。
    bool courier_imminent = 17;
    string provider_error_code = 18;    // 來自 shipments（V12 拆欄）；非空＝provider 層失敗
    string provider_error_message = 19;
    string provider_error_at = 20;      // ISO 8601 UTC
    string quote_id = 21;               // 對應 uber_quotes.quote_id（dqt_ 前綴）
    // 已抓回的 POD 件數（整數字串）。0 不等於異常：POD 在 delivered 之後才由 P2 抓取。
    string pod_artifact_count = 22;
    string created_at = 23;             // shipments.created_at（ISO 8601 UTC）
    string updated_at = 24;             // shipments.updated_at（ISO 8601 UTC）
}

// 報價快照（66 §5.1.4）。W6-4 Delivery Detail 的 quote／cost 兩格。
//
// ⚠️ 這是**買家被收取的運費**（uber_quotes.fee_amount，INV-U1 永不補收），
//    不是「我方付給 Uber 的實際成本」——後者只出現在月結帳單（66 §4.5.5 ③），
//    本 repo 今天沒有承載它的表。兩者不得混為一格。
message UberDeliveryQuoteView {
    string quote_id = 1;
    string fee_amount = 2;              // 元整數字串（🔴 response 側無原生數值豁免）
    string currency = 3;
    // CREATED｜CHECKOUT_ACCEPTED｜EXPIRED｜CONSUMED｜SUPERSEDED（66 §5.1.4）
    string status = 4;
    string expires_at = 5;              // ISO 8601 UTC
    string packing_policy_version = 6;  // 整數字串
    string created_at = 7;              // ISO 8601 UTC
}

// 送達憑證（66 §5.1.7）。
//
// 🔴 **pincode_value 刻意不在本 message**：它是「持有即可領取包裹」的憑證
//    （§10.3 的判準：憑證問「拿到它能做什麼」而不是「這是誰的個資」）。
//    賣家與 Admin 都不需要它才能判斷 POD 是否存在，而一旦外露就無法收回。
message UberPodArtifactView {
    string artifact_type = 1;   // picture｜signature｜pincode（Uber 原生值照抄）
    // 🔴 只給 objectKey，**不給 URL**：POD 走 secure/ 前綴（66 §5.1.7），
    //    拿 media base URL 直接串出來就是陷阱 A6（收件地址與門口實景任何人可取）。
    //    secure 資產的簽章取用路徑今天不在 Gateway，因此本欄的消費端要走既有機敏資產流程。
    string object_key = 2;
    string fetched_at = 3;      // ISO 8601 UTC；空＝尚未抓回
    string fetch_attempts = 4;  // 整數字串
    bool available = 5;         // fetched_at 非空且 object_key 非空
}

// 狀態歷程一筆（shipment_status_logs）。W6-4 的 timeline／callback／raw provider data 三格。
//
// 🔴 **Admin 專屬**：raw_payload 是 provider 原封不動的回呼內容，可能含收件人資訊。
message UberDeliveryTimelineEntry {
    string from_status = 1;      // ShippingStatus value；首筆可能為空
    string to_status = 2;        // ShippingStatus value
    string provider_status = 3;  // 當下的 provider 原生值
    string provider_message = 4;
    // 這一步是誰推動的：SYSTEM／ADMIN／SELLER／BUYER／PROVIDER。
    // 🔴 callback（provider 回呼）與我方主動回查在這一格分得出來——W6-4 要求 callback 可查。
    string actor_type = 5;
    string trigger_source = 6;   // 觸發來源字串（webhook／排程／端點名）
    string correlation_id = 7;
    string raw_payload = 8;      // provider 原始 payload（JSON 字串）
    string occurred_at = 9;      // ISO 8601 UTC
}

// ---- 賣家面：列表 ----

message ListSellerUberDeliveriesRequest {
    // 🔴 Gateway 的 sellerid resolver 由 JWT account_id 解析後注入（§4.1 例外 1）。
    //    **服務端以本欄強制過濾歸屬**，呼叫端無法藉任何 query 參數指定別人的 store_id。
    int64 store_id = 1;
    string page = 2;                   // 整數字串，預設 "1"
    string page_size = 3;              // 整數字串，預設 "20"，最大 "100"
    string status = 4;                 // ShippingStatus value，可多值逗號分隔
    string provider_status = 5;        // Uber 原生值 exact match
    string order_no = 6;
    string is_return = 7;              // "" / "true" / "false"
    string outcome = 8;                // UberDeliveryOutcome exact match
    string created_from = 9;           // ISO 8601 UTC
    string created_to = 10;
    string sort = 11;                  // updated_at_desc / updated_at_asc / created_at_desc / created_at_asc
}

message ListSellerUberDeliveriesResponse {
    int32 code = 1;
    string message = 2;
    ListSellerUberDeliveriesData data = 3;
}

message ListSellerUberDeliveriesData {
    repeated UberDeliverySummary records = 1;
    string total = 2;                  // 整數字串
    string page = 3;
    string page_size = 4;
}

// ---- 賣家面：詳情 ----

message GetSellerUberDeliveryRequest {
    int64 store_id = 1;                // 同上：服務端強制，不接受呼叫端指定
    // UberDeliverySummary.delivery_no（provider delivery id 或退回的 shipment_no）
    string delivery_no = 2;
}

message GetSellerUberDeliveryResponse {
    int32 code = 1;
    string message = 2;
    SellerUberDeliveryDetail data = 3;
}

message SellerUberDeliveryDetail {
    UberDeliverySummary summary = 1;
    // 🔴 **只有遮罩後的值**（66 §5.1.5／§8.6）：Uber 給的是可撥打的臨時號碼，
    //    原值只在請求生命週期內透傳、不落庫不落 log ⇒ 這裡沒有明碼可回，也不得新增明碼欄位。
    string courier_phone_masked = 2;
    string courier_location_json = 3;   // 外送員位置快照（JSON 字串，來源 courier_update）
    string related_deliveries_json = 4; // 正向 ↔ 逆向 leg 關聯（JSON 字串，66 N2）
    UberDeliveryQuoteView quote = 5;
    repeated UberPodArtifactView pod_artifacts = 6;
    // 🔴 前端不得自行從 status 推導可做什麼。Gateway 依 viewer 過濾並補 href／method。
    repeated ActionAvailability allowed_actions = 7;
}

// ---- Admin 面：列表 ----

message ListUberDeliveriesForAdminRequest {
    int64 account_id = 1;              // Gateway JWT 注入（Admin 身份）
    string page = 2;
    string page_size = 3;
    string order_no = 4;               // W6-4 ①「order」
    string shipment_no = 5;            // W6-4 ②「shipment」
    string store_id = 6;               // W6-4 ③「seller」（store 代理鍵）
    string delivery_id = 7;            // W6-4 ④「provider delivery id」
    string status = 8;                 // W6-4 ⑤「normalized status」，可多值逗號分隔
    string provider_status = 9;        // W6-4 ⑥「raw provider status」exact match
    // W6-4 ⑦「failure」：outcome 非空 OR provider_error_code 非空。
    // ⚠️ 判準**不是** provider_status 有值——那欄保存的是正常軌跡（同 V12 對 shipments 的修正）。
    bool failure_only = 10;
    // W6-4 ⑧「unknown」：建單結果未知（ShippingStatus.CREATE_UNKNOWN "991"）。
    // 🔴 它**不是** failure 的子集：991 的語意是「可能已經建成功了」，處置是回查不是重建（66 陷阱 A8）。
    bool unknown_only = 11;
    string outcome = 12;               // UberDeliveryOutcome exact match
    string created_from = 13;          // W6-4 ⑨「date」
    string created_to = 14;
    string sort = 15;
}

message ListUberDeliveriesForAdminResponse {
    int32 code = 1;
    string message = 2;
    ListUberDeliveriesForAdminData data = 3;
}

message ListUberDeliveriesForAdminData {
    repeated UberDeliverySummary records = 1;
    string total = 2;
    string page = 3;
    string page_size = 4;
}

// ---- Admin 面：詳情 ----

message GetUberDeliveryForAdminRequest {
    int64 account_id = 1;
    string delivery_no = 2;
}

message GetUberDeliveryForAdminResponse {
    int32 code = 1;
    string message = 2;
    AdminUberDeliveryDetail data = 3;
}

message AdminUberDeliveryDetail {
    UberDeliverySummary summary = 1;
    string buyer_id = 2;                // 買家 buyer 代理鍵（不是 account_id）
    string courier_phone_masked = 3;    // 🔴 同賣家面：只有遮罩值，沒有明碼欄位
    string courier_location_json = 4;
    string related_deliveries_json = 5;
    UberDeliveryQuoteView quote = 6;
    repeated UberPodArtifactView pod_artifacts = 7;
    repeated ActionAvailability allowed_actions = 8;
    // 🔴 Admin 專屬：含 provider 原始 payload。timeline 同時承擔 W6-4 的
    //    timeline／create／callback／raw provider data 四格——它們是同一條軌跡的不同切面。
    repeated UberDeliveryTimelineEntry timeline = 9;
    // ⚠️ 收件人資訊刻意**不在本 message**：同一筆的寄收件資料已在
    //    GetShipmentForAdmin（/admin/shipments/{shipment_id}）暴露一次，
    //    重複一份等於把同一組 PII 的收斂點變成兩個。以 summary.shipment_id 交叉連結。
}
