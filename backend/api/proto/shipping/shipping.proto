syntax = "proto3";

package hawkr.shipping;

option go_package = "github.com/Will413028/hawkr/go-pkg/proto/shipping";
option java_multiple_files = true;
option java_package = "io.github.will413028.hawkr.shipping.grpc";
option java_outer_classname = "ShippingProto";

service ShippingService {
    // ==================== 賣家端 — 安排出貨（經 Gateway）====================

    // 超商出貨單列印（觸發 PayUni 列印處理，出貨便代碼由 Webhook 回填）
    rpc PrintCvsLabel(PrintCvsLabelRequest) returns (PrintCvsLabelResponse);

    // 批次超商出貨單列印（觸發 PayUni 列印處理，出貨便代碼由 Webhook 逐筆回填）
    rpc BatchPrintCvsLabel(BatchPrintCvsLabelRequest) returns (BatchPrintCvsLabelResponse);

    // 產宅配編號並下載託運單 PDF（後端呼叫 PayUni → 上傳 OSS → 回傳 CDN URL）
    rpc GenerateHomeLabelPdf(GenerateHomeLabelPdfRequest) returns (GenerateHomeLabelPdfResponse);

    // 批次宅配取號 PDF（fan-out 並行；同步等待全部完成；不接受出貨照片）
    rpc BatchGenerateHomeLabelPdf(BatchGenerateHomeLabelPdfRequest) returns (BatchGenerateHomeLabelPdfResponse);

    // 呼叫黑貓預約取件（背景 API）
    rpc CallTcat(CallTcatRequest) returns (CallTcatResponse);

    // 超商賣家確認出貨（出貨照片選填，推進訂單到配送中）
    rpc ConfirmCvsShipment(ConfirmCvsShipmentRequest) returns (ConfirmCvsShipmentResponse);

    // ==================== 服務間呼叫（不對外暴露）====================

    // 查詢物流單（Order Service 用，聚合訂單詳情）
    rpc GetShipmentByOrderNo(GetShipmentByOrderNoRequest) returns (GetShipmentResponse);

    // 批次查詢物流單（Order Service 賣家列表頁用，避免 N+1）
    rpc GetShipmentsByOrderNos(GetShipmentsByOrderNosRequest) returns (GetShipmentsByOrderNosResponse);

    // 批次查詢 provider 狀態（Order / AfterSales 聚合異常列表用，遵循收斂規範 §6.3）
    rpc BatchGetProviderStatusByOrderIds(BatchGetProviderStatusByOrderIdsRequest) returns (BatchGetProviderStatusByOrderIdsResponse);

    // 主動查詢 PayUni 物流狀態（內部 / 賣家「同步」按鈕，以 shipment_no 為 key、無 ownership；補充 Webhook）
    rpc QueryShipmentStatus(QueryShipmentStatusRequest) returns (GetShipmentResponse);

    // ==================== 買家端 — 物流追蹤（經 Gateway）====================

    // 買家查看訂單物流追蹤（即時同步 PayUni 當前狀態；以 order_no 為 key + buyer ownership）
    rpc GetShipmentTracking(GetShipmentTrackingRequest) returns (GetShipmentResponse);

    // 賣家查看訂單物流追蹤（與買家同構，以 order_no + is_return 為 key + seller ownership）
    rpc GetSellerShipmentTracking(GetSellerShipmentTrackingRequest) returns (GetShipmentResponse);

    // ==================== 建店 API（賣家端，經 Gateway）====================

    // 超商 C2C 建店（首次呼叫提交 PayUni；ACTIVE 狀態再送僅更新本地）
    rpc OnboardCvsShipping(OnboardCvsShippingRequest) returns (OnboardShippingResponse);

    // 宅配建店（首次呼叫提交 PayUni；ACTIVE 狀態再送僅更新本地）
    rpc OnboardHomeDeliveryShipping(OnboardHomeDeliveryRequest) returns (OnboardShippingResponse);

    // 列出賣家建店設定
    rpc ListShippingOnboardings(ListShippingOnboardingsRequest) returns (ListShippingOnboardingsResponse);

    // 查詢單一建店設定
    rpc GetShippingOnboarding(GetShippingOnboardingRequest) returns (GetShippingOnboardingResponse);

    // 切換建店設定啟用/停用（純平台內部，不與 PayUni 溝通）
    rpc ToggleShippingOnboarding(ToggleShippingOnboardingRequest) returns (OnboardShippingResponse);

    // ==================== 賣家配送方式查詢（經 Gateway）====================

    // 查詢賣家可用配送方式（含建店狀態）
    rpc ListSellerShippingMethods(ListSellerShippingMethodsRequest) returns (ListSellerShippingMethodsResponse);

    // ==================== 買家常用門市管理（經 Gateway）====================

    // 新增常用門市
    rpc AddBuyerStorePickup(AddBuyerStorePickupRequest) returns (AddBuyerStorePickupResponse);

    // 修改常用門市
    rpc UpdateBuyerStorePickup(UpdateBuyerStorePickupRequest) returns (UpdateBuyerStorePickupResponse);

    // 取得常用門市列表
    rpc ListBuyerStorePickups(ListBuyerStorePickupsRequest) returns (ListBuyerStorePickupsResponse);

    // 刪除常用門市
    rpc DeleteBuyerStorePickup(DeleteBuyerStorePickupRequest) returns (DeleteBuyerStorePickupResponse);

    // ==================== 超商門市地圖（經 Gateway，買家/賣家共用）====================

    // 取得門市地圖加密參數（前端用此參數開啟 WebView Form POST 到 PayUni）
    rpc GetStoreMapParams(GetStoreMapParamsRequest) returns (GetStoreMapParamsResponse);

    // 以 opaque redirect_id 取回門市中轉表單 canonical 欄位（Gateway GET /store_map/redirect?id= 用，一次性消費，#1394 反射 XSS 修復）
    rpc GetStoreMapRedirectForm(GetStoreMapRedirectFormRequest) returns (GetStoreMapRedirectFormResponse);

    // 解密門市選擇結果（PayUni 前景回調後，Gateway 呼叫此 RPC 解密）
    rpc DecryptStoreMapResult(DecryptStoreMapResultRequest) returns (DecryptStoreMapResultResponse);

    // ==================== 賣家物流設定查詢（服務間呼叫，不對外暴露）====================

    // 查詢賣家物流開通狀態與寄件郵遞區號（供 Order Service / Product Service 使用）
    rpc GetSellerShippingConfig(GetSellerShippingConfigRequest) returns (GetSellerShippingConfigResponse);

    // ==================== 運費計算（服務間呼叫，不對外暴露）====================

    // 取得全部運費配置（供 Order Service 本地快取）
    rpc GetShippingFeeConfigs(GetShippingFeeConfigsRequest) returns (GetShippingFeeConfigsResponse);

    // 查詢單一運費（指定 method × temp × zone × dimensionSum）
    rpc LookupShippingFee(LookupShippingFeeRequest) returns (LookupShippingFeeResponse);

    // 計算可用配送選項與運費（給定包裹尺寸重量，回傳所有可用配送方式）
    rpc CalculateShippingOptions(CalculateShippingOptionsRequest) returns (CalculateShippingOptionsResponse);

    // 驗證商品配送方式合法性（商品建立/更新時，Product Service 呼叫）
    rpc ValidateProductShipping(ValidateProductShippingRequest) returns (ValidateProductShippingResponse);

    // ==================== 假日管理 ====================

    // 匯入假日（Admin，傳入政府 CSV URL）
    rpc ImportHolidays(ImportHolidaysRequest) returns (ImportHolidaysResponse);

    // 匯入假日（Admin，上傳 CSV 檔案內容，顯式年份）
    rpc ImportHolidaysFromContent(ImportHolidaysFromContentRequest) returns (ImportHolidaysResponse);

    // 查詢假日覆蓋現況（Admin，各年度覆蓋狀態）
    rpc GetHolidayCoverage(GetHolidayCoverageRequest) returns (GetHolidayCoverageResponse);

    // 查詢可出貨工作天（App，前台日曆元件用）
    rpc ListBusinessDays(ListBusinessDaysRequest) returns (ListBusinessDaysResponse);

    // 取一段日期區間內的國定假日（服務間，invoice-service 的行事曆鏡像每日同步用）。
    //
    // 與上面三支的差別：ListBusinessDays 回的是「未來 7 個可出貨日」（前台日曆），
    // GetHolidayCoverage 回的是「各年度覆蓋狀態」（ADM 儀表），兩者都給不出
    // 「[from, to] 這段區間裡有哪些假日」——而那正是工作天曆算式唯一需要的東西。
    rpc GetHolidaysInternal(GetHolidaysInternalRequest) returns (GetHolidaysInternalResponse);

    // ==================== 退貨物流（AfterSales Service 呼叫）====================

    // 超商 C2C 退貨（交貨便角色對調：買家=寄件人，賣家=收件人）
    rpc CreateReturnCvsShipment(CreateReturnCvsShipmentRequest) returns (CreateReturnShipmentResponse);

    // 宅配退貨
    rpc CreateReturnHomeShipment(CreateReturnHomeShipmentRequest) returns (CreateReturnShipmentResponse);

    // 查詢賣家退貨設定
    rpc GetSellerReturnConfig(GetSellerReturnConfigRequest) returns (GetSellerReturnConfigResponse);

    // 退貨出貨便列印重試（AfterSales ops retry 用，驗證 is_return=true 後非同步觸發 PayUni print_label）
    rpc RetryReturnPrintLabel(RetryReturnPrintLabelRequest) returns (RetryReturnPrintLabelResponse);

    // ==================== 開發工具（Webhook 模擬器用）====================

    // 依訂單編號查詢 ShipTradeNo（區分正向/退貨）
    rpc LookupShipTradeNo(LookupShipTradeNoRequest) returns (LookupShipTradeNoResponse);

    // ==================== Admin 異常查詢 API（§29 Admin 異常訂單管理）====================

    // 列物流異常（含正向+退貨）。abnormal_only=true 的判準 = 平台失敗態 OR provider_error_code 非空。
    // 🔴 判準**不是** provider_status——那欄保存的是物流商原始貨態（含正常軌跡與尚未 mapping 的
    // 未知值），以「有值」判異常會把每張正常單撈進來（V12 拆欄修正）。
    rpc ListShipmentsForAdmin(ListShipmentsForAdminRequest) returns (ListShipmentsForAdminResponse);

    // 取單一物流單詳情（Admin 對帳用，含完整 provider_* 與寄收件資訊）
    rpc GetShipmentForAdmin(GetShipmentForAdminRequest) returns (GetShipmentForAdminResponse);

    // 列建店異常（預設 onboarding_status=REJECTED；可 filter shipping_type / provider_status）
    rpc ListSellerShipmentSettingsForAdmin(ListSellerShipmentSettingsForAdminRequest) returns (ListSellerShipmentSettingsForAdminResponse);

    // ==================== §5.21 配送異常賣家通知 ====================

    // 列賣家配送異常 dashboard（直接查 shipments 表 LEFT JOIN ack 表，無第二份狀態）
    rpc ListSellerShipmentAnomalies(ListSellerShipmentAnomaliesRequest) returns (ListSellerShipmentAnomaliesResponse);

    // 賣家配送異常統計（依 anomaly_type / severity 分組計數）
    rpc GetSellerShipmentAnomalyStats(GetSellerShipmentAnomalyStatsRequest) returns (GetSellerShipmentAnomalyStatsResponse);

    // 賣家標記異常為「已處理」（upsert shipment_anomaly_acknowledgments）
    rpc AcknowledgeShipmentAnomaly(AcknowledgeShipmentAnomalyRequest) returns (AcknowledgeShipmentAnomalyResponse);

    // 賣家標記異常為「已忽略」
    rpc IgnoreShipmentAnomaly(IgnoreShipmentAnomalyRequest) returns (IgnoreShipmentAnomalyResponse);

    // Admin 平台級配送異常監控
    rpc ListShipmentAnomaliesForAdmin(ListShipmentAnomaliesForAdminRequest) returns (ListShipmentAnomaliesForAdminResponse);

    // Admin 標記異常為「已處理」（issue #1327；actor_type='ADMIN'，與賣家 ack 互不覆蓋）
    rpc AcknowledgeShipmentAnomalyForAdmin(AcknowledgeShipmentAnomalyForAdminRequest) returns (AcknowledgeShipmentAnomalyResponse);

    // Admin 標記異常為「已忽略」（issue #1327）
    rpc IgnoreShipmentAnomalyForAdmin(IgnoreShipmentAnomalyForAdminRequest) returns (IgnoreShipmentAnomalyResponse);

    // ==================== Uber 即時報價（66 §6.2；Stage 8B W2-2）====================
    //
    // 🔴 為什麼不是擴充 CalculateShippingOptions：那支是「靜態費率表查詢」——
    //    它的 request 連收件地址都不收（只有長寬高重＋store_id），回應也沒有報價 id
    //    與有效期。Uber 是即時報價：有 quote_id、有 TTL、會過期、要重報。
    //    把兩種語意塞進同一支，呼叫端會拿到一個「有時候有 expires_at」的回應，
    //    而那種形狀沒有人擋得住誤用。
    //
    // 呼叫方向：order-service → shipping-service（既有通道，不新增跨服務邊）。

    // 取得（或沿用）一筆 Uber 報價。冪等：同一車在 TTL 內重複呼叫回同一個 quote_id。
    rpc GetUberQuoteForCheckout(GetUberQuoteForCheckoutRequest) returns (GetUberQuoteForCheckoutResponse);

    // confirm（capture 前）重驗 TTL 與購物車一致性；capture 後把報價標成已確認。
    rpc ValidateUberQuoteForCheckout(ValidateUberQuoteForCheckoutRequest) returns (ValidateUberQuoteForCheckoutResponse);

    // ==================== Uber 配送查詢（66；Stage 8B W6-3 賣家面／W6-4 Admin 面）====================
    //
    // 🔴 為什麼是四支獨立 RPC 而不是兩支帶 is_admin 旗標：§5.1 角色分離——
    //    以特殊值或 boolean 分流角色，會讓「賣家能看到什麼」與「Admin 能看到什麼」
    //    共用同一條程式路徑，而那兩件事的差別（store_id 強制過濾、raw payload、timeline）
    //    正是最需要被型別分開的部分。
    //
    // 🔴 為什麼不擴充 ListShipmentsForAdmin：那支的 message 沒有 quote／courier／POD／
    //    provider raw status 這幾組欄位，而它們在其他物流商身上不存在。借用它的形狀
    //    會讓兩邊的欄位集合互相污染（見 gateway constants.go 的同一段說明）。

    // 賣家列自己的 Uber 配送。🔴 歸屬由服務端以 store_id 強制，不接受呼叫端指定。
    rpc ListSellerUberDeliveries(ListSellerUberDeliveriesRequest) returns (ListSellerUberDeliveriesResponse);

    // 賣家看單筆 Uber 配送詳情（含 quote／POD／allowed_actions）。
    rpc GetSellerUberDelivery(GetSellerUberDeliveryRequest) returns (GetSellerUberDeliveryResponse);

    // Admin 列平台全部 Uber 配送（W6-4 Delivery List 的九個篩選維度）。
    rpc ListUberDeliveriesForAdmin(ListUberDeliveriesForAdminRequest) returns (ListUberDeliveriesForAdminResponse);

    // Admin 看單筆 Uber 配送詳情（再加 timeline 與 provider raw payload）。
    rpc GetUberDeliveryForAdmin(GetUberDeliveryForAdminRequest) returns (GetUberDeliveryForAdminResponse);
}

// ==================== 超商出貨單列印（後端處理）====================

message PrintCvsLabelRequest {
    int64 store_id = 1;             // Gateway JWT 注入（E.5.5 例外）
    string order_no = 2;            // 訂單編號
    string ship_date = 3;           // 出貨日期 YYYYMMDD
}

message PrintCvsLabelResponse {
    int32 code = 1;
    string message = 2;
    CvsLabelData data = 3;
}

message CvsLabelData {
    string shipment_no = 1;        // 內部物流單號
    string partner_id = 2;         // 出貨便母代碼（3 碼，55 秒內 Webhook 回填；超時為空）
    string odno = 3;               // 出貨單編號（8 碼，55 秒內 Webhook 回填；超時為空）
    string validation_no = 4;      // C2C 驗證碼（4 碼，55 秒內 Webhook 回填；超時為空）
    bool webhook_received = 5;     // 是否在等待期內收到 Webhook（true=已收到代碼, false=超時）
}

// ==================== 批次超商出貨單列印 ====================

message BatchPrintCvsLabelRequest {
    int64 store_id = 1;             // Gateway JWT 注入（E.5.5 例外）
    repeated string order_nos = 2;  // 訂單編號列表（最多 50 筆）
    string ship_date = 3;           // 出貨日期 YYYYMMDD
}

message BatchPrintCvsLabelResponse {
    int32 code = 1;
    string message = 2;
    BatchCvsLabelData data = 3;
}

message BatchCvsLabelData {
    string total_count = 1;                     // 總筆數
    string success_count = 2;                   // 成功筆數
    repeated BatchCvsLabelResult results = 3;   // 每筆結果
}

message BatchCvsLabelResult {
    string order_no = 1;            // 訂單編號
    string shipment_no = 2;        // 內部物流單號（成功時才有）
    bool success = 3;               // 該筆是否成功
    string message = 4;             // 失敗原因（成功時為空）
}

// ==================== 宅配取號 PDF ====================

message GenerateHomeLabelPdfRequest {
    int64 store_id = 1;             // Gateway JWT 注入（E.5.5 例外）
    string order_no = 2;            // 訂單編號
    string ship_date = 3;           // 出貨日期 YYYYMMDD（需 > 今日，非週日/國定假日）
    string delivery_date = 4;       // 配達日期 YYYYMMDD（需 > ship_date）
    repeated string staged_tokens = 5; // 出貨照片 stageToken（選填）
}

message GenerateHomeLabelPdfResponse {
    int32 code = 1;
    string message = 2;
    HomeLabelData data = 3;
}

message HomeLabelData {
    string label_key = 1;           // 託運單 PDF objectKey（49 §6.6：Gateway 組 labelUrl）
    string shipment_no = 2;        // 內部物流單號
}

// ==================== 批次宅配取號 PDF ====================

message BatchGenerateHomeLabelPdfRequest {
    int64 store_id = 1;                                // Gateway JWT 注入（E.5.5 例外）
    repeated BatchHomeLabelItem items = 2;             // 待處理項目（單次上限由 SHIPPING_BATCH_MAX_SIZE 控制）
}

message BatchHomeLabelItem {
    string order_no = 1;            // 訂單編號
    string ship_date = 2;           // 出貨日期 YYYYMMDD（每筆獨立）
    string delivery_date = 3;       // 配達日期 YYYYMMDD（選填，未填=shipDate+1工作天）
}

message BatchGenerateHomeLabelPdfResponse {
    int32 code = 1;
    string message = 2;
    BatchHomeLabelData data = 3;
}

message BatchHomeLabelData {
    string total_count = 1;                              // 總筆數
    string success_count = 2;                            // 成功筆數
    repeated BatchHomeLabelResult results = 3;           // 每筆結果（順序與 request items 相同）
}

message BatchHomeLabelResult {
    string order_no = 1;            // 訂單編號
    string shipment_no = 2;        // 內部物流單號（成功時才有）
    string label_key = 3;           // 託運單 PDF objectKey（49 §6.6：成功時才有）
    bool success = 4;               // 該筆是否成功
    string message = 5;             // 失敗原因（成功時為空）
}

// ==================== 呼叫黑貓 ====================

message CallTcatRequest {
    int64 store_id = 1;             // Gateway JWT 注入（E.5.5 例外）
    string order_no = 2;            // 訂單編號
    string is_contact = 3;          // 是否需要事先電聯 Y/N（選填，預設 Y）
    string is_trolley = 4;          // 是否需要推車 Y/N（選填，預設 N）
    string memo = 5;                // 給宅配人員備註（選填，最長 100 位），存入 DB 再傳 PayUni
}

message CallTcatResponse {
    int32 code = 1;
    string message = 2;
    CallTcatData data = 3;
}

message CallTcatData {
    string call_time = 1;           // 呼叫時間（ISO 8601）
    string shipment_no = 2;        // 內部物流單號
}

// ==================== 查詢物流單 ====================

message GetShipmentByOrderNoRequest {
    string order_no = 1;
}

message GetShipmentsByOrderNosRequest {
    repeated string order_nos = 1;
}

message GetShipmentsByOrderNosResponse {
    int32 code = 1;
    string message = 2;
    repeated ShipmentDetailView data = 3;
}

// ==================== 批次 provider 狀態聚合（收斂規範 §6.3）====================

message BatchGetProviderStatusByOrderIdsRequest {
    repeated string order_ids = 1;          // 訂單 ID 清單（建議單次 ≤ 100）
    bool is_return = 2;                     // false = 正向物流；true = 退貨物流（is_return=TRUE）
}

message BatchGetProviderStatusByOrderIdsResponse {
    int32 code = 1;
    string message = 2;
    map<string, ProviderStatusEntry> entries = 3;  // key = order_id；找不到對應 shipment 則該 key 省略
}

message ProviderStatusEntry {
    string provider_status = 1;       // PayUni 原始狀態碼
    string provider_message = 2;      // PayUni 原始訊息
}

message GetShipmentResponse {
    int32 code = 1;
    string message = 2;
    ShipmentDetailView data = 3;
}

message ShipmentDetailView {
    string shipment_no = 1;
    string order_no = 2;
    string shipping_method = 3;      // CONVENIENCE_STORE / HOME_DELIVERY / UBER_INSTANT
    string status = 4;               // 內部物流狀態碼（數字字串）
    string provider_status = 5;      // 第三方原始狀態碼（收斂規範 §4.1 SoT）
    string provider_message = 6;     // 第三方狀態說明 / 錯誤訊息（原 provider_status_desc 改名）
    string ship_trade_no = 7;        // PayUni 物流序號
    string recipient_name = 8;
    string recipient_phone = 9;
    string recipient_address = 10;
    // 🔴 store_id(11) 已 reserved：本欄裝的是**超商門市代號**，而同一支 proto 內
    //    AdminShipmentSummary/AdminShipmentDetail 的 store_id 裝的是**賣家 store 代理鍵**
    //    ——同名兩種語意。Admin 那組已於命名債整理時改名成 cvs_store_code，本 message 沒有。
    //    2026-09-10 施工實查：gateway 的 OrderLogisticsResp、賣家追蹤 DTO、order-service 的
    //    ShippingGrpcClient 皆**沒有**讀 GetStoreId() ⇒ 零外露消費者 ⇒ 可直接移除而不需相容窗口。
    //    field number 保留、不重用（重用會讓舊版 client 把門市代號讀成賣家鍵）。
    reserved 11;
    reserved "store_id";
    string store_name = 12;
    string label_key = 13;           // 宅配 PDF objectKey（49 §6.6：Gateway 組 labelUrl；僅宅配使用）
    string status_time = 14;         // 最新狀態更新時間（ISO 8601）
    string created_at = 15;          // 建立時間（ISO 8601）
    string label_print_status = 16;  // 列印狀態機 LabelPrintStatus value（"4101"~"4104"）
    string tcat_call_status = 17;    // 黑貓叫件狀態機 TcatCallStatus value（"4201"~"4204"）
    string partner_id = 18;          // 超商出貨便母代碼（3 碼，Webhook 回填）
    string odno = 19;                // 超商出貨單編號（8 碼，Webhook 回填）
    string validation_no = 20;       // 超商 C2C 驗證碼（4 碼，Webhook 回填）
    repeated string shipment_photo_keys = 21; // 出貨照片 objectKey 陣列（49 §6.6：Gateway 組 shipmentPhotoUrls；選填）
    string status_label = 22;        // 內部物流狀態人類可讀文案（ShippingStatus.label() — CodeMeta SoT，Gateway 純透傳）

    // ── 65 物流履約平台 Shared Foundation ────────────────────────────────
    string cvs_store_code = 23;      // 超商門市代號（取代語意不誠實的 store_id；對應 shipments.cvs_store_code）

    // 領域動作的可用性。🔴 **前端不得自行從 status 推導可做什麼**——這是唯一出口。
    // ⚠️ 本欄**不含** href/method：那兩格是路由知識，由 Gateway（唯一對外入口、持有路由表）補上；
    //    微服務不暴露 HTTP，讓它吐 HTTP 路徑等於把對外路由散進業務層。
    repeated ActionAvailability allowed_actions = 24;
}

// 單一領域動作在「當下這一筆配送單」上的可用性（65 §4.4.1a 的兩層模型下層）。
message ActionAvailability {
    string action = 1;                  // FulfillmentAction 值域（snake_case，27 值）
    bool enabled = 2;                   // 這顆按鈕現在能不能按
    // 🔴 enabled=false 時必填：沒有它前端只能讓按鈕憑空消失，而「不可用要說明原因」是硬要求。
    // 型別是 string 而非 int32：對外數字一律字串（§4 型別規範）。
    string disabled_reason_code = 3;    // §6.7 的業務碼（例 "9522"）
    // 🔴 哪些身分可以執行這個動作：AccountType 值域（"1" 買家／"2" 賣家／"4" 管理員），已排序。
    // 與 href 不同，actor eligibility 是**業務判斷**不是路由知識——「誰有資格做這件事」
    // 由領域決定；Gateway 只做兩件事：viewer 在不在這個集合內（純執行）、據 viewer 選 href（純路由）。
    //
    // 🔴 **是集合不是單值**（field 4 → 5 的原因）：同一動作買賣家都能做、只是端點不同
    // （track／view_only；65 §6.1.1 的 cancel 買家 B-3、賣家 S-4 亦然）是常態不是例外。
    // 單值時 gateway 只能拿它自己的路由表 key 當資格判定（drop 理由字串逐字是
    // actor_mismatch），於是「哪個 action 屬於誰」有了第二份真相，而領域宣告的那份是死的。
    //
    // 少了它，同一份 allowedActions 會原樣出現在買家端與賣家端：QA 實測買家端回三條
    // 掛 seller capability 的 href，買家跟隨即 403，而賣家在該端點拿不到自己的動作。
    // 沿用 AccountType 而非另立 enum：gateway 的 x-account-type 用的就是這一組值。
    reserved 4;
    reserved "actor_account_type";
    repeated string actor_account_types = 5;
}

