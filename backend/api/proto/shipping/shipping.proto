    string return_name = 22;          // 退貨收件人姓名（宅配用）
    string return_phone = 23;         // 退貨收件人電話（宅配用）
    string return_city = 24;          // 退貨城市（宅配用）
    string return_district = 25;      // 退貨地區（宅配用）
    string return_address_detail = 26; // 退貨詳細地址（宅配用）
    string return_postal_code = 27;   // 退貨郵遞區號（宅配用）
    string payuni_submit_status = 28; // 建店送 PayUni 狀態機 PayUniSubmitStatus value（"4301"~"4304"）；前端依 SUCCEEDED 判斷宅配地址 readonly
    string provider_message = 29;     // PayUni 建店回應訊息（失敗時提供錯誤原因，收斂規範 §4.1 SoT）
