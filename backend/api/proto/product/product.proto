    string affected_count = 3;  // 受影響商品筆數
}

// ========== Hashtag（02 設計書 §3.7–§3.9 / §5.12） ==========

// Hashtag 條目（跨 RPC 共用）
message HashtagItem {
    string name = 1;             // canonical 名稱（lower），查詢與比對基準
    string display_name = 2;     // 顯示名稱（保留原大小寫）；auto-complete 場景填空字串
    string product_count = 3;    // 引用數量（hashtag.product_count 即時值，字串型別，docs/開發規範/Java 微服務開發規範.md §2.1；見 33 §5.4）
}

// Hashtag 列表篩選的多值匹配模式
enum HashtagMatchMode {
    HASHTAG_MATCH_ANY = 0;       // 預設：商品至少綁定其一即命中（OR）
    HASHTAG_MATCH_ALL = 1;       // 商品必須綁定全部（AND）
}

// Hashtag auto-complete 搜尋模式
enum HashtagSearchMode {
    HASHTAG_SEARCH_PREFIX = 0;   // 前綴匹配（name LIKE 'prefix%'）
    HASHTAG_SEARCH_CONTAIN = 1;  // 包含匹配（trgm GIN，IG 風格）
}

message SearchHashtagsRequest {
    string prefix = 1;           // 用戶輸入文字（任意大小寫，server normalize 後查詢；空字串回空陣列）
    HashtagSearchMode mode = 2;  // 預設 PREFIX
    int32 limit = 3;             // 預設 10，最大 50（超過視為 50）
}

message SearchHashtagsResponse {
    int32 code = 1;
    string message = 2;
    repeated HashtagItem items = 3;  // 僅含 product_count > 0；display_name 為空字串
}

// ========== Hashtag 熱門查詢（33 §5.2） ==========

message GetPopularHashtagsRequest {
    string start_from = 1;       // 日期字串 YYYY-MM-DD，可空；空時依 33 §5.2.2 規則計算
    string end_to = 2;           // 日期字串 YYYY-MM-DD，可空
    int32 limit = 3;             // 1 ≤ limit ≤ 50；0 或未設視為 50；> 50 視為 50
}

message GetPopularHashtagsResponse {
    int32 code = 1;
    string message = 2;
    repeated PopularHashtagItem records = 3;
}

// Popular hashtag 條目（與 HashtagItem 不同：count 為區間內 distinct ACTIVE 商品數，非全歷史）
message PopularHashtagItem {
    string hashtag = 1;          // 區間內最多 ACTIVE 商品使用的原始大小寫版本（33 §5.2.3）
    string count = 2;            // 區間內掛上此 hashtag 的 distinct ACTIVE 商品數（字串型別，docs/開發規範/Java 微服務開發規範.md §2.1）
}

// ========== 公開產地聚合（02 §5.13） ==========

message GetPublicOriginsSummaryRequest {
    string category_id = 1;  // 分類 ID（可空字串或 "0"=全部；支援第一/二/三層自動偵測，同 §5.3.1）
    int32 limit = 2;         // 上限（預設 50，最大 100；超過視為 100；最少 1）
}

message GetPublicOriginsSummaryResponse {
    int32 code = 1;
    string message = 2;
    repeated OriginSummaryItem records = 3;
}

message OriginSummaryItem {
    string origin = 1;         // 產地字串（如「台灣」「日本」），永不為空（origin IS NULL / '' 不回）
    string product_count = 2;  // 該產地下 ACTIVE 商品數（數字字串，docs/開發規範/Java 微服務開發規範.md §2.1）
}

message GetPublicSellerCitiesSummaryRequest {}

message GetPublicSellerCitiesSummaryResponse {
    int32 code = 1;
    string message = 2;
    repeated SellerCitySummaryItem records = 3; // 固定 22 筆，含零 count 城市
}

message SellerCitySummaryItem {
    string city_code = 1;                    // ISO 3166-2:TW，例如 TW-TPE
    string city_name = 2;                    // 商家註冊所在地 canonical 名稱
    string product_count = 3;                // 該城市 public 商品完整數量
    string seller_count = 4;                 // 該城市 public seller 完整數量
    repeated string preview_store_ids = 5;   // 最多 6 家畫面預覽，不得當完整 filter
}

// ========== 有公開上架商品的店家（02 §5.13c） ==========

message ListStoreIDsWithPublicProductsInternalRequest {}

message ListStoreIDsWithPublicProductsInternalResponse {
    int32 code = 1;
    string message = 2;
    // 至少有一件公開上架商品（未軟刪、賣家未刪、status=4004）的 store_id 全集，
    // 數字字串（同 seller.ListPublicStoresByCity 的 store_ids）。
    // 沒有公開商品的店**不出現**在此列表 —— 呼叫端據此把空店排除，
    // 「查不到」與「回空集合」語意不同：RPC 失敗時呼叫端一律 fail-open 不過濾。
    repeated string store_ids = 3;
}

// ============================================================================
// Product Import 整合（02 §9）
// ============================================================================

// ========== ValidateLeafCategoryInternal（02 §9.1） ==========

message ValidateLeafCategoryInternalRequest {
    string category_id = 1;                  // 葉節點候選 id（數字字串）
}

message ValidateLeafCategoryInternalResponse {
    int32 code = 1;
    string message = 2;
    bool is_valid = 3;
    string cat_l3_id = 4;
    string cat_l3_name = 5;
    string cat_l2_id = 6;
    string cat_l2_name = 7;
    string cat_l1_id = 8;
    string cat_l1_name = 9;
    string invalid_reason = 10;              // NOT_FOUND / NOT_LEAF / DISABLED
}

// ========== CreateProductFromImportInternal（02 §9.2） ==========

// Import 來源的商品圖片（用 import_asset_id 取代 staged_token）
message ProductImageImport {
    string import_asset_id = 1;              // Media import_asset.id (UUID)
    int32 sort_order = 2;
}

// Import 來源的 SKU（重用既有 SKU 結構但無 sku_id）
message ProductSkuImport {
    string sku_name = 1;
    string price = 2;
    string sale_price = 3;
    string stock_qty = 4;
    string weight = 5;
    string unit = 6;
    string length_cm = 7;
    string width_cm = 8;
    string height_cm = 9;
    repeated ShippingMethod shipping_methods = 10;
}

message CreateProductFromImportInternalRequest {
    string idempotency_key = 1;             // 由 Import 端組：import:{itemId}:rev:{revision}
    int64 store_id = 2;                     // 賣家 store 代理鍵（Import Service 上下文已驗證）
    string import_job_id = 3;               // 純記錄，寫入 product 表審計欄位
    string import_item_id = 4;
    string name = 5;
    string category_id = 6;
    ProductDescription description = 7;
    repeated ProductImageImport images = 8;          // 用 import_asset_id 取代 staged_token
    string origin = 9;
    repeated Certification certifications = 10;
    string target_status = 11;              // ACTIVE | DRAFT | PENDING_REVIEW
    repeated ProductSkuImport skus = 12;
