}

message CreateProductFromImportInternalResponse {
    int32 code = 1;
    string message = 2;
    string product_id = 3;                  // 數字字串
    string idempotency_status = 4;          // CREATED | DUPLICATED
}

// ========== BatchCheckSellerProductNames（02 §9.5） ==========

message BatchCheckSellerProductNamesRequest {
    int64 store_id = 1;                     // 賣家 store_id（由呼叫端 product-import-service 解析後傳入，內部 RPC 免身份驗證）
    repeated string names = 2;                // 上限 500，超過拋 INVALID_ARGUMENT
}

message BatchCheckSellerProductNamesResponse {
    int32 code = 1;
    string message = 2;
    repeated ExistingProductByName existing = 3;  // 只回該賣家既有的 product；不存在不出現
}

message ExistingProductByName {
    string name = 1;
    string product_id = 2;                    // 第一筆碰到的 product.id
    string status = 3;                        // 既有商品的 ProductStatus value
}

// ========== ValidateProductDraft（40 號 §4.3a） ==========

message ValidateProductDraftRequest {
    int64 store_id = 1;   // 賣家 store_id（由呼叫端 product-import-service 解析後傳入，內部 RPC 免身份驗證）
    ProductDraft draft = 2;
    // 上下文 hint：不同時機點 validator 對 ASSET_NOT_READY 等規則放寬程度不同
    enum ValidationContext {
        UNSPECIFIED = 0;
        CSV_PARSE = 1;          // §5.2 場景
        IMPORT_UPDATE = 2;      // §5.5 場景
        IMPORT_COMMIT = 3;      // §5.7 場景
        PUBLISH = 4;            // 正常商品上架 / 編輯
    }
    ValidationContext context = 3;
}

message ProductDraft {
    string name = 1;
    string category_id = 2;
    string origin = 3;
    repeated GalleryItem gallery = 4;
    repeated ProductSkuImport skus = 5;        // reuse import sku 結構
    repeated Certification certifications = 6;
    repeated string hashtags = 7;
    bytes description_json = 8;                 // HTML→JSON 後的 blocks
    string target_status = 9;
}

message ValidateProductDraftResponse {
    int32 code = 1;
    string message = 2;
    repeated DraftViolation violations = 3;
    bool has_blocking_error = 4;
}

message DraftViolation {
    string field = 1;                           // 對應 product_import_item_error.field
    string code = 2;                            // 對應 error_type
    string severity = 3;                        // ERROR | WARNING
    string message = 4;                         // 已翻譯中文
    string raw_value = 5;
}

// ========== GetProductsBriefInternal（40 號 §4.3b） ==========

message GetProductsBriefInternalRequest {
    repeated string product_ids = 1;            // 上限 200
    int64 caller_store_id = 2;                  // 審計 log 用（account_id 命名債正名，Phase 2 Task 16 review 補漏——
                                                 // 唯一呼叫端 product-import-service 傳入的一律是 store_id，非登入 account_id；
                                                 // 原設計文件把本欄位歸類進「audit 用途排除」，但排除規則指的是「值本身就是
                                                 // 登入 account_id」的 created_by/caller_account_id 這類欄位，本欄位的值語意
                                                 // 其實跟 owner_store_id 一樣，只是「audit 用途」跟「值是 store_id」兩者不衝突）
}

message GetProductsBriefInternalResponse {
    int32 code = 1;
    string message = 2;
    repeated ProductBriefInternal records = 3;  // 查不到的 id 不出現
}

message ProductBriefInternal {
    string product_id = 1;
    string name = 2;
    string status = 3;                          // ProductStatus enum value（4001~4004，只答「能不能賣」）
    string status_label = 4;                    // 上述 status 的中文標籤
    // ProductPublicationState（4011~4014），與 status 正交：status 答「能不能賣」、
    // 本欄答「曾不曾公開／還在不在」。4014 REMOVED = 已軟刪。
    //
    // 🔴 為什麼不是把 4014 塞進 status（#2819）：ProductStatus 只有 4001~4004，硬塞會讓
    // ProductStatus.isValidValue 判 false ⇒ status_label 變空字串，用新 bug 換舊 bug。
    // 底層查詢因此改用不濾 deleted_at 的版本，軟刪商品**會**出現在結果集。
    string publication_state = 5;
}

// ==========================================================================
// 商品認證申請與審核（19 號設計書 §10.2）
// 型別規範：數字欄位一律 string；唯一例外是 Gateway 注入的身分欄位
// （account_id／resolver 解析後的 store_id，僅出現在 request）與 response 的 int32 code。
// ==========================================================================

message ProductCertificationApplication {
    string id = 1;                          // TSID，字串
    string product_id = 2;
    string store_id = 3;
    string certification_type = 4;          // CertificationType value（3701–3706）
    string certificate_no = 5;
    string status = 6;                      // ProductCertificationStatus
    string source = 7;                      // ProductCertificationSource
    bool requires_manual_review = 8;        // true ⇒ 永不自動核准
    string gov_verify_state = 9;            // ProductCertificationGovVerifyState
    string gov_verified_at = 10;            // ISO 8601 UTC
    string submitted_at = 11;               // ISO 8601 UTC
    string reviewed_at = 12;                // ISO 8601 UTC
    string reviewed_by_account_id = 13;     // 自動核准為空（actor 由 review_event 的 SYSTEM 標示）
    string reason_code = 14;                // ProductCertificationRejectReason
    string public_reason = 15;              // 會展示給賣家
    string version = 16;                    // 樂觀鎖，數字字串

    // ---- 以下 Admin-only：賣家 DTO 不映射（Gateway 側 DTO 隔離，不是靠欄位空值）----
    GovVerifyResult gov_verify_payload = 17;
    string internal_note = 18;
    string submitted_by_account_id = 19;    // LEGACY_MIGRATION 的列為空
    string product_name = 20;
    // 同 type 現行有效那筆；首次申請時不設（proto3 message 未設 ⇒ Gateway DTO 輸出 null，不是空物件）。
    // 刻意用精簡 summary 而非自我遞迴的 ProductCertificationApplication。
    ProductCertificationSummary current_approved = 21;
    // 商品的公開生命週期（ProductPublicationState value：4011/4012/4013/4014）。
    //
    // 🔴 為什麼 ADM 需要這一欄：認證申請**結構上會指向已軟刪的商品**——V18 legacy
    // migration 的 INSERT 不濾 deleted_at，賣家也可以在送件後刪掉自己的商品，而
    // updateCertificationProjection 刻意不濾 deleted_at（ADM 要能對已下架商品撤銷標章）。
    // 只回 product_name 會讓 ADM 看到一個「看起來還在」的商品並可能核准它；本欄讓
    // 審核者看得出這筆申請的商品是不是已經不在平台上。
    //
    // 值一律由 ProductPublicationPolicy.deriveState 產生，不得在 SQL 或 mapper 內另寫
    // 「deleted_at != null || seller_deleted_at != null」——那是同一條規則的第二份定義
    // （該規則的 SSOT 是 ProductPublicationState，CodeMeta 生成）。
    string product_publication_state = 22;
}

message ProductCertificationSummary {
    string id = 1;
    string certification_type = 2;
    string certificate_no = 3;
    string status = 4;                      // 恆為 APPROVED（本欄只回現行有效那筆）
    string gov_verify_state = 5;
    string reviewed_at = 6;                 // ISO 8601 UTC
}

message GovVerifyResult {
    string cert_type = 1;
    string cert_no = 2;
    string queried_at = 3;                  // ISO 8601 UTC
    bool found = 4;
    string validity = 5;                    // VALID / EXPIRED / TERMINATED / SUSPENDED / NOT_FOUND / UNKNOWN
    string status_raw = 6;                  // 3701 才有
    string expires_on = 7;                  // 3703 沒有
    string holder_name = 8;
    string holder_address = 9;
    string issuer_name = 10;
    string product_summary = 11;
    string matched_count = 12;              // 數字字串
    string raw_excerpt_json = 13;           // 已修剪的 JSON 字串（§8.4 防線 3）
}

message ProductCertificationReviewEvent {
    string id = 1;
    string application_id = 2;
    string action = 3;                      // ProductCertificationReviewAction
    string from_status = 4;                 // 建立時為空
    string to_status = 5;
    string actor_role = 6;                  // SYSTEM / SELLER / ADMIN
    string actor_account_id = 7;            // SYSTEM 時為空
    string certification_type = 8;          // 快照
    string certificate_no = 9;              // 快照
    string reason_code = 10;
    string public_reason = 11;
    string internal_note = 12;              // Admin-only
    string application_version = 13;        // 事件當下的 application version
    string trace_id = 14;
    string created_at = 15;                 // ISO 8601 UTC
}

// ---------- 賣家 ----------

message SubmitProductCertificationRequest {
    string product_id = 1;
    string certification_type = 2;          // CertificationType value，字串
    string certificate_no = 3;              // 只 trim，保留前導 0，不轉數字
    string idempotency_key = 4;
    int64 account_id = 5;                   // Gateway 注入的 principal（§10.3 例外）
    int64 store_id = 6;                     // sellerid resolver 解析後的 store surrogate（同上）
}

message ListProductCertificationApplicationsRequest {
    string product_id = 1;
    string status = 2;                      // 選填；空字串 = 不篩
    string page = 3;                        // 數字字串
    string page_size = 4;                   // 數字字串
    int64 account_id = 5;
    int64 store_id = 6;
}

message ListProductCertificationApplicationsResponse {
    int32 code = 1;
    string message = 2;
    repeated ProductCertificationApplication records = 3;
    string total = 4;                       // 數字字串（envelope.Page 三欄皆 string，直接透傳）
    string page = 5;                        // 數字字串
    string page_size = 6;                   // 數字字串
}

message WithdrawProductCertificationRequest {
    string product_id = 1;
    string application_id = 2;
    string expected_version = 3;            // 數字字串
    string idempotency_key = 4;
    int64 account_id = 5;
    int64 store_id = 6;
}

message ProductCertificationApplicationResponse {
    int32 code = 1;
    string message = 2;
    ProductCertificationApplication data = 3;   // 賣家版：不映射 gov_verify_payload / internal_note
}

// ---------- Admin ----------

message GetProductCertificationApplicationForAdminRequest {
    string application_id = 1;
    int64 account_id = 2;                   // Gateway 注入的 principal
}

message ListProductCertificationApplicationsForAdminRequest {
    string status = 1;
    string certification_type = 2;
    string store_id = 3;                    // 數字字串（前端可控 ⇒ 不套 §10.3 例外）
    string keyword = 4;                     // 商品名或證號
    string submitted_from = 5;              // ISO 8601 UTC
    string submitted_to = 6;                // ISO 8601 UTC
    string page = 7;                        // 數字字串
    string page_size = 8;                   // 數字字串
    int64 account_id = 9;                   // Gateway 注入的 principal
}

message ListProductCertificationApplicationsForAdminResponse {
    int32 code = 1;
    string message = 2;
    repeated ProductCertificationApplication records = 3;
    string total = 4;                       // 數字字串
    string page = 5;                        // 數字字串
    string page_size = 6;                   // 數字字串
}

message ListProductCertificationAuditLogsForAdminRequest {
    string application_id = 1;
    string page = 2;                        // 數字字串
    string page_size = 3;                   // 數字字串
    int64 account_id = 4;                   // Gateway 注入的 principal
}

message ListProductCertificationAuditLogsForAdminResponse {
    int32 code = 1;
    string message = 2;
    repeated ProductCertificationReviewEvent records = 3;
    string total = 4;                       // 數字字串
    string page = 5;                        // 數字字串
    string page_size = 6;                   // 數字字串
}

message ProductCertificationApplicationAdminResponse {
    int32 code = 1;
    string message = 2;
    ProductCertificationApplication data = 3;   // Admin 版才映射 gov_verify_payload / internal_note / current_approved
}

// approve / reject / revoke 共用（動作由 RPC 名稱區分，不用 flag 分流）
message ReviewProductCertificationForAdminRequest {
    string application_id = 1;
    string idempotency_key = 2;
    string expected_version = 3;            // 數字字串
    string reason_code = 4;                 // reject / revoke 必填（缺 → 3028）
    string public_reason = 5;
    string internal_note = 6;               // Admin-only，不得出現在任何賣家／公開 DTO
    int64 account_id = 7;                   // Gateway 注入的 principal（§10.3 例外）
}

// 只重新查驗，不改 status ⇒ 不需要 expected_version
message ReverifyProductCertificationForAdminRequest {
    string application_id = 1;
    string idempotency_key = 2;             // 避免連點兩次打兩次政府 API
    int64 account_id = 3;                   // Gateway 注入的 principal
}

// ---------- 共用 ----------

// 認證未被採用的提示（每筆對應一個被剔除或被跳過的認證輸入，19 號 §6.3.1／§9.5）
message CertificationWarning {
    string certification_type = 1;          // 原樣回送賣家送來的值（可能非法，前端不得假設是合法碼）
    string certificate_no = 2;              // 同上
    string reason = 3;                      // INVALID_TYPE / INVALID_CERT_NO / CONCURRENT_CONFLICT
    string message = 4;                     // 可直接顯示的中文說明
}
