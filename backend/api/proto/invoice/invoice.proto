                                      //   APPROVE_INVOICE_REQUIRED/APPROVE_INVOICE_EXEMPT/REQUEST_SUPPLEMENT/
                                      //   KEEP_UNDER_REVIEW/REJECT/REVOKE/REOPEN_REVIEW
    string reason = 4;                // 每個決策必填（B4：以強制填理由＋二次確認＋完整稽核取代細粒度 capability）
    string approval_valid_until = 5;  // 僅 APPROVE_*
    bool confirmed = 6;               // 僅 APPROVE_INVOICE_EXEMPT 必須 true
    string expected_version = 7;
    string idempotency_key = 8;
    // §6.1.9：核定免用統一發票時**由 ADM 指名**收據代製授權的核定依據文件。
    //
    // 🔴 必須是該賣家自己在 S02 上傳的稅籍文件之一（不另外上傳）：media 的授權述詞
