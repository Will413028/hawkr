message ManualUnlockInfo {
    string unlock_id = 1;
    string status = 2;                       // AWAITING_SECOND_APPROVAL/APPROVED/REJECTED/EXPIRED
    string requested_by_account_id = 3;      // Response 內為 string
    string approved_by_account_id = 4;
    string provider_check_evidence = 5;
    string provider_checked_at = 6;          // ISO 8601 UTC
    string requested_at = 7;
    string expires_at = 8;                   // 發起後 24 小時
    // 覆核者（第二人）要看得到發起者附的證據種類與檔案，否則他是在對一個
    // 看不見證據的請求按同意 —— 而 §6.4 的四樣紀律裡「證據」正是其中一樣（#3089 A 組第 2 項）。
    string cancel_evidence_kind = 9;
    string cancel_evidence_object_key = 10;
}
message RequestManualUnlockForAdminRequest {
    int64 actor_account_id = 1;
    string job_id = 2;
    string provider_check_evidence = 3;   // 1–1000 字：向光貿查證的方式與結果
    string provider_checked_at = 4;
    string reason = 5;
    string expected_version = 6;
    string idempotency_key = 7;
    // 以下兩欄服務 J28（CANCEL_BLOCKED_UNKNOWN → CANCELLED_BY_ADMIN，#3089 A 組第 2 項）。
    //
    // 🔴 J28 在此之前**沒有任何輸入通道**：ConfirmInvoiceOperationCancel 的 SQL 與
    // sqlc 生成物都在，但 cancel_evidence_kind 是 arg（必填）而 proto 沒有這個欄位
    // ⇒ 那條邊零呼叫端 ⇒ CANCEL_BLOCKED_UNKNOWN 與 PROVIDER_STATUS_RECHECK
    // 之間無限循環，而 §7.5.6 逐字寫著它「**永不自動終結**，唯一出邊是 J28」。
    //
    // 值域＝CodeMeta InvoiceCancelEvidenceKind 的四值中**需人判讀**的那兩個
    // （MOF_PLATFORM_SCREENSHOT／AMEGO_RECONCILE_FILE）——另外兩值是 provider
    // 自動採信（J24 用），不走雙人確認。
    // 由 status=CANCEL_BLOCKED_UNKNOWN 的請求必填；CANCELLED_BY_ADMIN 那條路徑不需要
    // （它的取消已經在 J21→J24 完成過查證）。
    string cancel_evidence_kind = 8;
    // 截圖／對帳檔的 media objectKey（§25：只存 key 不存 URL）。選填。
    // chk_invop_evidence_object_key 只允許它配 MOF_PLATFORM_SCREENSHOT／AMEGO_RECONCILE_FILE。
    string cancel_evidence_object_key = 9;
    // ADM 上傳證據檔後拿到的 staged token（#3108）。與 object_key 二擇一：
    // 前端有檔案就送 token（後端換發成 objectKey），只有 key 就直接送 key。
    // 兩個都送 ⇒ 400（無法判斷哪個才是這次要存的）。
    string cancel_evidence_staged_token = 10;
}
message ApproveManualUnlockForAdminRequest {
    int64 actor_account_id = 1;   // 必須 ≠ requested_by_account_id，否則回 9345
    string job_id = 2;
    string unlock_id = 3;
    bool approved = 4;
    string reason = 5;
    string expected_version = 6;  // 本 RPC 會把 job.status 推進 MANUAL_PROCESS_ALLOWED ⇒ §6.1.0 (10) 強制帶版本；不符回 9343
    string idempotency_key = 7;
}
message ManualUnlockResponse {
    int32 code = 1;
    string message = 2;
    ManualUnlockInfo data = 3;
}
// 端點 56：ADM 代錄賣家自行開立的結果。與 ReportExternalIssuance（端點 62）是**同一件事的兩個入口**，
//   守衛（MANUAL_PROCESS_ALLOWED）、目標狀態（RESOLVED_EXTERNALLY）、寫入欄位（external_invoice_no）完全相同，
//   只差 actor 與稽核欄 ⇒ invoice-service 內必須共用同一段 domain 邏輯（見 §6.1.10 端點 62 末的 ）。
message ReportManualResultForAdminRequest {
    int64 actor_account_id = 1;
    string job_id = 2;
    string invoice_no = 3;      // 賣家自行開立的發票號碼，^[A-Z]{2}[0-9]{8}$（10 碼）
    string invoice_date = 4;    // YYYY-MM-DD（UTC+8）
    string total_amount = 5;    // 元
    string note = 6;
    string expected_version = 7;
    string idempotency_key = 8;
}

message IssuanceIssuer {
    string kind = 1;      // SELLER/PLATFORM
    string store_id = 2;  // kind=SELLER 時必填
}
message IssuanceRecipient {
    string kind = 1;           // BUYER/SELLER/EXTERNAL
    string buyer_id = 2;       // kind=BUYER 時必填（Request 內仍用 string：此值由 ADM 手填，非 Gateway 注入）
    string store_id = 3;       // kind=SELLER 時必填
    string name = 4;           // kind=EXTERNAL：以下四欄接受手填（含非會員）
    string tax_id = 5;
    string email = 6;
    string carrier_type = 7;   // InvoiceCarrierType 載具子集：MOBILE_BARCODE/CITIZEN_CERT/DONATION，留空 ＝ 無載具（不是 AMEGO 字面值）
    string carrier_value = 8;
}
message IssuanceSource {
    string kind = 1;                 // ORDER_SNAPSHOT/MANUAL_LINES
    string order_no = 2;             // kind=ORDER_SNAPSHOT 時必填
    repeated InvoiceLine lines = 3;  // kind=MANUAL_LINES 時必填，1–50 行
}
message CreateManualIssuanceForAdminRequest {
    int64 actor_account_id = 1;
    IssuanceIssuer issuer = 2;
    IssuanceRecipient recipient = 3;
    IssuanceSource source = 4;
    string document_kind = 5;   // B2C/B2B/RECEIPT
    string reason = 6;
    bool confirmed = 7;         // 必須 true（高風險二次確認）
    string idempotency_key = 8;
}
message CreateManualIssuanceForAdminData {
    string job_id = 1;
    string document_id = 2;
    string status = 3;
    string audit_log_id = 4;
}
message CreateManualIssuanceForAdminResponse {
    int32 code = 1;
    string message = 2;
    CreateManualIssuanceForAdminData data = 3;
}

message ListInvoiceComplaintsForAdminRequest {
    int64 actor_account_id = 1;
    string tab = 2;   // 視圖名不是狀態值：AWAITING_SELLER/SELLER_RESPONDED/ADM_REVIEW/OVERDUE/CLOSED（述詞見 §6.1.16 端點 58 對照表）
    string store_id = 3;
    string page = 4;
    string page_size = 5;
    // §6.1 端點 58 的另外兩個 query。缺了它們，「依訂單反查申訴」與「逾期案件排序」
    // 兩件 A07 的核心操作都做不出來。
    string order_no = 6;
    string sort = 7;      // 空字串＝服務端預設排序
}
message GetInvoiceComplaintForAdminRequest {
    int64 actor_account_id = 1;
    string complaint_id = 2;
}
message ActOnInvoiceComplaintForAdminRequest {
    int64 actor_account_id = 1;
    string complaint_id = 2;
    string action = 3;    // REMIND_SELLER/REQUEST_REWORK/DECIDE_RESOLVED/DECIDE_VIOLATION/RECOMMEND_SUSPENSION
    string reason = 4;
    bool confirmed = 5;   // RECOMMEND_SUSPENSION 必須 true
    string expected_version = 6;
    string idempotency_key = 7;
}
message SuspensionRecommendation {
    bool should_suspend = 1;
    string store_id = 2;
    string violation_count_in_90_days = 3;   // 只計 DECIDE_VIOLATION，以去重後的訂單數計
    bool threshold_reached = 4;              // 90 天內 3 次（C1）
    string suggested_suspend_days = 5;       // 建議 "14"（C2）
    string suggested_reason = 6;
    // 7 原為治理端點的路徑字串（值是舊 gateway 的 POST /admin/violations）。該路由已隨措施模型刪除，
    // 也沒有任何 client 讀它 ⇒ 移除；保留欄號與名稱防重用。發票模組不寫停權狀態：建議只是建議，
    // 措施由賣家治理模組的 CreateMeasure 建立。
    reserved 7;
    reserved "governance_endpoint";
}
message ActOnInvoiceComplaintForAdminData {
    string complaint_id = 1;
    string status = 2;
    string version = 3;
    SuspensionRecommendation recommendation = 4;
    string audit_log_id = 5;
}
message ActOnInvoiceComplaintForAdminResponse {
    int32 code = 1;
    string message = 2;
    ActOnInvoiceComplaintForAdminData data = 3;
}

message InvoiceAuditLogItem {
    string audit_log_id = 1;
    string occurred_at = 2;          // ISO 8601 UTC
    string actor_account_id = 3;     // Response 內為 string
    string actor_display_name = 4;
    string operation_type = 5;
    string target_kind = 6;          // TAX_PROFILE/PROVIDER_ACCOUNT/JOB/DOCUMENT/COMPLAINT
    string target_id = 7;
    string before_json = 8;          // 已遮罩（寫入時完成，非查詢時）
    string after_json = 9;
    string reason = 10;
    string request_id = 11;
    string terms_version = 12;
    string result = 13;              // SUCCESS/FAILED
}
message ListInvoiceAuditLogsForAdminRequest {
    int64 actor_account_id = 1;
    string target_actor_account_id = 2;
    string store_id = 3;
    string order_no = 4;
    string document_id = 5;
    string job_id = 6;
    string operation_type = 7;
    string date_from = 8;
    string date_to = 9;
    string page = 10;
    string page_size = 11;
}
message ListInvoiceAuditLogsForAdminData {
    repeated InvoiceAuditLogItem records = 1;
    string total = 2;
    string page = 3;
    string page_size = 4;
}
message ListInvoiceAuditLogsForAdminResponse {
    int32 code = 1;
    string message = 2;
    ListInvoiceAuditLogsForAdminData data = 3;
}

// ==================== 內部服務間 message ====================

// ResolveOrderInvoiceModeInternal — order-service 在 checkout preview 呼叫。
// 這支決定 B01 能不能讓買家付款：回不出可判定的 invoice_mode ⇒ 前端進 invalid 狀態並阻擋付款。
message ResolveOrderInvoiceModeInternalRequest {
    string store_id = 1;           // 純服務間欄位仍走 string（本檔不使用 §4 例外③）
    string buyer_id = 2;
    string product_amount = 3;     // 元
    string shipping_amount = 4;
    string discount_amount = 5;
    string checkout_id = 6;
}
message ResolveOrderInvoiceModeInternalData {
    string invoice_mode = 1;                 // InvoiceFulfillmentMode
    string snapshot_version = 2;
    string preview_expires_at = 3;           // ISO 8601 UTC；由後端給，前端不得自算 TTL
    InvoiceAmountBreakdown amount = 4;
    InvoiceDisclosure disclosure = 5;
    InvoiceProfileInfo default_profile = 6;  // 可為空 message（買家無 profile 且無手機無 email）
    SellerIntakeLimit intake_limit = 7;      // blocked=true 時 preview 仍回 code 0，阻擋在 confirm
}
message ResolveOrderInvoiceModeInternalResponse {
    int32 code = 1;
    string message = 2;
    ResolveOrderInvoiceModeInternalData data = 3;
}

// ValidateOrderInvoiceInputInternal — order-service 在 checkout confirm 呼叫。
// 統編／載具／捐贈三者互斥必須在這裡強制：AMEGO 實測不擋（三種違規組合全部通過）。
message ValidateOrderInvoiceInputInternalRequest {
    string store_id = 1;
    string buyer_id = 2;
    string order_no = 3;
    InvoiceInputSpec invoice = 4;   // 可為空 message ⇒ 走缺省鏈：預設 profile → 手機 → email → 無載具
    InvoiceAmountBreakdown amount = 5;
    string snapshot_version = 6;
    string idempotency_key = 7;
}
message ValidateOrderInvoiceInputInternalData {
    bool valid = 1;
    string snapshot_json = 2;        // 可持久化的發票快照（order-service 在付款前保存）
    string resolved_carrier_type = 3;
    string resolved_display_value = 4;   // 遮罩後
    string invoice_mode = 5;
    SellerIntakeLimit intake_limit = 6;
}
message ValidateOrderInvoiceInputInternalResponse {
    int32 code = 1;
    string message = 2;
    ValidateOrderInvoiceInputInternalData data = 3;
}

message GetSellerInvoiceCapabilitySimpleRequest {
    string store_id = 1;
}
message GetSellerInvoiceCapabilitySimpleData {
    string store_id = 1;
    string tax_review_status = 2;
    string invoice_mode = 3;
    string provider_status = 4;
    bool can_issue_automatically = 5;
    SellerIntakeLimit intake_limit = 6;
}
message GetSellerInvoiceCapabilitySimpleResponse {
    int32 code = 1;
    string message = 2;
    GetSellerInvoiceCapabilitySimpleData data = 3;
}
