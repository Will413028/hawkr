    // 按鈕亮在一個 CAS 必定 rows=0 的狀態上，而 rows=0 是靜默的（#3031／#3089 第 8 項
    // 兩次都是讀寫端分家）。true 的條件是 status=AWAITING_MANUAL 且 related_jobs 為空
    // ——有 operation 的那些走端點 52，入口在 A06。
    bool can_resume_from_manual = 6;
}
