}
message ListOrderExternalIssuancesData {
    // 述詞寫死在 usecase（三表 join，invoice_operations 沒有 store_id／order_no 欄）：
    //    invoice_issuers.issuer_ref_id = store_id AND invoice_documents.source_ref = order_no
    //    AND operation.status IN (MANUAL_PROCESS_ALLOWED, RESOLVED_EXTERNALLY)，
    //    依 statutory_deadline_at ASC NULLS LAST, id ASC。**不接受任何 status query**——
    //    放寬就退化成 S08 的等價物，而 S08 對停權賣家是 BLOCK（§3 D16）。
