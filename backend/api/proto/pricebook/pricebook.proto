syntax = "proto3";

package hawkr.pricebook;

option go_package = "github.com/Will413028/hawkr/go-pkg/proto/pricebook";
option java_package = "io.github.will413028.hawkr.pricebook.grpc";
option java_multiple_files = true;

import "google/protobuf/struct.proto";

service PricebookService {
  // Seller-only, personalized official-price snapshot (#2784). Identity is
  // taken exclusively from trusted metadata, never from request fields.
  rpc GetMarketOverview(GetMarketOverviewRequest) returns (GetMarketOverviewResponse);
  // Account-serialized, idempotent creation. An existing target succeeds
  // even when the account already has the maximum 20 targets.
  rpc CreateMarketWatchTarget(CreateMarketWatchTargetRequest) returns (CreateMarketWatchTargetResponse);
  // Idempotent owner-scoped deletion. Missing and other-account IDs have
  // the same successful response, without disclosing target ownership.
  rpc DeleteMarketWatchTarget(DeleteMarketWatchTargetRequest) returns (DeleteMarketWatchTargetResponse);
  // GetObservedPrice resolves a seller-facing crop name (via the P4 mapping
  // seed table) and returns raw observed price rows. Empty `observations`
  // means the crop name didn't resolve, or resolved but has no observation
  // data in range — both are business "not found", not an error.
  rpc GetObservedPrice(GetObservedPriceRequest) returns (GetObservedPriceResponse);
  // GetEstimatedItemPrice converts the nearest (horizon=1) 7-day forecast
  // point's P10/P50/P90 (TWD/kg) into a per-item price using the caller-
  // supplied net weight. Business "can't produce a price" outcomes (name
  // didn't resolve, forecast not ready, etc.) come back via `status`, never
  // as a gRPC error — see GetObservedPrice's own doc comment for the same
  // philosophy. net_weight_kg <= 0 is the one gRPC-layer error
  // (INVALID_ARGUMENT) since it's a caller-contract violation, not a
  // business outcome.
  rpc GetEstimatedItemPrice(GetEstimatedItemPriceRequest) returns (GetEstimatedItemPriceResponse);
  // GetForecastCurve returns the full 7-day forecast curve (all horizons,
  // not just the nearest one) for a resolved crop or crop group — P10/P50/P90
  // in TWD/kg, unconverted (no net_weight_kg multiplication; that's
  // GetEstimatedItemPrice's job). Business "can't produce a forecast"
  // outcomes (name unresolved, model doesn't cover this crop/group) come
  // back via `status`, never as a gRPC error — same philosophy as every
  // other RPC in this service.
  rpc GetForecastCurve(GetForecastCurveRequest) returns (GetForecastCurveResponse);
  // GetTrendSummary returns a day/week trend series for a resolved crop
  // (single market) or crop group (existing two-stage volume-weighted
  // aggregate), plus an optional WoW/364-day-aligned-YoY comparison anchored
  // on the most recent period in the requested range. Unlike
  // GetObservedPrice/GetForecastCurve, there is no crop_name/seed-table
  // resolution path — callers already have crop_code/group_code (from
  // SearchCropCatalog or a prior GetObservedPrice/GetForecastCurve call).
  rpc GetTrendSummary(GetTrendSummaryRequest) returns (GetTrendSummaryResponse);
  // SearchCropCatalog searches the crop / crop_group catalog for a picker
  // UI's autocomplete, reading the priceable_surface_form index (every
  // official name, variant name and curated alias lives there, written by
  // ingest in the same transaction as the entity itself). An empty query
  // returns the curated ALIAS rows as default "common items" suggestions.
  //
  // A non-empty query is normalised (whitespace/punctuation stripped,
  // full-width → half-width, 臺 → 台, lower-cased) with the same expression
  // the index uses, then matched as a substring. Results are ordered by
  // match tier (exact → prefix → substring), then by how authoritative the
  // matched form is (official name → source term → variant → alias), then
  // by normalised name; one row per entity (a group hit through both its
  // official name and an alias is returned once, keeping matched_alias).
  // The list is capped at `limit` distinct entities. Only groups and crops
  // are returned here; commodity hits (pork, poultry, rice…) come back from
  // SearchPriceableEntities instead.
  //
  // The usecase's doc comment (usecase/search_crop_catalog.go) says the
  // same thing — the two must not drift apart.
  rpc SearchCropCatalog(SearchCropCatalogRequest) returns (SearchCropCatalogResponse);
  // SearchPriceableEntities is the retrieval half of item resolution: it
  // returns every priceable entity (crop_group, crop AND commodity) whose
  // surface forms match any of the caller's query variants, with the
  // category ids each one is mapped to, so the caller (ai-service) can fuse
  // this ranked list with its other retrievers (taxonomy, LLM) and decide.
  // Unlike SearchCropCatalog this RPC does not pre-filter by entity kind
  // and carries a rank, not a picker row. At least one non-blank variant is
  // required (INVALID_ARGUMENT otherwise); an empty result is not an error.
  rpc SearchPriceableEntities(SearchPriceableEntitiesRequest) returns (SearchPriceableEntitiesResponse);
  // ListGroupCropOptions returns the crops under one crop_group, ranked by
  // how much they actually traded recently, for a caller that has already
  // resolved a group and now needs to offer its sub-variants as choices
  // (the procurement assistant's品項 drill-down).
  //
  // Why this is not SearchCropCatalog with the group's name as the query:
  // that search is a name substring match, so it both misses crops whose
  // name does not contain the group name and picks up crops from *other*
  // groups whose name does (querying "甘藍" also returns 球莖甘藍's crop).
  // This RPC joins on group_id instead — the actual parent-child edge.
  //
  // Ranking is descending count of price_observation rows in the trailing
  // window, then crop_code as a stable tiebreak. It is a popularity proxy,
  // not a quality score: a crop that stopped trading months ago sinks to
  // the bottom on its own without a separate freshness cutoff, which is
  // what keeps a genuinely seasonal item from disappearing outright.
  //
  // Returns the same CatalogMatch shape as SearchCropCatalog so a caller
  // can feed both into one resolution path. Every element has
  // match_type == "crop"; matched_alias is never set (nothing here was
  // found via an alias). An unknown or inactive group_code returns an
  // empty list, not an error — "this group has nothing to drill into" is a
  // business outcome, same rule the other RPCs apply.
  rpc ListGroupCropOptions(ListGroupCropOptionsRequest) returns (ListGroupCropOptionsResponse);
  // GetSpatialSurface returns the nationwide price surface for a crop or
  // crop group at a single horizon (issue #2248): market points, an IDW
  // interpolated price surface, its marching-squares contours, and the
  // per-county area-weighted rollup — all four as RFC 7946
  // FeatureCollections carried in google.protobuf.Struct (never an escaped
  // JSON string or base64 blob, per the issue's explicit requirement).
  //
  // Only the two request-shape violations are gRPC errors
  // (INVALID_ARGUMENT): zero-or-both of crop_code/group_code, and a
  // horizon_days outside 1-7. Every "can't produce a surface" outcome an
  // authenticated seller could legitimately hit — an unmodelled crop, every
  // scoped market closed, too few geocoded markets to interpolate, no
  // approved price scale, boundary data unavailable — comes back as
  // status/display_mode/quality_reason_codes on a successful call, the same
  // philosophy every other RPC in this service applies.
  rpc GetSpatialSurface(GetSpatialSurfaceRequest) returns (GetSpatialSurfaceResponse);
  // GetRegionalComparison returns a non-geometry per-county price
  // comparison table for a crop or crop group at a single horizon (issue
  // #2249 Slice C). p10/p50/p90 are each market's own forecast
  // uncertainty band, volume-weighted-averaged across the markets
  // assigned to that county (quantile averaging) — NOT a spatial IDW
  // interpolation, and NOT a cross-market percentile of P50 point
  // estimates. Shares the same market resolution + geography assignment
  // pipeline as GetSpatialSurface (issue #2249: "不能各算一套"), but never
  // builds an interpolation grid.
  //
  // Only the two request-shape violations are gRPC errors
  // (INVALID_ARGUMENT): zero-or-both of crop_code/group_code, and a
  // horizon_days outside 1-7 — same philosophy as GetSpatialSurface.
  rpc GetRegionalComparison(GetRegionalComparisonRequest) returns (GetRegionalComparisonResponse);
  rpc ResolveCategoryMapping(ResolveCategoryMappingRequest) returns (ResolveCategoryMappingResponse);
  rpc UpsertCategoryMapping(UpsertCategoryMappingRequest) returns (UpsertCategoryMappingResponse);
  rpc ListCategoryMappingWorklist(ListCategoryMappingWorklistRequest) returns (ListCategoryMappingWorklistResponse);
  rpc GetCategoryPriceRollup(GetCategoryPriceRollupRequest) returns (GetCategoryPriceRollupResponse);
}

// HTTP GET /app/sellers/pricebook/overview uses snake_case query keys.
// Absent numeric queries use the documented defaults; present empty or invalid
// numbers are INVALID_ARGUMENT, never silently clamped.
message GetMarketOverviewRequest {
  string scope = 1; // all (default when absent or empty) | watchlist.
  optional string window_days = 2; // 7 (default) | 14 | 30 calendar days.
  optional string page = 3; // Positive decimal integer, default 1.
  optional string page_size = 4; // 1..100, default 20.
  string query = 5; // Literal case-insensitive crop code/name/variant substring.
  optional string market_code = 6; // Only permitted with scope=all; any presence is invalid for watchlist.
}

message GetMarketOverviewResponse {
  string snapshot_id = 1; // Opaque ID for this fixed, account-scoped snapshot.
  string source = 2; // MOA_WHOLESALE_DAILY.
  string generated_at = 3; // Snapshot cutoff, ISO 8601 UTC seconds (...Z).
  optional string source_data_as_of = 4; // Latest participating trade-date end in UTC.
  string scope = 5;
  string window_days = 6;
  optional string market_code = 7;
  string currency = 8; // TWD.
  string unit = 9; // kg.
  repeated MarketOverviewMarketOption market_options = 10;
  repeated MarketOverviewItem items = 11;
  string page = 12;
  string page_size = 13;
  string total_items = 14; // Includes matching targets even on an empty page.
  bool has_next = 15;
}

message MarketOverviewMarketOption {
  string market_code = 1;
  string market_name = 2;
}

message MarketOverviewItem {
  optional string watch_target_id = 1;
  string crop_code = 2;
  string crop_name = 3;
  optional string variant_name = 4;
  optional string market_code = 5; // Absent means all markets, never a synthetic ID.
  optional string market_name = 6;
  bool is_watched = 7; // Exact (crop, optional market) identity for this account.
  string status = 8; // ready | unavailable; stale actuals remain actuals.
  string freshness_status = 9; // fresh | stale | unavailable; existing freshness thresholds.
  repeated string quality_reason_codes = 10;
  string currency = 11;
  // 來源公布的原始單位。擴充前恆為 kg；新來源填自己的單位（catty 等），
  // 消費端不得假設為 kg，也不得在前端做換算。
  string unit = 12;
  // 這一列的價格層級，取值同 PriceObservation.price_layer。空值語意是
  // wholesale_auction（擴充前唯一可能的值）。
  //
  // 🔴 比較與排名只在同一層級內成立：一份同時含活體價與產地價的排行榜
  // 沒有意義，消費端必須先依本欄分組。
  optional string price_layer = 18;
  optional string source_data_as_of = 13;
  optional MarketOverviewActual latest_actual = 14;
  optional MarketOverviewActual previous_actual = 15;
  optional MarketOverviewChange change = 16;
  repeated MarketOverviewPoint points = 17; // Ascending dates; closed days are absent.
}

message MarketOverviewActual {
  string trade_date = 1; // YYYY-MM-DD, Asia/Taipei trade date.
  string avg_price = 2; // Decimal NUMERIC string, TWD/kg; zero is valid.
  optional string volume_kg = 3; // Absent when all participant volumes are unknown.
}

message MarketOverviewPoint {
  string trade_date = 1;
  string avg_price = 2;
}

message MarketOverviewChange {
  string absolute = 1; // latest - previous, computed with NUMERIC.
  optional string percent = 2; // (latest - previous) / previous * 100; absent if previous=0.
  string direction = 3; // up | down | flat, based on the exact absolute delta.
  string basis = 4; // latest_vs_previous_observed_trade_date.
}

// HTTP POST body is {cropCode, marketCode?}; omitted market means all markets.
// A present empty marketCode is INVALID_ARGUMENT, not an all-market target.
message CreateMarketWatchTargetRequest {
  string crop_code = 1;
  optional string market_code = 2;
}

message CreateMarketWatchTargetResponse {
  string watch_target_id = 1;
  bool created = 2;
}

message DeleteMarketWatchTargetRequest {
  string watch_id = 1; // Positive decimal TSID from the HTTP path.
}

message DeleteMarketWatchTargetResponse {}

message GetObservedPriceRequest {
  // Seller-facing product name, resolved via mapping.Resolve. Required
  // unless crop_code or group_code is set — exactly one of the three must
  // be set.
  string crop_name = 1;
  // Optional market filter. Omitted = all markets.
  optional string market_code = 2;
  // Optional RFC3339 date (YYYY-MM-DD). Omitted = most recent available.
  optional string trade_date = 3;
  // When true, skip the "collapse to latest per (market,crop)" reduction
  // and return every observation in the server's observed_window_days
  // trailing window (default 30 days) — for trend charts. Ignored (treated
  // as false) when trade_date is set, since a pinned single date already
  // returns every matching row unreduced. Default false preserves existing
  // callers' behavior exactly.
  bool history = 4;
  // Direct crop-code lookup, bypassing crop_name/seed-table resolution —
  // used when the caller already resolved a specific crop via
  // SearchCropCatalog (which returns raw crop_code, not a seed alias).
  // Mutually exclusive with crop_name and group_code (exactly one of the
  // three must be set). Omitted market_code aggregates this exact crop
  // across active markets, one volume-weighted row per trade_date.
  optional string crop_code = 5;
  // Direct group-code lookup, same bypass rationale as crop_code.
  // Mutually exclusive with crop_name and crop_code. market_code is
  // optional here — scopes the
  // group's two-stage aggregation to one market; empty means all markets.
  optional string group_code = 6;
}

message GetObservedPriceResponse {
  // Two different row shapes, decided by how the request resolved:
  //
  // 1. Raw rows — exact crop with market_code. One row per (market_code,
  //    crop_code, trade_date), every price field carried straight from the
  //    underlying observation. No aggregation is performed — the caller
  //    decides how to summarize. A resolved crop name is usually a
  //    category (see design doc point 8), so this can still span multiple
  //    sub-crops and/or markets.
  //
  // Exact crop without market_code instead returns one daily NUMERIC
  // positive-volume weighted average across active eligible markets;
  // no positive weights falls back to equal weights with
  // VOLUME_WEIGHT_FALLBACK. crop_code remains set, market_code is empty,
  // volume_kg is the sum of known volumes (unset if none), and upper /
  // middle / lower prices are unset. history=false returns the latest day.
  // The same rule applies to crop_name resolving to that exact crop.
  //
  // 2. Aggregated rows — every crop_group resolution (via crop_name or
  //    group_code), unconditionally — history and market_code no longer
  //    change the row shape, only which market(s) the aggregate covers.
  //    Exactly ONE row per trade_date, whose avg_price is the same
  //    two-stage volume-weighted aggregate GroupForecast uses for
  //    predictions (stage 1: weight sub-crops within a market by volume;
  //    stage 2: weight markets by volume — degenerating to a single
  //    market's own weighting when market_code narrows the input to one
  //    market). market_code and crop_code are EMPTY and
  //    upper_price/middle_price/lower_price/volume_kg are unset on these
  //    rows — the value spans many (market, crop) pairs (or, with
  //    market_code set, many crops within that one market), so none of
  //    them is the row's identity. A consumer must NOT group these rows by
  //    market_code: it is always empty on this path. This shape exists
  //    because plotting the raw multi-market grid produced a zigzag
  //    (several y-values at the same date), and because the actual-price
  //    line has to be methodologically consistent with where the forecast
  //    line picks up.
  repeated PriceObservation observations = 1;
  // Additive metadata describing the exact same snapshot as `observations`
  // (issue #2249 Slice A). Always present; individual fields inside are
  // nil/omitted when there is nothing to report (e.g. observations is
  // empty), never a fake value. See PricebookDataMeta's own doc comment.
  optional PricebookDataMeta data_meta = 2;
}

// PricebookDataMeta is the additive metadata object added to
// GetObservedPriceResponse and GetForecastCurveResponse by issue #2249
// Slice A. It always describes the exact same snapshot as the payload it
// rides with — never a separately-queried "latest" or "current" state.
message PricebookDataMeta {
  // Opaque identifier for this exact data snapshot — currently the same
  // value as dataset_digest (see dataset_digest's own comment). Omitted
  // when there is no underlying data to identify (e.g. an empty response).
  optional string snapshot_id = 1;
  string source = 2; // Always "MOA_WHOLESALE_DAILY" for this service.
  // Source cutoff — the latest trade_date actually covered by the payload,
  // as that date's end-of-day in Asia/Taipei (wire format is still UTC
  // "...Z", per this repo's time-format redline). Omitted when there is no
  // underlying data.
  optional string source_data_as_of = 3;
  // Knowledge-time cutoff — the latest available_at (our own ingest
  // visibility time) among the contributing rows. Distinct from
  // source_data_as_of: a trade_date can become visible to us well after
  // that trade date itself. Omitted when there is no underlying data.
  optional string max_feature_available_at = 4;
  string generated_at = 5; // When this response was produced.
  // fresh | stale | unavailable.
  string freshness_status = 6;
  // usable | degraded | unusable.
  string usability_status = 7;
  // UPPER_SNAKE reason codes explaining a degraded/unusable
  // usability_status on the group-aggregated path (PARTIAL_VARIANT_COVERAGE
  // / VOLUME_WEIGHT_FALLBACK / INSUFFICIENT_MARKET_SUPPORT — see the ADR
  // this Slice A implements). Empty (not omitted) when there is nothing to
  // report — this is a phase-scoped concept: the non-group path never
  // populates it.
  repeated string quality_reason_codes = 8;
  // Omitted on GetObservedPriceResponse (observed data has no model of its
  // own — never borrow the forecast model's version here). On
  // GetForecastCurveResponse, equals the response's existing top-level
  // model_version field whenever that field is non-empty.
  optional string model_version = 9;
  // sha256:-prefixed content digest of the underlying data. For observed
  // responses spanning more than one distinct price_observation.source_digest,
  // this is a deterministic composite (sorted distinct digests, joined,
  // sha256'd) — never an arbitrarily-picked single row's digest. Omitted
  // when there is no underlying data.
  optional string dataset_digest = 10;
  string schema_version = 11; // "hawkr.pricebook/v1"
  string currency = 12; // "TWD"
  string unit = 13; // "kg"
}

message PriceObservation {
  string market_code = 1;
  string crop_code = 2;
  string trade_date = 3; // YYYY-MM-DD
  optional double avg_price = 4;
  optional double upper_price = 5;
  optional double middle_price = 6;
  optional double lower_price = 7;
  optional double volume_kg = 8;
  // 這筆價格在供應鏈中的位置，以及來源公布時使用的單位。
  //
  // price_layer：wholesale_auction | farmgate | live_animal | retail |
  // wholesale_bulk。🔴 不同層級的價格不可比較、不可平均、不可換算——活體與
  // 分切之間的差距來自屠宰率與分切溢價，兩者都不是常數，本服務不做這種推導。
  //
  // original_unit：來源公布的原始單位（kg | catty | 100kg）。**不是** canonical
  // 單位——只有換算比例是法定固定常數時（1 台斤 = 0.6 公斤、1 百公斤 = 100 公斤）
  // 才另外提供每公斤值，包裝單位一律保留原樣。
  //
  // 兩者在擴充前不存在，因此舊 series 與尚未回填的資料為空；空值的語意是
  // wholesale_auction / kg（擴充前唯一可能的組合）。新 series 一律必填。
  optional string price_layer = 9;
  optional string original_unit = 10;
}

message GetEstimatedItemPriceRequest {
  // Seller-facing product name, resolved via mapping.Resolve. Required.
  string crop_name = 1;
  // Product net weight in kg. Supplied by the caller (gateway, from
  // product-service data) — pricebook-service never queries or caches this.
  double net_weight_kg = 2;
  // Market code. Semantics differ from GetObservedPriceRequest.market_code:
  // required when crop_name resolves to a specific crop (sub-variant),
  // forbidden when it resolves to a crop group (GroupForecast aggregates
  // across all markets by design — see cmd/pricebook-forecast's existing
  // --group/--market mutual-exclusion rule). The handler decides which
  // rule applies after resolution; sending it in the wrong case is
  // INVALID_ARGUMENT, not silently ignored.
  optional string market_code = 3;
}

message GetEstimatedItemPriceResponse {
  // Existing 7-state model (forecast.PredictionStatus): ready / partial /
  // market_closed / insufficient_data / not_predicted / stale /
  // unavailable. "unavailable" is also used when crop_name doesn't resolve
  // at all, or resolves to a crop group name matching zero crop_group rows.
  string status = 1;
  // Populated only when status is "ready" or "partial" — never a fake
  // number for other statuses. TWD, rounded to the nearest integer.
  optional int64 low = 2;      // round(P10 x net_weight_kg)
  optional int64 median = 3;   // round(P50 x net_weight_kg)
  optional int64 high = 4;     // round(P90 x net_weight_kg)
  // Resolution result — exactly one of these two is set, mirroring
  // mapping.SeedEntry's CropGroupName/CropCode invariant.
  optional string resolved_crop_group_code = 5;
  optional string resolved_crop_code = 6;
  // Only set on the crop (sub-variant) path — a crop-group result has no
  // single market, since GroupForecast aggregates across all of them.
  optional string market_code = 7;
  string model_version = 8;
}

message GetForecastCurveRequest {
  // Seller-facing product name, resolved via mapping.Resolve. Required
  // unless crop_code or group_code is set — exactly one of the three must
  // be set.
  string crop_name = 1;
  // Market code. Omitted for an exact crop blends that crop's markets
  // using recent volume weights, one artifact/origin/cutoff. Unlike
  // GetEstimatedItemPriceRequest, an exact crop does not require a market.
  // Optional when it resolves to a crop group: does NOT scope
  // the group's own forecast curve (still a full-market GroupForecast
  // blend) — only used to exclude the "currently viewed" market from
  // market_comparison, mirroring the crop path's own sibling-market
  // exclusion.
  optional string market_code = 2;
  // See GetObservedPriceRequest.crop_code's doc comment — identical
  // semantics.
  optional string crop_code = 3;
  // See GetObservedPriceRequest.group_code's doc comment — identical
  // semantics.
  optional string group_code = 4;
  // 多來源品項（毛豬、漁產、家禽、蛋品、糧價、羊隻）的序列代碼，與上面三個
  // 互斥——恰好設定其中一個。
  //
  // 走這條路徑的序列 derivation 一律是 source_passthrough：它們的「預測值」
  // 就是來源公布的最新成交均價本身，不經模型。
  // 因此回應只會有一個 horizon_days=1 的 point、只有 p50、不帶 model_version。
  //
  // 🔴 這條路徑**不提供**跨區域比較。毛豬的 19 個肉品市場是拍賣地點，與買家
  // 的收貨縣市沒有因果關係——把它們映射成「各縣市的豬價」會發明一個資料裡
  // 不存在的區域差異。回傳的是全國成交量加權均價（產業慣例的報價方式）。
  optional string commodity_code = 5;
}

// SeriesCapabilities 說明一條序列能安全提供哪些能力。
//
// 存在的理由：擴充前每條序列都是「作物 × 批發市場」，五個分頁永遠成立，
// 所以前端把它們寫成靜態常數。多來源之後這個假設不成立——雞蛋的來源是全國
// 單一數字，沒有市場可比；毛豬有 19 個肉品市場但我方 registry 沒有座標，
// 畫不了地圖。
//
// 🔴 能力必須由 server 宣告。讓前端從「有沒有資料」推導會把「這種序列本來
// 就沒有」與「這次剛好查無」混為一談，而這兩者要對使用者說的話完全相反。
message SeriesCapabilities {
  // 是否可跨市場比較。
  bool market_comparison = 1;
  // 是否可畫價格地圖。
  bool spatial = 2;
  // 不提供某項能力的原因，UPPER_SNAKE reason code。空陣列代表全部可用。
  //
  //   NATIONAL_SERIES        來源本身就是全國單一行情，沒有市場維度
  //                          （白肉雞、雞蛋、鴨鵝）。這是資料的性質，不是缺陷。
  //   NO_APPROVED_GEOGRAPHY  有市場但沒有經核准的座標，畫不了圖。猜座標比
  //                          不畫更糟。
  //   SINGLE_SERIES_ONLY     此序列目前只提供彙整值，尚未提供逐市場讀取。
  //
  // 前端據此決定文案：「此品項為全國單一行情」與「查無資料」對使用者的意思
  // 完全不同——後者會讓人以為等一下就有。
  repeated string reason_codes = 3;
}

message GetForecastCurveResponse {
  // Equal to the points entry where horizon_days==1's status; "unavailable"
  // when crop_name doesn't resolve, or no usable model covers the target.
  // On the all-market crop path, recent observed markets without models
  // retain seven unavailable points and exclusions; no candidates means
  // empty points. Legacy unresolved/uncovered paths also have empty points.
  // This field only
  // saves a caller from hunting through points for the horizon-1 entry —
  // the full 7-day picture always comes from points, never from this field.
  string status = 1;
  // Resolution result — exactly one of these two is set, mirroring
  // GetEstimatedItemPriceResponse's own CropGroupCode/CropCode invariant.
  optional string resolved_crop_group_code = 2;
  optional string resolved_crop_code = 3;
  // Only set on the single-market crop path — an all-market crop or group has no
  // single market, since GroupForecast aggregates across all of them.
  optional string market_code = 4;
  // model derivation 時是模型版本；source_passthrough 時為空字串——
  // 那條路徑沒有模型，消費端應讀 points[].derivation 而非本欄。
  string model_version = 5;
  repeated ForecastCurvePoint points = 6;
  // One entry per sibling market. On the crop path: one entry per sibling
  // market with a trained series for the same crop_code, each carrying
  // that market's own direct-model D+1 P50 (TWD/kg); is_approximate is
  // always false. On the crop-group path: one entry per sibling market
  // with a trained series for ANY of the group's crops, each carrying the
  // arithmetic mean of the group's crops' own per-market D+1 P50s at that
  // market; is_approximate is always true (see MarketComparisonEntry's own
  // doc comment). Either path: an unavailable supplementary market retains
  // its identity and status with unset p50 (HTTP serializes it as null).
  repeated MarketComparisonEntry market_comparison = 7;
  // Additive metadata describing the exact same snapshot as `points`
  // (issue #2249 Slice A) — see PricebookDataMeta's own doc comment. Always
  // present. On the group-resolution path, usability_status/
  // quality_reason_codes are derived from the points entry where
  // horizon_days==1's GroupPoint, the same precedent the top-level `status`
  // field above already documents.
  optional PricebookDataMeta data_meta = 8;
  // Exact-crop all-market blend metadata for horizon 1; unset on legacy paths.
  optional ForecastAggregationMeta aggregation = 9;  // 這條曲線的價格層級與原始單位。
  //
  // 🔴 對 source_passthrough 序列這兩欄是**安全使用的前提**：毛豬回的是
  // live_animal（活體拍賣均價），它不是豬肉分切零售價，兩者水平差數倍。
  // 消費端在把 p50 當成商品單價使用之前必須讀 price_layer；
  // 未讀就使用是本欄位存在的理由。
  //
  // model derivation 的既有 crop 序列恆為 wholesale_auction / kg。
  optional string price_layer = 10;
  optional string unit = 11;
  // 這個數字實際來自哪一個交易日。source_passthrough 時它與 points[0] 的
  // target_date 相差一天——「09-12 的成交均價，作為 09-13 的參考價」。
  optional string source_data_as_of = 12;
  // 參與加權的市場數；成交量加總與其單位（毛豬是頭，不是公斤）。
  // total_quantity 為空代表上游沒給量、本次退回等權平均。
  optional string supporting_market_count = 13;
  optional string total_quantity = 14;
  optional string quantity_unit = 15;  // canonical（元／公斤）與原始單位表示式。
  //
  // points[].p50 一律是 canonical 值——**計算與比較用它**，一個數字只有一種
  // 單位。canonical_unit 為空代表來源單位沒有可追溯的固定換算比例
  // （元／盒、元／顆），此時 p50 是原始單位的值，不可跨序列比較。
  //
  // original_p50 ＋ unit 是顯示用的：官方公布的是台斤價，賣家自己去農業部
  // 網站查到的也是台斤價，畫面以它為主才對得上來源。
  //
  // 🔴 換算不改變層級。毛豬 106 元/公斤（活體）與豬五花 300 元/公斤（分切
  // 零售）都是「元/公斤」——單位統一之後看起來更像可以直接比，price_layer
  // 那條紅線因此更重要，不是更不重要。
  optional string canonical_unit = 16;
  optional string original_p50 = 17;  // 這條序列能安全提供哪些能力。由 server 宣告，**不由前端從資料推導**
  // ——前端推導正是「所有 series 都有市場與地圖」這個假設的來源。
  optional SeriesCapabilities capabilities = 18;
}

message ForecastCurvePoint {
  string target_date = 1; // YYYY-MM-DD
  int32 horizon_days = 2; // 1-7
  // Existing 7-state model (forecast.PredictionStatus), same string values
  // GetEstimatedItemPriceResponse.status/GetForecastCurveResponse.status use.
  string status = 3;
  // TWD/kg, not a per-item price — GetEstimatedItemPrice does that
  // conversion, this RPC never does. Populated only when status is ready or
  // partial, same rule as every other price field in this service.
  optional double p10 = 4;
  optional double p50 = 5;
  optional double p90 = 6;
  // Participants and exclusions for this horizon, which can differ on rest days.
  optional ForecastAggregationMeta aggregation = 7;
  // 這個預測值是怎麼來的：model | source_passthrough。
  //
  // model：模型對未來日期的分位推估。p10/p50/p90 三者皆有值，horizon 1-7，
  // 回應帶 model_version。這是擴充前唯一存在的形態，空值即代表 model。
  //
  // source_passthrough：直接採用來源公布的最新成交均價作為預測值。適用於官方
  // 本身就發布每日成交均價、而我方沒有（也不需要）模型的來源，例如毛豬活體
  // 拍賣均價。
  //
  // 🔴 source_passthrough 的三條紅線：
  //   1. 只有 p50。p10/p90 必須 unset——把 p50 填滿三個分位等於宣稱不確定性
  //      為零，來源沒說過這句話。
  //   2. 只有 horizon_days=1。不得把同一個數字複製到 D+1~D+7，平線是一個
  //      「價格不會變」的主張。
  //   3. 消費端一律讀本欄判別，不得以「有沒有 model_version」反推。
  optional string derivation = 8;
}

message ForecastAggregationMeta {
  // Candidate markets are the union of artifact-supported markets and
  // observed markets returned by the same recent-volume window. A recent
  // market without a trained series is excluded as unavailable, making an
  // otherwise usable blend partial. Markets with no model and no non-null
  // volume observation in that window are outside this coverage denominator.
  string method = 1;
  string weight_window_days = 2;
  repeated string participating_market_codes = 3;
  repeated ForecastMarketExclusion excluded_markets = 4;
}

message ForecastMarketExclusion {
  string market_code = 1;
  string reason = 2;
}

message MarketComparisonEntry {
  string market_code = 1;
  string market_name = 2;
  // D+1 P50, TWD/kg. Unset if that market's own forecast run failed —
  // never zero-filled.
  optional double p50 = 3;
  // True only for a group (crop_group) resolution: this P50 is the
  // arithmetic mean of the group's constituent crops' own independently-
  // trained per-market models, not one model's direct output. Always false
  // for a crop resolution.
  bool is_approximate = 4;
  // Existing prediction status; unavailable on supplemental system failure.
  string status = 5;
}

message GetTrendSummaryRequest {
  // Exactly one of crop_code / group_code must be set — no crop_name
  // resolution path on this RPC (see the RPC's own doc comment).
  optional string crop_code = 1;
  optional string group_code = 2;
  // Required when crop_code is set; forbidden when group_code is set
  // (group path aggregates across all markets, same rule
  // GetForecastCurve/GetObservedPrice already apply).
  optional string market_code = 3;
  string from = 4; // YYYY-MM-DD, inclusive
  string to = 5;   // YYYY-MM-DD, inclusive. to - from must be <= 366 days.
  string granularity = 6; // "day" | "week"
  // Subset of {"wow", "yoy364"}; unknown values are INVALID_ARGUMENT.
  repeated string comparisons = 7;
}

message GetTrendSummaryResponse {
  string selection_kind = 1; // "crop" | "group"
  string granularity = 2;
  string timezone = 3; // always "Asia/Taipei"
  repeated TrendPoint points = 4;
  // Keyed by comparison kind ("wow"/"yoy364") in TrendComparisonEntry —
  // proto3 doesn't have a native map<string, message> ergonomics advantage
  // here worth taking on; a repeated entry list mirrors how
  // MarketComparisonEntry already does the same "keyed list" shape
  // elsewhere in this file.
  repeated TrendComparisonEntry comparisons = 5;
  optional PricebookDataMeta data_meta = 6;
}

message TrendPoint {
  string period_start = 1; // YYYY-MM-DD, inclusive
  string period_end = 2;   // YYYY-MM-DD, inclusive
  // ready | partial | insufficient_data | market_closed — see
  // domain/forecast.PredictionStatus (this RPC reuses that existing
  // 7-state vocabulary's applicable subset, not a new enum).
  string status = 3;
  optional double observed_average_twd_per_kg = 4;
  optional double volume_kg = 5;
  int32 sample_count = 6;
  int32 observed_market_count = 7;
  // "volume_weighted/v1", or "" (empty string) when the period has zero
  // contributing days — AggregatePeriodValue returns no method label for a
  // period nothing bucketed into.
  string aggregation_method = 8;
  repeated string quality_reason_codes = 9;
}

message TrendComparisonEntry {
  string kind = 1; // "wow" | "yoy364"
  string status = 2;
  optional double current_value_twd_per_kg = 3;
  optional double baseline_value_twd_per_kg = 4;
  optional double change_amount_twd_per_kg = 5;
  optional double change_percent = 6; // e.g. 6.25 means 6.25%, never a ratio
  optional string reason_code = 7;
}

message SearchCropCatalogRequest {
  // Empty = return the curated ALIAS rows as default suggestions. Non-empty
  // = search the priceable_surface_form index (see the rpc doc comment).
  string query = 1;
  // Server-side result cap. 0 = server default (20).
  int32 limit = 2;
}

message SearchCropCatalogResponse {
  repeated CatalogMatch matches = 1;
}

message ListGroupCropOptionsRequest {
  // The parent crop_group. Required; an unknown or inactive one yields an
  // empty list rather than an error.
  string group_code = 1;
  // Server-side result cap. 0 = server default (20).
  int32 limit = 2;
}

message ListGroupCropOptionsResponse {
  // Always match_type == "crop", ranked most-traded first.
  repeated CatalogMatch crops = 1;
}

message CatalogMatch {
  // "group" = resolves to a crop_group (GetForecastCurve/GetObservedPrice
  // via group_code, market_code forbidden); "crop" = resolves to a specific
  // crop (via crop_code, market_code required — see markets below).
  string match_type = 1;
  string group_code = 2;
  string group_name = 3;
  // Set only when match_type == "crop".
  optional string crop_code = 4;
  optional string crop_name = 5;
  optional string variant_name = 6;
  // Set when this match was found via a curated ALIAS surface form (e.g.
  // querying "小黃瓜" surfaces this filled with "小黃瓜" on the "花胡瓜" group
  // match) — the caller displays "花胡瓜（小黃瓜）". Unset for matches found
  // only via official / variant names.
  optional string matched_alias = 7;
  // group: true if any child crop has a trained series in any market.
  // crop: true if this crop has a trained series in any market.
  bool has_forecast = 8;
  // Populated only when match_type == "crop" (a group's forecast blends
  // all markets by design, so there is no per-market list to offer).
  repeated CropMarketOption markets = 9;
}

message CropMarketOption {
  string market_code = 1;
  string market_name = 2;
}

message SearchPriceableEntitiesRequest {
  // Query variants produced by the caller's query understanding (e.g. the
  // buyer's original text plus a de-modified form). Each variant is searched
  // independently; hits are merged per entity keeping the best tier. At
  // least one non-blank variant is required.
  repeated string variants = 1;
  // Server-side result cap on distinct entities. 0 = server default (20).
  int32 limit = 2;
}

message PriceableEntityMatch {
  // CROP_GROUP | CROP | COMMODITY
  string kind = 1;
  // crop_group.group_code | crop.crop_code | commodity id (decimal string)
  string code = 2;
  // Display name of the entity (official name).
  string name = 3;
  // Platform category ids (L3 leaves) this entity is mapped to, resolved
  // mappings only. Empty when the entity has no mapping yet.
  repeated string category_ids = 4;
  // The surface form that matched, verbatim (for "matched 白肉雞" display).
  string matched_form = 5;
  // CANONICAL | SOURCE_TERM | VARIANT | ALIAS — how authoritative the
  // matched form is.
  string form_kind = 6;
  // "0" = exact, "1" = prefix, "2" = substring (best tier across all
  // variants). Decimal string per Proto 管理規範 §6 (numbers are strings on
  // the wire; converted at the gRPC boundary).
  string tier = 7;
  // 1-based position in this response's ordering, as a decimal string —
  // what a rank-fusion caller needs; the ordering itself is tier →
  // form_kind → first seen.
  string rank = 8;
  // CROP: this crop has a trained series in at least one market; CROP_GROUP:
  // any child crop has; COMMODITY: always true (its price comes from
  // observations, not a model). The caller must not resolve to an entity
  // whose has_forecast is false — it cannot be priced.
  bool has_forecast = 9;
  // CROP: the parent crop_group's group_code (what FallbackGroupCode should
  // carry); CROP_GROUP: equal to code; COMMODITY: empty.
  string group_code = 10;
}

message SearchPriceableEntitiesResponse {
  repeated PriceableEntityMatch matches = 1;
}

message GetSpatialSurfaceRequest {
  // Exactly one of crop_code / group_code must be set — no crop_name
  // resolution path on this RPC, same as GetTrendSummary.
  optional string crop_code = 1;
  optional string group_code = 2;
  int32 horizon_days = 3; // 1-7
}

message GetSpatialSurfaceResponse {
  string status = 1; // ready | degraded | unavailable
  string display_mode = 2; // contours_and_points | surface_and_points | points_only | table_only
  string selection_kind = 3; // crop | group
  string target_date = 4; // YYYY-MM-DD
  int32 horizon_days = 5;
  string currency = 6; // TWD
  string unit = 7; // kg
  PriceScaleInfo scale = 8;
  // The four RFC 7946 FeatureCollections, always present (a legally
  // degraded response carries an empty `features` array, never a missing
  // field). Each is a google.protobuf.Struct so the GeoJSON stays real
  // JSON on the wire — never an escaped string or base64 blob.
  //
  //   boundary_price_geojson: Polygon/MultiPolygon per county, properties
  //     regionCode / regionName / status / estimatedP50TwdPerKg /
  //     bandLowerTwdPerKg / bandUpperTwdPerKg / sampleCellCount /
  //     aggregationMethod. A county the surface never reached carries a
  //     null estimatedP50TwdPerKg and status "unavailable" — never 0, never
  //     a national average.
  //   market_points_geojson: Point per market that has BOTH a finite P50
  //     and a resolved coordinate. A closed / unpriced / ungeocoded market
  //     stays in market_prices but is never emitted here with a null
  //     geometry or a 0 placeholder.
  //   surface_cells_geojson: Polygon per interpolated grid cell, properties
  //     priceTwdPerKg / bandIndex / bandLowerTwdPerKg / bandUpperTwdPerKg.
  //   contour_lines_geojson: LineString per marching-squares segment,
  //     properties levelPriceTwdPerKg / surfaceRegion, plus a stable
  //     feature id.
  google.protobuf.Struct boundary_price_geojson = 9;
  google.protobuf.Struct market_points_geojson = 10;
  google.protobuf.Struct surface_cells_geojson = 11;
  google.protobuf.Struct contour_lines_geojson = 12;
  // Every market in scope, including the ones excluded from the surface —
  // the tabular fallback the caller renders when display_mode is
  // table_only, and the audit trail for excluded_market_codes.
  repeated SpatialMarketPrice market_prices = 13;
  SpatialStatistics statistics = 14;
  repeated string quality_reason_codes = 15;
  repeated string disclosures = 16;
  repeated string excluded_market_codes = 17;
  SpatialLineage lineage = 18;
  SpatialBoundary boundary = 19;
  // Fraction (0-1) of this response's interpolated land nodes that had
  // enough nearby markets to be IDW-supported (issue #2248's
  // min_supported_land_area_ratio quality gate, exposed as a number instead
  // of only feeding the unsupported_land_area quality-reason-code). Unset
  // when no grid was ever attempted for this request (unavailable status,
  // no boundary, no price scale).
  optional double supported_land_area_ratio = 20;
}

// SpatialBoundary is the raw county boundary geometry the surface was drawn
// against — separate from boundary_price_geojson, which is the same
// geometry annotated with per-county rollup prices. Callers that only need
// to draw the base map (before any price data loads) use this field.
message SpatialBoundary {
  string version = 1;
  string digest = 2;
  // [minLon, minLat, maxLon, maxLat], WGS84.
  repeated double bbox_wgs84 = 3;
  // FeatureCollection, Polygon/MultiPolygon per county — same geometry as
  // boundary_price_geojson, without the price properties.
  google.protobuf.Struct geojson = 4;
}

// PriceScaleInfo carries either #2248's reviewed fixed scale (policy_version
// "v1", legacy responses only) or #3102's per-selection adaptive P50 scale
// (policy_version "selection-p50-v1", or "selection-p50-v1-flat-fallback"
// with an empty breaks when the selection's domain is too flat to band).
// Either way, breaks are always server-computed, never client-calculated —
// the adaptive case is deliberately recomputed from this request's own
// SpatialStatistics every time, with determinism coming from the request's
// own inputs (selection/target date/horizon/model snapshot) being
// deterministic, not from the breaks themselves being cached or fixed.
message PriceScaleInfo {
  string scale_id = 1;
  string policy_version = 2;
  repeated double breaks = 3;
}

message SpatialMarketPrice {
  string market_code = 1;
  string market_name = 2;
  optional string category_code = 3;
  // Existing 7-state model (forecast.PredictionStatus), same vocabulary
  // GetForecastCurveResponse.status uses.
  string prediction_status = 4;
  // The *target* date's market state: closed | open | missing.
  string market_status = 5;
  bool used_for_surface = 6;
  // TWD/kg. Unset rather than zero-filled whenever the market produced no
  // usable forecast point. p50 is always set when used_for_surface is true.
  optional double p10 = 7;
  optional double p50 = 8;
  optional double p90 = 9;
  optional double recent_volume_kg = 10;
  // Set (non-empty) exactly when used_for_surface is false — machine-
  // readable reason this market's forecast point exists but was not fed to
  // the interpolation (no_usable_price | missing_coordinate |
  // outside_or_unsupported_domain). Unset when used_for_surface is true.
  optional string exclusion_reason = 11;
}

message SpatialStatistics {
  int32 priced_market_count = 1;
  int32 closed_market_count = 2;
  int32 total_market_count = 3;
  int32 surface_cell_count = 4;
  int32 contour_segment_count = 5;
  // Cross-market summary, TWD/kg, over every market with a non-null P50
  // (same set priced_market_count counts). Weighted by each market's
  // recent_volume_kg — a market missing volume falls back to an equal
  // weight of 1 rather than being dropped, so partial volume coverage
  // degrades to a mixed weighted/equal-weight median instead of failing.
  // Unset only when priced_market_count is 0.
  optional double p50 = 6;
  optional double minimum_p50 = 7;
  optional double maximum_p50 = 8;
}

// SpatialLineage is the provenance block. Everything in it derives from
// pricebook-service's own two immutable inputs (the baked model artifact
// and the mirrored boundary file), so there is no cross-service snapshot to
// fall out of sync.
message SpatialLineage {
  // Equal to model_version: this service loads exactly one model.json whose
  // model_version is already content-addressed, so there is no separate
  // artifact identifier to report.
  string artifact_id = 1;
  string model_version = 2;
  string dataset_digest = 3; // "sha256:"-prefixed
  string boundary_digest = 4;
  optional string generated_at = 5; // RFC3339 UTC ("...Z"), same as PricebookDataMeta
  optional string source_data_as_of = 6;
  optional string max_feature_available_at = 7;
  optional string schema_version = 8;
}

message GetRegionalComparisonRequest {
  // Exactly one of crop_code / group_code must be set — no crop_name
  // resolution path on this RPC, same as GetTrendSummary/GetSpatialSurface.
  optional string crop_code = 1;
  optional string group_code = 2;
  int32 horizon_days = 3; // 1-7
}

message GetRegionalComparisonResponse {
  string selection_kind = 1; // crop | group
  int32 horizon_days = 2;
  string currency = 3; // TWD
  string unit = 4; // kg
  // One entry per county in geography scope, always — a county with no
  // supporting market still appears, status "unavailable", null
  // quantiles (issue #2249: "不得補全國平均").
  repeated RegionalComparisonRegion regions = 5;
  // Same provenance block GetSpatialSurfaceResponse uses — this RPC reads
  // the same model artifact and geography registry, just never touches
  // the boundary geometry, so boundary_digest is still meaningful
  // provenance even though this response carries no geometry.
  SpatialLineage lineage = 6;
  // mapping_version 是 crop/group/region 映射政策的版本，對應 procurement
  // V2 pricing preview 的 policyVersion 概念前置，非預測模型版本
  // （不要跟 Lineage.ModelVersion 混淆）。
  string mapping_version = 7;
}

message RegionalComparisonRegion {
  string region_code = 1; // CountyRegion.CountyCode, e.g. "63000"
  string region_name = 2;
  string status = 3; // ready | unavailable
  // TWD/kg. Set together, or unset together — never 0 as a placeholder.
  optional double p10 = 4;
  optional double p50 = 5;
  optional double p90 = 6;
  int32 supporting_market_count = 7;
  repeated string excluded_market_codes = 8;
  // "market_volume_weighted_quantile_average/v1". Set only when status
  // is "ready".
  optional string aggregation_method = 9;
  repeated string quality_reason_codes = 10;
  string freshness_status = 11; // fresh | stale | unavailable — never empty
}

// ==================== categoryId 權威解析（issue #2786）====================

message ResolveCategoryMappingRequest {
  string category_id = 1;
}

message ResolveCategoryMappingResponse {
  reserved 3, 4; // selection_kind, crop_code — removed 2026-08-30, L3 一律對 group
  string category_id = 1;
  string status = 2;                    // resolved | unmapped | ambiguous
  // 🔴 resolved 有兩種形狀，group_code 與 commodity_code **恰好一個**非空
  // （DB CHECK 強制）。消費端不可只判 group_code——只判一個會讓 commodity
  // 映射看起來像「resolved 但沒有目標」，退回無價格路徑。
  optional string group_code = 5;       // 蔬果花卉，價格走 crop_group 批發拍賣序列
  optional string label = 6;            // 僅 resolved 有值，group 或 commodity 的現行顯示名
  string mapping_version = 7;
  // commodity_code 是多來源品項（毛豬、家禽、蛋品、糧價）的查詢碼，
  // 值是 commodity.id 的十進位字串——與 GetForecastCurve 收的 crop_code
  // 是同一個命名空間的對外識別，消費端直接原樣帶去查即可。
  optional string commodity_code = 8;   // 直採序列，價格走 source_passthrough
  repeated CategoryCropVariety crop_varieties = 9;
}

message CategoryCropVariety {
  string crop_code = 1;
  string name = 2;
  optional string variant_name = 3;
}

message UpsertCategoryMappingRequest {
  reserved 3, 4; // selection_kind, crop_code — removed 2026-08-30, L3 一律對 group
  string category_id = 1;
  string status = 2;                    // resolved | unmapped | ambiguous
  optional string group_code = 5;       // 僅 status=resolved 時必填
  optional string source_note = 6;
  int64 updated_by = 7;                 // Gateway 從 JWT 填入，不接受 client 傳入語意（HTTP 層擋）
}

message UpsertCategoryMappingResponse {
  string category_id = 1;
  string status = 2;
  string mapping_version = 3;
  string updated_at = 4;                // ISO 8601 UTC
}

message ListCategoryMappingWorklistRequest {
  // 空字串＝不篩選；有值時只能是 unmapped｜ambiguous（resolved 不會出現在待處理清單，語意上已處理完）。
  string status = 1;
}

message ListCategoryMappingWorklistResponse {
  repeated CategoryMappingWorklistItem items = 1;
}

message CategoryMappingWorklistItem {
  string category_id = 1;
  string category_name = 2;             // 來自 category service 的分類名稱，供人工判讀不必跨系統對照
  string status = 3;                    // unmapped | ambiguous
  optional string updated_by = 4;       // 完全查無列時為 unset
  optional string updated_at = 5;       // 完全查無列時為 unset
}

// ==================== categoryId 分級彙總價格（issue #2786 後續）====================

message GetCategoryPriceRollupRequest {
  string category_id = 1;  // product-service 分類樹任一層（L1/L2/L3）
}

message GetCategoryPriceRollupResponse {
  string category_id = 1;
  int32 level = 2;                      // 1｜2｜3
  // ready | mixed_layer | unavailable。
  //
  // mixed_layer：這個分類底下的子節點分屬不同價格層級（批發拍賣／產地／活體／
  // 零售／躉售）或不同單位，算術平均沒有意義，因此**不回傳任何彙總值**
  // （latest_price／prev_price 皆 unset、points 為空）。消費端應引導使用者
  // 下鑽到具體品項，不得把它當成 unavailable 呈現——「算不出來」與「沒有資料」
  // 是兩件事。實例：肉類 L1 底下豬肉與羊肉是活體拍賣價，雞鴨鵝是產地價。
  string status = 3;
  optional string latest_price = 4;     // 字串化數字，避免 JS 精度問題；非 ready 時 unset
  optional string prev_price = 5;
  repeated CategoryPriceRollupPoint points = 6;
  int32 source_group_count = 7;
  string computed_at = 8;               // ISO 8601 UTC
  // 七日預測全市場曲線（GroupForecast 對子分類取平均後的結果）；空陣列代表
  // 這個 category 沒有可用的預測，不是查詢失敗。
  repeated CategoryForecastPoint forecast_points = 9;
  // latest_price／prev_price／points 這些數字是什麼層級、什麼單位。
  // status=ready 時必定成對出現；mixed_layer 與 unavailable 時皆 unset
  // （那兩種狀態本來就沒有彙總值）。
  //
  // 擴充前寫入、且尚未被每日批次覆寫的歷史列兩欄為空，語意是
  // wholesale_auction / kg。消費端必須容忍空值並套用這個預設，
  // 不得把空值當成「未知」而隱藏價格。
  optional string price_layer = 10;
  optional string unit = 11;
}

message CategoryPriceRollupPoint {
  string trade_date = 1;   // YYYY-MM-DD
  string avg_price = 2;    // 字串化數字
}

message CategoryForecastPoint {
  int32 horizon_days = 1;   // 1-7
  string target_date = 2;   // YYYY-MM-DD
  optional string p10 = 3;  // 字串化數字，比照 latest_price 既有慣例
  optional string p50 = 4;
  optional string p90 = 5;
}
