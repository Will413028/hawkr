# Service Alert Rules
# Monitors service health and performance

groups:
  - name: service-availability
    interval: 30s
    rules:
      # Service Down Alert（pod 存在但 /metrics 抓不到 → up==0）
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      # Prod Service Absent — 整個服務所有 pod 消失（**scrape 傳輸的服務**）。
      # App metrics 走 Prometheus Agent（kubernetes_sd）：pod 全滅時 up series 是「消失(absent)」而非 up==0，
      # 上面的 ServiceDown 抓不到「全服務下線」。用 absent() 對預期存在的 prod 服務補這個偵測缺口
      # （原本由 file_sd 靜態 target 隱含提供；#1377 收斂雙抓移除 file_sd app 後改由此明確保障）。
      #
      # 🔴 2026-09-07 修正：**這條規則之前對 7 個服務永遠 firing**，因為它們沒有、也不可能有 up series。
      # 原清單 14 個裡：
      #   - account / buyer / seller / im / ai / content 已改 gRPC-only，指標走 OTLP，**沒有 scrape target**
      #     ⇒ up{job=…} 這個 series 在 prod 從不存在 ⇒ absent() 恆為真。改由下方 ProdOtlpServiceAbsent 承接。
      #   - invoice-service 曾因 prod replicas=0（刻意未部署）移出清單；#3230 已把 replicas 改回 1，
      #     **加回本條**。它不是 gRPC-only：k8s/values/invoice-service.yaml 有 ports.http(10040)，
      #     chart 因此打 prometheus.io/scrape ⇒ 有 up series，與 order／product 同類。
      #     ⚠️ 一度誤加進下方 ProdOtlpServiceAbsent —— 那條要的是 server_start_total，而它來自
      #     pkgotel.InitMeterProvider，invoice-service 沒有呼叫（全 repo 只有那 11 個服務有）⇒
      #     absent() 恆為真 ⇒ 會讓整條 or 鏈永久 firing，把那 11 個服務的偵測一起毀掉。
      #     判準：**看 k8s/values/<svc>.yaml 有沒有 `transportMode: grpc-only`** —— 那才是 chart
      #     決定要不要打 prometheus.io/scrape 的條件（deployment.yaml 的 $grpcOnly）。
      #     ⚠️ 不要用「有沒有 ports.http」當判準：chart 對 ports.http.containerPort 有預設值 8080，
      #     照字面永遠為真。今天兩者恰好同解（11 個 grpc-only 服務都沒顯式寫 ports），但下一個
      #     服務若同時寫了 ports.http 與 transportMode: grpc-only，照 ports 判會放錯條、重現永久 firing。
      #   ⚠️ 本列在 prod 完成部署前會 firing，那是正確的（它說的正是「invoice-service 在 prod
      #     不存在」這個事實），且有明確終止條件。它同時是 G8（replicas 只有 1 合法）的唯一偵測：
      #     有人再把 replicas 設回 0 時 deploy job 全綠、kubectl 顯示 0/0，只有這條會響。
      # 症狀是這條 alert 連續 firing 14 小時以上、7 個實例。**永遠響的告警比沒有告警更糟**——真的有服務
      # 消失時，新實例會被埋進一條早就紅著的 alert 裡，而把它靜音的人同時失去了真正的訊號。
      #
      # ⚠️ 維護規則：**這份清單綁定「該服務用哪種傳輸把指標送出去」**。任何服務改變傳輸（scrape ⇄ OTLP）
      # 時必須同步搬移它在這兩條規則之間的位置，否則就會重現上述靜默失效。下方 ProdWorkloadNotRunning
      # 不依賴手寫清單，是這個失效模式的兜底。
      - alert: ProdServiceAbsent
        expr: |
          absent(up{job="gateway", env="prod"})
          or absent(up{job="shipping-service", env="prod"})
          or absent(up{job="media-service", env="prod"})
          or absent(up{job="product-service", env="prod"})
          or absent(up{job="order-service", env="prod"})
          or absent(up{job="aftersales-service", env="prod"})
          or absent(up{job="payment-service", env="prod"})
          or absent(up{job="invoice-service", env="prod"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prod service {{ $labels.job }} 完全消失（無任何 up series）"
          description: "{{ $labels.job }}(env=prod) 已 5 分鐘沒有任何 metrics（所有 pod 消失或 agent 停抓）。"

      # Prod OTLP Service Absent — 同上，但針對 **gRPC-only／OTLP 傳輸**的服務。
      # 它們沒有 /metrics 可刮，因此沒有 up series；等價的存活訊號是 server_start_total
      # （pkg/server 的 OTel instrument，每個 PeriodicReader 週期重送一次累積值）。
      # 所有 pod 消失 ⇒ 推送停止 ⇒ series 在 staleness 窗後消失 ⇒ absent() 成立，語意與上面一致。
      - alert: ProdOtlpServiceAbsent
        expr: |
          absent(server_start_total{job="ai-service", env="prod"})
          or absent(server_start_total{job="crm-service", env="prod"})
          or absent(server_start_total{job="im-service", env="prod"})
          or absent(server_start_total{job="notification-service", env="prod"})
          or absent(server_start_total{job="review-service", env="prod"})
          or absent(server_start_total{job="seller-service", env="prod"})
          or absent(server_start_total{job="social-service", env="prod"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prod OTLP service {{ $labels.job }} 完全消失（無任何 OTLP 指標）"
          description: "{{ $labels.job }}(env=prod) 已 5 分鐘沒有推送任何 OTLP 指標（所有 pod 消失，或 otel-collector 斷線）。"

      # Prod Workload Not Running — **不依賴任何手寫服務清單**的兜底。
      # 上面兩條的正確性建立在「清單與實際傳輸方式一致」，而 2026-09-07 的事故正是清單沒跟上傳輸變更。
      # 這條改由 kube-state-metrics 直接讀宣告面，語意是「宣告要跑但一個可用副本都沒有」：
      #   - 新增服務、改名、換傳輸 ⇒ 自動涵蓋，不需要改這裡。
      #   - 刻意 scale 到 0 的 ⇒ spec_replicas > 0 這個守衛會排除，不誤報。
      #     ⚠️ 這裡曾舉 prod 的 invoice-service 為例，#3230 之後不再成立：`replicas: 0` 已被
      #     §12.3.0 G8 明文列為非法值（它把「一個功能未開通」放大成「整個服務不存在」且完全靜默）。
      # 與上面兩條互補而非取代：這條答「工作負載在不在」，上面兩條答「指標有沒有送到」——
      # pod 活著但 agent／collector 斷線時只有上面兩條會響。
      - alert: ProdWorkloadNotRunning
        expr: |
          kube_deployment_status_replicas_available{env="prod"} == 0
          and on(deployment, env) kube_deployment_spec_replicas{env="prod"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prod workload {{ $labels.deployment }} 沒有任何可用副本"
          description: "{{ $labels.deployment }}(env=prod) 宣告 replicas > 0 但可用副本為 0，已持續 5 分鐘。"

      # High HTTP Error Rate (5xx) — Gateway
      - alert: HighHttpErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate on {{ $labels.job }}"
          description: '{{ $value | humanizePercentage }} of requests returning 5xx (threshold: 5%)'

      # High HTTP Latency (P99 > 3s) — Gateway
      # 排除 SSE/WebSocket 長連線 path：本身就會撐住連線到逾時，跟真實延遲無關
      - alert: HighHttpLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{path!~"/api/v1/app/notifications/stream|/api/v1/app/chat/ws"}[5m])) by (job, le)
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP P99 latency on {{ $labels.job }}"
          description: 'P99 latency is {{ printf "%.2f" $value }}s (threshold: 3s)'

  - name: service-resources
    interval: 60s
    rules:
      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (process_resident_memory_bytes / 1024 / 1024 / 1024) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: '{{ $labels.job }} is using {{ printf "%.2f" $value }}GB memory'

      # Java Heap Memory Warning
      - alert: JavaHeapMemoryHigh
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Java heap memory high on {{ $labels.job }}"
          description: 'Heap usage is {{ $value | humanizePercentage }}'

  - name: go-runtime-alerts
    interval: 60s
    rules:
      # ⚠️ 下面兩條的 500／1000 門檻是照**應用服務**校的：2026-09-10 實測 35 條
      # go_goroutines 裡，gateway 與 12 個 Go 服務全部 <150（最高 gateway/dev 146）。
      #
      # 監控棧（Loki／Tempo／Grafana／promtail／alertmanager）必須排除，不是因為
      # 不想監控它們，而是**這組門檻對它們沒有鑑別力**：它們的正常穩態就在門檻之上
      # （2026-09-10 加進 scrape 的那一刻實測 tempo 1017、loki 558 ⇒ 立刻 pending，
      # tempo 那條還是 critical）。Loki／Tempo 的 per-tenant ingester／WAL／compactor
      # 各自開 goroutine，上千是設計如此。用同一個門檻只會製造一條永遠響的告警，
      # 而永遠響的告警比沒有告警更糟——真的有事時新實例會被埋進早就紅著的 alert 裡。
      #
      # 用明列 job 排除而不是「排除沒有 env label 的」：後者會把 prometheus 與
      # otel-collector 一起排掉（兩者目前在範圍內且正常，prometheus 131），而且未來
      # 新增的應用服務若漏設 env label 會被靜默排除——那是往「少偵測」的方向失敗。
      # 明列的失敗方向是「多一條吵的告警」，看得見、改得掉。
      #
      # Followup：監控棧要有自己的 goroutine 門檻，得先收一段真實基線（單一取樣不是
      # 基線）。追蹤在 wiki backend-payuni Pending 的監控棧存活條目。
      - alert: GoGoroutineLeak
        expr: |
          go_goroutines{job!~"loki|tempo|grafana|promtail|alertmanager"} > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Possible goroutine leak on {{ $labels.job }}"
          description: '{{ $labels.job }} has {{ printf "%.0f" $value }} goroutines'

      # Goroutine Spike — 短時間內 goroutine 數量暴增
      - alert: GoGoroutineSpike
        expr: |
          go_goroutines{job!~"loki|tempo|grafana|promtail|alertmanager"} > 1000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Goroutine spike on {{ $labels.job }}"
          description: '{{ $labels.job }} has {{ printf "%.0f" $value }} goroutines'

      # GC Pause High — GC 暫停時間佔比過高
      - alert: GoGCPauseHigh
        expr: |
          rate(go_gc_duration_seconds_sum[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High GC pause on {{ $labels.job }}"
          description: '{{ $labels.job }} GC pause is {{ printf "%.3f" $value }}s/s'

  - name: grpc-alerts
    interval: 30s
    rules:
      # gRPC High Error Rate — Go services
      - alert: GrpcHighErrorRate
        expr: |
          (
            sum(rate(grpc_server_requests_total{code!="OK"}[5m])) by (job, method)
            /
            sum(rate(grpc_server_requests_total[5m])) by (job, method)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC error rate on {{ $labels.job }}"
          description: '{{ $labels.method }} has {{ $value | humanizePercentage }} error rate'

  - name: mq-consumer-alerts
    interval: 30s
    rules:
      # #1871 OBS-08：handler 級直接信號，互補 infra-alerts.yml rabbitmq-alerts
      # 既有的 queue 級間接信號（RabbitMQDLQMessages/RabbitMQNoConsumers/
      # RabbitMQQueueNoConsumersStalled）——那三條抓 consumer 數歸零或訊息堆積，
      # 抓不到「consumer 仍在跑、但持續處理失敗」的情況。見 MQ 與事件管理規範 §3.3.6。
      #
      # MQ Consumer Error Rate High — Go（pkg/mq 唯一共用 consume 入口，有完整
      # ack/retry/dlq/requeue 四態，可算失敗率比值）
      - alert: MQConsumerErrorRateHigh
        expr: |
          (
            sum(rate(mq_consume_total{result=~"retry|dlq|requeue"}[10m])) by (job, queue)
            /
            sum(rate(mq_consume_total[10m])) by (job, queue)
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} queue {{ $labels.queue }} consumer 失敗率過高"
          description: '{{ $value | humanizePercentage }} of {{ $labels.queue }} deliveries ended in retry/dlq/requeue over 10m (threshold: 10%)'

      # MQ Consumer Failure Rate High — Java（MqErrorHandler.handleFailure 是
      # retry/dlq 唯一集中決策點，但成功 ack 分散在 32 個 @RabbitListener 各自
      # 呼叫，沒有集中的成功計數可當分母，改用絕對速率而非比值）
      - alert: MQJavaConsumerFailureHigh
        expr: |
          sum(rate(mq_java_consume_failure_total[10m])) by (job, queue) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} queue {{ $labels.queue }} consumer 持續 retry/dlq"
          description: '{{ $labels.queue }} averaging {{ printf "%.2f" $value }} retry/dlq outcomes/s over 10m (threshold: 0.1/s)'

  - name: rate-limit-alerts
    interval: 30s
    rules:
      # Gateway 分層限流（ratelimit.go）拒絕率異常飆高 —— 429 已計入
      # http_requests_total{status="429"}。該 metric 自 #2264 起帶 subject_kind 與
      # tier label，所以「是哪一條軸在被擋」（visitor / ssr / ci）現在查得到；
      # 「是哪一個 subject」仍然查不到——subject 是 v:<ip>，基數無界，刻意不做 label，
      # 那個問題的唯一答案在 logBlocked 抽樣 log 的 subject 欄（同一行還有 ip 欄：
      # subject 答「算誰頭上」、ip 答「哪台機器在打」，SSR / CI / admin 代打時兩者不同）。
      # 閾值為首次上線估計值（未經 prod 真實流量量測），上線後依實際 429 基線調整。
      - alert: GatewayRateLimitRejectionSpikeProd
        expr: |
          sum(rate(http_requests_total{job="gateway", env="prod", status="429"}[5m])) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Gateway 429 拒絕率異常飆高 (env=prod)"
          description: "近 5 分鐘平均每秒 {{ $value }} 次 429，遠高於正常水位，疑似 DDoS / 濫用流量正被限流擋下，查來源 IP 分布（logBlocked 抽樣 log）。"

      # dev 閾值較寬且 for 較長：容忍 e2e 測試套件（如 seller login 90+ 條測試）短時間
      # 打 auth-tier 端點造成的雜訊，只在真的持續飆高時才報。
      - alert: GatewayRateLimitRejectionSpikeDev
        expr: |
          sum(rate(http_requests_total{job="gateway", env="dev", status="429"}[5m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gateway 429 拒絕率異常飆高 (env=dev)"
          description: "近 10 分鐘平均每秒 {{ $value }} 次 429，超出 dev 正常水位（含 e2e 測試雜訊的寬容值），查是否為測試誤觸或真實濫用流量。"

      # ── 來源簽章 X-HK-Origin-Auth（#2264，01 設計書 §3.2.11）──────────────────
      #
      # 選簽章而不是明文共享 secret 的理由是「失效可量測」，那就必須真的量測。
      # 失效的形狀是：secret 任一端沒更新 / 輪替沒對齊 / 沒注入 ⇒ 網頁 SSR 的簽章
      # 全部驗不過 ⇒ fail-open 降級回對端 IP ⇒ **全站 SSR 又共用一把 key，即
      # #2264 本身 100% 重現**——而服務正常回應、CI 全綠、頁面 200，沒有任何人會知道。
      #
      # A：機制根本沒啟用（secret 為空 ⇒ 該把密鑰的驗證停用）。
      # 用 gauge 而非 rate(result="ok") == 0：counter 在「從未成功過」時**沒有
      # series**，空向量讓條件永遠求值不成立——而「secret 從沒被建立」正是這個情境，
      # 也正是最需要被抓到的那一個。gauge 恆有值（程序啟動即為兩個 key 各寫一次），
      # 這個洞不存在。
      # 逐 series 判定，**不可以**寫成 min() 或任何聚合掉 key 的形式：兩把密鑰是
      # 各自獨立的開關，而「人工只建了一把」正是最可能的失誤形狀；聚合會讓有設的
      # 那把用 1 蓋掉沒設的那把，蓋掉的正好是要抓的東西。by (env) 同理——dev 有設
      # 不代表 prod 有設。
      - alert: GatewayOriginAuthDisabled
        expr: |
          gateway_origin_auth_enabled{job="gateway"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Gateway 來源簽章驗證停用：key={{ $labels.key }} (env={{ $labels.env }})"
          description: "ORIGIN_AUTH{{ if eq $labels.key \"ci\" }}_CI{{ end }}_SECRET 在 env={{ $labels.env }} 未設定，該類 X-HK-Origin-Auth 一律不採信、流量落回 per-ClientIP 配額（#2264 的原始狀態）。secret 由人工建立：在該環境跑 k8s/scripts/create-secrets.sh。"

      # B：簽章對不上（密鑰漂移 / 輪替沒對齊 / 時鐘偏移）。
      # 分母排除 absent：絕大多數流量（瀏覽器、App）本來就不帶簽章，也包含「該把
      # 密鑰停用時的請求」——把它們算進去比率永遠觸發不了，而那正是 A 的職責範圍。
      - alert: GatewayOriginAuthSignatureFailures
        expr: |
          (
            sum by (env) (rate(gateway_origin_auth_total{job="gateway", result=~"bad_sig|expired|malformed"}[5m]))
            /
            sum by (env) (rate(gateway_origin_auth_total{job="gateway", result!="absent"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway 來源簽章驗證失敗率過高 (env={{ $labels.env }})"
          description: "近 5 分鐘 {{ $value | humanizePercentage }} 的 X-HK-Origin-Auth 驗不過（fail-open 降級成 per-ClientIP）。查密鑰是否兩端不一致、輪替是否只做了一半，或簽章端時鐘偏移超過 60 秒。"

      # C：SSR 軸逼近配額上限（硬上限依賴接入治理規範 §6 要求的「逼近上限」告警）。
      # 這條軸的定位是**失控保險絲不是日常節流閥**：網頁是自家系統，日常量應該遠低
      # 於 200 req/s。40% 門檻對應約 20–24 個並發重度瀏覽訪客——真的長到那個量體是
      # 好事，但要在觸頂**之前**知道，因為觸頂的症狀是網頁整片 429。
      - alert: GatewaySSRQuotaUtilizationHigh
        expr: |
          (
            sum by (env) (rate(http_requests_total{job="gateway", subject_kind="ssr", tier="moderate"}[5m])) * 60
            /
            max by (env) (gateway_ratelimit_limit{job="gateway", tier="moderate", subject_kind="ssr"})
          ) > 0.4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "網頁 SSR 限流軸用量達 {{ $value | humanizePercentage }} (env={{ $labels.env }})"
          description: "SSR 軸（RATE_LIMIT_MODERATE_SSR_PER_WINDOW）用量超過 40%。要嘛並發訪客真的長上來了（該調高上限並重算預算），要嘛網頁有失控的扇出迴圈。"

  # ===========================================================================
  # 選填功能的開通狀態（backend#3329）
  #
  # 🔴 這一組存在的唯一理由：#3329 把五個服務的「業務前置條件」從啟動必要條件改成
  # graceful degradation，於是「這個環境沒開通 X」從一個**會 CrashLoop 的狀態**變成
  # 一個**完全安靜的狀態**。沒有這一組，那次改動的淨效果只是把開機失敗換成靜默失能
  # ——而靜默失能比 CrashLoop 貴得多（#3230：invoice-service 76 條路由消失三天無人察覺）。
  #
  # ⚠️ severity 一律 warning 不是 critical：**未開通是合法的部署狀態**，不是故障。
  # 這些告警要回答的是「有沒有人忘了開通它」，不是「現在壞了」。開成 critical 會讓
  # 每個刻意不開通的環境長期紅著，兩週後沒有人再看它——那等於沒有告警。
  #
  # ⚠️ for: 1h 不是 10m：憑證要靠人工建 secret ＋ 一次 rollout，分鐘級的窗口必然誤報。
  #
  # ⚠️ 每一條都 `by (env)` 並用 max：dev 有設不代表 prod 有設，不分 env 聚合會讓有設的
  # 那個環境把沒設的蓋掉，而蓋掉的正好是要抓的東西（同 GatewayOriginAuthDisabled）。
  #
  # ⚠️ **_incomplete 那幾條與 _enabled 互斥**：enabled==0 且 incomplete==0 ＝ 尚未開通
  # （可能是刻意的）；incomplete==1 ＝ 憑證只設了一半 ＝ 配置錯誤，一定有人打錯字。
  # 兩者處置相反，所以分成兩條而不是一條。
  # ===========================================================================
  - name: feature-provisioning-alerts
    rules:
      - alert: SellerAddressLookupDisabled
        expr: max by (env) (seller_address_lookup_enabled) == 0 and max by (env) (seller_address_lookup_config_incomplete) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：賣家端地址查詢（TGOS）尚未開通"
          description: "seller-service 的 SuggestAddress／ValidateAddress 一律回 9700。其餘 89 支 RPC 正常服務。處置：補齊 hawkr-address secret 的 TGOS_QUERYADDR_APPID／TGOS_QUERYADDR_APIKEY、configmap 的 TGOS_BASE_URL／TGOS_PROXY_CALLER_KEY_FILE，以及 tgos-proxy-caller-credentials 這個 secret volume（四者缺一都會落在本條）。⚠️ 刻意不開通地址查詢的環境，本條會長期為真：那是預期行為，不是誤報。"

      - alert: SellerAddressLookupConfigIncomplete
        expr: max by (env) (seller_address_lookup_config_incomplete) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：賣家端地址查詢設定只有一半"
          description: "TGOS 四項設定（TGOS_BASE_URL／TGOS_QUERYADDR_APPID／TGOS_QUERYADDR_APIKEY／TGOS_PROXY_CALLER_KEY_FILE）有設到但不齊全，或 env 齊全而 GCP SA 金鑰檔讀不到。⚠️ 這**不是**「尚未開通」——一定有人打錯字或漏掛 secret volume。seller-service 開機當下的 Error log 會列出哪一項是空的。"

      - alert: SellerPayuniMerchantDisabled
        expr: max by (env) (seller_payuni_merchant_enabled) == 0 and max by (env) (seller_payuni_merchant_config_incomplete) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：金流商家建檔（PayUni 代理商）尚未開通"
          description: "seller-service 的 BindSeller／GetSellerStatus／UpdateMerchant 一律回 9704。賣家看到的是「尚未開通」而不是一個卡在 PENDING 永遠不動的申請——後者是 fail-open 會產生的症狀，本次刻意不做。處置：補齊 hawkr-payuni secret 的 PAYUNI_AGENT_HASH_KEY 與 PAYUNI_AGENT_HASH_IV（兩者必須同批補，只補一半會掉進 SellerPayuniMerchantConfigIncomplete）。"

      - alert: SellerPayuniMerchantConfigIncomplete
        expr: max by (env) (seller_payuni_merchant_config_incomplete) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：PayUni 代理商憑證只設了一半"
          description: "PAYUNI_AGENT_HASH_KEY 與 PAYUNI_AGENT_HASH_IV 必須成對。只有一個 ⇒ 配置錯誤，不是未開通。"

      - alert: PayuniReconciliationFailing
        expr: sum by (env) (rate(payuni_sync_api_error_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：PayUni 實名認證對帳輪詢持續失敗"
          description: "背景對帳呼叫 search_merchant_status 持續失敗超過 30 分鐘。🔴 這條失效是靜默的：租約在呼叫**之前**就已經前進，失敗的那一筆要等一個完整的節流窗（payuniPollMinInterval）才重試，而 client 端的 freshness 讀的是 last_synced_at——它不會因為失敗而變舊，只是停在原地。⇒ 畫面上一切正常，對帳其實已經停擺。AGENT_NOTIFY webhook 仍是主通道，所以短時間內賣家不一定受影響；但 webhook 一旦也漏收就沒有第二道防線了。處置：先確認 PayUni 端是否故障（seller_payuni_client_degraded_total 有沒有同時在跳），再看 seller-service 的 Warn log『failed to get PAYUNi seller status』。"

      - alert: PayuniClientRateLimitDegraded
        expr: sum by (env) (increase(seller_payuni_client_degraded_total[1h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：疑似被 PayUni 擋下，本地速率上限已自動砍半"
          description: "looksRateLimited 判定收到的錯誤像是被上游擋（429／503／連線被拒或重置），限速器已把自訂 QPS 砍半並會在 5 分鐘內線性回升。🔴 PayUni **沒有公開任何速率限制**，所以這個計數器就是我們唯一的實測來源：它從 0 開始跳代表目前的 QPS 設定已經踩到對方的線。處置：(1) 撈當時的錯誤原文，把實際形狀補進 services/seller-service/internal/client/payuni/ratelimit.go 的 looksRateLimited 與 docs/第三方整合/；(2) 調降 maxQPS 或放長 payuniPollMinInterval，並同步更新容量帳。⚠️ 不要用調高上限的方式處理——那是把自訂上限當成可有可無（規範 §7 禁止事項）。"

      - alert: PayuniReconciliationQueueSaturated
        expr: max by (env) (payuni_pending_registrations) >= 100
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：PayUni 對帳佇列取件被批次上限截斷"
          description: "每個 tick 取件到的 pending 筆數持續貼著 payuniSyncBatchSize（目前 100，⚠️ 這個閾值與該常數耦合，改常數要一起改這裡），代表對帳已經追不上進件速度：穩態吞吐上限是 payuniSyncBatchSize × payuniPollMinInterval ÷ payuniSyncInterval（目前 100 × 2h ÷ 15m = 800 筆），超過就有列開始排不進來。處置：依容量帳調整三個參數之一，或替 seller-service 加副本（⚠️ 加副本前先讀 ratelimit.go 的註記：限速器是每副本上限，replicas = N ⇒ 對 PayUni 的真實上限變成 N × maxQPS）。容量帳寫在 services/seller-service/internal/usecase/payuni.go 的 payuniPollMinInterval 常數註解。"

      - alert: AIAssistantProviderDisabled
        expr: max by (env) (ai_assistant_provider_enabled) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：通用 AI 助理（Gemini）尚未開通"
          description: "AIAssistantService 的聊天／專家類 RPC（BuyerChat／SellerChat／SellerProductListingChat／SellerProductAutofill 等由 internal/agent 的 runner 驅動、實際呼叫 LLM 的路徑）一律回 9703（fail-closed，不是回空字串——「功能沒開」與「模型沒話說」必須分得出來）。BuyerReturnPolicy（純靜態文案）與 *LatestSession（讀歷史 session）不呼叫 LLM，不受影響；RFQ 詢價、AI 配額 admin、影像處理、AI 推薦等其餘 RPC 也正常服務。⚠️ 在 #3329 之前這個狀態是 fx abort ⇒ 59 支 RPC 全滅；#3519 把當時列舉的 Chat／ProductQA／GenerateRecommendations／GenerateImage 那批死 RPC 連同承載它們的舊 adapter 一併刪除，這支 gauge 現在覆蓋的是上面列的 AIAssistantService 路徑。處置：補 hawkr-ai secret 的 GEMINI_API_KEY。⚠️ 本條為 0 **不代表** Gemini 上游掛了——它只答「憑證有沒有設」。"

      # 🔴 ai-service 有**兩條**獨立的 LLM 路徑，兩支 gauge 缺一不可：
      #   ai_assistant_provider_enabled  → 通用聊天（internal/llmprovider.NewAssistant，供 AIAssistantService 的聊天／專家類 RPC）
      #   ai_procurement_llm_enabled     → 採購助手 RFQ（internal/procurement）
      # #3329 盤點時只列了前者；後者是同一個 class 的第二條中止路徑，
      # 而且它受 EXTRACTOR_MODEL 影響（預設 gemini-2.5-flash、dev/prod 是 deepseek-flash）。
      # 只看其中一支會漏掉另一條整條路徑。
      #
      # 🔴 #3519 Task 5 fix round 1：ai_assistant_provider_enabled 原本掛在
      # internal/client/gemini（承載真正呼叫 Gemini SDK 的舊 adapter；那份程式碼
      # 唯一的 caller 是 Chat／ProductQA／GenerateImage／GenerateRecommendations
      # 等已刪除的死 RPC，adapter 已隨它們一起刪掉）。gauge 本身仍有效——
      # NewAssistant 跟舊 adapter 吃同一把 GEMINI_API_KEY——因此隨 NewAssistant
      # 搬到 internal/llmprovider，指標名稱與 expr 不變。
      - alert: AIProcurementLLMDisabled
        expr: max by (env) (ai_procurement_llm_enabled) == 0 and max by (env) (ai_procurement_llm_config_incomplete) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：採購助手（RFQ）的 LLM 尚未開通"
          description: "抽取／敘述／控制三條路徑一律回 9703（fail-closed）。⚠️ 停用實作刻意**不回空 patch**——空 patch 是抽取器的合法輸出，回它的話呼叫端會照常續行，買家經歷「問什麼都沒反應」而監控上完全看不出 LLM 沒接上。處置：用 ai_procurement_llm_info 看目前解析出來的是哪顆模型（停用時該序列不存在），補它所屬 provider 的 key（gemini-*→GEMINI_API_KEY／deepseek-*→DEEPSEEK_API_KEY／gemma→OPENROUTER_API_KEY，皆在 hawkr-ai secret）。"

      - alert: AIProcurementLLMConfigIncomplete
        expr: max by (env) (ai_procurement_llm_config_incomplete) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：EXTRACTOR_MODEL 設定有誤"
          description: "兩種情況之一：① EXTRACTOR_MODEL **明確指定**了 deepseek／gemma 系列的模型卻沒有對應的 API key ② EXTRACTOR_MODEL 不在已驗過 quirk 的登記表裡（打錯字，或指定了一個真實存在但沒人驗過的模型——後者放行的話會靜默送出被端點拒絕的 request 形狀）。⚠️ 在 backend#3329 之前這兩種情況都會讓整個 ai-service 起不來（一個 env 的錯字連坐 59 支 RPC）；現在改成降級，代價是**錯字不再自己現形**，只剩這條告警看得到。開機當下的 Error log 會指出是哪一種，並列出登記表裡的合法值。"

      # #3519 刀 C：LLM 是硬上限依賴（provider 額度用盡已經實際發生過，#1979），
      # 之前只有事後的結果面 counter（procurement_llm_tokens_total）與上面兩支
      # on/off gauge——三者都答不出「是不是快逼近我們自己設的量了」。
      #
      # 🔴 這條與上面兩條（Disabled／ConfigIncomplete）回答的是不同問題：
      # 那兩條答「LLM 這條路徑現在通不通」，本條答「路徑通，但用量是不是快
      # 超出我們自訂的治理預算」——兩者互斥觸發時機：LLM 停用時幾乎不會有
      # token 用量，本條自然不會 fire；本條 fire 時代表 LLM 正常運作、只是
      # 用得比預期多。不要把本條當成「provider 掛了」的訊號，那是上面兩條
      # 與下面 AIProcurementLLMExtractionDegraded（接在 TokenBudgetExceeded
      # 之後，量的是 procurement_degraded_total）的職責。
      #
      # 分母 ai_procurement_llm_budget_limit 是我們自己宣告的數字，不是 provider 配額
      # （LLM_TOKEN_BUDGET_PER_MINUTE，k8s/values/ai-service.yaml）；未設定
      # 時該 gauge 完全缺席（不是 0），這條 expr 就沒有分母、算不出任何結果、
      # 不會 fire——這是刻意的。⚠️ 若改成 export 0 後果相反於直覺：正數除以 0
      # 在 PromQL 是 `+Inf`，`+Inf > 0.4` 成立，會讓這條告警**立刻且永久
      # fire**，不是永遠不 fire；一個假的「已逼近預算」訊號跟長期沒人管的
      # 告警是同一種缺陷。缺席才誠實：沒有資料就是沒有資料，不是恆假的 0。
      #
      # 形狀照 GatewaySSRQuotaUtilizationHigh（同檔 :348）：rate 換算成
      # 「每分鐘」以對齊 ai_procurement_llm_budget_limit 的單位，40% 門檻、for: 10m
      # 排除分鐘級抖動，severity 維持 warning——長期貼著這個數字可能只是
      # 用量成長（好事），不是故障。
      - alert: AIProcurementLLMTokenBudgetHigh
        expr: |
          (
            sum by (env) (rate(procurement_llm_tokens_total{kind!="cached"}[5m])) * 60
            /
            max by (env) (ai_procurement_llm_budget_limit)
          ) > 0.4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：採購助手 LLM token 用量達自訂預算的 {{ $value | humanizePercentage }}"
          description: "近 5 分鐘 procurement_llm_tokens_total（extract／narrate／realize／crop_suggest 四條角色的 prompt／completion／thoughts 合計，不含 cached——cached 是 prompt 的子集，算進去會重複計入且對不上 provider 實際計費）換算成的每分鐘 token 用量，已超過 LLM_TOKEN_BUDGET_PER_MINUTE（k8s/values/ai-service.yaml）宣告值的 40%。⚠️ 這不是 provider 掛了——LLM 仍在正常回應，AIProcurementLLMDisabled／AIProcurementLLMConfigIncomplete 才回答『通不通』。處置：先查是不是有失控的扇出（同一買家對話異常重複觸發 extract/narrate/realize，或候選排序邏輯在迴圈裡重複呼叫 LLM）；排除後若是真實用量成長，調高 LLM_TOKEN_BUDGET_PER_MINUTE 並重新評估容量帳（硬上限依賴接入治理規範 §5 R7）。"

      # 這條是同一顆比值換一個更高的門檻（100%），存在的理由是「用量超過
      # 自己宣告的上限」本身值得比 40% 逼近線更快被看到——但 🔴 2026-09-20
      # review 糾正了先前這裡的說法：**這條不是**硬上限依賴接入治理規範
      # §2②要求的「已觸上限的副作用」告警。②要的是拒絕／失敗訊號，證明
      # 依賴真的回絕了我們；這條與上面那條一樣，回答的仍然是「用量佔我們
      # 自己設的預算多少」，只是門檻換了。真正落地②的是下面的
      # AIProcurementLLMExtractionDegraded（量 procurement_degraded_total，
      # 也就是 provider 真的沒回應成功的那些 turn）。這條本身仍然有價值
      # （值班的人想更快知道「已經超過自訂上限」跟「快要超過」是兩件事），
      # 只是不能拿來當②的證據。
      #
      # for: 3m 比上面的 10m 短：「已經超過自己宣告的預算」不是分鐘級抖動
      # 可以合理解釋的狀態（不像「逼近中」需要更長窗排除偶發尖峰），值班的
      # 人應該更快知道。severity 仍是 warning，理由同上面那條與本檔慣例——
      # 這是我方自訂數字，沒有强制拒絕行為，長期紅著（用量持續成長中）不等
      # 於故障。
      - alert: AIProcurementLLMTokenBudgetExceeded
        expr: |
          (
            sum by (env) (rate(procurement_llm_tokens_total{kind!="cached"}[5m])) * 60
            /
            max by (env) (ai_procurement_llm_budget_limit)
          ) >= 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：採購助手 LLM token 用量已超過自訂預算（{{ $value | humanizePercentage }}）"
          description: "近 5 分鐘 procurement_llm_tokens_total（不含 cached，理由同 AIProcurementLLMTokenBudgetHigh）換算成的每分鐘 token 用量已達到或超過 LLM_TOKEN_BUDGET_PER_MINUTE（k8s/values/ai-service.yaml）宣告值的 100%——不是逼近，是已經超過我們自己定的線。⚠️ 與 AIProcurementLLMTokenBudgetHigh 的差別只在門檻與 for，兩者會同時 fire、不是重複告警。⚠️ 本條**不是**硬上限依賴接入治理規範 §2②要求的「已觸上限副作用」告警——那個角色由 AIProcurementLLMExtractionDegraded（procurement_degraded_total）擔任，本條只是同一顆比值換一個更高門檻。⚠️ 與 AIProcurementLLMDisabled／AIProcurementLLMConfigIncomplete 的差別同上面那條——LLM 仍在正常回應，這不是 provider 掛了。這是我方自訂、非強制性的治理數字，沒有任何程式路徑會因此拒絕或降級呼叫，所以本條不代表任何請求失敗；但持續超過代表容量帳已經跟不上真實用量。處置：立刻查是否有失控的扇出（同一買家對話異常重複觸發 extract/narrate/realize，或候選排序邏輯在迴圈裡重複呼叫 LLM）；排除後若是真實用量成長，調高 LLM_TOKEN_BUDGET_PER_MINUTE 並重新評估容量帳（硬上限依賴接入治理規範 §5 R7）。"

      # 硬上限依賴接入治理規範 §2②「已觸上限的副作用」的真正落地：上面兩條
      # （TokenBudgetHigh／TokenBudgetExceeded）都是同一顆比值換個門檻，回答
      # 的是「用量佔我們自己設的預算多少」——2026-09-20 review 指出這兩條都
      # 不是②要的東西：②要的是**拒絕／失敗訊號**，證明依賴真的回絕了我們，
      # 不是同一個用量指標的第二個門檻。procurement_llm_tokens_total 描述
      # 用量，從不描述失敗。
      #
      # procurement_degraded_total 才是那個訊號：internal/procurement/usecase/
      # graph_nodes.go 只在 extractor.Extract(...) 真的回 error（timeout、
      # provider 錯誤、額度用盡……）時才 +1——這正是 #1979 那類事故的直接
      # 後果，買家的訊息送出去，LLM 沒有正確回應，抽取器退回固定問法。這支
      # counter 存在已久（55 號設計書 §4 有列），但從來沒有接過任何告警。
      #
      # `and max by (env) (ai_procurement_llm_enabled) == 1` 是刻意的守門：
      # LLM 尚未開通時 disabledLLM.GenerateContent 對**每一次**呼叫都回
      # ErrDisabled（llmprovider/provider.go 的 disabledLLM 實作），一樣會讓
      # extractErr != nil、一樣會讓這支 counter 持續跳——但那個狀態已經由
      # AIProcurementLLMDisabled（for: 1h）覆蓋，是合法的部署狀態。不加這個
      # and，本條會在任何刻意不開通 LLM 的環境裡跟 AIProcurementLLMDisabled
      # 一起長期紅著，變成同一件事的第二份噪音，不是一個新訊號。
      #
      # for: 10m 是 rate 視窗（5m）的兩倍，比照 PayuniReconciliationFailing
      # （rate[15m] 配 for:30m）的同一個比例慣例：單一一次退化事件的
      # rate(...) > 0 只會撐一個 rate 視窗就自然歸零，湊不到 for: 10m；真正
      # 持續退化（provider 真的在拒絕，不是單次逾時）才撐得過去。
      - alert: AIProcurementLLMExtractionDegraded
        expr: |
          sum by (env) (rate(procurement_degraded_total[5m])) > 0
          and
          max by (env) (ai_procurement_llm_enabled) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：採購助手 LLM 抽取持續失敗，買家已經在收到降級回應"
          description: "extractor.Extract 持續回 error（timeout／provider 錯誤／額度用盡等），抽取器退回固定問法而非真正理解買家需求——這不是『快超出預算』，是**現在就在發生**的使用者體驗劣化，且 LLM 本身處於已開通狀態（ai_procurement_llm_enabled==1，排除了由 AIProcurementLLMDisabled 覆蓋、刻意未開通的那個狀態，避免同一件事被兩條告警重複計）。處置：查 EXTRACTOR_MODEL 所屬 provider（gemini／deepseek／gemma）當下的狀態頁與額度儀表板，確認是不是撞到 #1979 那類配額問題；同時看 ai-service log 的『procurement: graph extract_slots degraded』一行，裡面的 timeout 欄位可以分辨是逾時還是 provider 直接拒絕。"

      - alert: ShippingPayuniProviderDisabled
        expr: max by (env) (shipping_payuni_credentials_configured) == 0 and max by (env) (shipping_payuni_credentials_incomplete) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：PayUni 物流尚未開通"
          description: "shipping-service 所有 PayUni 呼叫（叫件／建單／標籤／門市地圖／建店）回 9705，一個位元組都不會送出去。⚠️ **運費計算不受影響**——它在結帳 hot path 上且完全不碰 PayUni，而在 #3329 之前 PAYUNI_AGENT_KEY 缺席會讓整個 Spring context 起不來、連運費計算一起死（實測坐實：Could not resolve placeholder 'payuni.agent.key'）。處置：補 hawkr-payuni secret 的 PAYUNI_AGENT_KEY 與 PAYUNI_AGENT_IV。"

      - alert: ShippingPayuniProviderConfigIncomplete
        expr: max by (env) (shipping_payuni_credentials_incomplete) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "env={{ $labels.env }}：PayUni 物流憑證只設了一半"
          description: "PAYUNI_AGENT_KEY 與 PAYUNI_AGENT_IV 必須成對。只有一個 ⇒ 配置錯誤，開機當下的 Error log 會指出來。"

