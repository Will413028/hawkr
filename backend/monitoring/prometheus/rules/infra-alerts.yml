# Infrastructure Alert Rules
# Monitors PostgreSQL, Redis, RabbitMQ, and system resources

groups:
  - name: k8s-workload-alerts
    interval: 60s
    rules:
      # 2026-07-13：dev cluster 有人手動 kubectl/helm 誤植 prod-only DB 設定，
      # coupon-service Helm release 卡 pending-rollback、im-service/cart-service
      # CrashLoopBackOff 長達數小時無人發現（當時無此告警）。
      - alert: KubePodCrashLooping
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod CrashLoopBackOff (pod={{ $labels.pod }} ns={{ $labels.namespace }} env={{ $labels.env }})"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} 已 CrashLoopBackOff 逾 5 分鐘，查 kubectl logs / helm history 是否有卡住的 release。"

      # 抓「起不來但還沒被判定 CrashLoopBackOff」的中間態（ImagePullBackOff、
      # readiness 一直過不了、被卡住的 rollout 等），比單看 CrashLoopBackOff 更廣。
      - alert: KubePodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod 逾 10 分鐘未 Ready (pod={{ $labels.pod }} ns={{ $labels.namespace }} env={{ $labels.env }})"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} 不是 CrashLoopBackOff 但也不是 Ready，可能卡在 ImagePullBackOff / readiness 探針失敗 / 部署中途卡住。"

  - name: postgresql-alerts
    interval: 60s
    rules:
      # PostgreSQL 連不上（postgres-exporter 活著但連不到 DB）— 抓「exporter 綠燈(up=1)但 pg_up=0」的失明狀態。
      # 2026-07 實際發生過：prod DB 遷 PlanetScale 後 exporter 仍指舊 Aliyun RDS，pg_up=0 數月無人察覺（無此告警）。
      - alert: PostgresDown
        expr: pg_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 連不上 (instance={{ $labels.instance }} env={{ $labels.env }})"
          description: "postgres-exporter pg_up=0 逾 5 分鐘：exporter 活著但連不上 DB（憑證/host/網路），該環境 DB 指標已失明。"

      # PostgreSQL Connection Pool Exhaustion
      - alert: PostgreSQLConnectionPoolHigh
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool is nearly exhausted"
          description: '{{ $value | humanizePercentage }} of max connections in use'

      # PostgreSQL Slow Queries (queries running > 30s)
      - alert: PostgreSQLSlowQueries
        expr: |
          pg_stat_activity_max_tx_duration{state="active"} > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL long-running queries detected"
          description: 'Longest active query running for {{ printf "%.0f" $value }} seconds'

      # PostgreSQL Dead Tuples (needs VACUUM)
      - alert: PostgreSQLHighDeadTuples
        expr: |
          pg_stat_user_tables_n_dead_tup > 100000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL table has many dead tuples"
          description: 'Table {{ $labels.relname }} has {{ printf "%.0f" $value }} dead tuples, consider running VACUUM'

  - name: redis-alerts
    interval: 60s
    rules:
      # Redis 連不上（redis-exporter 活著但連不到 Redis）— 對稱 PostgresDown。
      # 泛用的 ServiceDown(up==0) 只抓得到 exporter 本身掛掉；exporter 綠燈但
      # Redis 拒絕連線／認證失敗時 up=1、redis_up=0，過去無任何規則涵蓋。
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 連不上 (instance={{ $labels.instance }} env={{ $labels.env }})"
          description: "redis-exporter redis_up=0 逾 2 分鐘：exporter 活著但連不上 Redis。session 寫入會失敗（登入全滅），優先處理。"

      # Redis Memory High
      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: 'Using {{ $value | humanizePercentage }} of max memory'

      # Redis 開始逐出 key —— #2014 病根的**直接指標**，原三條 Redis 告警全不覆蓋。
      # maxmemory-policy=allkeys-lru 不區分 session 與快取：記憶體壓到上限時被逐出的
      # 可能正是 session ＝ 靜默的大規模登出（RedisMemoryHigh 的 85% 閾值只是預警，
      # 逐出已經是「資料真的丟了」）。任何非零逐出都要看，不設數量閾值。
      # 容量契約與現況數字見 docs/速查參考/Redis 快取管理.md §5。
      - alert: RedisKeysEvicted
        expr: increase(redis_evicted_keys_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis 正在逐出 key (instance={{ $labels.instance }} env={{ $labels.env }})"
          description: '10 分鐘內逐出 {{ printf "%.0f" $value }} 個 key：記憶體已達 maxmemory，allkeys-lru 可能正在丟 session（使用者被登出）。查 docs/速查參考/Redis 快取管理.md §5 找成長來源。'

      # 記憶體用量趨勢外推：用近 6 小時斜率預測 24 小時後是否越過 85%。
      # RedisMemoryHigh 只在「已經高」時響，這條讓「正在往上長」提前一天出手，
      # 對應治理規範「與上限對齊的指標」中的趨勢面。
      - alert: RedisMemoryExhaustionPredicted
        expr: |
          predict_linear(redis_memory_used_bytes[6h], 24 * 3600)
          / redis_memory_max_bytes > 0.85
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Redis 記憶體預計 24 小時內逼近上限 (instance={{ $labels.instance }} env={{ $labels.env }})"
          description: "依近 6 小時成長速率外推，24 小時後將超過 maxmemory 的 85%。逐出一旦開始就會丟 session，請在此之前找出成長來源。"

      # Redis Hit Rate Low
      - alert: RedisHitRateLow
        expr: |
          (
            rate(redis_keyspace_hits_total[5m])
            /
            (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))
          ) < 0.8
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache hit rate is low"
          description: 'Hit rate is {{ $value | humanizePercentage }} (threshold: 80%)'

      # Redis Connection Spike
      - alert: RedisConnectionSpike
        expr: |
          redis_connected_clients > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis has too many connections"
          description: '{{ printf "%.0f" $value }} clients connected'

  - name: rabbitmq-alerts
    interval: 60s
    rules:
      # 以下 rabbitmq_detailed_* 指標來自 prometheus.yml 的 rabbitmq-detailed job
      # (/metrics/detailed)。**不可**改回 aggregated 的 rabbitmq_queue_* ——後者
      # 是聚合模式、無 queue label，per-queue selector 永遠 match 不到（#1625：
      # prod 6 條 queue 因 406 args drift 斷線 5 天，這三條告警因此從未生效）。

      # RabbitMQ Queue Depth High
      - alert: RabbitMQQueueDepthHigh
        expr: |
          rabbitmq_detailed_queue_messages_ready > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue depth is high"
          description: 'Queue {{ $labels.queue }} has {{ printf "%.0f" $value }} messages'

      # RabbitMQ DLQ Messages — 死信出現就該關注（>0），閾值不再用 >100：
      # DLQ 語意下訊息=已重試耗盡的失敗事件，堆到 100 才報過鈍。
      # 涵蓋 repo 兩種 DLQ 命名：後綴 *.dlq 與前綴 dlq.*。
      - alert: RabbitMQDLQMessages
        expr: |
          rabbitmq_detailed_queue_messages_ready{queue=~".*\\.dlq$|^dlq\\..*"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue has accumulated messages"
          description: 'DLQ {{ $labels.queue }} has {{ printf "%.0f" $value }} messages'

      # RabbitMQ No Consumers（有堆積且無 consumer）
      # 排除 DLQ：DLQ 天然無 consumer，有死信時已由 RabbitMQDLQMessages 專職告警，
      # 不排除會對同一條 DLQ 疊報兩條 alert（#1625 上線首日實測 10 條疊報）。
      - alert: RabbitMQNoConsumers
        expr: |
          rabbitmq_detailed_queue_consumers{queue!~".*\\.dlq$|^dlq\\..*"} == 0
            and on(env, queue, vhost) rabbitmq_detailed_queue_messages_ready > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ queue has no consumers"
          description: "Queue {{ $labels.queue }} has messages but no consumers"

      # RabbitMQ Queue No Consumers（本次 #1625 事故的直接防再犯）：
      # 業務 queue 只要無任何 consumer 就告警，**不要求**有訊息堆積——args drift
      # (406 PRECONDITION_FAILED) 或服務斷線會讓 consumer 靜默歸零，此時若剛好
      # 無新訊息，上面「有堆積才報」的 NoConsumers 會漏掉整個窗口（正是 5 天無告警成因）。
      # 排除項（皆為「無 consumer 屬正常拓撲」）：
      #   *.dlq / dlq.* — 死信 queue 本就無 consumer，訊息留存待 ops 介入
      #   *.retry       — 重試 queue/暫留通道，非常駐消費
      #   gateway.sse.* — per-pod 動態 auto-delete queue，pod 起落時短暫無 consumer 屬正常
      # 參照 MQ 與事件管理規範 §3.3 / 36 號設計書。
      - alert: RabbitMQQueueNoConsumersStalled
        expr: |
          rabbitmq_detailed_queue_consumers{queue!~".*\\.dlq$|^dlq\\..*|.*\\.retry$|^gateway\\.sse\\..*"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ queue 無任何 consumer (queue={{ $labels.queue }} env={{ $labels.env }})"
          description: "Queue {{ $labels.queue }} 存在但無任何 consumer 逾 15 分鐘：可能是 406 args drift（queue 宣告參數不一致致 consumer 被拒）或服務斷線。這是 #1625 prod 斷線 5 天無告警的直接防再犯，查該 queue 對應服務的啟動 log 與 QueueDeclare 參數。"

  - name: node-alerts
    interval: 60s
    rules:
      # High CPU Usage
      - alert: HostHighCpuUsage
        expr: |
          100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: 'CPU usage is {{ printf "%.0f" $value }}%'

      # High Memory Usage
      - alert: HostHighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage is high"
          description: 'Memory usage is {{ printf "%.0f" $value }}%'

      # Low Disk Space
      - alert: HostLowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host disk space is low"
          description: 'Only {{ printf "%.0f" $value }}% disk space remaining'

  - name: exporter-health
    interval: 60s
    rules:
      # sql_exporter（業務告警 #1353 ATM 退款卡單 / #898 假日覆蓋的 metric 來源）query 失敗。
      # 抓「業務告警來源靜默失效」——exporter 連不上 DB 時 metric 停止更新、告警形同不存在。
      - alert: SqlExporterScrapeErrors
        expr: increase(scrape_errors_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "sql_exporter query 失敗 (target={{ $labels.exported_job }} env={{ $labels.env }})"
          description: "sql_exporter 對 {{ $labels.exported_job }} 的 query 15 分鐘內出錯：#1353/#898 業務 metric 可能停止更新，請查 DB 連線/憑證。"

  # ── 監控棧自身（2026-09-11）─────────────────────────────────────────────
  #
  # 這一組跟上面的 exporter-health 是同一個問題的不同面：**監控自己失效時沒有
  # 徵兆**。2026-09-10 補了 loki／tempo／grafana／alertmanager／promtail 的 up
  # series，這裡補的是「活著但沒在做事」那一半。
  - name: monitoring-stack
    interval: 60s
    rules:
      # 告警鏈的**最後一跳**。在 gateway 有指標之前，轉發失敗只會 log 一行
      # 然後回 500 給 Alertmanager——Alertmanager 會重試，但沒有任何東西會告訴
      # 人「告警送不出去」。而那正是最不能靜默的失效。
      #
      # ⚠️ 這條 alert 本身要穿過它正在抱怨的東西，所以只有**部分**自我涵蓋：
      # 三條路由指向三個不同的 Discord webhook（/alert、/alert/dev-alert、
      # /alert/prod-alert），本 alert 不帶 channel／env label ⇒ 走預設的 /alert。
      # 因此「某一個頻道的 webhook 壞掉」偵測得到也送得出去；「gateway 整個掛掉」
      # 由 ServiceDown（up == 0）承接；「Discord 整體不可用」則是不可化約的那部分，
      # 需要 Discord 以外的第二條通報路徑才能解。
      - alert: DiscordWebhookForwardFailing
        expr: increase(discord_webhook_gateway_forward_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "告警轉發到 Discord 失敗（route={{ $labels.route }}）"
          description: "discord-webhook-gateway 對 {{ $labels.route }} 的轉發 15 分鐘內出錯：該頻道的告警正在遺失，請查 .env 的 webhook URL 是否失效或 Discord 端是否限流。"

      # 監控棧自己的 goroutine 門檻。
      #
      # 2026-09-10 這幾個容器被排除在 go-runtime-alerts 之外（[PR #3298]），理由是那組
      # 500／1000 門檻是照**應用服務**校的（12 個 Go 服務 + gateway 全部 <150），
      # 而 Loki／Tempo 的 per-tenant ingester／WAL／compactor 各自開 goroutine，
      # 上千是設計如此——同一個門檻對它們沒有鑑別力，只會製造永遠響的告警。
      # 當時說「要有自己的門檻，得先收一段真實基線」。
      #
      # 2026-09-11 收滿一個完整日週期（5755 個 15s 取樣點 ≈ 24h）後量出來：
      #
      #   job           min    avg    p99    max
      #   loki          544    561    576    834
      #   tempo        1004   1017   1025   1027
      #   grafana       368    370    374    497
      #   promtail      162    164    165    171
      #   alertmanager   31     39     43     44
      #
      # 門檻取 2000：比觀測到的最高值（tempo 1027）留約 95% 餘裕，也高於 loki 那次
      # 短暫衝到 834 的尖峰（p99 才 576 ⇒ 那是瞬時，不是常態）。goroutine 洩漏的形狀
      # 是無界成長到數千甚至數萬，不是在常態附近抖動，所以寬餘裕不會犧牲偵測能力。
      #
      # for: 30m 而非 5m：這幾個是查詢驅動的服務，一次重壓查詢會讓 goroutine 短暫拉高
      # （loki 的 834 就是），30 分鐘才能區分「尖峰」與「回不去了」。
      #
      # ⚠️ 24h 不是一週。若出現週期性的重負載日（例如週一批次）把常態推高，
      # 這個門檻要重訂——重訂前先跑一次上面那組 min/avg/p99/max over [7d]。
      # 同理，RSS 那條（HighMemoryUsage > 2048 MiB）2026-09-11 量過對它們是安全的：
      # 24h max 依序 tempo 848／loki 521／grafana 291／promtail 121／alertmanager 47 MiB，
      # 不需要另外排除或另訂。
      - alert: MonitoringStackGoroutineHigh
        expr: |
          go_goroutines{job=~"loki|tempo|grafana|promtail|alertmanager"} > 2000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "監控棧 {{ $labels.job }} 的 goroutine 異常高（{{ printf \"%.0f\" $value }}）"
          description: "{{ $labels.job }} 持續 30 分鐘超過 2000 個 goroutine。2026-09-11 的 24h 基線最高是 tempo 1027，這個值遠在常態之外，疑似 goroutine 洩漏——它的下一步通常是 OOM 重啟，而那會造成 log/trace 的資料缺口。"
