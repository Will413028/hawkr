# ⚠️⚠️ 本檔【未被掛載】，讀它會得到錯的結論 ⚠️⚠️
#
# 實際生效的是同目錄的 `local-config.yaml`：
#   monitoring/docker-compose.yml 的 loki service
#     command: -config.file=/etc/loki/local-config.yaml
#     volumes:  ./loki/local-config.yaml:/etc/loki/local-config.yaml
#   → 只有 local-config.yaml 被掛進容器，本檔的任何一行都不會被 Loki 讀到。
#
# 最容易踩的差異：**保留期**
#   本檔（未生效）        retention_period: 720h  = 30 天
#   local-config.yaml     retention_period: 168h  = 7 天  ← 真正生效的值
#   runtime 實查 `/config` 回 `retention_period: 1w`，以它為準。
# 任何「Loki 可回溯幾天」的判斷（例如設計書 54 §8.2 的 App 版本佔比查詢窗口）
# 一律以 7 天為上限，不要引用本檔的 30 天。
#
# 保留本檔不刪：它是完整版參考配置（含 query_range cache / storage_config /
# tsdb_shipper / max_query_series 等 local-config 沒有的段落），日後要調整或
# 換用完整配置時仍有價值。要讓它生效必須同時改 docker-compose.yml 的
# command 與 volumes 兩處，改完請把本段註解一併更新。

# Loki Configuration
# Log aggregation with 30 days retention

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

limits_config:
  retention_period: 720h # 30 days
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_query_series: 5000
  max_query_parallelism: 32
  max_entries_limit_per_query: 5000

ruler:
  alertmanager_url: http://alertmanager:9093
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: true

analytics:
  reporting_enabled: false
