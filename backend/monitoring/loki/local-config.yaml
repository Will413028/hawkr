auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  retention_period: 168h              # 7 天後自動刪除 log

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true             # 啟用 retention 清理
  delete_request_store: filesystem    # Loki 3.x 必填
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

analytics:
  reporting_enabled: false

# Ruler：評估 loki/rules/<tenant>/*.yml 的 LogQL 告警規則 → alertmanager（→ Discord）。
# auth_enabled: false → 單租戶 "fake"，故規則放 rules/fake/。log-based 告警（如
# revalidate 全失敗）走這裡，因 Prometheus 只看 metrics 看不到 log。
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/ruler-wal
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
