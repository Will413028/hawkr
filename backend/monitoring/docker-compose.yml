services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    container_name: hawkr-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-collector/otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC（app VM 推 traces/metrics）
      - "4318:4318"   # OTLP HTTP（app VM 推 traces/metrics）
    depends_on:
      - loki
      - tempo
    networks:
      - hawkr-monitoring

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: hawkr-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - hawkr-monitoring

  loki:
    image: grafana/loki:3.6.6
    container_name: hawkr-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - ./loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - hawkr-monitoring

  tempo:
    image: grafana/tempo:2.10.1
    container_name: hawkr-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - hawkr-monitoring

  alertmanager:
    image: prom/alertmanager:v0.31.1
    container_name: hawkr-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
      - discord-webhook-gateway
    networks:
      - hawkr-monitoring

  discord-webhook-gateway:
    build: ./discord-webhook-gateway
    container_name: hawkr-discord-webhook-gateway
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:?請在 .env 設定 DISCORD_WEBHOOK_URL}
      # 業務告警頻道 dev-警報 / prod-警報（channel=business；#1353 退款卡單、#898 假日覆蓋等共用）
      # 選填；未設則該路徑不註冊，Alertmanager 指向時會 404 可察覺
      - DISCORD_WEBHOOK_URL_DEV_ALERT=${DISCORD_WEBHOOK_URL_DEV_ALERT:-}
      - DISCORD_WEBHOOK_URL_PROD_ALERT=${DISCORD_WEBHOOK_URL_PROD_ALERT:-}
    networks:
      - hawkr-monitoring

  promtail:
    image: grafana/promtail:3.6.6
    container_name: hawkr-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - hawkr-monitoring

  grafana:
    image: grafana/grafana:12.3.3
    container_name: hawkr-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?請在 .env 設定 GF_SECURITY_ADMIN_PASSWORD}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - hawkr-monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: hawkr-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
    ports:
      - "9100:9100"
    networks:
      - hawkr-monitoring

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  alertmanager_data:
  grafana_data:
  promtail_positions:

networks:
  hawkr-monitoring:
    driver: bridge
