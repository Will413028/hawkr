root = "."
tmp_dir = "tmp"

[build]
# Path from monorepo root (Docker WORKDIR is /app)
cmd = "sh -c 'cd /app/services/crm-service && go build -o /app/tmp/main ./cmd/crm-service/main.go'"
bin = "./tmp/main"
include_dir = ["services/crm-service", "pkg"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]

[log]
time = true
