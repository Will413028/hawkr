version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "schema/"
    gen:
      go:
        package: "gen"
        out: "../internal/repository/postgres/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # category_price_rollup.points 是這個服務第一個 jsonb 欄位：裸 []byte
          # 在 pgx v5 QueryExecModeExec（見 pkg/database/postgres.go）下沒有
          # server-side Describe 可用，型別推斷只能靠 Go 值本身——[]byte 的
          # 預設 OID 是 bytea 不是 json/jsonb，寫入時會用 bytea text 格式
          # （"\x..." 十六進位）送出，被 jsonb_in() 拒絕成 22P02 invalid input
          # syntax for type json。encoding/json.RawMessage 的預設 OID 才是
          # json，同一慣例見 invoice-service/db/sqlc.yaml 的 11 條 override。
          # 新增任何 jsonb 欄位都必須同步在這裡加一條，漏了不會編譯錯、不會
          # 測試紅在型別層，只會在真的執行 INSERT/UPDATE 時 22P02。
          - column: "category_price_rollup.points"
            go_type: "encoding/json.RawMessage"
          - column: "category_price_rollup.forecast_points"
            go_type: "encoding/json.RawMessage"
