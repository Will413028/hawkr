version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "schema/"
    gen:
      go:
        package: "gen"
        out: "../internal/repository/postgres/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # pgx v5 QueryExecModeExec (pkg/database/postgres.go) skips server-side
          # Describe, so parameter OIDs are inferred purely from the Go argument's
          # dynamic type via pgtype's default TypeMap. A bare []byte defaults to
          # bytea, NOT jsonb — writing it into a jsonb column corrupts the value
          # (22P02 invalid input syntax for type json). pgx registers json.RawMessage
          # specifically to the JSON codec (pgtype_default.go), so this column needs
          # that exact Go type to round-trip correctly under QueryExecModeExec.
          # Root cause discovered verifying #1370 PR4 (seller_deleted_outbox.Insert).
          # #1370 follow-up full-repo audit widened this to every jsonb column with a
          # []byte-bound sqlc param in this service (previously scoped to this column
          # only; the others were confirmed via the same static pattern).
          - column: "seller_deleted_outbox.payload"
            go_type: "encoding/json.RawMessage"
          - column: "certification_reviews.required_fields"
            go_type: "encoding/json.RawMessage"
          - column: "payuni_registrations.raw_request"
            go_type: "encoding/json.RawMessage"
          - column: "payuni_registrations.raw_response"
            go_type: "encoding/json.RawMessage"
          - column: "payuni_status_history.raw_response"
            go_type: "encoding/json.RawMessage"
          - column: "certification_applications.document_asset_ids"
            go_type: "encoding/json.RawMessage"
          - column: "certification_applications.step_data"
            go_type: "encoding/json.RawMessage"
          - column: "seller_violation_reports.evidence_asset_ids"
            go_type: "encoding/json.RawMessage"
          - column: "food_safety_reports.evidence_asset_ids"
            go_type: "encoding/json.RawMessage"
          - column: "seller_violations.appeal_evidence_asset_ids"
            go_type: "encoding/json.RawMessage"
          - column: "seller_notification_log.message_payload"
            go_type: "encoding/json.RawMessage"
          - column: "merchant_verification_outbox.payload"
            go_type: "encoding/json.RawMessage"
          - column: "payuni_merchant_profile_updates.changed_fields"
            go_type: "encoding/json.RawMessage"
          - column: "payuni_merchant_profile_outbox.payload"
            go_type: "encoding/json.RawMessage"
