// buyer lookup.

message ListBuyerIDsByAccountRequest {
    int64 account_id = 1;
}

message ListBuyerIDsByAccountResponse {
    int32 code = 1;
    string message = 2;
    repeated string buyer_ids = 3;  // TSID 數字字串（§4，>2^53）；含所有 stint（含已關閉），無序
}

// ========== Admin: Buyer Statistics Messages ==========

message GetBuyerStatsForAdminRequest {}

message GetBuyerStatsForAdminResponse {
    int32 code = 1;
    string message = 2;
    AdminBuyerStats data = 3;
}

message AdminBuyerStats {
    string total = 1;  // §4：對外數字一律 string（與 hawkr.account.AdminAccountStats 對稱）
}

// ========== Membership (doc 59 子系統 1) ==========

message GetBuyerEntitlementRequest {
    string buyer_id = 1;
}

message BuyerEntitlement {
    int32 code = 1;             // 0 = 成功；非 0 時見 message，其餘欄位為零值（§6.2 例外 2 全專案慣例：Response 固定含 int32 code）
    string message = 2;
    string plan_code = 3;
    string monthly_answer_limit = 4;
    string period_start = 5;    // RFC3339 UTC
    string period_end = 6;      // RFC3339 UTC
    string source = 7;          // admin | system_default
}

message AssignMembershipRequest {
    string buyer_id = 1;
    string plan_code = 2;
    string period_days = 3;              // ""/"0" → server defaults to 30
    string note = 4;
    string granted_by_account_id = 5;     // admin 操作者的登入 account_id（維持 account_id——這軸識別操作者本人，不是被指派對象；見 §5.1 note）
    string request_id = 6;                // 冪等 key
}

message ListMembershipPlansRequest {
}

message MembershipPlan {
    string plan_code = 1;
    string display_name = 2;
    string monthly_answer_limit = 3;
    string monthly_price_twd = 4;
    bool is_purchasable = 5;
    string created_at = 6;      // RFC3339 UTC
    string updated_at = 7;      // RFC3339 UTC
}

message ListMembershipPlansResponse {
    int32 code = 1;
    string message = 2;
    repeated MembershipPlan plans = 3;
}

// UpdateMembershipPlanRequest 是 membership_plans 目錄本身的 partial update
// （plan_code 是 identity，不可變；display_name 這輪不開放，見 doc 59 §6.1
// 新增段落）。has_* 顯式旗標比照既有 UpdateAiStyleRequest 慣例：未設的欄位維
// 持原值，不是被覆寫成零值。
message UpdateMembershipPlanRequest {
    string plan_code = 1;
    string monthly_answer_limit = 2;
    string monthly_price_twd = 3;
    bool is_purchasable = 4;
    bool has_monthly_answer_limit = 5;
    bool has_monthly_price_twd = 6;
    bool has_is_purchasable = 7;
}

message UpdateMembershipPlanResponse {
    int32 code = 1;
    string message = 2;
}
