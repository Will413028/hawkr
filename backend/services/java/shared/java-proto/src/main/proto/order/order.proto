message GetSellerOrdersRequest {
    int64 store_id = 1;            // Gateway getAccountID 注入（例外）
    string status_filter = 2;     // 支援逗號分隔多值（如 "20,30"），空字串表示全部
    PageRequest page = 3;
    string buyer_id = 4;  // 篩選指定買家，空字串表示不篩選
    // keyword: 模糊搜尋，空字串 = 不篩選。比對範圍恰為三者：order_no、recipient_name、
    // 以及 order_items 的 product_name／sku_name（半連接）。
    // ⚠️ **不得**把 recipient_phone 或完整 shipping_address 加進比對範圍。判準是
    // 「列表投影看得到的才可以搜」：姓名在代行投影裡未遮罩、列表本來就顯示得出來，
    // 搜尋只是省去翻頁；而電話列表 RPC 從不回傳、地址只給到縣市區 ⇒ 拿它們當條件
    // 等於造出一支 oracle——輸入一個值看有沒有命中，就能在完全不揭露該值的前提下
    // 確認它存在，而且不會觸發 ORDER_PII_REVEAL 稽核（56 號 §8.1.5／A16）。
    // 訂單編號是 "O" + 9 位數字（不含日期、不遞增）⇒ 只能 ILIKE '%q%'，prefix 無意義。
    string keyword = 5;
    // date_from／date_to: 依 created_at 篩選，ISO 8601 UTC，空字串 = 不篩選。
    // 命名跟 56 號 §6.1.10 與 delegation.proto 的稽核查詢一致；**不要**抄
    // ListAbnormalOrdersForAdminRequest 的 created_from／created_to（那兩欄 Java 側
    // 從未被讀取，是靜默無效參數）。
    string date_from = 6;
    string date_to = 7;
    hawkr.common.DelegationContext delegation = 100;
}

message GetSellerOrdersResponse {
    int32 code = 1;
    string message = 2;
    repeated OrderSummaryView orders = 3;
    PageMeta meta = 4;
}

message GetSellerOrderDetailRequest {
    int64 store_id = 1;            // Gateway getAccountID 注入（例外）
    string order_no = 2;
    hawkr.common.DelegationContext delegation = 100;

    // 只有 GET .../orders/{orderNo}/recipient-contact 這一支端點傳 true。
    // 遮罩的預設值是 false，且 proto3 的 bool 零值就是 false ⇒ 任何忘記填、
    //    任何舊版 client、任何新的呼叫點，預設都是「遮罩」。這是本欄用
    //    reveal_*（而不是 mask_*）命名的唯一理由：fail-safe 的方向必須與零值一致。
    // 本欄只在 delegation 非空時被讀取；賣家本人的呼叫一律看得到自己的訂單，
    //    不經本欄。order-service 收到 delegation 為空而本欄為 true 時回 INVALID_ARGUMENT。
    bool reveal_recipient_contact = 101;
}

message GetSellerOrderDetailResponse {
    int32 code = 1;
    string message = 2;
    OrderDetailView data = 3;
}

