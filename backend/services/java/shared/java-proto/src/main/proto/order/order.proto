message CheckoutItem {
    string sku_id = 1;                         // SKU ID（數字字串）
    string quantity = 2;                       // 數量（數字字串）
    string product_id = 3;                     // 商品 ID（TSID 數字字串）
}

// --- CheckoutValidate（即時驗證）---

message CheckoutValidateRequest {
    int64 buyer_id = 1;                      // Gateway 注入的 buyer_id（E.5.5 int64 例外；原 account_id，已改名對齊語意）
    repeated CheckoutItem items = 2;           // 當前已勾選的商品
}

message CheckoutValidateResponse {
    int32 code = 1;
    string message = 2;
    CheckoutValidateData data = 3;
}

message CheckoutValidateData {
    bool valid = 1;                                              // 是否可進入結帳 = unavailable_items.isEmpty() && errors.isEmpty()
    repeated string delivery_temp_intersection = 2;              // 溫層交集 value（如 ["3202"]）
    repeated AvailableShippingOption available_shipping_options = 3; // 可用配送選項（已排除超限）
    repeated CheckoutValidationError errors = 4;                 // 整單級錯誤（DIFFERENT_SELLER / TEMP_ZONE_INCOMPATIBLE / ALL_SHIPPING_EXCEEDED / INVALID_ITEM）
    repeated UnavailableItem unavailable_items = 5;              // row 級不可購買清單（DELISTED / OUT_OF_STOCK / INSUFFICIENT_STOCK / LOOKUP_FAILED）
}

message CheckoutValidationError {
    string error_code = 1;                     // 整單級錯誤碼（DIFFERENT_SELLER / TEMP_ZONE_INCOMPATIBLE / ALL_SHIPPING_EXCEEDED / INVALID_ITEM）。注意：row 級「商品不可購買」已廢棄 PRODUCT_UNAVAILABLE，改走 unavailable_items
    string error_message = 2;                  // 繁體中文錯誤訊息
}

// row 級不可購買明細（Validate / Preview / Confirm 共用）。Preview / Confirm 非空 → envelope code=4001
message UnavailableItem {
    string sku_id = 1;                         // SKU ID（數字字串）
    string sku_name = 2;                       // 商品名稱（來源：cart_items.sku_name_snapshot；lookup 失敗時前端可 fallback「商品已下架」）
    string reason = 3;                         // CartItemUnavailableReason value（DELISTED / OUT_OF_STOCK / INSUFFICIENT_STOCK / LOOKUP_FAILED）
    string requested_qty = 4;                  // 買家本次勾選量（數字字串，承載原 InsufficientStockItem.requested_qty 語意）
    string available_qty = 5;                  // 即時可購買量；reason=INSUFFICIENT_STOCK 時 0 < available_qty < requested_qty；OUT_OF_STOCK 時 "0"；DELISTED / LOOKUP_FAILED 時空字串
}

// 可用的配送選項（配送方式 × 溫層 × 運費），前端以 radio button grid 呈現
message AvailableShippingOption {
    string shipping_method = 1;                // ShippingMethod value（如 3001）
    string delivery_temp = 2;                  // ShippingTemperature value（如 3202）
    string label = 3;                          // 顯示名稱（如「黑貓宅急便（冷藏）」）
    string fee = 4;                            // 運費（級距查找結果，數字字串；免運時為 "0"）
    string fee_payer = 5;                      // 運費負擔方 value（3101=買方 / 3102=賣方）
    string free_shipping_threshold = 6;        // 免運門檻（數字字串，"0" 表示無免運）
    bool tentative_free_shipping_eligible = 7; // **語意變更**（原 free_shipping_eligible 重命名）：暫定免運判定（基於商品 unit_price × qty，不含優惠券折扣）。最終免運資格須等 CheckoutPreview 階段以折扣後金額重判定（20 設計書 §4.7）
}

// --- CheckoutShippingFee（運費精算）---

message CheckoutShippingFeeRequest {
    int64 buyer_id = 1;                      // Gateway 注入的 buyer_id（E.5.5 int64 例外；原 account_id，已改名對齊語意）
    repeated CheckoutItem items = 2;           // 當前已勾選的商品
    string shipping_method = 3;                // 已選的配送方式 value（如 3001）
    string delivery_temp = 4;                  // 已選的配送溫層 value（如 3202）
    string receiver_zip_code = 5;              // 收件人郵遞區號（宅配必填，如 "880"；店到店可空）
    string cvs_store_id = 6;                   // 超商門市代號（店到店時填，宅配時空字串）
}

message CheckoutShippingFeeResponse {
    int32 code = 1;
    string message = 2;
    CheckoutShippingFeeData data = 3;
}

message CheckoutShippingFeeData {
    string shipping_method = 1;                // 配送方式（回顯）
    string delivery_temp = 2;                  // 配送溫層（回顯）
    string shipping_route = 3;                 // 運費路線（後端推導，如 DOMESTIC / TO_OFFSHORE）
    string shipping_fee = 4;                   // 精確運費（數字字串；免運時為 "0"）
    string fee_payer = 5;                      // 運費負擔方 value（3101/3102）
    bool tentative_free_shipping_eligible = 6; // **語意變更**（原 free_shipping_eligible 重命名）：暫定免運判定（未套優惠券）。20 設計書 §4.7
    string free_shipping_threshold = 7;        // 免運門檻（數字字串）
    string order_subtotal = 8;                 // 商品實際成交小計（基於 unit_price 彙總，數字字串）
    string estimated_total = 9;                // 預估總額 = 小計 + 運費（數字字串）
}

// --- CheckoutPreview（結帳預覽）---

message CheckoutPreviewRequest {
    int64 buyer_id = 1;                      // Gateway 注入的 buyer_id（E.5.5 int64 例外；原 account_id，已改名對齊語意）
    repeated CheckoutItem items = 2;           // 購物車勾選的商品
    string shipping_method = 3;                // 用戶已選的配送方式 value（如 3001）
    string delivery_temp = 4;                  // 用戶已選的配送溫層 value（如 3202）
    string receiver_zip_code = 5;              // 收件人郵遞區號（宅配必填，如 "880"；店到店可空）
    string cvs_store_id = 6;                   // 超商門市代號（店到店時填）
    string coupon_template_id = 7;             // 使用者選擇的優惠券**模板** ID（空字串表示不使用）
    bool consolidated = 8;                     // 是否為和單（多賣家走代理商代收）。default false=單賣家走 seller.payuni_mer_id；true=取 env PAYUNI_AGENT_MER_ID。詳見 20 設計書 §4.13

    // ─── Uber Direct（shipping_method = 3003）專用，其餘配送方式一律空字串 ───
    //
    // 🔴 這兩欄是 3003 **唯一**的過關條件。Uber 的資格判定需要「結構化收件地址 ＋
    // 買家手上那筆報價」，而本 message 原本只有 receiver_zip_code 與一串 shipping_address
    // ⇒ 組不出 UberQuoteDropoff ⇒ UberOrderEligibilityGuard 依 deny-by-default 回 9503。
    // 買家在購物車**選得到** Uber 而 preview 一律失敗，就是那個缺口。
    //
    // ⚠️ 為什麼不攤平字串讓 shipping 反解：shipping.proto 的 UberQuoteDropoff 逐字禁止，
    // 每一筆解不出來的就是一個看不到選項的買家。address_id 讓 order-service 走
    // buyer 模組取回 city／district／detail_address 三欄——與 /app/checkout/uber_quote
    // 同一個來源，兩邊不會給出不同的答案。
    string address_id = 9;                     // 買家地址簿的 shipping_addresses.id（TSID 數字字串）
    string uber_quote_id = 10;                 // 買家手上那筆報價（uber_quotes.quote_id，dqt_ 前綴）；空 ⇒ 重新取價
}

message CheckoutPreviewResponse {
    int32 code = 1;
    string message = 2;
    CheckoutPreviewData data = 3;
}

message CheckoutPreviewData {
    string checkout_id = 1;                        // 結帳批次 ID（後端生成，UUID 格式）
    repeated OrderGroupPreview order_groups = 2;   // 訂單分組（Phase 1: 1 組）
    string total_original_amount = 3;              // 所有訂單原價總計（數字字串）
    string total_shipping_fee = 4;                 // 運費總計（數字字串）
    string total_discount = 5;                     // 折扣總計（數字字串）
    string total_actual_amount = 6;                // 實付總計（含運費、扣折扣，數字字串）
    string payment_mer_id = 7;                     // 本次交易付款對應的 PayUni MerID（top-level，一次交易=一個 merId）。consolidated=false 取 sellerMeta.payuni_mer_id；consolidated=true 取 env PAYUNI_AGENT_MER_ID。前端 Web/Mobile 用此值帶入 Google Pay SDK tokenizationSpec.parameters.gatewayMerchantId
    repeated UnavailableItem unavailable_items = 8; // row 級不可購買清單。非空 → envelope code=4001 + 前端跳「請先返回購物車移除以下商品」dialog
    repeated AvailablePaymentMethod available_payment_methods = 9; // 依 total_actual_amount 算出的各付款方式可用性（20 設計書 §3.4.1）。前端據此 render（禁用 + 理由），不自行用金額判斷。total_actual_amount==0（零元）→ 空清單，前端顯示「無需付款」

    // 58 號 §6.2.4 order ②：結帳頁的發票區（B01）所需的一切。
    //
    // 由 order-service 在 preview 時呼叫 invoice-service 的
    // ResolveOrderInvoiceModeInternal 取得後併入。**order 不自行計算任何一欄**——
    // 開票模式、法定告知文案、待審額度都是發票服務的判定，order 只是傳遞。
    //
    // 🔴 snapshot_version 是唯一的例外：I-50 明訂它的唯一寫入者是 order-service，
    // 而 invoice 那支 RPC 回空字串（它沒有可回聲的值）⇒ **order 必須用自己的值覆蓋**，
    // 否則前端拿到空字串。設計書 §5821 第 1 項逐字記載這件事。
    CheckoutInvoicePreview invoice = 10;
}

// 付款方式可用性（依訂單金額對 PayUni 各方式合法區間判定）。20 設計書 §3.4.1；OrderDetailView 再次付款 surface 共用
message AvailablePaymentMethod {
    string payment_type = 1;       // PaymentMethod value（2001 信用卡 / 2002 Apple Pay / 2003 Google Pay / 2004 ATM）
    bool eligible = 2;             // 金額是否落在該方式合法區間
    string ineligible_reason = 3;  // PaymentMethodIneligibleReason value（2101 未達下限 / 2102 超過上限）；eligible=true 時為空字串
}

// 單筆訂單分組預覽
message OrderGroupPreview {
    string group_index = 1;                        // 分組序號（"0", "1", ...）
    string store_id = 2;                  // 賣家 store_id surrogate（TSID 數字字串）
    string seller_name = 3;                        // 賣家名稱（快照，供前端顯示）
    string shipping_method = 4;                    // 用戶已選的配送方式（回顯）
    string delivery_temp = 5;                      // 用戶已選的配送溫層（回顯）
    string shipping_label = 6;                     // 配送方式顯示名稱（如「黑貓宅急便（冷藏）」）
    string shipping_fee = 7;                       // 運費（已計算，數字字串；免運時為 "0"）
    string shipping_fee_payer = 8;                 // 運費負擔方 value（3101/3102）
    bool free_shipping_eligible = 9;               // **最終免運判定**（基於 unit_price × qty − share_discount，折扣後判定）
    repeated CheckoutItemPreview items = 10;       // 商品明細
    string subtotal_original_amount = 11;          // 分組實際成交小計（Σ unit_price × qty，數字字串）
    string discount_amount = 12;                   // 該分組折扣金額（數字字串）
    bool tentative_free_shipping_eligible = 13;    // **新增**：未套優惠券前的暫定免運判定。前端比對 `tentative != final` 提示「使用此優惠券將失去免運資格」（20 設計書 §4.7.2）
    // 賣家 canonical 短碼（sellers.store_code）；store_id 是內部代理鍵，賣家頁
    // canonical 網址走 store_code。與 seller_name 同源自本次 preview 已呼叫的
    // getSellerMeta，聚合失敗為空字串。
    string store_code = 14;
}

message CheckoutItemPreview {
    string sku_id = 1;                             // SKU ID（數字字串）
    string product_id = 2;                         // 商品 ID（TSID 數字字串）
    string sku_name = 3;                           // SKU 名稱（快照）
    string quantity = 4;                           // 數量（數字字串）
    string price = 5;                              // **語意變更**：實際成交單價（有特價=sale_price，否則=list_price，數字字串）
    string subtotal = 6;                           // 小計 = price × quantity（數字字串）
    string stock_qty = 7;                          // 當前庫存（供前端提示）
    string temperature = 8;                        // 該 SKU 的存儲溫層（AMBIENT / CHILLED / FROZEN）
    string list_price = 9;                         // **新增**：原價快照（永遠 = SKU.price，數字字串）
    string sale_price = 10;                        // **新增**：特價（無特價=空字串，數字字串）。前端可比對 list_price/sale_price 顯示「省 $XX」
    string share_discount = 11;                    // **新增**：該品項分攤的優惠券折扣（折扣後免運判定用，數字字串）
    string actual_pay_amount = 12;                 // **新增**：該品項最終實付（= subtotal − share_discount，數字字串）
}

// --- CheckoutConfirm（確認結帳 → 建單）---

message CheckoutConfirmRequest {
    int64 buyer_id = 1;                          // Gateway 注入的 buyer_id（E.5.5 int64 例外；原 account_id，已改名對齊語意）
    string checkout_id = 2;                        // 結帳批次 ID（Preview 回傳的）
    repeated CheckoutItem items = 3;               // 商品列表（與 Preview 相同）
    string shipping_method = 4;                    // 用戶選擇的配送方式 value（3001/3002/3003）
    string delivery_temp = 5;                      // 用戶選擇的配送溫層 value（3201/3202/3203）
    string receiver_zip_code = 6;                  // 收件人郵遞區號（宅配必填；店到店可空）
    // 收件人資訊
    string recipient_name = 7;                     // 收件人姓名（必填）
    string recipient_phone = 8;                    // 收件人電話（必填）
    string shipping_address = 9;                   // 收件地址（宅配必填）
    string shipping_note = 10;                     // 配送備註（選填）
    // 超商取貨
    string cvs_store_id = 11;                      // 超商門市代號（店到店必填）
    string cvs_store_name = 12;                    // 超商門市名稱（店到店必填）
    string coupon_template_id = 13;                // 使用者選擇的優惠券**模板** ID（與 Preview 相同，空字串表示不使用）
    string order_remark = 14;                      // 訂單備註（選填，買家留言給賣家，最長 500 字）
    // 🔴 **選填**（58 號 §4.1「03 訂單」逐字定案 ＋ §6.1.2(b)）：`hawkr_buyer` 已上架 App
    // 直接呼叫 /app/checkout/confirm，改成必填會立刻打爛線上結帳。
    // 整包省略 ⇒ carrier_selection_mode = USE_BUYER_DEFAULT，由 invoice-service 在建立文件時
    // 依 D6 fallback 鏈解析（買家指定的預設 → 無載具發票），order-service 不在 hot path 打那支 gRPC。
    CheckoutInvoiceRequest invoice = 15;

    // ─── Uber Direct（shipping_method = 3003）專用，其餘配送方式一律空字串 ───
    // 語意與欄位來源同 CheckoutPreviewRequest 的同名欄位（見那裡的紅字）。
    //
    // 🔴 confirm 是 INV-U1 的收斂點（66 §8「訂單 Uber 運費 ＝ 被 CHECKOUT_ACCEPTED 的那筆
    // quote 的 fee_amount，永不補收」）：它拿 uber_quote_id 重驗一次拿到運費，
    // 建單成功後再把同一筆 CAS 成 CHECKOUT_ACCEPTED（66 §9 的
    // 「確認 → 重驗 TTL>180s ＋ hash → CHECKOUT_ACCEPTED → 收款」）。
    // 少了 CAS 那一步，建單時 UberDirectAdapter.acceptedQuote() 找不到報價 ⇒
    // markCreateFailed("UBER_QUOTE_NOT_ACCEPTED") ⇒ 收了錢建不出單。
    string address_id = 16;
    string uber_quote_id = 17;
}

// 結帳時採集的買家發票選擇（58 號 §7.1.2 步驟 1、§6.2.4 order-service ⑤）。
//
// 🔴 **本 message 只收「order_invoice_snapshots 存得下」的東西**（58 號 §5.4.3 DDL）：
// 該表是零 PII 表，載具明碼（手機條碼 3J0002／自然人憑證 CQ0001）一律不落 order-service
// ⇒ 買家臨櫃輸入的載具值必須先經 invoice-service 的常用發票資料端點（§6.1.1 端點 1–4）
// 存成 buyer_invoice_preferences 一列，結帳時只帶 profile_id。
// 設計書 §6.1.2(b) 列的 carrier_type／value／save_as_default／disclosure_accepted／
// disclosure_version 五欄屬 **invoice-service 那一腿**（ValidateOrderInvoiceInputInternal），
// 刻意不放進 order 契約：order-service 收了也無處可寫，等於強制收集一個永遠不被使用的欄位。
// ─── 結帳發票預覽（58 §6.2.4 order ②、58A §B01）────────────────────────
//
// 逐欄鏡射 invoice-service 的 ResolveOrderInvoiceModeInternalData，但**不共用**
// 那份 message：order 的對外契約不承載發票服務的內部型別，兩邊各自演化時
// 才不會被對方的欄位變更牽動（同 CheckoutInvoiceRequest 與 InvoiceInputSpec 的關係）。
message CheckoutInvoicePreview {
    // InvoiceFulfillmentMode：AMEGO_AUTO / PLATFORM_RECEIPT / SELLER_SELF_ISSUE / LEGACY_MANUAL
    // 🔴 前端必須四值都有分支，缺一即落 invalid 而擋付款（58A §B01）。
    string invoice_mode = 1;
    string snapshot_version = 2;          // 由 order-service 覆蓋，見上方紅字
    string preview_expires_at = 3;        // ISO 8601 UTC；前端不得自算 TTL
    CheckoutInvoiceAmount amount = 4;
    CheckoutInvoiceDisclosure disclosure = 5;
    CheckoutInvoiceProfile default_profile = 6;  // 可為空 message（買家無 profile 且無手機無 email）
    CheckoutInvoiceIntakeLimit intake_limit = 7; // blocked=true 時 preview 仍回 code 0，阻擋在 confirm
}

// 發票金額拆解。**四欄逐字對齊 58A §B01 的金額明細列**，前端不得拿右欄的
// grand_total 充當 invoice_amount（兩者在 Phase 1 相等是業務決策不是恆等式）。
message CheckoutInvoiceAmount {
    string product_amount = 1;   // 商品小計，元
    string shipping_amount = 2;  // 應稅運費，元
    string discount_amount = 3;  // 折抵金額（正數），元；前端顯示為 −NT$ X
    string invoice_amount = 4;   // 發票總額（含稅）＝ product + shipping − discount
    string tax_category = 5;
}

// 法定告知。
//
// ⚠️ required 於 2026-08-31（DEC-20260831-210934）起**只決定要不要顯示**，
// 不再是付款前置條件：confirm 不檢查任何回填值，9314 已無 emitter。
// title／body 仍要逐字顯示——免用統一發票的買家得知道自己拿到的是收據。
message CheckoutInvoiceDisclosure {
    bool required = 1;
    string terms_version = 2;
    string title = 3;
    string body = 4;
}

// 買家的預設常用發票資料（B01 的 LockedCard 顯示它）。
// display_value 是**遮罩後**的字串：DB 存密文，明碼永不出服務邊界。
message CheckoutInvoiceProfile {
    string profile_id = 1;
    string carrier_type = 2;
    string display_value = 3;
    string buyer_tax_id = 4;
    string buyer_name = 5;
    bool is_default = 6;
    string label = 7;
}

// 賣家待審期間的接單額度。blocked=true ⇒ B01 顯示不可下單 banner（9326）。
message CheckoutInvoiceIntakeLimit {
    string order_count_used = 1;
    string order_count_limit = 2;
    string amount_used = 3;
    string amount_limit = 4;
    bool blocked = 5;
}

message CheckoutInvoiceRequest {
    // invoice-service buyer_invoice_preferences.id（數字字串）。非空 ⇒ EXPLICIT_PREFERENCE。
    // 🔴 前端可控、跨服務、無 FK：order-service 只做 fail-fast 形狀驗證，
    // **歸屬驗證（IDOR，I-47）的收斂點在 invoice-service**，且 buyer_id 只能取自訂單。
    string profile_id = 1;
    // 公司統編（8 碼數字）。非空 ⇒ invoice_kind = B2B、carrier_selection_mode = NONE，
    // 且 buyer_title 必填（chk_ois_b2b）。
    string buyer_tax_id = 2;
    // 買方抬頭（AMEGO BuyerName 上限 60 字元）；僅 B2B 有值。
    string buyer_title = 3;
    // 捐贈碼（3–7 碼數字）。非空 ⇒ carrier_selection_mode = DONATION。
    string donation_code = 4;
    // 發票通知信箱（選填）。留空 ⇒ 快照 notify_email 為 NULL，由 invoice-service 依 D6 解析。
    string notify_email = 5;
}

message CheckoutConfirmResponse {
    int32 code = 1;
    string message = 2;
    CheckoutConfirmData data = 3;
    CheckoutPriceChangedDetail price_changed = 4;  // code=4091 時填充：金額變動明細
}

message CheckoutConfirmData {
    string checkout_id = 1;                        // 結帳批次 ID（付款用）
    repeated string order_nos = 2;                 // 建立的訂單編號（Phase 1: 1 筆）
    string total_pay_amount = 3;                   // 付款總金額（數字字串）
    repeated UnavailableItem unavailable_items = 4; // **語意統一**：取代舊 InsufficientStockItem，row 級不可購買 / 庫存不足清單。reason=INSUFFICIENT_STOCK 時帶 available_qty 等同舊欄位
}

// 金額變動明細（code=4091 時 price_changed 填充）
message CheckoutPriceChangedDetail {
    string old_total_amount = 1;                   // Preview 時顯示的實付金額
    string new_total_amount = 2;                   // Confirm 重算後的實付金額
    string change_reasons = 3;                     // 變動原因（逗號分隔，如 "PRODUCT_PRICE,SHIPPING_FEE"）
    string new_subtotal = 4;                       // 重算後商品小計
    string new_shipping_fee = 5;                   // 重算後運費
    string new_discount = 6;                       // 重算後折扣
}

// ==================== GetOrderForReview（review-service 用）====================

message GetOrderForReviewRequest {
    string order_no = 1;
}

// 訂單評論資格資訊
message OrderForReviewData {
    string order_no = 1;
    string buyer_id = 2;    // TSID 數字字串
    string store_id = 3;   // 賣家 store_id surrogate（TSID 數字字串）
    string status = 4;              // OrderStatus value，如 "40"
    string completed_at = 5;        // 訂單完成時間（confirmedAt），ISO 8601 UTC 格式
}

// 訂單中的商品項目（供評論用）
message OrderItemForReview {
    string order_item_id = 1;       // TSID 數字字串
    string sku_name = 2;            // 商品名稱
    string image_url = 3;           // 商品圖片 URL（相容欄位，值為 Order Service 組好的 CDN URL；新流程改讀 image_object_key）
    string price = 4;               // 商品單價（數字字串，元）
    string product_id = 5;          // 商品 ID（TSID 數字字串）
    string image_object_key = 6;    // 商品圖片 objectKey（review-service 直接落庫，免剝殼；49 §5.3 item_image 回填理想解）
}

message GetOrderForReviewResponse {
    int32 code = 1;
    string message = 2;
    OrderForReviewData data = 3;
    repeated OrderItemForReview items = 4;  // 訂單中的商品項目
}

// ==================== 買家消費彙總（Buyer Service 內部呼叫）====================

message GetBuyerMerchantSummaryRequest {
    int64 buyer_id = 1;
}

message GetBuyerMerchantSummaryResponse {
    int32 code = 1;
    string message = 2;
    repeated BuyerMerchantSummaryItem data = 3;
}

// 買家在某賣家的累計消費摘要
message BuyerMerchantSummaryItem {
    string store_id = 1;  // 賣家 store_id surrogate（TSID 數字字串）
    // 累計消費金額（毛額，未扣退款；計 status ∈ {COMPLETED(50), PARTIALLY_REFUNDED(60)}，數字字串，元）
    string total_spending = 2;
    string last_order_time = 3;    // 最近一筆訂單時間（Unix ms 數字字串，供排序用）
    // 累計退款金額（同一批訂單的 SUM(orders.refund_total_amount)，數字字串，元）。
    // 淨消費 = total_spending - total_refund；兩者刻意分開回，讓前端能同時顯示毛額與退回。
    string total_refund = 4;
}

message GetBuyerOrdersForSellerRequest {
    int64 buyer_id = 1;
    int64 store_id = 2;
    string page = 3;               // 1-based 數字字串
    string size = 4;
}

message GetBuyerOrdersForSellerResponse {
    int32 code = 1;
    string message = 2;
    repeated BuyerSellerOrderRecord records = 3;
    string total = 4;              // 數字字串
    string page = 5;
    string page_size = 6;
}

// 消費紀錄明細列表中的單筆訂單
message BuyerSellerOrderRecord {
    string order_no = 1;
    string create_time = 2;        // Unix ms 數字字串
    string actual_amount = 3;      // 實付金額（數字字串，元）
    string discount_amount = 4;    // 優惠券折扣金額（"0" 表示未使用，數字字串）
    repeated OrderItemDetail items = 5;  // 商品明細
    string shipping_address = 6;   // 收件地址
    string recipient_phone = 7;    // 收件人電話
    string shipping_fee = 8;       // 運費（數字字串，元）
    // 本筆訂單已完成的退款金額（orders.refund_total_amount，數字字串，元；"0" = 未退款）。
    // 只在 PARTIALLY_REFUNDED(60) 上會非 0——FULLY_REFUNDED(70) 路徑不維護該欄位
    // （AfterSalesRefundEventHandler.applyFullRefund 只做狀態 CAS），故 70 不納入本列表。
    string refund_amount = 9;
}

// ==================== 賣家儀表板訊息 ====================

message GetSellerOrderStatusCountsRequest {
    int64 store_id = 1;  // 店家 ID（Gateway JWT 注入，resolver 解析後的 store surrogate）
}

message GetSellerOrderStatusCountsResponse {
    int32 code = 1;
    string message = 2;
    // 賣家工作台四桶 count，計算規則見 03 §2.1「賣家工作台 Dashboard 狀態卡 Count 規則（SSOT）」；三桶互斥、PENDING_PAYMENT(0) 不計入、疊加售後覆蓋、排除自買單（buyer_id == store_id）
    int64 pending_shipment_count = 3;  // 待出貨：order.status∈{10,20} 排除售後覆蓋 + 自買單
    int64 in_progress_count = 4;       // 配送中：order.status∈{30,32,35,40} 排除售後覆蓋
    // 已結束（賣家無需再處理）：order.status∈{50,60,70,80} + terminal-override 售後（case status∈{33,50}）
    // ⚠️ 桶內含 CANCELLED(80) 與 FULLY_REFUNDED(70)，**不是成交數**；賣家面標籤一律顯示「已結束」，
    // 不得寫成「已完成」——那是 CodeMeta OrderStatus 50 單一狀態的 Label（代行面按狀態逐一計數時才成立）。
    // 欄名 completed_count 為既有 wire 契約（Gateway 對外 JSON key `completedCount` 已被 App 消費）保留，語意以本註解為準。
    int64 completed_count = 5;
    int64 aftersales_count = 6;        // 售後處理：active 售後 case 數（本服務聚合 aftersales GetSellerCaseClassification）
}

// ==================== 推薦商家訊息 ====================

// ==================== 服務間：CRM 訂單聚合（issue #1519，crm-service GetOrderAggregates）====================

message GetOrderAggregatesRequest {
    int64 store_id = 1;    // 0 = 不篩選（全店家聚合）
    PageRequest page = 2;
}

message GetOrderAggregatesResponse {
    int32 code = 1;
    string message = 2;
    repeated OrderAggregateItem data = 3;
    PageMeta meta = 4;
}

message OrderAggregateItem {
    string store_id = 1;          // §6.1：exposed 欄位一律 string，避免 JSON number 精度遺失
    string buyer_id = 2;
    string order_count = 3;
    string total_net_amount = 4;
}

message GetTopSellersByRevenueRequest {
    int32 days = 1;   // 計算區間天數（預設 30）
    int32 limit = 2;  // 回傳筆數上限（預設 10，最大 50）
}

message GetTopSellersByRevenueResponse {
    int32 code = 1;
    string message = 2;
    repeated SellerRevenue sellers = 3;
}

message SellerRevenue {
    string store_id = 1;          // 賣家 store_id（TSID 數字字串，原 int64 store_id）
    int64 total_revenue = 2;      // 營收加總（新台幣元）
    int32 order_count = 3;        // 訂單數
}

message ListStoreOrderStatsRequest {
    int32 days = 1;                  // 計算區間天數（必填，1–90；成立訂單 pay_time >= now - days，賣家取消 cancelled_at >= now - days）
    string after_store_id = 2;       // keyset 游標：只回 store_id 大於此值的店；空字串＝從頭（填上一頁的 next_after_store_id）
    int32 page_size = 3;             // 每頁店數（1–1000；0＝預設 500）
}

message ListStoreOrderStatsResponse {
    int32 code = 1;                  // 0＝成功；days 或 page_size 超出範圍為 INVALID_PARAM
    string message = 2;
    repeated StoreOrderStats stats = 3;  // 依 store_id 升冪；只含至少有一筆成立訂單或賣家取消訂單的店
    string next_after_store_id = 4;  // 還有下一頁時為本頁最後一個 store_id；空字串＝已是最後一頁
}

message StoreOrderStats {
    string store_id = 1;             // 店家 store_id（TSID 數字字串）
    int32 distinct_buyers = 2;       // 成立訂單的不重複買家數（以付款時間計的時間窗內）
    int32 qualifying_orders = 3;     // 成立訂單數：已付款、未取消、未全額退款，以付款時間計（狀態集合同 GetTopSellersByRevenue：已付款到完成、部分退款；部分退款仍是成立的購買，金額不計）
    int32 seller_cancelled_orders = 4;  // 賣家取消的訂單數（CANCELLED 且 cancel_by_role=SELLER），以取消時間計
}

message GetStorePeriodOrderStatsRequest {
    int64 store_id = 1;                       // 店家 store_id（必填，正數）
    repeated StatsWindow windows = 2;         // 1–4 個時間窗；回應依此順序逐窗回傳
}

// 左閉右開的時間窗 [start_time, end_time)，以付款時間 pay_time 比對。
message StatsWindow {
    string start_time = 1;           // Unix timestamp (ms)，數字字串，含
    string end_time = 2;             // Unix timestamp (ms)，數字字串，不含；必須晚於 start_time，窗長至多 90 天
}

message GetStorePeriodOrderStatsResponse {
    int32 code = 1;                  // 0＝成功；store_id、windows 或任一窗不合法為 INVALID_PARAM
    string message = 2;
    repeated StorePeriodOrderStats windows = 3;  // 與請求的 windows 同長、同順序；窗內沒有成立訂單時三個值都是 "0"
}

message StorePeriodOrderStats {
    string qualifying_orders = 1;    // 成立訂單數：已付款、未取消、未全額退款，付款時間落在窗內（狀態集合同 ListStoreOrderStats；自買單不排除）
    string distinct_buyers = 2;      // 成立訂單的不重複買家數
    string revenue = 3;              // 營收（新台幣元，數字字串）：成立訂單的實付金額（total_actual_amount）減去已完成的退款金額（refund_total_amount）加總；之後才發生的退款會使過去的窗變小
}

