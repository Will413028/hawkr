    string content = 2;              // 評論文字（可空）
    repeated string image_keys = 3;  // 評論附圖 objectKey（49 §6.6：Gateway 組 imageUrls）
    string created_at = 4;           // 評論建立時間（ISO 8601 UTC）
}

message RefundRequestView {
