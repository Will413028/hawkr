// ==================== 服務間：發票快照（58 號 §5.4.3／§6.2.4／§7.1.2）====================
//
// 角色分離（Proto 管理規範 §5.1）：本組 message 只服務 invoice-service，
// 不經 Gateway 暴露、不與 app／admin 面的 OrderDetail 共用型別。
//
// 【型別】所有數值（TSID、金額、數量、版本號）一律 `string`，時間一律 ISO 8601 UTC
// （`YYYY-MM-DDTHH:mm:ssZ`），與本檔其餘 response 一致。
// ⚠️ 這裡刻意**不用** §4.1 例外 ③ 的原生 int64：`protonumericlint`
// （`pkg/cmd/protonumericlint`）走訪的是「任何 RPC **output type** 可達的 message」，
// 不區分該 RPC 是否對外——所以 response 側用 int64 會直接被 `make proto-lint-numeric`
// 擋下，只能靠 `scripts/proto/numeric-allowlist.txt` grandfather，而那份清單只准縮不准長。
// 例外 ③ 對 request 端仍成立（request message 不在走訪範圍內）。

message GetOrderInvoiceSnapshotInternalRequest {
    string order_no = 1;
}

// 買家於開立前更正發票資料（58 號 §6.2.5）。七條定版全文見該節。
message ReviseOrderInvoiceSnapshotInternalRequest {
    string order_no = 1;
    // 樂觀鎖：呼叫端讀到的版本（十進位數字字串）。與 DB 最新版不符 ⇒ 回 9308
    // INVOICE_SNAPSHOT_VERSION_CONFLICT、不寫入。兩筆更正並行時，沒有它就是後寫的
    // 靜默覆蓋前者，而兩筆的 correction 都會顯示成功。
    string expected_snapshot_version = 2;

    // ---- 更正後的買家發票選擇；逐欄語意同 OrderInvoiceSnapshotData ----
    string invoice_kind = 3;                // B2C / B2B
    string carrier_selection_mode = 4;      // USE_BUYER_DEFAULT / EXPLICIT_PREFERENCE / NONE / DONATION
    string buyer_invoice_preference_id = 5; // 數字字串；空字串＝NULL
    string buyer_tax_id = 6;
    string buyer_title = 7;
    string donation_code = 8;

    // 🔴 **刻意沒有 notify_email**（58 號 §6.2.5 定版 7）：snapshot_version 是內容軸，
    // 只承載發票上會印出來的東西；notify_email 只決定通知寄到哪、不在發票上。讓它遞增
    // 內容軸，「同內容重開一張票」與「內容真的變了」在冪等鍵上就無法區分——而那正是
    // issue_attempt_seq 實體軸存在的理由（AMEGO 回 3040171、我方誤判成功 ⇒ 買家手上
    // 一張發票都沒有）。買家只改通知 Email 時由 invoice-service 就地改自己的
    // invoice_documents.recipient_email，不呼叫本 RPC。

    // 冪等鍵＝invoice-service 的 correction_id。同鍵重送必須回**同一個**
    // snapshot_version、不新增列，否則重試會讓版本號與實際更正次數脫鉤。
    string idempotency_key = 9;
}

message ReviseOrderInvoiceSnapshotInternalResponse {
    int32 code = 1;
    string message = 2;
    // 新版本（數字字串）。invoice-service 只能從這裡複製（58 號 I-50）。
    string snapshot_version = 3;
}

message GetOrderInvoiceSnapshotInternalResponse {
    int32 code = 1;
    string message = 2;
    // 查無此訂單、或該訂單沒有發票快照列 ⇒ 回**非 0** 業務碼，不得回 code=0 ＋ 空 data。
    // 呼叫端（invoice-service）唯一安全的行為是讓 order.paid 重試三次後進 DLQ；
    // 空 data 會被當成「這張訂單沒有品項」而開出一張金額為 0 的發票，發票不可回收。
    OrderInvoiceSnapshotData data = 3;
}

message OrderInvoiceSnapshotData {
    string order_no = 1;
    // order_invoice_snapshots.snapshot_version（數字字串）。
    // invoice-service 沒有、也不得新增任何遞增它的路徑（58 號 I-50）。
    string snapshot_version = 2;

    // ---- 買家發票選擇（order_invoice_snapshots，58 號 §5.4.3 DDL）----
    // 買家在結帳當下宣告的發票種類：B2C / B2B（chk_ois_kind）。
    string invoice_kind = 3;
    // USE_BUYER_DEFAULT / EXPLICIT_PREFERENCE / NONE / DONATION（chk_ois_mode）。
    // USE_BUYER_DEFAULT **不在結帳當下解析**：載具由 invoice-service 建立文件時才依序解析
    // （買家指定的預設 → 手機 → email → 無載具），故本 message 不帶任何載具值。
    string carrier_selection_mode = 4;
    // invoice-service buyer_invoice_preferences.id（數字字串；"" ＝ NULL）。
    // 🔴 前端可控、跨服務、無 FK ⇒ invoice-service 解析時必須驗歸屬
    // （`WHERE id = ? AND buyer_id = orders.buyer_id AND deleted_at IS NULL`，58 號 I-47）；
    // buyer_id 只能取自訂單，不得取自請求。條件不成立要拒絕開票轉 AWAITING_MANUAL，
    // 不是 fallback 成無載具（後者會把 IDOR 靜默吞掉）。
    // 非空 ⟺ carrier_selection_mode == "EXPLICIT_PREFERENCE"（chk_ois_pref_pair 保證）。
    string buyer_invoice_preference_id = 5;
    // 公司統編（8 碼數字；"" ＝ NULL）。屬公開營業登記資訊，非 PII。
    string buyer_tax_id = 6;
    // 買方抬頭（AMEGO BuyerName 上限 60 字元；"" ＝ NULL）。
    string buyer_title = 7;
    // 捐贈碼（3–7 碼數字；"" ＝ NULL）。非空 ⟺ carrier_selection_mode == "DONATION"。
    string donation_code = 8;
    // 發票通知 email（買家在結帳採集，58 號 §6.2.4 order-service ⑤、§7.1.2 步驟 1）。
    // ⚠️ §5.4.3 的 V12 DDL 目前沒有承載此值的欄位——order-service 實作時必須補上，
    // 否則 invoice_documents.recipient_email 恆為空、開票通知寄不出去（不會報錯）。
    string notify_email = 9;

    // ---- 金額（orders，元整數的數字字串；58 號 §5A.2）----
    // Σ order_items.unit_price × quantity（欄名沿用 orders 的既有誤導命名：
    // 它存的是成交價小計，不是原價；原價在 order_items.list_price）。
    string total_original_amount = 10;
    // orders.shipping_fee，買家實際被收的運費；免運成立時為 "0"。
    string shipping_fee = 11;
    // orders 的優惠折扣總額。
    string discount_amount = 12;
    // orders.total_actual_amount ＝ max(0, 小計 + 運費 − 折扣)，發票總額的唯一權威。
    // "0" ⇒ 零元訂單，invoice-service 建 NOT_APPLICABLE 文件（reason=ZERO_AMOUNT），不開票。
    string total_actual_amount = 13;
    // 這筆折扣是誰出的錢："SELLER" / "PLATFORM" / "" ＝ 判不出來。
    // 🔴 零值（""）必須被呼叫端當成 **fail-closed**（＝不是賣家負擔 ⇒ 轉 AWAITING_MANUAL
    // ＋ manual_reason_code=PLATFORM_FUNDED_DISCOUNT），不得當成 "SELLER"：
    // 把平台補貼的那一段從賣家銷售額扣掉 ＝ 賣家短漏報銷售額，要等國稅局查帳才浮現
    // （58 號 §5A.2.2、決策 D9a）。判別欄是 coupon_templates.issuer_type，
    // 而 CouponValidateResult 不帶它（58 號 U-7）⇒ order-service 判不出來時填 ""。
    string discount_funding = 14;

    // ---- fail-closed 三格中程式推不出來的兩格（58 號 §7.1.3）----
    // 和單訂單（代理商 MerID 收款）⇒ 開票法源前提不成立，轉 AWAITING_MANUAL。
    // 第一道防線是 CheckoutConfirm 以 9327 拒絕成單，本欄是第二道。
    bool is_consolidated_order = 15;

    // ---- 品項（order_items，依 order_items.id 升冪；58 號 §5A.3）----
    repeated OrderInvoiceSnapshotItem items = 16;
}

message OrderInvoiceSnapshotItem {
    // order_items.id（TSID 數字字串）。invoice_document_lines.order_item_id 的來源，
    // 也是明細行排序鍵（升冪 ＝ 建立順序，line_seq 決定性不得依賴 map 迭代序）。
    string order_item_id = 1;
    string sku_id = 2;          // TSID 數字字串
    string product_name = 3;
    string sku_name = 4;        // 為空或等於 product_name 時，品名只取 product_name
    string quantity = 5;        // 正整數的數字字串
    // order_items.unit_price（元整數的數字字串）＝**含稅成交價**，不是 list_price。
    // 明細行金額一律由 unit_price × quantity 重建；刻意不回 actual_pay_amount／
    // share_discount，那兩欄的既有分攤器用浮點四捨五入、尾差歸最後一筆、負值夾 0，
    // 收了就會有人拿去算發票金額（58 號 domain.OrderItem 的同一條理由）。
    string unit_price = 6;
}

// ==================== Uber 即時報價中繼（66 §6.1.3；Stage 8B W2-2）====================

message OrderUberQuoteRequest {
    int64 buyer_id = 1;                    // Gateway 注入（E.5.5 int64 例外，與 CheckoutValidateRequest 同）
    string address_id = 2;                 // 買家收件地址 id（buyer 模組的 shipping_addresses.id）
    repeated CheckoutItem items = 3;       // 當前已勾選的商品，與 CheckoutValidate 同一個型別
}

// 🔴 形狀與 shipping.UberQuoteData 對齊但**不共用**：跨服務共用 message 會讓
//    order 與 shipping 的契約綁死，而它們的演進節奏不同（10 檔 §3）。
//    欄位語意逐字相同，轉換點只有一處（OrderGrpcService）。
message OrderUberQuoteData {
    bool available = 1;
    string unavailable_reason = 2;         // available=false 時必填，可寫進 UI 的理由碼
    string quote_id = 3;
    string fee_amount = 4;                 // 運費（元整數；🔴 string）
    string currency = 5;
    string expires_at = 6;                 // ISO 8601 UTC
}

message OrderUberQuoteResponse {
    int32 code = 1;
    string message = 2;
    OrderUberQuoteData data = 3;
}
