syntax = "proto3";

package hawkr.order;

import "common/delegation.proto";

option go_package = "github.com/Will413028/hawkr/go-pkg/proto/order";
option java_multiple_files = true;
option java_package = "io.github.will413028.hawkr.order.grpc";
option java_outer_classname = "OrderProto";

// Order Service - 訂單服務（買家/賣家/後台統一入口）
service OrderService {
    // ==================== 買家端 ====================

    // 建立訂單
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);

    // EXTERNAL lane RFQ 成交建單（64 號 §6.4）。
    //
    // ⛔ 不是 CreateOrder 的變體，也不是它的 lane 分支：本 RPC 刻意不走庫存協調
    //    路徑（不扣庫存、不寫 stock_tx、不鎖購物車、不進補償 worker）——站外業者
    //    的貨在站外，平台不持有可售數量。持久化仍共用同一個 TX handler。
    //    改 createOrder 加分支要動到 @Transactional 與補償路徑內的兩處，那是全平台
    //    共用的庫存寫入路徑，正是 64 號 §6.2 否決 2PC 時用的同一條理由。
    //
    // ⚠️ 只服務 EXTERNAL lane。PLATFORM lane 的 RFQ 成交走現行 CreateOrder
    //    （有真 SKU 與真庫存，賣方就是那個平台賣家）。
    //
    // 冪等鍵＝acceptance_id（orders.acceptance_id 偏唯一索引）：命令由 ai-service 的
    // outbox worker 投遞，重試必然發生；重送回既有 order_no，不建第二張。
    rpc CreateRfqOrder(CreateRfqOrderRequest) returns (CreateRfqOrderResponse);

    // 取消訂單（僅限 PENDING_PAYMENT 狀態）
    rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

    // 查詢我的訂單列表
    rpc GetMyOrders(GetMyOrdersRequest) returns (GetMyOrdersResponse);

    // 查詢買家各狀態訂單筆數（訂單 tab 筆數 rollup，規則見 03 §2.1「買家訂單 Tab 筆數 Rollup（SSOT）」）
    rpc GetMyOrderStatusCounts(GetMyOrderStatusCountsRequest) returns (GetMyOrderStatusCountsResponse);

    // 查詢訂單詳情（買家視角）
    rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);

    // 確認收貨（買家手動，物流已送達後操作）
    rpc ConfirmReceipt(ConfirmReceiptRequest) returns (ConfirmReceiptResponse);

    // ==================== 賣家端 ====================

    // 查詢賣家訂單列表
    rpc GetSellerOrders(GetSellerOrdersRequest) returns (GetSellerOrdersResponse);

    // 查詢賣家訂單詳情
    rpc GetSellerOrderDetail(GetSellerOrderDetailRequest) returns (GetSellerOrderDetailResponse);

    // ==================== 服務間呼叫 ====================

    // 根據物流序號查詢訂單（shipping-service 用）
    rpc GetOrderByShipTradeNo(GetOrderByShipTradeNoRequest) returns (GetOrderByShipTradeNoResponse);

    // 查詢訂單評論資格（review-service 用）
    rpc GetOrderForReview(GetOrderForReviewRequest) returns (GetOrderForReviewResponse);

    // 取得物流建單所需訂單資訊（shipping-service 用）
    rpc GetOrderForShipping(GetOrderForShippingRequest) returns (GetOrderForShippingResponse);

    // 查詢買家在各賣家的累計消費總額（buyer 模組用，會員卡清單）
    rpc GetBuyerMerchantSummary(GetBuyerMerchantSummaryRequest) returns (GetBuyerMerchantSummaryResponse);

    // 查詢買家在特定賣家的消費紀錄（buyer 模組用，消費紀錄明細）
    rpc GetBuyerOrdersForSeller(GetBuyerOrdersForSellerRequest) returns (GetBuyerOrdersForSellerResponse);

    // 售後用：查詢訂單詳情（含買家地址、金額、送達時間，aftersales-service 用）
    rpc GetOrderForAfterSales(GetOrderForAfterSalesRequest) returns (GetOrderForAfterSalesResponse);

    // 售後用：內部取消訂單（CAS status IN (0,10,20)，aftersales-service 用）
    rpc CancelOrderInternal(CancelOrderInternalRequest) returns (CancelOrderInternalResponse);

    // 賣家停權 IM 訂單關聯回填用：反查買賣雙方之間是否存在關聯訂單
    // （判準 status NOT IN (0,80)，14 號設計書 §6.5.1 路徑②，46 號 §4.4；im-service 用）
    rpc HasOrderBetween(HasOrderBetweenRequest) returns (HasOrderBetweenResponse);

    // ==================== 結帳模組 ====================

    // 即時驗證（購物車勾選時呼叫，輕量級，預設運費 Grid）
    rpc CheckoutValidate(CheckoutValidateRequest) returns (CheckoutValidateResponse);

    // 運費精算（選配送方式 + 填地址/選門市後呼叫）
    rpc CheckoutShippingFee(CheckoutShippingFeeRequest) returns (CheckoutShippingFeeResponse);

    // 結帳預覽（完整驗證 + 精算總額，不建單）
    rpc CheckoutPreview(CheckoutPreviewRequest) returns (CheckoutPreviewResponse);

    // 確認結帳（建單 + 回傳付款資訊）
    rpc CheckoutConfirm(CheckoutConfirmRequest) returns (CheckoutConfirmResponse);

    // 取得訂單付款資訊（Payment Service 內部呼叫）
    rpc GetOrderForPayment(GetOrderForPaymentRequest) returns (GetOrderForPaymentResponse);

    // 快照付款資訊到訂單（CreatePayment 成功後由 Gateway 呼叫）
    rpc SnapshotPaymentInfo(SnapshotPaymentInfoRequest) returns (SnapshotPaymentInfoResponse);

    // ==================== 管理端 ====================

    // 搜尋訂單（後台）
    rpc SearchOrders(SearchOrdersRequest) returns (SearchOrdersResponse);

    // 查詢訂單詳情（後台，含資金流水）
    rpc GetAdminOrderDetail(GetAdminOrderDetailRequest) returns (GetAdminOrderDetailResponse);

    // ==================== 賣家儀表板 ====================

    // 查詢賣家訂單狀態計數（gateway 用，儀表板）
    rpc GetSellerOrderStatusCounts(GetSellerOrderStatusCountsRequest) returns (GetSellerOrderStatusCountsResponse);

    // ==================== 推薦商家 ====================

    // 查詢近 N 天營收排名前 N 的賣家（gateway 推薦商家用）
    rpc GetTopSellersByRevenue(GetTopSellersByRevenueRequest) returns (GetTopSellersByRevenueResponse);

    // 查詢近 N 天各店的成立訂單買家數、成立訂單數與賣家取消訂單數（單體 discovery 推薦排行用；
    // 以 store_id 升冪、keyset 分頁取全集）。成立訂單：已付款、未取消、未全額退款；以付款時間計。
    // 賣家取消以取消時間計。
    rpc ListStoreOrderStats(ListStoreOrderStatsRequest) returns (ListStoreOrderStatsResponse);

    // 查詢單一店家在多個時間窗內的成立訂單數、不重複買家數與營收（單體賣家儀表板用）。成立訂單的定義與
    // ListStoreOrderStats 同一個（已付款、未取消、未全額退款，以付款時間計），營收是實付金額扣掉已退款的金額。
    rpc GetStorePeriodOrderStats(GetStorePeriodOrderStatsRequest) returns (GetStorePeriodOrderStatsResponse);

    // ==================== Admin：撥款重發（收斂規範 §8.4 人工介入閉環）====================
    // 重新觸發既有 grant_payment_tasks 的執行；僅 Admin 可用。
    rpc RetryGrant(RetryGrantRequest) returns (RetryGrantResponse);

    // ==================== §29 Admin 異常訂單列表 ====================
    // 跨服務異常訂單聚合（依 order.status 批次聚合 provider_* from Payment / Shipping）
    rpc ListAbnormalOrdersForAdmin(ListAbnormalOrdersForAdminRequest) returns (ListAbnormalOrdersForAdminResponse);

    // ==== 服務間：CRM 訂單聚合 ====
    rpc GetOrderAggregates(GetOrderAggregatesRequest) returns (GetOrderAggregatesResponse);

    // ==== 服務間：發票開立所需的訂單不可變快照（58 號 §7.1.2 步驟 5 ①）====
    // invoice-service 的 order.paid consumer 專用；唯讀、不改任何狀態。
    // 走 52 號 HMAC 內部授權四 header，client deadline 3s（58 號 §7.5「逾時矩陣」）。
    rpc GetOrderInvoiceSnapshotInternal(GetOrderInvoiceSnapshotInternalRequest) returns (GetOrderInvoiceSnapshotInternalResponse);

    // ==== 服務間：買家於開立前更正發票資料（58 號 §6.2.5、B06／R03）====
    // order-service 是 snapshot_version 的唯一寫入者（58 號 I-50），invoice-service
    // 只能複製本 RPC 的回傳值、不得自行 +1。append-only：每次成功都 INSERT 一列新版本。
    // 走 52 號 HMAC 內部授權四 header。
    rpc ReviseOrderInvoiceSnapshotInternal(ReviseOrderInvoiceSnapshotInternalRequest) returns (ReviseOrderInvoiceSnapshotInternalResponse);

    // ==================== Uber 即時報價中繼（66 §6.1.3；Stage 8B W2-2）====================
    //
    // 🔴 為什麼要經過 order-service 而不是 Gateway 直接打 shipping：
    //    報價需要「這一車的賣家是誰、每一件的尺寸重量單價是多少」，而那些是
    //    CheckoutService.resolveItems() 已經在做的事（批次打 product-service）。
    //    讓 Gateway 直接打 shipping 的話，那段解析要在 Gateway 重寫一份，
    //    而 Gateway 是 thin proxy、不該持有商品解析邏輯。
    //
    // ⚠️ 呼叫端只送 address_id 與 items：賣家由伺服端從 SKU 推導（66 §6.1.3 逐字
    //    「不收 externalStoreId」）。前端傳賣家 id 等於讓前端決定跟誰叫車。
    rpc GetUberQuoteForCheckout(OrderUberQuoteRequest) returns (OrderUberQuoteResponse);
}

// ==================== 共用訊息結構 ====================

message PageRequest {
    string page = 1;   // 1-based，數字字串
    string size = 2;
}

message PageMeta {
    string current_page = 1;
    string total_pages = 2;
    string total_items = 3;
}

// 訂單摘要（列表用）
message OrderSummaryView {
    string order_no = 1;
    string create_time = 2;       // Unix timestamp (ms)，數字字串
    string status = 3;            // OrderStatus value，如 "0", "10"
    string total_actual_amount = 4; // 金額字串，如 "1250"
    string item_count = 5;       // 數字字串
    repeated OrderItemView items = 6;
    // 賣家資訊（即時聚合自 Seller Service）
    string seller_name = 7;       // 賣家店名
    string seller_avatar_key = 8; // 賣家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 sellerAvatarUrl；http 值 passthrough）
    string seller_city = 9;       // 賣家城市（如「台北市」）
    string seller_district = 10;  // 賣家地區（如「大安區」）
    string store_id = 11; // 賣家 store_id surrogate（TSID 數字字串）
    // 賣家 canonical 短碼（sellers.store_code）；store_id 是內部代理鍵，賣家頁
    // canonical 網址走 store_code。與 seller_name/seller_avatar_key 同源自
    // batchGetSellerMeta，聚合失敗時為空字串。
    string store_code = 44;
    // 配送資訊（訂單快照）
    string shipping_method = 12;  // 運送方式 value（3001=黑貓 / 3002=7-11店到店 / 3003=Uber）
    string delivery_temp = 13;    // 配送溫層 value（3201=常溫 / 3202=冷藏 / 3203=冷凍）
    string pickup_store_name = 14; // 超商取貨門市名稱（僅 7-11店到店(3002) 時有值）
    // 狀態摘要（後端計算，前端直接渲染）
    string shipping_status = 15;  // 物流狀態 ShippingStatus value = PayUni 狀態碼（""=未建物流單, "91"=未處理, "92"=處理中, "21"=待出貨, "31"=配送中, "32"=待取貨, "11"=已取貨...）
    string shipping_status_desc = 29; // 物流狀態描述（PayUni ShipStatusDesc 或 ShippingStatus displayName）
    string status_time = 16;      // 當前狀態的關鍵時間點（ISO 8601），依 OrderStatus 自動選取
    string status_summary = 17;   // 狀態摘要文案（後端依 OrderStatus + ShippingStatus 組合產生）
    // 賣家訂單列表擴充欄位（卡片顯示用）
    string recipient_name = 18;   // 收件人姓名
    string shipping_address = 19; // 收件地址（宅配）
    string buyer_id = 20; // 買家帳號 ID（TSID 數字字串）
    // 買家資訊（gRPC 聚合自 Buyer Service，僅賣家/管理員視角填充）
    string buyer_nickname = 21;     // 買家暱稱（空字串表示未設定或聚合失敗）
    string buyer_avatar_key = 22;   // 買家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 buyerAvatarUrl；http 值 passthrough）
    // 物流出貨資訊（MQ 事件快照自 Shipping Service）
    string label_key = 23;          // 宅配託運單 PDF objectKey（49 §6.6：Gateway 組 labelUrl；僅宅配有值）
    string label_expire_at = 28;    // 宅配託運單 PDF 下載期限（ISO 8601，取號時 NOW()+24h，僅賣家視角）
    string partner_id = 24;         // 超商出貨便母代碼（3 碼，shipment.label.updated 事件快照）
    string odno = 25;               // 超商出貨單編號（8 碼，shipment.label.updated 事件快照）
    string validation_no = 26;      // 超商 C2C 驗證碼（4 碼，shipment.label.updated 事件快照，B2C 時為空）
    repeated string shipment_photo_keys = 27; // 出貨照片 objectKey 陣列（49 §6.6：Gateway 組 shipmentPhotoUrls；僅賣家視角，選填）
    bool need_refund_page = 30;               // ATM 退款等待買家前往 PayUni 頁面
    bool is_reviewed = 31;                    // 該訂單是否已有評論（任一商品已評即 true）
    string review_deadline = 32;              // 評論截止時間（confirmed_at + 30 天，ISO 8601 UTC，僅 status=50 時有值）
    bool can_review = 33;                     // 是否可評論（status=50 且未超過評論截止時間）
    string auto_complete_at = 34;             // 送達後自動完成時間（ISO 8601 UTC，僅 status=40 時有值；送達時 = delivered_at + auto-complete-hours，倒數恢復時 += 累計暫停時長，03 §5.8）
    string provider_status = 35;              // 聚合 PayUni 原始狀態碼（收斂規範 §6.2；依 order 當下 status 取源）
    string provider_message = 36;             // 聚合 PayUni 原始訊息
    string processing_deadline = 37;          // 賣家處理期限（ISO 8601 UTC，09 §5.9）；空字串表示無期限/已處理/已取消/Uber
    // 取消資訊（僅 status=80 時有值，03 §5.3）
    string cancel_reason = 38;                // OrderCancelReason value（91xx 系統 / 92xx 賣家）；buyer 自願取消為空字串
    string cancel_remark = 39;                // 賣家自填備註（OTHER / SUGGEST_SPLIT 場景；其他為空字串）
    string cancel_by_role = 40;               // OrderCancelByRole value（SYSTEM / SELLER / BUYER）
    string countdown_paused_at = 41;          // 倒數暫停時刻（ISO 8601 UTC；空字串=倒數中，非空=已暫停，03 §5.8）
    // 付款期限（03 §8.5；買家列表「待付款倒數」卡片用，免再逐筆打詳情 API）
    string payment_deadline = 42;             // ISO 8601 UTC，僅 status=0 時有值；建單時 = createdAt + payment-deadline-seconds
    string payment_method = 43;               // 付款方式 PaymentMethod value（CodeMeta 2001-2004；orders.payment_method 快照，未付款為空字串）
}

message OrderItemView {
    string sku_id = 1;           // TSID 數字字串
    string sku_name = 2;         // 規格名稱
    string quantity = 3;         // 數字字串
    string image_key = 4;        // 商品圖片 objectKey（快照；49 §6.6：Gateway 組 imageUrl）
    string id = 5;               // order_item TSID 數字字串
    string product_id = 6;       // 商品 ID（TSID 數字字串，快照）
    string product_name = 7;     // 商品名稱（快照）
    string list_price = 8;       // 原價快照（永遠 = 下單時 SKU.price，數字字串）
    string unit_price = 9;       // 實際成交單價快照（無特價=list_price，有特價=當時 sale_price，數字字串）
}

// 訂單詳情
message OrderDetailView {
    string order_no = 1;
    string create_time = 2;       // Unix timestamp (ms)，數字字串
    string pay_time = 3;          // Unix timestamp (ms)，未付款時為 "0"
    string ship_time = 4;         // Unix timestamp (ms)，未發貨時為 "0"
    string status = 5;            // OrderStatus value，如 "0", "10"
    string total_original_amount = 6;
    string total_actual_amount = 7;
    string shipment_no = 8;
    string transaction_id = 9;   // Admin/Seller 可見；Buyer 視需求遮罩
    string buyer_id = 10; // Admin/Seller 可見，TSID 數字字串
    string store_id = 11; // 賣家 store_id surrogate（TSID 數字字串）
    repeated OrderItemDetail items = 12;
    repeated RefundRequestView refund_history = 13;
    // 配送快照（下單時從商品複製）
    string delivery_temp = 14;      // 配送溫層 value（3201/3202/3203）
    string shipping_method = 15;    // 運送方式 value（3001/3002/3003）
    string shipping_fee = 16;       // 運費快照（新台幣元，數字字串）
    string shipping_fee_payer = 17; // 運費負擔方 value（3101/3102）
    // 收件人資訊快照
    string recipient_name = 18;     // 收件人姓名
    string recipient_phone = 19;    // 收件人電話
    string shipping_address = 20;   // 收件地址
    string shipping_note = 21;      // 配送備註
    // 超商取貨快照
    string cvs_store_id = 22;       // 超商門市代號（與賣家 store_id surrogate 無關）
    string pickup_store_name = 23;  // 超商取貨門市名稱
    // 結帳模組新增
    string shipping_area = 24;      // 配送區域 value（3401=本島 / 3402=離島）
    string coupon_instance_id = 25; // 訂單綁定的優惠券**實例** ID（建單後 reserveCoupon 取得；空字串表示未使用）
    string discount_amount = 26;    // 優惠券折扣金額（數字字串）
    // 物流狀態（Shipping Service 引入後新增）
    string shipping_status = 27;    // 物流狀態碼（ShippingStatus value，數字字串，空字串表示尚未建單）
    string shipping_status_desc = 46; // 物流狀態描述（PayUni ShipStatusDesc 或 ShippingStatus displayName）
    string label_key = 28;          // 宅配託運單 PDF objectKey（49 §6.6：Gateway 組 labelUrl；空字串表示無）
    string label_expire_at = 45;    // 宅配託運單 PDF 下載期限（ISO 8601，僅賣家視角）
    // 超商出貨便代碼（Shipping Service Webhook 回填，聚合至訂單詳情）
    string partner_id = 29;         // 出貨便母代碼（3 碼）
    string odno = 30;               // 出貨單編號（8 碼）
    string validation_no = 31;      // C2C 驗證碼（4 碼，B2C 時為空）
    // 付款資訊（Order DB 快照 + Payment Service 聚合）
    string payment_method = 32;     // 付款方式 value（2001=信用卡 / 2002=ApplePay / 2003=GooglePay / 2004=ATM）
    string atm_bank_code = 33;      // ATM 銀行代碼（僅 ATM 付款時有值，如 "822"）
    string atm_virtual_account = 34; // ATM 虛擬帳號（僅 ATM 付款時有值）
    string atm_expire_date = 35;    // ATM 繳費期限（僅 ATM 付款時有值，格式 "yyyy-MM-dd"）
    // 賣家資訊（即時聚合自 Seller Service）
    string seller_name = 36;        // 賣家店名
    string seller_avatar_key = 37;  // 賣家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 sellerAvatarUrl；http 值 passthrough）
    string seller_city = 38;        // 賣家城市（如「台北市」）
    string seller_district = 39;    // 賣家地區（如「大安區」）
    // 賣家 canonical 短碼（sellers.store_code）；store_id 是內部代理鍵，賣家頁
    // canonical 網址走 store_code。同源自 batchGetSellerMeta，聚合失敗為空字串。
    string store_code = 63;
    // 買家資訊（gRPC 聚合自 Buyer Service，僅賣家/管理員視角填充）
    string buyer_nickname = 40;     // 買家暱稱（空字串表示未設定或聚合失敗）
    string buyer_avatar_key = 41;   // 買家頭像 objectKey（49 §6.6 S2+S9：Gateway 組 buyerAvatarUrl；http 值 passthrough）
    // 取消資訊（賣家取消時填充）
    string cancel_reason = 42;      // 取消原因（空字串表示非賣家取消）
    string cancel_remark = 43;      // 取消備註（空字串表示無備註）
    // 出貨照片（賣家上傳，雙方詳情頁可見，統一從 orders.shipment_photo_urls 快照取）
    repeated string shipment_photo_keys = 44; // 賣家出貨照片 objectKey 陣列（49 §6.6：Gateway 組 shipmentPhotoUrls；選填）
    bool need_refund_page = 47;               // ATM 退款等待買家前往 PayUni 頁面
    // 訂單備註
    string order_remark = 48;                 // 訂單備註（買家下單時留言給賣家，選填）
    // 評論狀態
    bool is_reviewed = 49;                    // 該訂單是否已有評論（任一商品已評即 true）
    // 收貨照片（買家確認收貨時上傳，雙方詳情頁可見）
    repeated string receipt_photo_keys = 50;  // 買家收貨照片 objectKey 陣列（49 §6.6：Gateway 組 receiptPhotoUrls；選填）
    // 評論期限
    string review_deadline = 51;              // 評論截止時間（confirmed_at + 30 天，ISO 8601 UTC，僅 status=50 時有值）
    bool can_review = 52;                     // 是否可評論（status=50 且未超過評論截止時間）
    // 自動完成期限
    string auto_complete_at = 53;             // 送達後自動完成時間（ISO 8601 UTC，僅 status=40 時有值；送達時 = delivered_at + auto-complete-hours，倒數恢復時 += 累計暫停時長，03 §5.8）
    // 聚合 PayUni provider 狀態（收斂規範 §6.2 / §9.4）
    string provider_status = 54;              // 依 order 當下 status 取自 payment_transactions / payment_refunds / shipments
    string provider_message = 55;             // 聚合 PayUni 原始訊息
    // 賣家處理期限（09 §5.9）
    string processing_deadline = 56;          // ISO 8601 UTC；空字串表示無期限/已處理/已取消/Uber
    // 取消角色（cancel_reason / cancel_remark 已分別在 field 42/43，03 §5.3）
    string cancel_by_role = 57;               // OrderCancelByRole value（SYSTEM / SELLER / BUYER；僅 status=80 時有值）
    // 自動完成倒數暫停（03 §5.8）
    string countdown_paused_at = 58;          // 倒數暫停時刻（ISO 8601 UTC；空字串=倒數中，非空=已暫停）
    // 付款期限（03 §8.5；買家詳情頁顯示「待付款倒數」用）
    string payment_deadline = 59;             // ISO 8601 UTC，僅 status=0 時有值；建單時 = createdAt + payment-deadline-seconds
    // 評論快照（訂單層級單一，取該訂單最近一筆商品評論；未評論時不設定 / null）
    OrderReviewView review = 60;
    // 付款 PayUni MerID（= orders.mer_id）— 給 Web/Mobile Google Pay 重試時動態取得 tokenization gatewayMerchantId（20 設計書 §4.13）
    string payment_mer_id = 61;
    // 再次付款可用付款方式（依 total_actual_amount 算）。**僅買家 getOrder + status=PENDING_PAYMENT 時填**；賣家/管理員/物流 caller 與非 pending 一律空（per-caller enrich，03 §4.2.1）。型別與規則同結帳預覽（20 §3.4.1）
    repeated AvailablePaymentMethod available_payment_methods = 62;
    // 結案節點時間（皆 ISO 8601 UTC，空字串=尚未發生）。訂單時間軸的最後一格靠它們——
    // 沒有這三欄時只能送空字串，或拿 updated_at 冒充（dev 實測 95 筆取消單有 11 筆漂掉、
    // 最大漂 22.7 天，故不採用）。
    //
    // completed_at 的來源欄是 orders.confirmed_at，兩者刻意不同名：DB 欄記的是「買家確認
    // 收貨」這個**動作**的時間，而 40→50 的轉換一次寫入 status=COMPLETED 與 confirmed_at
    // （OrderRepository.completeDeliveredOrderByStatus），所以那個時刻同時就是訂單完成的
    // 時刻。對外契約用業務語意命名，不把 DB 欄名洩漏出去；改 DB 欄名的成本大於收益。
    string completed_at = 64;                 // 訂單完成時間（= orders.confirmed_at；僅 status=50 時有值）
    string cancelled_at = 65;                 // 訂單取消時間（僅 status=80 時有值）
    string delivered_at = 66;                 // 訂單送達時間（status>=40 時有值）
}

message OrderItemDetail {
    string id = 1;               // order_item TSID 數字字串
    string sku_id = 2;           // TSID 數字字串
    string sku_name = 3;         // 規格名稱
    string quantity = 4;         // 數字字串
    string unit_price = 5;       // **重命名**（原 original_price → unit_price）：實際成交單價快照
    string actual_pay_amount = 6;
    string refund_status = 7;     // OrderItemStatus value，如 "0", "20"
    string share_discount = 8;   // 分攤折扣金額（數字字串）
    string image_key = 9;        // 商品圖片 objectKey（快照；49 §6.6：Gateway 組 imageUrl）
    string product_id = 10;      // 商品 ID（TSID 數字字串，快照）
    string product_name = 11;    // 商品名稱（快照）
    string list_price = 12;      // **新增**：原價快照（永遠 = 下單時 SKU.price，數字字串）
}

// 訂單評論快照（訂單層級單一；取該訂單最近一筆商品評論，源自 review.created MQ 事件，凍結快照）
message OrderReviewView {
