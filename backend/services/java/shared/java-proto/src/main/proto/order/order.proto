message CreateOrderRequest {
    int64 buyer_id = 1;          // Gateway 注入的 buyer_id（原 account_id，已改名對齊語意）
    string store_id = 2;  // 買家選購的目標店家 store_id surrogate（前端傳入，TSID 數字字串）
    repeated CreateOrderItem items = 3;
    string total_original_amount = 4;  // 金額字串，如 "1250"
    string total_actual_amount = 5;
    string checkout_id = 6;       // 購物車結帳批次 ID（UUID 字串，非購物車下單可不填）
    string delivery_temp = 7;     // 配送溫層 value（如 3201、3202、3203）
    string shipping_method = 8;   // 運送方式 value（如 3001、3002）
    string shipping_fee = 9;      // 運費（新台幣元，數字字串）
    string shipping_fee_payer = 10; // 運費負擔方 value（如 3101、3102）
    // 收件人資訊
    string recipient_name = 11;    // 收件人姓名
    string recipient_phone = 12;   // 收件人電話
    string shipping_address = 13;  // 收件地址（宅配）
    string shipping_note = 14;     // 配送備註（選填）
    // 超商取貨資訊
    string cvs_store_id = 15;      // 超商門市代號（店到店；與賣家 store_id surrogate 無關）
    string cvs_store_name = 16;    // 超商門市名稱（店到店）
    // 結帳模組新增
    string shipping_area = 17;     // 配送區域（MAIN_ISLAND / OFFSHORE_ISLAND）
    string mer_id = 18;            // PayUni 商家編號（Confirm 時從 Seller Service 取得）
    string coupon_instance_id = 19; // 訂單綁定的優惠券**實例** ID（空字串表示未使用）
    string discount_amount = 20;   // 優惠券折扣金額（數字字串，由 Coupon Service 計算）
}

message CreateRfqOrderRequest {
    // 冪等鍵：ai-service 的 procurement_buyer_quote_acceptances.id（TSID 數字字串）。
    string acceptance_id = 1;
    int64 buyer_id = 2;
    // 訂單賣方的 store surrogate id（TSID 數字字串）。
    // `EXTERNAL` ⇒ 平台結算 store（2026-09-07 的建單決策指定的那一筆設定值）；
    // `PLATFORM` ⇒ 回價那個平台賣家自己的 store。
    string store_id = 3;
    // 成交總額 ＝ goods + shipping + tax（賣家那一版的 totalAmount）。
    // 同時寫進 total_actual_amount 與 total_original_amount：RFQ 沒有優惠券。
    string total_amount = 4;
    // 運費。買方負擔（shipping_fee_payer 固定 3101），對帳式因此成立：
    // sum(order_items.actual_pay_amount) + shipping_fee = total_actual_amount。
    string shipping_fee = 5;
    // 一次性 SKU（worker 先向 ProductService 建好才投遞本命令）。
    string sku_id = 6;
    // 真實成交品名，**含數量與單位**。⛔ 不得使用 sentinel：退款、售後、發票三條
    // 下游都吃它。數量與單位寫在名稱裡是因為 order_items.quantity 是 INT，而賣家
    // 報價的數量是 NUMERIC(14,3)（12.5 公斤是合法報價），小數表達不出來。
    string sku_name = 7;
    // 單價 ＝ goods + tax。order_items 恆為一列且 quantity = 1。
    string unit_price = 8;
    // 配送溫層 value（選填，如 3201／3202／3203）。
    string delivery_temp = 9;
    // 賣方身分 lane：`PLATFORM`（平台賣家自己就是訂單賣方）｜`EXTERNAL`（站外業者，
    // 賣方記為平台結算 store）。未知值 fail-closed，不猜。
    //
    // ⛔ **兩條 lane 都不扣庫存**：賣家回價不綁任何 SKU——
    // `procurement_seller_response_versions` 與 `procurement_buyer_quote_acceptances`
    // 對 sku／product 都是零命中，賣家報的是「200 公斤、總價 30000」這種自帶單位基準
    // 的承諾，不是「買 N 件某商品」。沒有可扣的可售量，要扣就得自己發明一條從報價
    // 回推候選商品的對應，而候選是探索產物不是契約。
    //
    // ⇒ lane 的差別只有兩件事：賣方是誰（store_id）、政策六欄是賣家直營還是 MoR。
    string lane = 10;
}

message CreateRfqOrderData {
    string order_no = 1;
    // ISO8601。付款期限由 order-service 依既有設定算，呼叫端不得指定。
    string payment_deadline = 2;
    // true ＝ 冪等命中，回的是既有那一張，本次沒有建立新訂單。
    bool replayed = 3;
}

message CreateRfqOrderResponse {
    int32 code = 1;
    string message = 2;
    CreateRfqOrderData data = 3;
}

message CreateOrderItem {
