message CreateRefundRequest {
  string trade_no = 1;
  string amount = 2;          // 退款金額（新台幣元，數字字串格式）
  string reason = 3;
  // field 4~7 已移除（ATM 改用 PayUni 頁面版，平台不接觸銀行機敏資訊）
  reserved 4, 5, 6, 7;
  string refund_no = 8;       // 冪等鍵（AfterSales 傳入 case_no 或 cancel_id）
}

message CreateRefundResponse {
  int32 code = 1;             // 0=成功
  string message = 2;
  RefundDetail data = 3;
}

message RefundDetail {
  string refund_no = 1;
  string trade_no = 2;
  string order_id = 3;
  string amount = 4;          // 退款金額（新台幣元，數字字串格式）
  string status = 5;           // 退款狀態 value（0=REQUESTED, 1=PROCESSING, 2=SUCCEEDED, 3=FAILED）
  string reason = 6;
  string provider_refund_no = 7;
  string provider_status = 8;     // 收斂規範 §4.4：sync 寫 response.Status；async webhook 寫 inner RefundStatus（1/2）
  string provider_message = 9;
  string completed_at = 10;   // Unix timestamp 毫秒（數字字串）
  string created_at = 11;     // Unix timestamp 毫秒（數字字串）
  string estimated_refund_date = 12; // ATM sync success：PayUni EstimatedRefundDate（YYYY-MM-DD，空字串代表無值）
  string bank_date = 13;      // ATM async RefundStatus=1：webhook BankDate（YYYY-MM-DD，空字串代表無值）
}

