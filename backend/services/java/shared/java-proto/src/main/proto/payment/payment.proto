syntax = "proto3";

// 必須與 Java payment-service 的 proto package 一致，gRPC 才能正確路由
package io.github.will413028.hawkr.payment.grpc;

option go_package = "github.com/Will413028/hawkr/go-pkg/proto/payment";
option java_package = "io.github.will413028.hawkr.payment.grpc";
option java_multiple_files = true;

// Payment Service - 支付服務 gRPC 接口（與 Java payment-service 同步）
service PaymentService {
  // 建立支付交易
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // 查詢支付詳情
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  // §2A.3.6 / §2A.6 查詢同 order_id 的所有付款嘗試（含 CLOSED_BY_SWITCH / 副 row）
  rpc GetPaymentHistory(GetPaymentHistoryRequest) returns (GetPaymentHistoryResponse);

  // #2501 賣家視角付款歷程：由 Gateway 解出的現任 store_id 驗店家歸屬（一般 GetPaymentHistory 已收斂為 buyer-only）
  rpc GetSellerPaymentHistory(GetSellerPaymentHistoryRequest) returns (GetSellerPaymentHistoryResponse);

  // 查詢付款狀態（公開，免驗證 — 供付款結果回調頁面使用）
  rpc GetPublicPaymentStatus(GetPublicPaymentStatusRequest) returns (GetPublicPaymentStatusResponse);

  // 同步查詢支付狀態（呼叫 PayUni Query API）
  rpc SyncPaymentStatus(SyncPaymentStatusRequest) returns (SyncPaymentStatusResponse);

  // 關閉交易
  rpc ClosePayment(ClosePaymentRequest) returns (ClosePaymentResponse);

  // 依訂單編號關閉付款交易（Order Service 取消訂單時呼叫，內部 RPC）
  rpc ClosePaymentByOrderNo(ClosePaymentByOrderNoRequest) returns (ClosePaymentByOrderNoResponse);

  // 依訂單編號反查活躍/最終付款狀態（internal-only，Order Service 逾期取消前守門用）
  // 免權限（isInternalCall()）；以 order_no 為鍵回傳該訂單 canonical 交易的付款狀態
  rpc GetActivePaymentStatusByOrderNo(GetActivePaymentStatusByOrderNoRequest) returns (GetActivePaymentStatusByOrderNoResponse);

  // 建立退款
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);

  // 查詢退款詳情
  rpc GetRefund(GetRefundRequest) returns (GetRefundResponse);

  // 查詢交易的所有退款
  rpc GetRefundsByTradeNo(GetRefundsByTradeNoRequest) returns (GetRefundsByTradeNoResponse);

  // 取得付款結果回調頁面（含 HTML + Deep Link，供 Gateway 透傳）
  rpc GetPaymentReturnPage(GetPaymentReturnPageRequest) returns (GetPaymentReturnPageResponse);

  // 以 opaque redirect_id 取回付款中轉表單 canonical 欄位（Gateway GET /payment/redirect?id= 用，一次性消費，#1394 反射 XSS 修復）
  rpc GetPaymentRedirectForm(GetPaymentRedirectFormRequest) returns (GetPaymentRedirectFormResponse);

  // 發動撥款指示（代理商模式：買家確認收貨後，由 Order Service 呼叫）
  rpc GrantPayment(GrantPaymentRequest) returns (GrantPaymentResponse);

  // ATM 退款頁面版 URL 組裝（AfterSales Service 呼叫）
  rpc GetRefundPageUrl(GetRefundPageUrlRequest) returns (GetRefundPageUrlResponse);

  // 批次查詢付款 provider 狀態（Order 聚合用，收斂規範 §6.3）
  rpc BatchGetProviderStatusByOrderIds(BatchGetProviderStatusByOrderIdsRequest) returns (BatchGetProviderStatusByOrderIdsResponse);

  // 批次查詢退款 provider 狀態 by case_ids（AfterSales 聚合用）
  rpc BatchGetRefundProviderStatusByCaseIds(BatchGetRefundProviderStatusByCaseIdsRequest) returns (BatchGetRefundProviderStatusResponse);

  // 批次查詢退款 provider 狀態 by order_ids（Order 聚合用，取每個 order 最新一筆 payment_refunds）
  rpc BatchGetRefundProviderStatusByOrderIds(BatchGetRefundProviderStatusByOrderIdsRequest) returns (BatchGetRefundProviderStatusResponse);

  // 信用卡付款 Return 處理（Gateway 接收 PayUni Form POST 後呼叫）
  // 解密 + 驗簽 + 更新交易狀態 + 組裝 Deep Link
  rpc HandlePaymentPageReturn(HandlePaymentPageReturnRequest) returns (HandlePaymentPageReturnResponse);

  // ── 多功能收付（agent_fee，代理商級別 API）──────────────────────────────
  //
  // 🔴 **本 RPC 目前零呼叫端**（2026-09-12 實查）。原本規劃的唯一 caller 是一個獨立的
  // Go 服務，而架構裁決 DEC-20260912-184025 已把該 domain 併進 payment-service ⇒
  // 內部收款直接注入 AgentFeeService，**不得自己 call 自己的 gRPC**（裁決第 5 條）。
  // ⚠️ 它因此是一支孤兒 RPC（10 檔 §5.3），留著只會讓下一個人以為有人在用。
  // 與 GrantPayment 是**方向相反的兩件事**：
  // 撥款是平台付錢給賣家，本組是平台**向賣家收**物流服務費。

  // 送出多功能收付。
  // 🔴 呼叫端必須**先落地 trade_no** 才呼叫本 RPC（70 §3.3 pre-commit）；
  // 🔴 **本 RPC 不負責去重**——PayUni 官方三處逐字標 TradeNo「可重複」，
  //    去重只能由呼叫端的 DB UNIQUE 保證。
  rpc SubmitAgentFee(SubmitAgentFeeRequest) returns (SubmitAgentFeeResponse);

  // 查詢多功能收付的撥款結果（agent_fee_query）。
  // 回 FundDate 與實際 Fee —— 那是「平台到底收到多少」的唯一來源。
  rpc QueryAgentFee(QueryAgentFeeRequest) returns (QueryAgentFeeResponse);

  // PayUni 加密資料通用解密（供其他微服務呼叫，如 AfterSales ATM 退款回調）
  rpc DecryptPayUniResult(DecryptPayUniResultRequest) returns (DecryptPayUniResultResponse);

  // Apple Pay on Web Merchant Validation：對 Apple validationURL 取 merchantSession
  // 使用 Apple Pay Merchant Identity Certificate (PEM + Key) 進行 mTLS POST，原樣透傳 Apple 回應
  // 詳見 05 號設計書 §5.11
  rpc ValidateApplePayMerchant(ValidateApplePayMerchantRequest) returns (ValidateApplePayMerchantResponse);

  // ATM 退款頁面版受理成功確認（收斂規範 §4.4 雙階段 sync 階段 → PROCESSING + estimated_refund_date）
  // AfterSales 解密 PayUni 回頁面 payload 後呼叫
  rpc AckAtmRefundAccepted(AckAtmRefundAcceptedRequest) returns (AckAtmRefundAcceptedResponse);

  // ==================== Admin 異常查詢 API（§29 Admin 異常訂單管理）====================

  // 列付款異常（FAILED / EXPIRED / CONFLICT 或 rescue_action 有值）
  rpc ListPaymentTransactionsForAdmin(ListPaymentTransactionsForAdminRequest) returns (ListPaymentTransactionsForAdminResponse);

  // 取付款詳情（Admin 對帳用，含 grant_* 撥款欄位、rescue、重複付款等）
  rpc GetPaymentTransactionForAdmin(GetPaymentTransactionForAdminRequest) returns (GetPaymentTransactionForAdminResponse);

  // 列退款異常（FAILED 或處理超時 24h）
  rpc ListRefundsForAdmin(ListRefundsForAdminRequest) returns (ListRefundsForAdminResponse);

  // 取退款詳情
  rpc GetRefundForAdmin(GetRefundForAdminRequest) returns (GetRefundForAdminResponse);

  // 列撥款異常（grant_status 非成功）
  rpc ListGrantsForAdmin(ListGrantsForAdminRequest) returns (ListGrantsForAdminResponse);

  // ==== 服務間：發票日期與金額所需的付款事實（58 號 §7.1.2 步驟 5 ②、註 2）====
  // invoice-service 的 order.paid consumer 專用；唯讀，**不改支付服務任何狀態機**。
  // 走 52 號 HMAC 內部授權四 header，client deadline 3s。
  // 既有的 AdminPaymentTransactionDetail 雖然也帶 provider_paid_at，但那是 admin 面 DTO，
  // 服務間直用違反角色分離（Proto 管理規範 §5.1）。
  rpc GetPaymentFactsInternal(GetPaymentFactsInternalRequest) returns (GetPaymentFactsInternalResponse);

}


// ══════════════════════════════════════════════════════════════════════════════
// LogisticsFinanceService —— 物流財務（線 B）的對外出口
// ══════════════════════════════════════════════════════════════════════════════
//
// 🔴 **為什麼是獨立的 service 而不是掛在 PaymentService 底下**：gRPC 一個 service name
//    只能有一個實作 bean。掛進 PaymentService 就必須把十支 RPC 塞進已經 1900 行的
//    PaymentGrpcService，而那支的每個方法都帶著自己的授權與遮蔽規則——混進去之後
//    「這支 RPC 的授權軸是什麼」要逐行讀才知道。獨立 service ＝ 獨立 bean ＝
//    授權規則看一眼就成立（對照：MembershipBillingService 同一個理由）。
//    ⚠️ 它與 PaymentService 共用同一個 gRPC channel／port，不新增任何服務或部署單元。
service LogisticsFinanceService {
  // ==================== 物流財務（線 B：賣家物流應收 / 收款 / 對帳）====================
  //
  // V9 的九張表在本波之前**零對外出口**：賣家看不到自己被收了多少物流費，Admin 查不到
  // 任何一筆應收、收款或對帳差額。以下兩組 RPC 就是那個出口。
  //
  // 🔴 **全部唯讀**。寫入路徑只有兩條且都已存在：送達事件建應收、scheduler 送出／查詢／
  //    對帳。在這裡開寫入 RPC 等於開一條繞過 idempotency key 與 lease 的第二路徑
  //    （CLAUDE.md §22：不在 application code 建補償入口）。
  //
  // 🔴 **賣家面與 Admin 面是兩組獨立 RPC**（Proto 管理規範 §5.1）：不得以 flag、特殊值
  //    或「同一支 RPC 看 account_type 分流」實作。賣家面的 store_id 由 Gateway 的
  //    sellerid resolver 解出後注入，服務端強制以它過濾，**不接受呼叫端指定任何 store**。
  //
  // 🔴 **十一個維度（ADR-008 §1）各自是獨立欄位，不得合併或互相抵銷。** 最容易犯的是
  //    把「賣家欠平台」與「平台欠賣家」合成一個帶正負的淨額——那兩個是兩個科目，
  //    合成之後 ADR-008「永久可追蹤」的保證就失效了，而帳面上看起來一切正常。

  // 賣家面：一間店（可選期間）的物流財務總覽，十一個維度逐一具名。
  rpc GetSellerLogisticsFinanceSummary(GetSellerLogisticsFinanceSummaryRequest) returns (GetSellerLogisticsFinanceSummaryResponse);

  // 賣家面：自己的應收明細（分頁）。每一筆帶同樣十一個維度的單筆值。
  rpc ListSellerLogisticsReceivables(ListSellerLogisticsReceivablesRequest) returns (ListSellerLogisticsReceivablesResponse);

  // 賣家面：自己的物流帳本流水（雙分錄表頭 ＋ 分錄）。
  rpc ListSellerLogisticsLedgerEntries(ListSellerLogisticsLedgerEntriesRequest) returns (ListSellerLogisticsLedgerEntriesResponse);

  // Admin 面：應收列表／單筆詳情（含收款嘗試、調整單、帳本、該賣家帳戶餘額）。
  rpc ListLogisticsReceivablesForAdmin(ListLogisticsReceivablesForAdminRequest) returns (ListLogisticsReceivablesForAdminResponse);
  rpc GetLogisticsReceivableForAdmin(GetLogisticsReceivableForAdminRequest) returns (GetLogisticsReceivableForAdminResponse);

  // Admin 面：PayUni 收款嘗試（gross / actual fee / net proceeds / residual）。
  rpc ListLogisticsCollectionsForAdmin(ListLogisticsCollectionsForAdminRequest) returns (ListLogisticsCollectionsForAdminResponse);

  // Admin 面：責任／對帳調整單。
  rpc ListLogisticsAdjustmentsForAdmin(ListLogisticsAdjustmentsForAdminRequest) returns (ListLogisticsAdjustmentsForAdminResponse);

  // Admin 面：provider 帳單（彙總）與單份帳單的全部明細列。
  rpc ListProviderStatementsForAdmin(ListProviderStatementsForAdminRequest) returns (ListProviderStatementsForAdminResponse);
  rpc GetProviderStatementForAdmin(GetProviderStatementForAdminRequest) returns (GetProviderStatementForAdminResponse);

  // Admin 面：維運例外案件佇列（含人工覆核提案，manual review）。
  rpc ListFulfillmentExceptionCasesForAdmin(ListFulfillmentExceptionCasesForAdminRequest) returns (ListFulfillmentExceptionCasesForAdminResponse);

  // Admin 面：單一例外案件詳情（65 §6.1.1 A-2）。
  //
  // 🔴 **與 List 分開是刻意的**：List 是佇列視圖（分頁、篩選、SLA 齡），Detail 要帶
  //    responsibility 軸的完整決策脈絡（凍結的 event context、maker 主張的成因、
  //    影響預覽快照、提案歷程）。把它們做成同一支 RPC 靠 flag 分流，就是 Proto 管理
  //    規範 §5.1 禁止的那個形狀。
  //
  // ⚠️ 它仍然是**讀**，所以留在這支唯讀 service；寫入路徑在
  //    FulfillmentResponsibilityService（見該 service 的說明）。
  rpc GetFulfillmentExceptionCaseForAdmin(GetFulfillmentExceptionCaseForAdminRequest) returns (GetFulfillmentExceptionCaseForAdminResponse);
}

// ══════════════════════════════════════════════════════════════════════════════
// FulfillmentResponsibilityService —— 責任判定 maker-checker 的**寫入**出口（WP2B）
// ══════════════════════════════════════════════════════════════════════════════
//
// 🔴 **為什麼不掛在 LogisticsFinanceService 底下**：那支 service 的檔頭逐字寫著
//    「**全部唯讀**。寫入路徑只有兩條且都已存在……在這裡開寫入 RPC 等於開一條繞過
//    idempotency key 與 lease 的第二路徑」。那句話針對的是**應收與收款**軸，而它是對的
//    ——本 service 不碰 logistics_receivables 一個欄位。
//    把責任判定的寫入塞進去，會讓那句「全部唯讀」變成假的，而**一句被推翻的不變式
//    比沒有不變式更危險**：下一個人讀到它會以為那支 service 不會寫任何東西。
//    ⇒ 獨立 service ＝ 獨立 bean ＝ 授權與寫入邊界看一眼就成立
//      （與 LogisticsFinanceService／MembershipBillingService 同一個判準）。
//    ⚠️ 共用同一個 gRPC channel／port（payment-service 9925），不新增服務或部署單元。
//
// 🔴 **本 service 只做「責任判定」這一種 resolution_type**（`RESPONSIBILITY_ATTRIBUTE`）。
//    `chk_fcr_type` 另外六個型別（CLAIM_SETTLE／CLAIM_DISMISS／SHIPMENT_CANCEL／
//    SHIPMENT_CANCEL_CONFIRM／SHIPMENT_CANCEL_AND_REFUND／ANOMALY_RESUME）的副作用
//    全部落在 shipping-service 的配送軸狀態邊上（65 §6.4.2 對照表），本波不實作。
//    ⇒ 對它們一律 **fail-closed 拒絕**（9571），**不是**先收下來再說——收下一個沒有人
//      會執行副作用的提案，等於製造一張永遠結不了的案件。
//    ⚠️ URL 形狀與雙人約束刻意對齊 65 §6.1.1 的 A-4／A-5，讓後續波次直接擴充同一組端點，
//      而不是另開一套（「同一個機制長成兩種形狀」是 65 §6.1.2 明令要避免的）。
service FulfillmentResponsibilityService {
  // A-4 maker：提出責任判定提案（附 server 端算出的影響預覽快照）。
  //
  // 🔴 成因（responsibility_cause）是**提案的標的物**，不是覆核時才補的欄位：
  //    它決定買家拿不拿得到退款（BUYER_CAUSED ⇒ refund = 0）。若成因在 approve 當下
  //    才第一次出現，雙人制保證的就只剩「有兩個人碰過這張單」，而不是「第二個人批准了
  //    第一個人提的那一件事」——覆核者可以獨自決定不退款，而帳面上雙人制完全成立。
  rpc ProposeResponsibilityResolutionForAdmin(ProposeResponsibilityResolutionForAdminRequest) returns (ProposeResponsibilityResolutionForAdminResponse);

  // A-5 checker：覆核（APPROVE／REJECT）。
  //
  // 🔴 request **刻意只有 decision ＋ comment**：覆核者能表達的只有「批准或駁回**這一筆
  //    提案**」。成因取自 maker 的提案列、事件 context 取自建案當下凍結的案件列、
  //    覆核者身分取自 GrpcAuthContext ——三者皆非呼叫端可指定。
  //    ⚠️ 不得為了「方便前端」把 responsibility_cause／order_no／shipment_id／
  //      shipping_method／refund_amount 任何一欄加進本 request。
  rpc ReviewResponsibilityResolutionForAdmin(ReviewResponsibilityResolutionForAdminRequest) returns (ReviewResponsibilityResolutionForAdminResponse);
}

// ==================== 枚舉已移除 ====================
// PaymentType, TransactionStatus, RefundStatus 改為 string（存 CodeMeta value）

// ==================== 建立支付 ====================

message CreatePaymentRequest {
  string order_no = 1;            // 訂單編號（必填，Payment Service 從 Order Service 查詢 mer_id + amount）
  string payment_type = 2;        // 支付方式 value（2001=信用卡, 2002=ApplePay, 2003=GooglePay, 2004=ATM）
  string expire_days = 3;        // ATM 繳費期限天數（數字字串）
  string apple_pay_token = 4;    // Apple Pay payment token
  string google_pay_token = 5;   // Google Pay payment token
  string bank_type = 6;          // ATM 銀行代碼
  string user_email = 7;         // 使用者信箱（付款通知用）
  int64 buyer_id = 8;             // Gateway 已解析為現任 buyer_id 後注入（見 gateway payment.go resolvePaymentBuyerID；E.5.5 例外 #1，2026-08-02 由 account_id 改名，值本來就是 buyer_id）
  string client_type = 9;        // CodeMeta ClientType value（MOBILE_APP / WEB_BROWSER）；空字串視為 MOBILE_APP（向下相容）。決定 §5.9 PayUni 回調最終出口
  string app_type = 10;          // CodeMeta AppType value（BUYER / SELLER）；空字串視為 BUYER（向下相容）。Gateway 由 JWT AccountType 推導後注入，禁止寫死字串字面量
  // mer_id、amount、product_name 由 Payment Service 從 Order Service 查詢，不由前端傳入
}

message CreatePaymentResponse {
  int32 code = 1;             // 0=成功
  string message = 2;
  PaymentResult data = 3;
}

message PaymentResult {
  string trade_no = 1;
  string order_id = 2;
  string payment_type = 3;     // 支付方式 value
  string amount = 4;          // 金額（新台幣元，數字字串格式）
  string status = 5;          // 交易狀態 value（0=INIT, 1=PAID, 2=FAILED, 3=EXPIRED, 4=CONFLICT, 5=CLOSED）

  // 信用卡 UPP 表單資料（前端需組裝 form POST 到 PayUni）
  UppFormData upp_form_data = 6;

  // ATM 專用
  string atm_bank_code = 7;
  string atm_virtual_account = 8;
  string atm_expire_date = 9;

  // 保留欄位編號 10, 11（已移除 CVS 相關欄位）
  reserved 10, 11;

  string expire_at = 12;      // Unix timestamp 毫秒（數字字串）

  // 完整的 WebView 開啟 URL（含 base64 編碼表單資料，由 Payment Service 組裝）
  string redirect_url = 13;
}

// UPP 整合式支付頁 Form POST 資料
// 前端收到後需建立 hidden form 並 POST 到 action_url
message UppFormData {
  string action_url = 1;      // https://api.payuni.com.tw/api/upp
  string mer_id = 2;        // MerID（PayUni 子商家代號）
  string version = 3;         // 固定 2.0
  string encrypt_info = 4;    // AES 加密字串
  string hash_info = 5;       // SHA256 簽章
  string is_platform = 6;     // 代理商模式固定 "1"
}

// ==================== 查詢支付 ====================

message GetPaymentRequest {
  string trade_no = 1;
}

message GetPaymentResponse {
  int32 code = 1;             // 0=成功
  string message = 2;
  PaymentDetail data = 3;
}

message PaymentDetail {
  string trade_no = 1;
  string order_id = 2;
  string mer_id = 3;
  string buyer_id = 4;         // 買家 buyer_id（2026-08-02 由 account_id 改名，值本來就是 buyer_id）
  string payment_type = 5;     // 支付方式 value
  string amount = 6;          // 金額（新台幣元，數字字串格式）
  string product_name = 7;
  string status = 8;          // 交易狀態 value
  string provider_trade_no = 9;
  string provider_status = 10;
  string provider_message = 11;
  string atm_bank_code = 12;
  string atm_virtual_account = 13;
  string atm_expire_date = 14;
  string pay_time = 15;       // Unix timestamp 毫秒（數字字串）
  string closed_at = 16;      // Unix timestamp 毫秒（數字字串）
  string expire_at = 17;      // Unix timestamp 毫秒（數字字串）
  string created_at = 18;     // Unix timestamp 毫秒（數字字串）
  string updated_at = 19;     // Unix timestamp 毫秒（數字字串）
  // §2A.6 重複付款顯示欄位
  bool is_duplicate = 20;     // 是否為重複付款副 row
  string duplicate_sequence = 21; // 重複付款序號（1, 2, 3...），主 row 為空字串
  // 撥款欄位（收斂規範 §2.3 / §6.2：僅 Admin API 暴露，App DTO 必須過濾）
  string granted_at = 22;     // 撥款成功時間（ISO 8601，Admin only）
  string grant_status = 23;   // PayUni 撥款狀態碼（Admin only）
  string grant_message = 24;  // PayUni 撥款訊息（Admin only）
}

// ==================== §2A.3.6 / §2A.6 付款歷程查詢 ====================

message GetPaymentHistoryRequest {
  string order_id = 1;            // 原始訂單編號（如 O382716459），查詢該訂單所有付款嘗試
  int64 account_id = 2;           // Gateway JWT 注入，僅能查自己的訂單
}

message GetPaymentHistoryResponse {
  int32 code = 1;
  string message = 2;
  repeated PaymentDetail records = 3;  // 依 created_at DESC 排序，含 CLOSED_BY_SWITCH / 副 row
}

// #2501 賣家視角付款歷程查詢。store_id 由 Gateway 從賣家 JWT 的 account_id 解出的
// 現任 store_id（信任 actor context，非 client 自填）；payment-service 仍會以
// canonical order 反解的 store_id 再次比對，跨店與查無訂單一律回同形 NOT_FOUND。
message GetSellerPaymentHistoryRequest {
  string order_id = 1;            // 原始訂單編號（如 O382716459）
  int64 store_id = 2;             // Gateway 解出的呼叫端現任 store_id
}

// 賣家視角回應：records 與買家版同型，但 payment-service 已遮蔽 buyer_id /
// atm_virtual_account / provider_trade_no 等買家 PII（#2501）。
message GetSellerPaymentHistoryResponse {
  int32 code = 1;
  string message = 2;
  repeated PaymentDetail records = 3;  // 依 created_at DESC 排序，含 CLOSED_BY_SWITCH / 副 row
}

// ==================== 公開查詢付款狀態（免驗證） ====================

message GetPublicPaymentStatusRequest {
  string trade_no = 1;
}

message GetPublicPaymentStatusResponse {
  int32 code = 1;               // 0=成功
  string message = 2;
  PublicPaymentStatus data = 3;
}

// 僅回傳最小資訊，不含敏感欄位（buyer_id、mer_id 等）
message PublicPaymentStatus {
  string trade_no = 1;
  string order_id = 2;
  string amount = 3;            // 金額（新台幣元，數字字串）
  string status = 4;           // 交易狀態 value
}

// ==================== 付款結果回調頁面 ====================

message GetPaymentReturnPageRequest {
  string trade_no = 1;          // 交易編號
}

message GetPaymentReturnPageResponse {
  string html_content = 1;      // 完整 HTML 頁面（含 Deep Link 導向，由 Payment Service 組裝）
}

// 以 opaque redirect_id 取回付款中轉表單 canonical 欄位（#1394）
message GetPaymentRedirectFormRequest {
  string redirect_id = 1;       // 不可猜的 opaque id（後端產生，一次性消費）
}

message GetPaymentRedirectFormResponse {
  string action_url = 1;        // PayUni Form POST action URL
  string mer_id = 2;            // 商店代號（HAWK）
  string version = 3;           // API 版本
  string encrypt_info = 4;      // AES 加密字串
  string hash_info = 5;         // SHA256 簽章
