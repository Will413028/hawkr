    int64 account_id = 1;
    string name = 2;
    reserved 3;  // was: logo（入站死欄位，usecase 一律拒非空；logo 只能走 UpdateLogo staged-token flow，欄位移除）
    string description = 4;
    string contact_phone = 5;
    reserved 6;  // was: address
    reserved 7;  // was: cover_url（#1660：入站死欄位，封面設定走 UpdateCover staged-token 流程，欄位移除）
    string prize = 8;
    string city = 9;
    string district = 10;
    string address_detail = 11;
    string birthday = 12;
    string gender = 13;
