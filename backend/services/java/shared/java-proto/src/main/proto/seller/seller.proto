syntax = "proto3";

package hawkr.seller;

import "common/delegation.proto";

option go_package = "github.com/Will413028/hawkr/go-pkg/proto/seller";
option java_multiple_files = true;
option java_package = "io.github.will413028.hawkr.seller.grpc";
option java_outer_classname = "SellerProto";

// Seller Service - 商家服務
service SellerService {
    // 獲取商家信息
    rpc GetSeller(GetSellerRequest) returns (SellerResponse);

    // 輕量版 store_id → account_id 解析：只回 account_id，不像 GetSeller(store_id=x)
    // 要組整份 profile。供 gateway admin 端點吃 :store_id path param、但下游呼叫
    // 仍是 account_id-keyed（如手動停權 gRPC 系列）時使用。查無此 store_id 回
    // gRPC NotFound（本 RPC 回應無 code/message 欄位，錯誤走真實 gRPC status）。
    rpc ResolveSellerAccountID(ResolveSellerAccountIDRequest) returns (ResolveSellerAccountIDResponse);

    rpc GetCurrentStoreID(GetCurrentStoreIDRequest) returns (GetCurrentStoreIDResponse);

    // 批量獲取商家
    rpc GetSellerBatch(GetSellerBatchRequest) returns (SellerBatchResponse);

    // 獲取商家統計
    rpc GetSellerStats(GetSellerStatsRequest) returns (SellerStatsResponse);

    // 判斷政府查驗回的「業者名稱」是否屬於這個賣家（19 號設計書 §8.5.1，供 product-service 使用）。
    //
    // 🔴 比對在本服務內部完成，只回布林與命中欄位名：real_name 是 PII
    //    （`backend/docs/modules/seller.md` §13 列為明文保留欄），不得跨服務傳輸。
    rpc MatchCertificateHolder(MatchCertificateHolderRequest) returns (MatchCertificateHolderResponse);

    // ========== Cross-Service: Seller Meta ==========
    // 批量獲取商家元資料（輕量：名稱+Logo+狀態），回傳 Map<account_id, SellerMeta>
    rpc BatchGetSellerMeta(BatchGetSellerMetaRequest) returns (BatchGetSellerMetaResponse);

    // 公開商品城市篩選用：只回符合城市且可公開販售之 current store ids，不暴露賣家 PII。
    rpc ListPublicStoreIDsByCity(ListPublicStoreIDsByCityRequest) returns (ListPublicStoreIDsByCityResponse);
    // 一次回傳 canonical 22 縣市與完整 public store ids，供 product 聚合；不含 PII。
    rpc ListPublicStoresByCity(ListPublicStoresByCityRequest) returns (ListPublicStoresByCityResponse);

    // ========== Cross-Role Guards: Principal Resolution ==========
    // 解析 store_id → 登入 principal account_id（Plan 2b，供 order/cart/coupon/im/social 5 個 cross-role
    // guard 用）。只解析存活（沒有關閉）的店家；其餘的 id（已關閉或不存在）不在 principals 裡，只出現在 unresolved_ids。
    rpc ResolvePrincipals(ResolvePrincipalsRequest) returns (ResolvePrincipalsResponse);

    // ========== Cross-Service: Historical Stint Enumeration (internal-use only) ==========
    // 回傳該帳號名下「所有」store_id stint（不論 is_current，含已關閉）。唯一用途：
    // account.deleted/buyer.deleted PII 清除 consumer（im-service）逐一枚舉歷史
    // store_id 清 messages.sender_id（買家 store-stint rekey W2/W3 D8）。不透過
    // gateway 暴露，僅供服務間 gRPC 呼叫。
    rpc ListStoreIDsByAccount(ListStoreIDsByAccountRequest) returns (ListStoreIDsByAccountResponse);

    // ========== Cross-Service: Shipping Profile ==========
    // 取得賣家寄件資訊（Shipping Service 建立物流單用）
    rpc GetSellerShippingProfile(GetSellerShippingProfileRequest) returns (GetSellerShippingProfileResponse);

    // ========== 站外業者主檔（招商名單） ==========
    // 供 ai-service 的 EXTERNAL lane 與舊「AI 找貨」工具查詢站外業者。
    //
    // 🔴 一列即一業者：呼叫端不得再做任何去重。已入駐（CONVERTED）與已封存
    //    （ARCHIVED）的業者由本服務端過濾掉——已入駐者出現在「找平台外的
    //    業者」本來就是錯的，那不是去重問題。
    //
    // 相關性分數不在本 RPC 計算：回傳命中的 facet 旗標與可評分的文字欄位，
    // 由呼叫端自行加權排序（procurement 的 tier 加權與曝光門檻屬 ai-service）。
    rpc SearchSellerProspects(SearchSellerProspectsRequest) returns (SearchSellerProspectsResponse);
}

message GetSellerRequest {
    int64 account_id = 1;
    reserved 2;
    // ② store re-key：> 0 時改用 PK sellers.store_id 查（public
    // /sellers/:id namespace）。與 account_id 互斥；account_id 保留
    // current-stint（/app/sellers/me）語意。
    int64 store_id = 3;
    hawkr.common.DelegationContext delegation = 100;
}

message ResolveSellerAccountIDRequest {
    int64 store_id = 1;
}

message ResolveSellerAccountIDResponse {
    int64 account_id = 1;
}

message GetSellerBatchRequest {
    // store_id 命名債正名（Phase 2 campaign Task 3）：一律承載 seller_account_id
    // surrogate（sellers PK），欄位名 account_ids 是歷史誤稱。之前因「rename 需跨
    // gateway/im/buyer 多 caller 原子改」而暫緩，本次連同呼叫端一次改完（monorepo
    // 內 proto rename 是 wire 相容的，field number 不變）。
    // Class-3 historical-surrogate API：PK lookup、無 is_current / deleted_at
    // 過濾 — 已關閉 stint 也解析（tombstone 顯示依賴）。
    repeated int64 store_ids = 1;
    reserved 2;
}

message SellerResponse {
    int32 code = 1;
    string message = 2;
    SellerInfo data = 3;
}

message SellerBatchResponse {
    int32 code = 1;
    string message = 2;
    // data[i].store_id 是 batch map key；account_id 維持登入 principal 語意。
    repeated SellerInfo data = 3;
}

message SellerInfo {
    int64 account_id = 1;
    string name = 2;
    string logo_key = 3;  // 商家 logo objectKey（49 §6.6 GW組：Gateway 組 logoUrl）
    string description = 4;
    string contact_phone = 5;
    reserved 6;  // was: address
    double rating = 7;
    int32 status = 8;  // 0: 禁用, 1: 正常, 2: 審核中
    int64 created_at = 9;
    string cover_key = 10;  // 商家封面 objectKey（49 §6.6 GW組：Gateway 組 coverUrl）
    string prize = 11;
    string city = 12;
    string district = 13;
    string address_detail = 14;
    string postal_code = 15;
    bool onboarding_completed = 16;
    string nickname = 17;
    string avatar_key = 18;  // 頭像 objectKey（49 §6.6 S2+GW組：Gateway 組 avatarUrl；http 值 passthrough）
    string email = 19;
    reserved 20;
    int32 account_type = 21;
    string phone = 22;
    string seller_type = 23;
    string overall_certification_status = 24;
    string birthday = 25;
    string gender = 26;
    string current_certification_id = 27;  // TSID 字串（§4，AdminSellerItem 版已 string）
    reserved 28;  // was: display_name (removed: unified to store_name)
    string seo_title = 29;
    string seo_description = 30;
    bool is_processed_food = 31;
    string food_business_reg_no = 32;
    // ② 賣家聚合 re-key：現任 store surrogate（TSID 數字字串）。grandfather：
    // 目前 == account_id；店關閉後 re-onboard 會分岔。gateway sellerid resolver 用。
    string store_id = 33;
    // 生命週期值：active / suspended / suspended_governance / pending_deletion（隨帳號刪除等待未結訂單結束，單體新增的值，
    // 不是 active 的呼叫方一律不放行）/ closed（reshape 前的舊列可能仍為 deleted）。im read-only tombstone 判斷用。
    string lifecycle_status = 34;
    // 46 §7.2：停權原因碼（SellerSuspensionReason CodeMeta：9601=違反平台規範 /
    // 9602=屢勸不改 / 9603=其他）。僅 lifecycle_status=="suspended" 且有 active
    // suspension 時非空；供賣家自身 GET /app/sellers/me 撈原因碼顯示停權公告頁，對稱
    // admin 版 SellerSuspension.reason_code（無 admin 身分不查該 message）。
    string suspension_reason_code = 35;
    // 賣家自訂官網 URL；空字串代表未設定，MerURL/公開頁 fallback 平台生成頁。
    string website_url = 36;
    // 對外顯示碼（YY+8 位亂數，10 碼），2026-07-21 起取代直接曝露 store_id。
    string store_code = 37;
    // 樂觀鎖版本（數字字串）；每次成功寫入 +1（56 設計書 §6.2.3）。
    string version = 38;
}

message GetSellerStatsRequest {
    int64 account_id = 1;
    reserved 2;
    // ② store re-key：> 0 時以 PK sellers.store_id 解析（public
    // /sellers/:id/stats|rating）。與 account_id 互斥。
    int64 store_id = 3;
}

message SellerStatsResponse {
    int32 code = 1;
    string message = 2;
    SellerStats data = 3;
}

message SellerStats {
    // store_id 命名債正名（Phase 2 campaign Task 3）：值一直是 store surrogate，
    // 欄位本身叫 account_id 純屬歷史誤稱（gateway GetSellerRating/GetSellerStats
    // 早已把它組進回應的 StoreID/store_id，只有這個 proto 欄位名沒跟上）。
    string store_id = 1;
    int32 total_products = 2;
    int32 total_orders = 3;
    double total_sales = 4;
    double rating = 5;
    int32 followers = 6;
    int32 review_count = 7;
    reserved 20;
}

// ========== Cross-Service: Seller Meta ==========

message BatchGetSellerMetaRequest {
    // Store-stint surrogate ids (sellers.store_id, the PK). Historical
    // ids from closed/retired stints resolve too — no is_current filter (§3.1 class 3).
    repeated int64 store_ids = 1;
}

message SellerMeta {
    int64 account_id = 1;   // principal login account.id of the stint (audit / FCM boundary mapping)
    reserved 5;             // was: merchant_id (payuni_mer_id string)
    string seller_name = 2; // 店家名稱
    string logo_key = 3;    // 商家 logo objectKey（49 §6.6 GW組：內部欄，product 端經 Gateway 組 logoUrl）
    reserved 4;             // was: status (PAYUNi mer_status raw value)
    string zip_code = 6;    // 賣家郵遞區號（運費路線推導用）
    string payuni_mer_id = 7; // PayUni 商家編號（該 stint 自己的 MerID — 歷史 stint 回歷史值）
    // 店家此刻是否可以公開曝光、結帳可以下單（單體的 seller.pub_exposable_stores，經 exposure.Classify：營運中、沒有停權、KYC 流程核准含 PayUni、店名、logo 與
    // 鄉鎮市區代碼齊全；ADR 2026-10-05-store-exposure-to-legacy 決策 3）。給 order-service 的結帳閘（9241）。
    bool can_accept_orders = 8;
    string city = 9;         // 賣家城市（如「台北市」，商品列表/詳情用）
    string district = 10;    // 賣家地區（如「大安區」，商品列表/詳情用）
    string store_id = 11; // 賣家目前的 store-stint surrogate（② re-key；grandfather 期間 = account_id，delete+re-onboard 後與 account_id 分岔；數字字串，§6 響應側禁 int64，protonumericlint gate）
    string store_code = 12; // 對外顯示碼（YY+8 位亂數，10 碼），2026-07-21 起取代直接曝露 store_id
    // 店家此刻是否可以管理商品、把商品轉成 ACTIVE（單體的 CapProductManage：營運中且沒有停權，不要求 KYC 或 PayUni 核准，
    // 賣家可以在可曝光之前先準備商品；ADR 2026-10-05-store-exposure-to-legacy 決策 3）。給 product-service 的上架閘（9240）。
    bool can_manage_products = 13;
    // 店家是否曾經公開過、有公開的店家卡片：first_exposed_at 有值，或此刻可以公開曝光（與單體 seller.StoreCards 的同一條規則；
    // 暫停中與已關閉的店只要曾經公開過就是 true）。給 social 與 gateway 判斷聊天對象（決策簡報 backend/docs/plans/2026-09-29-a3-buyer-seller/step10d-decision-brief.md D2）；公開內容的可見性看店家此刻是否可公開曝光，不看它。
    bool has_public_card = 14;
}

message BatchGetSellerMetaResponse {
    int32 code = 1;
    string message = 2;
    // Keyed by store_id (store-stint surrogate). Pre-reshape this was
    // keyed by account_id — identical values for all grandfathered rows.
    map<int64, SellerMeta> sellers = 3;
}

message ResolvePrincipalsRequest {
    repeated int64 ids = 1;
}

message ResolvePrincipalsResponse {
    int32 code = 1;
    string message = 2;
    map<int64, int64> principals = 3;
    // 請求的 ids 裡沒有存活店家列的（已關閉或不存在）。這些 id 不會出現在 principals 裡（沒有值可以回：單體的 store_id 與 account_id
    // 是兩個獨立的序列，原樣回吐一定是錯的 account_id）；呼叫方以 key 不存在或出現在這裡判斷為未解析，並依用途 fail-closed 或降級。
    repeated int64 unresolved_ids = 4;
}

message ListStoreIDsByAccountRequest {
    int64 account_id = 1;
}

message ListStoreIDsByAccountResponse {
    int32 code = 1;
    string message = 2;
    repeated int64 store_ids = 3;
}

// ========== Cross-Service: Shipping Profile Messages ==========

message GetSellerShippingProfileRequest {
    // 登入 account_id。名字原為 seller_account_id，2026-08-05 正名 —— 值一直都是
    // login account_id（不是 store surrogate），但 seller_account_id 這個名字在本
    // repo 的歷史意義正好相反（sellers.seller_account_id 欄位已於 migration
    // 20260711155335 更名為 store_id），是整份 proto 裡最容易接錯線的欄位。
    // 現況：全 monorepo 零生產端 —— 唯一呼叫者 shipping-service SellerGrpcClient
    // 只設 store_id，所以這個欄位實際上永遠是 0，server 端一律走 store_id 分支。
    int64 account_id = 1;
    // ② store re-key：> 0 時改用 PK sellers.store_id 查。與 account_id 互斥。
    int64 store_id = 2;
}

message GetSellerShippingProfileResponse {
    int32 code = 1;
    string message = 2;
    SellerShippingProfile data = 3;
}

message SellerShippingProfile {
    string store_id = 1;            // 數字字串
    string sender_name = 2;         // 寄件人名稱（= 商家名稱）
    string sender_phone = 3;        // 寄件人電話
    string city = 4;                // 城市
    string district = 5;            // 區域
    string address_detail = 6;      // 詳細地址
    string zip_code = 7;            // 郵遞區號
    string mer_id = 8;              // PayUni 商家編號（建立物流單用）
    string contact_email = 9;       // 聯絡人信箱
}

// Appended to keep all existing protoc message indices stable.
message ListPublicStoreIDsByCityRequest {
    string city = 1; // 台灣 22 縣市；接受台/臺別名，server 正規化
}

message ListPublicStoreIDsByCityResponse {
    int32 code = 1;
    string message = 2;
    string city = 3;               // canonical city
    repeated string store_ids = 4; // 數字字串，供 product store_ids filter 使用
    string city_code = 5;          // ISO 3166-2:TW
}

message ListPublicStoresByCityRequest {}

message ListPublicStoresByCityResponse {
    int32 code = 1;
    string message = 2;
    repeated PublicCityStores cities = 3; // 固定 22 筆，含零商家城市
}

message PublicCityStores {
    string city_code = 1;                  // ISO 3166-2:TW，例如 TW-TPE
    string city_name = 2;                  // canonical 中文名稱，例如台北市
    repeated string store_ids = 3;         // 完整 store ids，供 server-side filter/count
    repeated string preview_store_ids = 4; // 前 6 筆 deterministic preview；不得作完整 filter
}

message GetCurrentStoreIDRequest {
    int64 account_id = 1;
}

message GetCurrentStoreIDResponse {
    int64 store_id = 1;
}

// 業者名稱歸屬比對（19 號 §8.5.1）——自動核准前確認「這張證書是不是這個賣家的」。
message MatchCertificateHolderRequest {
    // 內部呼叫、前端不可控 ⇒ 適用型別規範 §4.1 例外 1，用原生數值
    int64 store_id = 1;
    // 政府查驗回的業者名稱，原樣送出（正規化在本服務內做）
    string holder_name = 2;
}

message MatchCertificateHolderResponse {
    // 任一名稱匹配即 true
    bool matched = 1;
    // "REAL_NAME" / "COMPANY_NAME" / "NONE"——稽核用，不含名稱本身
    string matched_field = 2;
    // 該賣家是否有任何可比對的名稱；false ⇒ 無從判斷，呼叫端應轉人工而非放行
    bool has_reference = 3;
}

// ========== 站外業者主檔（招商名單） ==========

message SearchSellerProspectsRequest {
    string category = 1;
    string region = 2;
    string keywords = 3;
    // category_ids 是平台分類樹的節點 id，呼叫端（ai-service）已把買家要的節點
    // 展開成祖先鏈。業者掛的分類落在其中任一個就算命中，語意與上面三個條件同為
    // 加權 OR。為空時這個述詞恆為 false，行為與加這個欄位之前逐位元相同。
    repeated string category_ids = 5;
    // 服務端安全上限，不是「回傳幾筆」的意思——相關性排序與最終截斷交給呼叫端
    // （ai-service 的 CandidateSearchUseCase.Search，見該檔註解）在算完分數之後
    // 做，DB 這一側只需要保證單次查詢不會把整份名單（634 筆量級）全撈回來造成
    // 過量傳輸。0 表示採用服務端預設（500）。
    int32 limit = 4;
}

// SellerProspectItem 是一家站外業者的對外投影。
// id 依 API/Proto 規範以字串承載（避免 JavaScript 精度問題）。
message SellerProspectItem {
    string id = 1;
    string display_name = 2;
    string vendor_type = 3;
    string category = 4;
    string region = 5;
    string product_summary = 6;
    string positioning = 7;
    string research_summary = 8;
    string priority_letter = 9;
    // 星等以字串承載：repo 的 proto-lint-numeric 把「計數」型欄位一律要求字串
    // （CLAUDE.md §4）。0–3 的星等本身沒有 JS 精度風險，但規則是機械式的，
    // 而在 allowlist 加一筆新例外會把一份「既有豁免」清單變成常態出口。
    string priority_stars = 10;
    string public_email = 11;
    string public_phone = 12;
    string public_website = 13;
    string public_social = 14;
    // 這一列的事實截止時間（呼叫端寫進候選快照的 facts_as_of）。
    string updated_at = 15; // ISO 8601 UTC

    // 站外業者的品牌素材 objectKey（顯示 URL 由 Gateway 組，49 §6.6）。
    // **這不是平台賣家身分**——站外業者沒有 store，這兩欄純粹是「這家業者
    // 自己的品牌圖長什麼樣」，不得被消費端當成已入駐或已驗證的訊號。
    // 素材來源與使用許可狀態見 seller_prospects.{logo,cover}_source_url。
    string logo_key = 16;
    string cover_key = 17;
}

// SellerProspectHit 是命中列 ＋ 命中了哪些 facet。
message SellerProspectHit {
    SellerProspectItem prospect = 1;
    bool hit_category = 2;
    bool hit_region = 3;
    bool hit_keywords = 4;
    // hit_category_ids 說這筆是靠結構化分類標籤命中的，不是靠字串比對。
    // 呼叫端用它把「命中理由」標給買家看，也是排序訊號。
    bool hit_category_ids = 5;
}

message SearchSellerProspectsResponse {
    int32 code = 1;
    string message = 2;
    repeated SellerProspectHit data = 3;
}
