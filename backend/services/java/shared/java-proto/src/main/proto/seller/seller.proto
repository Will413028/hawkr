    string zip_code = 6;    // 賣家郵遞區號（運費路線推導用）
    string payuni_mer_id = 7; // PayUni 商家編號（該 stint 自己的 MerID — 歷史 stint 回歷史值）
    // 店家此刻是否可以公開曝光、結帳可以下單（單體的 seller.pub_exposable_stores，經 exposure.Classify：營運中、沒有停權、KYC 流程核准含 PayUni、店名、logo 與
    // 鄉鎮市區代碼齊全；ADR 2026-10-05-store-exposure-to-legacy 決策 3）。給 order-service 的結帳閘（9241）。
    bool can_accept_orders = 8;
    string city = 9;         // 賣家城市（如「台北市」，商品列表/詳情用）
    string district = 10;    // 賣家地區（如「大安區」，商品列表/詳情用）
    string store_id = 11; // 賣家目前的 store-stint surrogate（② re-key；grandfather 期間 = account_id，delete+re-onboard 後與 account_id 分岔；數字字串，§6 響應側禁 int64，protonumericlint gate）
    string store_code = 12; // 對外顯示碼（YY+8 位亂數，10 碼），2026-07-21 起取代直接曝露 store_id
    // 店家此刻是否可以管理商品、把商品轉成 ACTIVE（單體的 CapProductManage：營運中且沒有停權，不要求 KYC 或 PayUni 核准，
    // 賣家可以在可曝光之前先準備商品；ADR 2026-10-05-store-exposure-to-legacy 決策 3）。給 product-service 的上架閘（9240）。
    bool can_manage_products = 13;
    // 店家是否曾經公開過、有公開的店家卡片：first_exposed_at 有值，或此刻可以公開曝光（與單體 seller.StoreCards 的同一條規則；
    // 暫停中與已關閉的店只要曾經公開過就是 true）。給 social 與 gateway 判斷聊天對象（決策簡報 docs/plans/2026-09-29-a3-buyer-seller/step10d-decision-brief.md D2）；公開內容的可見性看店家此刻是否可公開曝光，不看它。
    bool has_public_card = 14;
}

message BatchGetSellerMetaResponse {
    int32 code = 1;
    string message = 2;
    // Keyed by store_id (store-stint surrogate). Pre-reshape this was
    // keyed by account_id — identical values for all grandfathered rows.
    map<int64, SellerMeta> sellers = 3;
}

message ResolvePrincipalsRequest {
    repeated int64 ids = 1;
}

message ResolvePrincipalsResponse {
    int32 code = 1;
    string message = 2;
    map<int64, int64> principals = 3;
    // 請求的 ids 裡沒有存活店家列的（已關閉或不存在）。這些 id 不會出現在 principals 裡（沒有值可以回：單體的 store_id 與 account_id
    // 是兩個獨立的序列，原樣回吐一定是錯的 account_id）；呼叫方以 key 不存在或出現在這裡判斷為未解析，並依用途 fail-closed 或降級。
    repeated int64 unresolved_ids = 4;
}

message ListStoreIDsByAccountRequest {
    int64 account_id = 1;
}

message ListStoreIDsByAccountResponse {
    int32 code = 1;
    string message = 2;
    repeated int64 store_ids = 3;
}

// ========== Cross-Service: Shipping Profile Messages ==========

message GetSellerShippingProfileRequest {
    // 登入 account_id。名字原為 seller_account_id，2026-08-05 正名 —— 值一直都是
    // login account_id（不是 store surrogate），但 seller_account_id 這個名字在本
    // repo 的歷史意義正好相反（sellers.seller_account_id 欄位已於 migration
    // 20260711155335 更名為 store_id），是整份 proto 裡最容易接錯線的欄位。
    // 現況：全 monorepo 零生產端 —— 唯一呼叫者 shipping-service SellerGrpcClient
    // 只設 store_id，所以這個欄位實際上永遠是 0，server 端一律走 store_id 分支。
    int64 account_id = 1;
    // ② store re-key：> 0 時改用 PK sellers.store_id 查。與 account_id 互斥。
    int64 store_id = 2;
}

message GetSellerShippingProfileResponse {
    int32 code = 1;
    string message = 2;
    SellerShippingProfile data = 3;
}

message SellerShippingProfile {
    string store_id = 1;            // 數字字串
    string sender_name = 2;         // 寄件人名稱（= 商家名稱）
    string sender_phone = 3;        // 寄件人電話
    string city = 4;                // 城市
    string district = 5;            // 區域
    string address_detail = 6;      // 詳細地址
    string zip_code = 7;            // 郵遞區號
    string mer_id = 8;              // PayUni 商家編號（建立物流單用）
    string contact_email = 9;       // 聯絡人信箱
}

