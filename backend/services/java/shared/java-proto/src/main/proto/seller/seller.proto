syntax = "proto3";

package hawkr.seller;

import "common/delegation.proto";

option go_package = "github.com/Will413028/hawkr/go-pkg/proto/seller";
option java_multiple_files = true;
option java_package = "io.github.will413028.hawkr.seller.grpc";
option java_outer_classname = "SellerProto";

// Seller Service - 商家服務
service SellerService {
    // 獲取商家信息
    rpc GetSeller(GetSellerRequest) returns (SellerResponse);

    // 輕量版 store_id → account_id 解析：只回 account_id，不像 GetSeller(store_id=x)
    // 要組整份 profile。供 gateway admin 端點吃 :store_id path param、但下游呼叫
    // 仍是 account_id-keyed（如手動停權 gRPC 系列）時使用。查無此 store_id 回
    // gRPC NotFound（本 RPC 回應無 code/message 欄位，錯誤走真實 gRPC status）。
    rpc ResolveSellerAccountID(ResolveSellerAccountIDRequest) returns (ResolveSellerAccountIDResponse);

    rpc GetCurrentStoreID(GetCurrentStoreIDRequest) returns (GetCurrentStoreIDResponse);

    // 根據會員ID獲取商家
    rpc GetSellerByMemberId(GetSellerByMemberIdRequest) returns (SellerResponse);

    // 根據 UserID 獲取商家
    rpc GetSellerByUserId(GetSellerByUserIdRequest) returns (SellerResponse);

    // 批量獲取商家
    rpc GetSellerBatch(GetSellerBatchRequest) returns (SellerBatchResponse);

    // 驗證商家狀態
    rpc ValidateSeller(ValidateSellerRequest) returns (ValidateSellerResponse);

    // 獲取商家統計
    rpc GetSellerStats(GetSellerStatsRequest) returns (SellerStatsResponse);

    // ========== PAYUNi 金流整合 ==========
    // 觸發 PAYUNi 商家註冊
    rpc RegisterPayuni(RegisterPayuniRequest) returns (PayuniStatusResponse);

    // 查詢 PAYUNi 註冊狀態
    rpc GetPayuniStatus(GetPayuniStatusRequest) returns (PayuniStatusResponse);

    // 重試 PAYUNi 註冊
    rpc RetryPayuniRegistration(RetryPayuniRequest) returns (PayuniStatusResponse);

    // 手動刷新 PAYUNi 審核狀態
    rpc RefreshPayuniStatus(RefreshPayuniStatusRequest) returns (PayuniStatusResponse);

    // 更新商家 PAYUNi 聯絡/地址資料（issue #2806 Phase 2 deny-by-default allowlist）
    rpc UpdateMerchantProfile(UpdateMerchantProfileRequest) returns (UpdateMerchantProfileResponse);

    // 獲取商家 PAYUNi 配置（供 payment-service 使用）
    rpc GetSellerPayuniConfig(GetSellerPayuniConfigRequest) returns (SellerPayuniConfigResponse);

    // 判斷政府查驗回的「業者名稱」是否屬於這個賣家（19 號設計書 §8.5.1，供 product-service 使用）。
    //
    // 🔴 比對在本服務內部完成，只回布林與命中欄位名：real_name 是 PII
    //    （18 號設計書列為明文保留欄），不得跨服務傳輸。
    rpc MatchCertificateHolder(MatchCertificateHolderRequest) returns (MatchCertificateHolderResponse);

    // 創建商家 (Apply)
    rpc CreateSeller(CreateSellerRequest) returns (SellerResponse);

    // 更新商家
    rpc UpdateSeller(UpdateSellerRequest) returns (SellerResponse);
    rpc UpdateSellerSEO(UpdateSellerSEORequest) returns (UpdateSellerSEOResponse);
    rpc UpdateSellerFoodRegistration(UpdateSellerFoodRegistrationRequest) returns (UpdateSellerFoodRegistrationResponse);

    // 完成 Onboarding（填寫或略過）
    rpc CompleteOnboarding(CompleteOnboardingRequest) returns (SellerResponse);

    // 更新商家 logo（透過 staged token）
    rpc UpdateLogo(UpdateLogoRequest) returns (UpdateLogoResponse);

    // 更新商家封面圖片（透過 staged token）
    rpc UpdateCover(UpdateCoverRequest) returns (UpdateCoverResponse);

    // ========== Certification: Old API (Deprecated) ==========
    rpc GetCertificationDraft(GetDraftRequest) returns (CertificationDraftResponse);
    rpc SaveCertificationDraft(SaveDraftRequest) returns (CertificationDraftResponse);
    rpc SubmitCertification(SubmitCertificationRequest) returns (CertificationDraftResponse);

    // ========== Certification: New API ==========
    // Draft management
    rpc CreateCertificationDraft(CreateCertificationDraftRequest) returns (CertificationApplicationResponse);
    rpc SaveCertificationProgress(SaveCertificationProgressRequest) returns (CertificationApplicationResponse);
    rpc CancelCertification(CancelCertificationRequest) returns (CertificationApplicationResponse);

    // Submission
    rpc SubmitCertificationApplication(SubmitCertificationApplicationRequest) returns (CertificationApplicationResponse);

    // Query
    rpc GetCertificationApplication(GetCertificationApplicationRequest) returns (CertificationApplicationResponse);

    // 統一編號查詢（GCIS 經濟部商業司公開資料，autofill 公司資料用）
    rpc LookupBusinessRegistration(LookupBusinessRegistrationRequest) returns (LookupBusinessRegistrationResponse);

    // 地址模糊搜尋 / 驗證（proxy 至 Google Maps，透過 pkg/geocode ACL；賣家門市地址用）
    rpc SuggestAddress(SuggestAddressRequest) returns (SuggestAddressResponse);
    rpc ValidateAddress(ValidateAddressRequest) returns (ValidateAddressResponse);

    // Review operations (for admin backend)
    rpc ApproveCertification(ApproveCertificationRequest) returns (ReviewResponse);
    rpc RejectCertification(RejectCertificationRequest) returns (ReviewResponse);
    rpc GetCertificationReviews(GetCertificationReviewsRequest) returns (CertificationReviewsResponse);

    // ========== Admin: Seller Management ==========
    rpc ListSellersForAdmin(ListSellersForAdminRequest) returns (ListSellersForAdminResponse);
    // 賣家統計走獨立 RPC，不內嵌在列表回應裡：這五個數字是全站聚合、不隨分頁
    // 改變，內嵌等於每次翻頁都重算五個全表 COUNT，且前端要拿統計就得先發一個
    // ?page=1&limit=1 的假查詢。與 GetAccountStatsForAdmin / GetBuyerStatsForAdmin 同形。
    rpc GetSellerStatsForAdmin(GetSellerStatsForAdminRequest) returns (GetSellerStatsForAdminResponse);

    // ========== Admin: Certification Management ==========
    rpc ListCertificationsForAdmin(ListCertificationsForAdminRequest) returns (ListCertificationsForAdminResponse);
    // Admin certification detail — returns the FULL id_card_no (§5.1 角色分離；
    // 賣家 GetCertificationApplication 回遮蔽值，admin 走此 RPC 回完整值, #608)。
    rpc GetCertificationApplicationForAdmin(GetCertificationApplicationForAdminRequest) returns (CertificationApplicationResponse);

    // ========== Cross-Service: Seller Meta ==========
    // 批量獲取商家元資料（輕量：名稱+Logo+狀態），回傳 Map<account_id, SellerMeta>
    rpc BatchGetSellerMeta(BatchGetSellerMetaRequest) returns (BatchGetSellerMetaResponse);

    // 公開商品城市篩選用：只回符合城市且可公開販售之 current store ids，不暴露賣家 PII。
    rpc ListPublicStoreIDsByCity(ListPublicStoreIDsByCityRequest) returns (ListPublicStoreIDsByCityResponse);
    // 一次回傳 canonical 22 縣市與完整 public store ids，供 product 聚合；不含 PII。
    rpc ListPublicStoresByCity(ListPublicStoresByCityRequest) returns (ListPublicStoresByCityResponse);

    // ========== Cross-Role Guards: Principal Resolution ==========
    // 解析 store_id → 登入 principal account_id（Plan 2b，供 order/cart/coupon/im/social 5 個 cross-role
    // guard 用）。只解析存活（沒有關閉）的店家；其餘的 id（已關閉或不存在）不在 principals 裡，只出現在 unresolved_ids。
    rpc ResolvePrincipals(ResolvePrincipalsRequest) returns (ResolvePrincipalsResponse);

    // ========== Cross-Service: Historical Stint Enumeration (internal-use only) ==========
    // 回傳該帳號名下「所有」store_id stint（不論 is_current，含已關閉）。唯一用途：
    // account.deleted/buyer.deleted PII 清除 consumer（im-service）逐一枚舉歷史
    // store_id 清 messages.sender_id（買家 store-stint rekey W2/W3 D8）。不透過
    // gateway 暴露，僅供服務間 gRPC 呼叫。
    rpc ListStoreIDsByAccount(ListStoreIDsByAccountRequest) returns (ListStoreIDsByAccountResponse);

    // ========== Cross-Service: Shipping Profile ==========
    // 取得賣家寄件資訊（Shipping Service 建立物流單用）
    rpc GetSellerShippingProfile(GetSellerShippingProfileRequest) returns (GetSellerShippingProfileResponse);

    // ========== Store Visitors ==========
    // 記錄訪客（買家瀏覽賣家商店頁時 fire-and-forget 呼叫）
    rpc RecordStoreVisit(RecordStoreVisitRequest) returns (RecordStoreVisitResponse);

    // 取得商店訪客列表（賣家查看誰來看過）
    rpc GetStoreVisitors(GetStoreVisitorsRequest) returns (StoreVisitorListResponse);

    // ========== Product View Stats ==========
    // 記錄商品被瀏覽（網頁匿名路徑，APP 路徑走 MQ）
    rpc RecordProductView(RecordProductViewRequest) returns (RecordProductViewResponse);
    // 取得賣家旗下所有商品總瀏覽數與週環比（Dashboard 用）
    rpc GetProductViewStats(GetProductViewStatsRequest) returns (ProductViewStatsResponse);

    // ========== Recommended Sellers ==========
    // 取得推薦商家列表（依營收排名，組合 Order Service 資料）
    rpc GetRecommendedSellers(GetRecommendedSellersRequest) returns (GetRecommendedSellersResponse);

    // ========== Self-Service: Account Deletion ==========
    // 賣家自行申請刪除帳號（或管理員代刪）
    rpc DeleteSellerAccount(DeleteSellerAccountRequest) returns (DeleteSellerAccountResponse);

    // ========== B-169 Governance: 商家違規 / 食安通報 / 申訴 (issue #722) ==========

    // 登入端商家違規檢舉（買家 / 賣家）
    rpc CreateViolationReport(CreateViolationReportRequest) returns (CreateViolationReportResponse);
    // 檢舉者查自己提交的檢舉
    rpc ListMyViolationReports(ListMyViolationReportsRequest) returns (ListMyViolationReportsResponse);

    // 公開無登入食安通報（gateway 走 anonymous 路由，雙層 IP rate limit）
    rpc CreateFoodSafetyReport(CreateFoodSafetyReportRequest) returns (CreateFoodSafetyReportResponse);

    // 賣家側
    rpc SellerListMyViolations(SellerListMyViolationsRequest) returns (SellerListMyViolationsResponse);
    rpc SellerSubmitAppeal(SellerSubmitAppealRequest) returns (SellerSubmitAppealResponse);
    rpc SellerGetAppeal(SellerGetAppealRequest) returns (SellerGetAppealResponse);

    // 公開賣家頁查詢過去 90 天 high+ 違規（D8 Redis cache）
    rpc GetPublicSellerViolations(GetPublicSellerViolationsRequest) returns (GetPublicSellerViolationsResponse);

    // Admin 治理
    rpc AdminListViolationReports(AdminListViolationReportsRequest) returns (AdminListViolationReportsResponse);
    rpc AdminPatchSellerViolationReportStatus(AdminPatchReportStatusRequest) returns (AdminPatchReportStatusResponse);
    rpc AdminPatchFoodSafetyReportStatus(AdminPatchReportStatusRequest) returns (AdminPatchReportStatusResponse);
    rpc AdminAcknowledgeFoodSafetyReport(AdminAcknowledgeRequest) returns (AdminAcknowledgeResponse);
    rpc AdminGenerateFDAReport(AdminGenerateFDAReportRequest) returns (AdminGenerateFDAReportResponse);
    rpc AdminMarkFDAReported(AdminMarkFDAReportedRequest) returns (AdminMarkFDAReportedResponse);
    rpc AdminNotifySeller(AdminNotifySellerRequest) returns (AdminNotifySellerResponse);
    rpc AdminCreateViolation(AdminCreateViolationRequest) returns (AdminCreateViolationResponse);
    // Admin 決議申訴前查看 violation 詳情（含 appeal_evidence_asset_ids，issue #1516）
    rpc AdminGetViolation(AdminGetViolationRequest) returns (AdminGetViolationResponse);
    rpc AdminUpdateViolation(AdminUpdateViolationRequest) returns (AdminUpdateViolationResponse);
    rpc AdminRevokeViolation(AdminRevokeViolationRequest) returns (AdminRevokeViolationResponse);
    rpc AdminDecideAppeal(AdminDecideAppealRequest) returns (AdminDecideAppealResponse);

    // ========== Admin 手動停權（不服勸導，32 §13 / 46 §5） ==========
    rpc SuspendSellerForAdmin(SuspendSellerForAdminRequest) returns (SuspendSellerForAdminResponse);
    rpc LiftSellerSuspensionForAdmin(LiftSellerSuspensionForAdminRequest) returns (LiftSellerSuspensionForAdminResponse);
    rpc ListSellerSuspensionsForAdmin(ListSellerSuspensionsForAdminRequest) returns (ListSellerSuspensionsForAdminResponse);
    rpc GetActiveSellerSuspensionForAdmin(GetActiveSellerSuspensionForAdminRequest) returns (GetActiveSellerSuspensionForAdminResponse);

    // ========== Admin 賣家會員分級方案（子系統 1）==========
    rpc AssignSellerMembershipPlan(AssignSellerMembershipPlanRequest) returns (SellerMembershipPlanResponse);
    rpc GetSellerMembershipPlan(GetSellerMembershipPlanRequest) returns (SellerMembershipPlanResponse);
    // Admin：方案目錄本身（cap/price/is_purchasable）的讀寫，比照買家 membership_plans
    // 目錄的 ListMembershipPlans/UpdateMembershipPlan 慣例。tier_rank 不開放編輯——它
    // 決定 candidate_platform_lane.go 的 AI 排序權重，風險層級與 cap/price 不同。
    rpc ListSellerMembershipPlans(ListSellerMembershipPlansRequest) returns (ListSellerMembershipPlansResponse);
    rpc UpdateSellerMembershipPlan(UpdateSellerMembershipPlanRequest) returns (UpdateSellerMembershipPlanResponse);

    // ========== 站外業者主檔（招商名單） ==========
    // 供 ai-service 的 EXTERNAL lane 與舊「AI 找貨」工具查詢站外業者。
    //
    // 🔴 一列即一業者：呼叫端不得再做任何去重。已入駐（CONVERTED）與已封存
    //    （ARCHIVED）的業者由本服務端過濾掉——已入駐者出現在「找平台外的
    //    業者」本來就是錯的，那不是去重問題。
    //
    // 相關性分數不在本 RPC 計算：回傳命中的 facet 旗標與可評分的文字欄位，
    // 由呼叫端自行加權排序（procurement 的 tier 加權與曝光門檻屬 ai-service）。
    rpc SearchSellerProspects(SearchSellerProspectsRequest) returns (SearchSellerProspectsResponse);

    // 建立一筆站外業者。識別鍵的正規化與分層比對一律發生在本服務端——
    // 呼叫端（一次性遷移腳本、階段二的 admin console）只送原始欄位。
    rpc CreateSellerProspect(CreateSellerProspectRequest) returns (CreateSellerProspectResponse);

    // ========== 站外業者主檔 — Admin console（階段二） ==========
    // 與上面兩支的差別在投影：這一組回 AdminSellerProspectItem（含 status、
    // tax_id、稽核欄位），呼叫端只有 gateway 的 /admin namespace。
    // 不共用 SellerProspectItem——那個型別的消費端包含 ai-service，而
    // toProspectSearchItemPB 的窄投影清單不能繼續成長。
    rpc AdminListSellerProspects(AdminListSellerProspectsRequest) returns (AdminListSellerProspectsResponse);
    rpc AdminGetSellerProspect(AdminGetSellerProspectRequest) returns (AdminGetSellerProspectResponse);
    rpc AdminUpdateSellerProspect(AdminUpdateSellerProspectRequest) returns (AdminGetSellerProspectResponse);
    rpc AdminArchiveSellerProspect(AdminArchiveSellerProspectRequest) returns (AdminGetSellerProspectResponse);
    rpc AdminListDuplicateProspects(AdminListDuplicateProspectsRequest) returns (AdminListDuplicateProspectsResponse);
    rpc AdminMergeSellerProspects(AdminMergeSellerProspectsRequest) returns (AdminMergeSellerProspectsResponse);
    rpc AdminConvertSellerProspect(AdminConvertSellerProspectRequest) returns (AdminGetSellerProspectResponse);
    // 換一張品牌圖片。kind 決定 logo 還是 cover，兩者各自獨立一組欄位。
    // 回應與 AdminGetSellerProspect 同型別：Admin 收到後會逐項核對 key／version／
    // source_url 才認定存檔成功，少回欄位等同存檔失敗。
    rpc AdminUpdateSellerProspectMedia(AdminUpdateSellerProspectMediaRequest) returns (AdminGetSellerProspectResponse);
    rpc AdminListProspectTaxIdMatches(AdminListProspectTaxIdMatchesRequest) returns (AdminListProspectTaxIdMatchesResponse);
    rpc AdminCreateProspectInvite(AdminCreateProspectInviteRequest) returns (AdminCreateProspectInviteResponse);
    rpc AdminRevokeProspectInvite(AdminRevokeProspectInviteRequest) returns (AdminRevokeProspectInviteResponse);

    // ========== Vendor Portal (#2539 E1) ==========

    // 建立或重取一個 RFQ 收件人的邀請，回明文 secret（只此一次）。結果：
    //   - 成功：invite_id（邀請的 UUID）、secret、invited_email。
    //   - InvalidArgument：prospect_id、rfq_recipient_id 不是十進位正整數，expires_at 不是 RFC3339 或不在允許範圍內（要晚於現在且不超過
    //     上限），或這個 rfq_recipient_id 的邀請已屬於別的業者。
    //   - NotFound：業者不存在。
    //   - AlreadyExists：這張邀請的 secret 已標記寄出（不帶 reason）。
    //   - FailedPrecondition，ErrorInfo.reason 是 VendorPortalInviteErrorReason 的名稱：
    //     INVITE_REVOKED（邀請已撤銷）、PROSPECT_NOT_ACTIVE（業者不是進行中）、NO_DELIVERABLE_EMAIL（沒有可寄送的 email）。
    //   - 其他錯誤：Internal。
    rpc EnsureVendorPortalInvite(EnsureVendorPortalInviteRequest) returns (EnsureVendorPortalInviteResponse);

    // 記下 secret 對應的信已寄出。結果：
    //   - 成功：code 0；同一把 secret 重複標記冪等。
    //   - InvalidArgument：invite_id 不是 UUID，或 secret 是空字串或格式不正確。
    //   - NotFound：邀請不存在。
    //   - Aborted，ErrorInfo.reason 是 INVITE_SECRET_SUPERSEDED：secret 已被之後的 Ensure 換掉，標記不生效，寄出的連結已失效。
    //   - 其他錯誤：Internal。
    rpc MarkVendorPortalInviteSecretDelivered(MarkVendorPortalInviteSecretDeliveredRequest) returns (MarkVendorPortalInviteSecretDeliveredResponse);
}

// ========== Certification Messages ==========

message GetDraftRequest {
    int64 account_id = 1;
}

message CertificationDraftResponse {
    int32 code = 1;
    string message = 2;
    CertificationDraft data = 3;
}

message CertificationDraft {
    string id = 1;
    string account_id = 2;
    int32 current_step = 3;
    int32 total_steps = 4;
    string step_data_json = 5;
    string status = 6;
    string review_comment = 7;
}

message SaveDraftRequest {
    int64 account_id = 1;
    int32 current_step = 2;
    int32 total_steps = 3;
    string step_data_json = 4;
}

message SubmitCertificationRequest {
    int64 account_id = 1;
}

message GetSellerRequest {
    int64 account_id = 1;
    reserved 2;
    // ② store re-key：> 0 時改用 PK sellers.store_id 查（public
    // /sellers/:id namespace）。與 account_id 互斥；account_id 保留
    // current-stint（/app/sellers/me）語意。
    int64 store_id = 3;
    hawkr.common.DelegationContext delegation = 100;
}

message ResolveSellerAccountIDRequest {
    int64 store_id = 1;
}

message ResolveSellerAccountIDResponse {
    int64 account_id = 1;
}

message GetSellerBatchRequest {
    // store_id 命名債正名（Phase 2 campaign Task 3）：一律承載 seller_account_id
    // surrogate（sellers PK），欄位名 account_ids 是歷史誤稱。之前因「rename 需跨
    // gateway/im/buyer 多 caller 原子改」而暫緩，本次連同呼叫端一次改完（monorepo
    // 內 proto rename 是 wire 相容的，field number 不變）。
    // Class-3 historical-surrogate API：PK lookup、無 is_current / deleted_at
    // 過濾 — 已關閉 stint 也解析（tombstone 顯示依賴）。
    repeated int64 store_ids = 1;
    reserved 2;
}

message SellerResponse {
    int32 code = 1;
    string message = 2;
    SellerInfo data = 3;
}

message SellerBatchResponse {
    int32 code = 1;
    string message = 2;
    // data[i].store_id 是 batch map key；account_id 維持登入 principal 語意。
    repeated SellerInfo data = 3;
}

message SellerInfo {
    int64 account_id = 1;
    string name = 2;
    string logo_key = 3;  // 商家 logo objectKey（49 §6.6 GW組：Gateway 組 logoUrl）
    string description = 4;
    string contact_phone = 5;
    reserved 6;  // was: address
    double rating = 7;
    int32 status = 8;  // 0: 禁用, 1: 正常, 2: 審核中
    int64 created_at = 9;
    string cover_key = 10;  // 商家封面 objectKey（49 §6.6 GW組：Gateway 組 coverUrl）
    string prize = 11;
    string city = 12;
    string district = 13;
    string address_detail = 14;
    string postal_code = 15;
    bool onboarding_completed = 16;
    string nickname = 17;
    string avatar_key = 18;  // 頭像 objectKey（49 §6.6 S2+GW組：Gateway 組 avatarUrl；http 值 passthrough）
    string email = 19;
    reserved 20;
    int32 account_type = 21;
    string phone = 22;
    string seller_type = 23;
    string overall_certification_status = 24;
    string birthday = 25;
    string gender = 26;
    string current_certification_id = 27;  // TSID 字串（§4，AdminSellerItem 版已 string）
    reserved 28;  // was: display_name (removed: unified to store_name)
    string seo_title = 29;
    string seo_description = 30;
    bool is_processed_food = 31;
    string food_business_reg_no = 32;
    // ② 賣家聚合 re-key：現任 store surrogate（TSID 數字字串）。grandfather：
    // 目前 == account_id；店關閉後 re-onboard 會分岔。gateway sellerid resolver 用。
    string store_id = 33;
    // 生命週期值：active / suspended / suspended_governance / pending_deletion（隨帳號刪除等待未結訂單結束，單體新增的值，
    // 不是 active 的呼叫方一律不放行）/ closed（reshape 前的舊列可能仍為 deleted）。im read-only tombstone 判斷用。
    string lifecycle_status = 34;
    // 46 §7.2：停權原因碼（SellerSuspensionReason CodeMeta：9601=違反平台規範 /
    // 9602=屢勸不改 / 9603=其他）。僅 lifecycle_status=="suspended" 且有 active
    // suspension 時非空；供賣家自身 GET /app/sellers/me 撈原因碼顯示停權公告頁，對稱
    // admin 版 SellerSuspension.reason_code（無 admin 身分不查該 message）。
    string suspension_reason_code = 35;
    // 賣家自訂官網 URL；空字串代表未設定，MerURL/公開頁 fallback 平台生成頁。
    string website_url = 36;
    // 對外顯示碼（YY+8 位亂數，10 碼），2026-07-21 起取代直接曝露 store_id。
    string store_code = 37;
    // 樂觀鎖版本（數字字串）；每次成功寫入 +1（56 設計書 §6.2.3）。
    string version = 38;
}

message ValidateSellerRequest {
    int64 account_id = 1;
    reserved 2;
}

message ValidateSellerResponse {
    int32 code = 1;
    string message = 2;
    bool valid = 3;
    int32 status = 4;
}

message GetSellerStatsRequest {
    int64 account_id = 1;
    reserved 2;
    // ② store re-key：> 0 時以 PK sellers.store_id 解析（public
    // /sellers/:id/stats|rating）。與 account_id 互斥。
    int64 store_id = 3;
}

message SellerStatsResponse {
    int32 code = 1;
    string message = 2;
    SellerStats data = 3;
}

message SellerStats {
    // store_id 命名債正名（Phase 2 campaign Task 3）：值一直是 store surrogate，
    // 欄位本身叫 account_id 純屬歷史誤稱（gateway GetSellerRating/GetSellerStats
