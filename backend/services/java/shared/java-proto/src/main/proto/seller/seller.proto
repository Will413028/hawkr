message PayuniStatus {
    string account_id = 20;             // seller account_id
    string payuni_mer_id = 2;           // PAYUNi 商店代號 (如 DAIL0001)
    string payuni_status = 3;           // unregistered, pending, active, failed
    string mer_status = 4;              // PAYUNi 原始商店狀態
    string member_status = 5;           // PAYUNi 會員狀態
    string credit_status = 6;           // 信用卡支付狀態
    string applepay_status = 7;         // Apple Pay 狀態
    string googlepay_status = 8;        // Google Pay 狀態
    string atm_status = 9;              // ATM 狀態
    string error_message = 10;          // 錯誤訊息
    int64 registered_at = 11;           // 註冊時間 (Unix timestamp)
    int64 approved_at = 12;             // 審核通過時間
    int64 last_synced_at = 13;          // 最後同步時間
    string approval_status = 14;        // Hawkr 審核狀態: pending, approved, rejected
    string payuni_mer_status = 15;      // PAYUNi 商戶狀態
    string overall_status = 16;         // 綜合認證狀態
    string reason = 17;                 // PayUni 商店審核未通過/待補件原因（≤200 字），無則為空字串
    string freshness = 18;              // fresh | stale | very_stale | not_applicable（非 pending 狀態一律 not_applicable）。
                                         // 反映最後一次同步「嘗試」（ClaimForSync CAS lease 取得時）而非最後一次「成功」：
                                         // lease 在實際呼叫 PAYUni API 之前就寫入 last_synced_at，若取得 lease 後
                                         // API 呼叫失敗，freshness 仍會前進，與呼叫成功時無法區分（Phase 1 已知限制）。
    repeated string allowed_actions = 19; // "resync"（pending 且逾同步間隔）｜"edit_merchant_profile"（active）
    // 以下 8 個欄位（issue #2806 Phase 2）鏡射 payuni_registrations 的聯絡/地址
    // 欄位與樂觀鎖版本號，供 Web 端開啟編輯表單前先 GET 取得目前值與版本號
    // （之後 PATCH /app/sellers/me/payuni/merchant_profile 的 If-Match）。
    // 未曾設定值時為空字串；merchant_profile_version 未有註冊紀錄時為空字串。
    string merchant_profile_version = 21; // 數字字串，語意與型別同 UpdateMerchantProfileResponse.merchant_profile_version
    string contact_name = 22;
    string contact_mobile = 23;
    string contact_tel = 24;
    string mer_email = 25;
    string mer_addr = 26;
    string mer_addr_post = 27;
    string mer_tel = 28;
    // 以下 4 個欄位（2026-09-10 賣家可讀錯誤目錄）：賣家被 PayUni 拒絕／退件時的
    // 結構化原因。error_message（tag 10）仍是這支 internal gRPC message 的欄位，
    // 服務間呼叫仍會傳遞；「不下發給賣家」是 gateway 的 JSON 邊界保證，不是這裡
    // 的欄位定義本身——由 gateway/internal/handler/seller_test.go 的
    // TestGetSellerPayuniStatus_ErrorMessageAbsent 鎖住，proto 層未做任何刪減。
    string error_code = 29;             // AGENT 碼或 MER_*/MEMBER_* 合成碼；無錯誤時空字串
    string error_display_message = 30;  // 賣家可讀文案：PayUni Reason 優先，否則 CodeMeta 目錄文案
    string error_remedy = 31;           // SELLER_FIX | CONTACT_SUPPORT | RETRY_LATER
    string retry_step = 32;             // idCard | bankBook | companyInfo | otherInfo | start；非 SELLER_FIX 為空
}

