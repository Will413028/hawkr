// Admin-only certification detail request (#608). Separate RPC from the seller
// GetCertificationApplication so admin can receive the unmasked id_card_no.
// Placed at end of file so protoc message-index assignment does not shift
// existing generated indices (minimal generated-code churn).
message GetCertificationApplicationForAdminRequest {
    string application_id = 1;  // path TSID 字串（§4）
}

// Appended to keep all existing protoc message indices stable.
message ListPublicStoreIDsByCityRequest {
    string city = 1; // 台灣 22 縣市；接受台/臺別名，server 正規化
}

message ListPublicStoreIDsByCityResponse {
    int32 code = 1;
    string message = 2;
    string city = 3;               // canonical city
    repeated string store_ids = 4; // 數字字串，供 product store_ids filter 使用
    string city_code = 5;          // ISO 3166-2:TW
}

message ListPublicStoresByCityRequest {}

message ListPublicStoresByCityResponse {
    int32 code = 1;
    string message = 2;
    repeated PublicCityStores cities = 3; // 固定 22 筆，含零商家城市
}

message PublicCityStores {
    string city_code = 1;                  // ISO 3166-2:TW，例如 TW-TPE
    string city_name = 2;                  // canonical 中文名稱，例如台北市
    repeated string store_ids = 3;         // 完整 store ids，供 server-side filter/count
    repeated string preview_store_ids = 4; // 前 6 筆 deterministic preview；不得作完整 filter
}

message GetCurrentStoreIDRequest {
    int64 account_id = 1;
}

message GetCurrentStoreIDResponse {
    int64 store_id = 1;
}

// 業者名稱歸屬比對（19 號 §8.5.1）——自動核准前確認「這張證書是不是這個賣家的」。
message MatchCertificateHolderRequest {
    // 內部呼叫、前端不可控 ⇒ 適用型別規範 §4.1 例外 1，用原生數值
    int64 store_id = 1;
    // 政府查驗回的業者名稱，原樣送出（正規化在本服務內做）
    string holder_name = 2;
}

message MatchCertificateHolderResponse {
    // 任一名稱匹配即 true
    bool matched = 1;
    // "REAL_NAME" / "COMPANY_NAME" / "NONE"——稽核用，不含名稱本身
    string matched_field = 2;
    // 該賣家是否有任何可比對的名稱；false ⇒ 無從判斷，呼叫端應轉人工而非放行
    bool has_reference = 3;
}

// ========== 站外業者主檔（招商名單） ==========

message SearchSellerProspectsRequest {
    string category = 1;
    string region = 2;
    string keywords = 3;
    // category_ids 是平台分類樹的節點 id，呼叫端（ai-service）已把買家要的節點
    // 展開成祖先鏈。業者掛的分類落在其中任一個就算命中，語意與上面三個條件同為
    // 加權 OR。為空時這個述詞恆為 false，行為與加這個欄位之前逐位元相同。
    repeated string category_ids = 5;
    // 服務端安全上限，不是「回傳幾筆」的意思——相關性排序與最終截斷交給呼叫端
    // （ai-service 的 CandidateSearchUseCase.Search，見該檔註解）在算完分數之後
    // 做，DB 這一側只需要保證單次查詢不會把整份名單（634 筆量級）全撈回來造成
    // 過量傳輸。0 表示採用服務端預設（500）。
    int32 limit = 4;
}

// SellerProspectItem 是一家站外業者的對外投影。
// id 依 API/Proto 規範以字串承載（避免 JavaScript 精度問題）。
message SellerProspectItem {
    string id = 1;
    string display_name = 2;
    string vendor_type = 3;
    string category = 4;
    string region = 5;
    string product_summary = 6;
    string positioning = 7;
    string research_summary = 8;
    string priority_letter = 9;
    // 星等以字串承載：repo 的 proto-lint-numeric 把「計數」型欄位一律要求字串
    // （CLAUDE.md §4）。0–3 的星等本身沒有 JS 精度風險，但規則是機械式的，
    // 而在 allowlist 加一筆新例外會把一份「既有豁免」清單變成常態出口。
    string priority_stars = 10;
    string public_email = 11;
    string public_phone = 12;
    string public_website = 13;
    string public_social = 14;
    // 這一列的事實截止時間（呼叫端寫進候選快照的 facts_as_of）。
    string updated_at = 15; // ISO 8601 UTC

    // 站外業者的品牌素材 objectKey（顯示 URL 由 Gateway 組，49 §6.6）。
    // **這不是平台賣家身分**——站外業者沒有 store，這兩欄純粹是「這家業者
    // 自己的品牌圖長什麼樣」，不得被消費端當成已入駐或已驗證的訊號。
    // 素材來源與使用許可狀態見 seller_prospects.{logo,cover}_source_url。
    string logo_key = 16;
    string cover_key = 17;
}

// SellerProspectHit 是命中列 ＋ 命中了哪些 facet。
message SellerProspectHit {
    SellerProspectItem prospect = 1;
    bool hit_category = 2;
    bool hit_region = 3;
    bool hit_keywords = 4;
    // hit_category_ids 說這筆是靠結構化分類標籤命中的，不是靠字串比對。
    // 呼叫端用它把「命中理由」標給買家看，也是排序訊號。
    bool hit_category_ids = 5;
}

message SearchSellerProspectsResponse {
    int32 code = 1;
    string message = 2;
    repeated SellerProspectHit data = 3;
}

message CreateSellerProspectRequest {
    string display_name = 1;
    string vendor_type = 2; // individual | business
    string tax_id = 3;      // 可空；有值時必須是 8 碼數字
    string public_email = 4;
    string public_phone = 5;
    string public_website = 6;
    string public_social = 7;
    string category = 8;
    string region = 9;
    string product_summary = 10;
    string positioning = 11;
    string research_summary = 12;
    string priority_letter = 13;
    // 與 SellerProspectItem.priority_stars 同型別：同一個概念在請求與回應上
    // 用兩種 wire 型別，讀的人一定會踩到。
    string priority_stars = 14;
    // 操作者的登入 principal（admin operator）。遷移腳本送 0。
    string created_by_account_id = 15;
    // true 時只回比對結果、不寫入。遷移的 dry-run 與階段二 admin 表單的
    // 即時查重都走這個旗標。
    bool dry_run = 16;
    // 這筆事實原本成立的時間點（ISO 8601 UTC），只給 candidate_leads 的一次性
    // 遷移腳本用（scripts/migrate_candidate_leads_to_prospects.go 讀
    // candidate_leads.imported_at 帶進來）：候選卡把 seller_prospects.updated_at
    // 呈現成 facts_as_of（可驗證來源證據），若遷移當下沒有這個欄位、一律蓋成
    // 遷移執行日，8 月做的研究會謊報成遷移當天才查證。階段二 admin 建檔不送
    // 這個欄位，交由伺服器端用 now()。空字串或解析失敗 ⇒ 伺服器端一律退回 now()。
    string facts_as_of = 17;
}

// ProspectMatchCandidate 是「這筆輸入看起來跟既有哪幾列是同一家」。
// tier 只會是 T1_TAX_ID 或 T2_CONTACT——名稱模糊比對永不自動合併，
// 因此不會出現在這個回應裡。
message ProspectMatchCandidate {
    SellerProspectItem prospect = 1;
    string tier = 2;       // T1_TAX_ID | T2_CONTACT
    string matched_on = 3; // tax_id | email | phone | domain | social
}

message CreateSellerProspectResponse {
    int32 code = 1;
    string message = 2;
    // dry_run=true 時為空；實際建立成功時帶新列。
    SellerProspectItem data = 3;
    // 比對到的既有列——比對對象是這次呼叫當下 seller_prospects 裡「已經寫入」
    // 的資料，不多不少。dry_run=true 與 dry_run=false 都可能非空：dry_run 不
    // 寫入，所以只能比到呼叫之前就已存在的列；而遷移腳本要在真正套用前看到
    // 「這批輸入互相之間」的重複，必須先用一次真寫入的 staging pass 累積起來
    // （見 scripts/migrate_candidate_leads_to_prospects.go 檔頭），這種情況下
    // 即使 dry_run=false，non-empty matches 一樣可能只代表「跟同一批稍早那筆」
    // 撞上，不是跟既有正式資料撞上。呼叫端不能只看「非空」就假設對象是既有
    // 正式資料，必須自己知道自己在哪個階段呼叫。
    repeated ProspectMatchCandidate matches = 4;
}

// ========== 站外業者主檔 — Admin messages ==========

// AdminSellerProspectItem 是給 admin console 的完整投影。與
// SellerProspectItem 的差別是識別鍵與狀態欄位——那些刻意不出現在
// ai-service 消費的那個型別上。數字一律字串過線。
message AdminSellerProspectItem {
    string id = 1;
    string display_name = 2;
    string vendor_type = 3;
    string status = 4;                    // ACTIVE | ARCHIVED | CONVERTED
    string outreach_status = 5;
    string tax_id = 6;                    // 空字串表示未填
    string converted_store_id = 7;        // 空字串表示未歸因
    string converted_at = 8;              // ISO 8601 UTC，空字串表示未歸因
    string merged_into_prospect_id = 9;   // 空字串表示未被合併
    string category = 10;
    string region = 11;
    string product_summary = 12;
    string positioning = 13;
    string research_summary = 14;
    string priority_letter = 15;
    string priority_stars = 16;
    string public_email = 17;
    string public_phone = 18;
    string public_website = 19;
    string public_social = 20;
    string created_by_account_id = 21;
    string updated_by_account_id = 22;
    string created_at = 23;               // ISO 8601 UTC
    string updated_at = 24;               // ISO 8601 UTC

    // 品牌圖片。key 是 media-service 轉正後的 objectKey；顯示 URL 由 Gateway 組，
    // 不在這裡回——同 SellerInfo.logo_key（49 §6.6 GW組）。
    string logo_key = 25;
    string cover_key = 26;
    // 「這張圖是從哪個公開頁面找到的」。稽核欄位，後端只驗格式不下載；
    // 填了網址不代表已取得使用許可。
    string logo_source_url = 27;
    string cover_source_url = 28;
    // 圖片專屬的樂觀鎖版本（數字字串），與文字主檔的編輯分開計。每次換圖遞增，
    // Admin 以它作為下一次寫入的 expected 基準。
    string media_version = 29;
}

message AdminListSellerProspectsRequest {
    string status = 1;           // 空 ⇒ 只回 ACTIVE（admin 的日常工作面）
    string outreach_status = 2;
    string vendor_type = 3;
    string category = 4;
    string region = 5;
    string keyword = 6;          // 比對 display_name／product_summary／positioning／research_summary
    string page = 7;             // 從 1 起；空或解析失敗 ⇒ 1
    string page_size = 8;        // 上限 500；空或解析失敗 ⇒ 20
}

message AdminListSellerProspectsResponse {
    int32 code = 1;
    string message = 2;
    repeated AdminSellerProspectItem data = 3;
    string total = 4;
    string page = 5;
    string page_size = 6;
}

// ProspectInviteItem 是一筆邀請的對外投影。token 只在建立當下回一次
// （AdminCreateProspectInviteResponse.token），列表不回——邀請歷史是給
// BD 看漏斗的，不是給人重新取得憑證的地方。
message ProspectInviteItem {
    string id = 1;
    string prospect_id = 2;
    string expires_at = 3;   // ISO 8601 UTC
    string sent_at = 4;      // 空字串表示未寄送
    string clicked_at = 5;   // 空字串表示未點擊（T17 之前恆為空）
    string consumed_at = 6;  // 空字串表示未消費
    string revoked_at = 7;   // 空字串表示未撤銷
    string created_at = 8;
}

message AdminGetSellerProspectRequest {
    string id = 1;
}

message AdminGetSellerProspectResponse {
    int32 code = 1;
    string message = 2;
    AdminSellerProspectItem data = 3;
    repeated ProspectInviteItem invites = 4;
}

message AdminUpdateSellerProspectRequest {
    string id = 1;
    string display_name = 2;
    string vendor_type = 3;
    string outreach_status = 4;
    string tax_id = 5;
    string public_email = 6;
    string public_phone = 7;
    string public_website = 8;
    string public_social = 9;
    string category = 10;
    string region = 11;
    string product_summary = 12;
    string positioning = 13;
    string research_summary = 14;
    string priority_letter = 15;
    string priority_stars = 16;
    // 操作者的登入 principal，寫進 updated_by_account_id。
    string operator_account_id = 17;
}

message AdminArchiveSellerProspectRequest {
    string id = 1;
    // true ⇒ ARCHIVED；false ⇒ 還原成 ACTIVE。
    // 帶 merged_into_prospect_id 的列不可還原——那要求同時撤銷一次合併。
    bool archived = 2;
    string operator_account_id = 3;
}

// AdminProspectDuplicatePair 是一對疑似重複。matched_on 由服務端的
// matchedOn() 計算，與遷移報告用同一份優先序。
message AdminProspectDuplicatePair {
    AdminSellerProspectItem left = 1;
    AdminSellerProspectItem right = 2;
    string matched_on = 3;  // email | social | phone | domain
}

message AdminListDuplicateProspectsRequest {}

message AdminListDuplicateProspectsResponse {
    int32 code = 1;
    string message = 2;
    repeated AdminProspectDuplicatePair data = 3;
    // 服務端硬上限 500 對；true 表示還有沒回的。
    bool truncated = 4;
}

message AdminMergeSellerProspectsRequest {
    string winner_id = 1;
    string loser_id = 2;
    string operator_account_id = 3;
}

message AdminMergeSellerProspectsResponse {
    int32 code = 1;
    string message = 2;
    AdminSellerProspectItem data = 3;  // 合併後的 winner
}

message AdminConvertSellerProspectRequest {
    string id = 1;
    string store_id = 2;
    string operator_account_id = 3;
}

// AdminUpdateSellerProspectMediaRequest 走 staged-token flow：bytes 由 Admin 直傳
// media-service，這裡只帶轉正用的 token。刻意沒有「直接給圖片 URL」的欄位——
// 外部網址會過期（研究來源有 64% 是帶簽章與 oe 到期參數的 CDN 連結），存進來的
// 顯示欄位三天後就是壞圖。
message AdminUpdateSellerProspectMediaRequest {
    string id = 1;
    // logo | cover。兩個角色各自獨立，換 logo 不動 cover 的 key 與 source_url。
    string kind = 2;
    string staged_token = 3;
    // 樂觀鎖基準：必須等於目前的 media_version，否則回衝突讓 Admin 重新讀取。
    // 缺值不視為「不在意版本」——那會讓兩個 admin 的換圖互相覆蓋。
    string expected_media_version = 4;
    // 公開 HTTPS 頁面網址。服務端自己再驗一次，不信前端驗過。
    string source_url = 5;
    string operator_account_id = 6;
}

// AdminProspectTaxIdMatch 是「這筆 prospect 的統編對得上一個已入駐賣家」。
message AdminProspectTaxIdMatch {
    AdminSellerProspectItem prospect = 1;
    string store_id = 2;
    string store_name = 3;
    string certification_company_name = 4;
    string certification_status = 5;
}

message AdminListProspectTaxIdMatchesRequest {}

message AdminListProspectTaxIdMatchesResponse {
    int32 code = 1;
    string message = 2;
    repeated AdminProspectTaxIdMatch data = 3;
}

message AdminCreateProspectInviteRequest {
    string prospect_id = 1;
    // 有效天數；空或解析失敗 ⇒ 服務端預設 30。
    string valid_days = 2;
    string operator_account_id = 3;
}

message AdminCreateProspectInviteResponse {
    int32 code = 1;
    string message = 2;
    ProspectInviteItem data = 3;
    // token 只在這裡回一次。它不授予任何權限（spec §5.3），但仍是憑證，
    // 不放進列表回應。
    string token = 4;
}

message AdminRevokeProspectInviteRequest {
    string prospect_id = 1;
    string invite_id = 2;
    string operator_account_id = 3;
}

message AdminRevokeProspectInviteResponse {
    int32 code = 1;
    string message = 2;
}

// ========== Vendor Portal (#2539 E1) ==========

message EnsureVendorPortalInviteRequest {
    string prospect_id = 1;
    string rfq_recipient_id = 2;
    string expires_at = 3;
}

message EnsureVendorPortalInviteResponse {
    string invite_id = 1;
    string secret = 2;
    string invited_email = 3;
}

// EnsureVendorPortalInvite 與 MarkVendorPortalInviteSecretDelivered 以 ErrorInfo.reason（domain 是 "hawkr"）回報的結果；
// reason 字串就是這個列舉的名稱（enum 的 String()），呼叫端據此分辨，不得另寫字串。UNSPECIFIED 不是有效的 reason。
enum VendorPortalInviteErrorReason {
    VENDOR_PORTAL_INVITE_ERROR_REASON_UNSPECIFIED = 0;
    VENDOR_PORTAL_INVITE_ERROR_REASON_INVITE_REVOKED = 1;
    VENDOR_PORTAL_INVITE_ERROR_REASON_PROSPECT_NOT_ACTIVE = 2;
    VENDOR_PORTAL_INVITE_ERROR_REASON_NO_DELIVERABLE_EMAIL = 3;
    VENDOR_PORTAL_INVITE_ERROR_REASON_INVITE_SECRET_SUPERSEDED = 4;
}

message MarkVendorPortalInviteSecretDeliveredRequest {
    string invite_id = 1;
    // Ensure 回傳、寄進信件的那一把明文 secret。
    string secret = 2;
}

message MarkVendorPortalInviteSecretDeliveredResponse {
    int32 code = 1;
    string message = 2;
}
