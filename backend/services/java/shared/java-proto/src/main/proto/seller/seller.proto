// ========== Admin 手動停權（不服勸導，32 §13 / 46 §5） ==========
//
// account_id 為被停權的登入帳號（非 store surrogate）— admin 手動停權是對「人」的懲罰，
// 需跨越 close→re-onboard 的店鋪世代持續生效，與 seller_violations 的 store-scope 不同
// （見 07-方案設計.md §6.2；Redis key `seller:suspended:<accountId>` / MQ payload
// accountId 均以此為準，46 §4.2 / §5）。

message SellerSuspension {
    string id                     = 1;  // TSID 字串（§4）— 即 suspensionId，隨 MQ payload 傳給下游
    string account_id             = 2;  // TSID 字串（§4）
    string reason_code            = 3;  // SellerSuspensionReason CodeMeta
    string reason_detail          = 4;
    string status                 = 5;  // active / lifted
    string suspended_by_admin_id  = 6;
    string suspended_at           = 7;  // ISO 8601 UTC（YYYY-MM-DDTHH:mm:ssZ，§6 response 欄位禁數字型別）
    string lifted_by_admin_id     = 8;  // 空字串 = 尚未解除
    string lifted_at              = 9;  // ISO 8601 UTC；空字串 = 尚未解除
    string created_at             = 10; // ISO 8601 UTC
}

message SuspendSellerForAdminRequest {
    string account_id    = 1;  // path {sellerId}，TSID 字串（§4）
    string reason_code   = 2;  // SellerSuspensionReason CodeMeta（9601=違反平台規範 / 9602=屢勸不改 / 9603=其他）
    string reason_detail = 3;
    int64  admin_id      = 4;  // JWT 注入（§4.1 例外①）
}

message SuspendSellerForAdminResponse {
    int32  code              = 1;
    string message           = 2;
    SellerSuspension suspension = 3;
    bool   already_suspended = 4;  // 冪等：uq_seller_suspensions_active 擋第二筆 active 時 true
}

message LiftSellerSuspensionForAdminRequest {
    string account_id = 1;  // path {sellerId}，TSID 字串（§4）
    string id         = 2;  // path {id}，suspension TSID 字串（§4）
    int64  admin_id   = 3;  // JWT 注入（§4.1 例外①）
}

message LiftSellerSuspensionForAdminResponse {
    int32  code              = 1;
    string message           = 2;
    SellerSuspension suspension = 3;
    bool   already_lifted    = 4;  // 冪等：重複解除 no-op 時 true
}

message ListSellerSuspensionsForAdminRequest {
    string account_id = 1;  // path {sellerId}，TSID 字串（§4）
    int32  limit       = 2;
    int32  offset      = 3;
}

message ListSellerSuspensionsForAdminResponse {
    int32 code    = 1;
    string message = 2;
    repeated SellerSuspension suspensions = 3;
}

message GetActiveSellerSuspensionForAdminRequest {
    string account_id = 1;  // path {sellerId}，TSID 字串（§4）
}

message GetActiveSellerSuspensionForAdminResponse {
    int32 code    = 1;
    string message = 2;
    SellerSuspension suspension = 3;  // id 為空字串 = 無 active 停權
}

// ========== Admin 賣家會員分級方案（子系統 1）==========

