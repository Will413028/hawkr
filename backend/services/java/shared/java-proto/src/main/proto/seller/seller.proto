}

// BusinessRegistrationData 公司登記資料。found=false 表示 GCIS 可連線但查無此統編
// （definitive not-found）；上游逾時 / 連線失敗回 gRPC error（transient，由 caller fail-soft）。
message BusinessRegistrationData {
    bool   found               = 1;
    string ban                 = 2;
    string business_nm         = 3;
    string business_address    = 4;
    string business_setup_date = 5; // 西元 YYYY-MM-DD
    string business_type       = 6; // 股份有限公司 / 有限公司 …
    string capital_amount      = 7; // §6：response 數值欄位用 string，gRPC boundary 轉換
}

message LookupBusinessRegistrationResponse {
    int32  code = 1;
    string message = 2;
    BusinessRegistrationData data = 3;
}

// ========== Address Geocode (賣家門市地址查詢/驗證) ==========

message SuggestAddressRequest {
    string county = 1;
    string district = 2;
    string query = 3;
}

message AddressSuggestionData {
    string full_address = 1;
    string county = 2;
    string district = 3;
    string detail = 4;
}

