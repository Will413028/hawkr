    string expected_version = 15;
    // ② store re-key：> 0 時直接鎖定 PK sellers.store_id（代行路徑）。與 account_id
    // 互斥，語意與 GetSellerRequest.store_id 相同 —— account_id 保留「解析該帳號的
    // current stint」語意（/app/sellers/me），store_id 則指名一個 stint。
