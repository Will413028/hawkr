}

message DeleteSellerAccountResponse {
    int32  code    = 1;
    string message = 2;
}

// ========== B-169 Governance Messages (issue #722) ==========

// 統一錯誤包封 (失敗時 code != 0；duplicate / silent drop 路徑用特定 code)
//   - code=0: success
//   - code=4001: invalid input (phone format / missing field / penalty 互斥)
//   - code=4030: forbidden (非 own violation 申訴)
//   - code=4040: not found
//   - code=4090: conflict (duplicate / status transition / already acked)

// ----- 共用 -----

// 食安通道 + 登入端報告共用 status enum (string carrying)
//   pending / investigating / verified / dismissed
// food_safety severity 不存 DB，固定 'critical'。

// ----- Create Reports -----

message CreateViolationReportRequest {
    int64  reporter_account_id     = 1;
    string target_seller_id        = 2;  // TSID 字串（§4）
    string target_product_id       = 3; // optional, TSID 字串（§4）
    string target_post_id          = 4; // optional, TSID 字串（§4）
    string target_order_no         = 5; // optional
    string category                = 6; // food_safety / fake_certification / ...
    string severity                = 7; // low / medium / high / critical
    string description             = 8;
    repeated string evidence_asset_ids = 9; // media-service two-step asset_ids
}

message CreateViolationReportResponse {
    int32  code      = 1;
    string message   = 2;
    string report_id = 3;
    bool   duplicate = 4; // D13 calendar-day partial unique 觸發回 既有 id
}

message CreateFoodSafetyReportRequest {
    string target_seller_id    = 1; // optional, TSID 字串（§4）
    string target_product_id   = 2; // optional, TSID 字串（§4）
    string target_order_no     = 3; // optional
    string reporter_phone      = 4; // 必填，台灣手機 09xxxxxxxx / +886... / 等可被 NormalizePhone 接受
    string reporter_email      = 5; // optional
    string reporter_name       = 6; // optional
    string description         = 7; // 必填
    repeated string evidence_asset_ids = 8; // anonymous upload 取得
}

message CreateFoodSafetyReportResponse {
    int32  code              = 1;
    string message           = 2;
    string report_id         = 3;
    int64  ack_estimated_at  = 4; // unix ms — admin 應在此時間前 ack
}

// ----- ListMyViolationReports -----

message ListMyViolationReportsRequest {
    int64 reporter_account_id = 1;
    int64 since_ms            = 2; // optional unix ms (default 90d ago)
    int32 limit               = 3;
    int32 offset              = 4;
}

message ListMyViolationReportsResponse {
    int32 code    = 1;
    string message = 2;
    repeated SellerViolationReport reports = 3;
}

// SellerViolationReport message — admin / 賣家自助共用 view (含 reporter / status)
message SellerViolationReport {
    string id                       = 1;
    string target_seller_id         = 2;
    string target_product_id        = 3;
    string target_post_id           = 4;
    string target_order_no          = 5;
    string reporter_account_id      = 6;
    string category                 = 7;
    string severity                 = 8;
    string description              = 9;
    repeated string evidence_asset_ids = 10;
    string status                   = 11;
    int64  investigating_at_ms      = 12;
    int64  resolved_at_ms           = 13;
    string admin_resolution_summary = 14;
    int64  created_at_ms            = 15;
}

// FoodSafetyReport message — admin 用 view
message FoodSafetyReport {
    string id                       = 1;
    string target_seller_id         = 2;
    string target_product_id        = 3;
    string target_order_no          = 4;
    string reporter_phone           = 5; // admin 可看完整；公開查詢不暴露
    string reporter_email           = 6;
    string reporter_name            = 7;
    string description              = 8;
    repeated string evidence_asset_ids = 9;
    string status                   = 10;
    int64  acknowledged_at_ms       = 11;
    string acknowledged_by_admin_id = 12;
    int64  investigating_at_ms      = 13;
    int64  resolved_at_ms           = 14;
    string admin_resolution_summary = 15;
    int64  fda_reported_at_ms       = 16;
    string fda_report_channel       = 17;
    string fda_reference_no         = 18;
    int64  created_at_ms            = 19;
}

// SellerViolation message — admin / 賣家自助共用 view
message SellerViolation {
    string id                          = 1;
    string seller_id                   = 2;
    string source_seller_report_id     = 3;
    string source_food_safety_report_id = 4;
    string category                    = 5;
    string severity                    = 6;
    string penalty_type                = 7;
    int64  penalty_amount_cents        = 8;
    string description                 = 9;
    string public_summary              = 10;
    int64  effective_at_ms             = 11;
    int64  expires_at_ms               = 12;
    string status                      = 13; // enforced / revoked
    int64  revoked_at_ms               = 14;
    string revoked_reason              = 15;
    bool   appealed                    = 16;
    string appeal_reason               = 17;
    repeated string appeal_evidence_asset_ids = 18;
    string appeal_status               = 19; // pending / accepted / rejected (if appealed)
    int64  appeal_submitted_at_ms      = 20;
    int64  appeal_decided_at_ms        = 21;
    string appeal_decision_reason      = 22;
    string appeal_decided_by_admin_id  = 23;
    string created_by_admin_id         = 24;
    int64  created_at_ms               = 25;
}

// PublicSellerViolation 對外公開賣家頁顯示用（D8 嚴格白名單）
message PublicSellerViolation {
    string id                = 1;
    string category          = 2;
    string severity          = 3;
    string penalty_type      = 4;
    string public_summary    = 5;
    int64  effective_at_ms   = 6;
    int64  expires_at_ms     = 7;
}

