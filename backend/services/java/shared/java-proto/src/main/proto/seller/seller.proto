    string seo_description = 24;
    string description = 25;
    string cover_key = 26;  // 商家封面 objectKey（#1660：原 cover_url 存裸 key，§25 違規已修；Gateway 組 coverUrl）
    // sellers.status 生命週期值：active / suspended / suspended_governance / closed。
    // admin 列表停權 badge / 篩選用（詳情走 SellerInfo.lifecycle_status）。
    string lifecycle_status = 27;
    // sellers.email 登入信箱。admin 列表唯一能區分同名商店的識別欄位——
    // 缺這欄時 admin 只看得到店名，同名店無從分辨會直接刪錯帳號。
    string email = 28;
