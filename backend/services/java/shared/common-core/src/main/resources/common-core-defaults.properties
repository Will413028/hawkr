# ============================================================
# common-core 統一預設配置
# ============================================================
# 由各 AutoConfiguration 透過 @PropertySource 載入
# 優先級低於微服務的 application.yml，如有特殊需求可在服務內覆蓋
# 環境變數優先級最高，部署時可透過 env var 覆蓋
# ============================================================

# === 媒體 URL 配置（49 號設計書 §8.5，域名唯一來源 MEDIA_BASE_URL）===
# 無預設域名（backend#2283）：媒體域名不做新舊相容，dev 一律 test-media.example.com、
# prod 一律 media.example.com，一律由 MEDIA_BASE_URL 注入（k8s values／compose）。
hawkr.media.base-url=${MEDIA_BASE_URL:}

# === Frontend SSR cache invalidation（後端服務責任邊界規範 §9）===
# 空值 → RevalidateClient noop（local dev 不對接 web）。
hawkr.web-revalidate.base-url=${WEB_REVALIDATE_BASE_URL:}
hawkr.web-revalidate.secret=${WEB_REVALIDATE_SECRET:}
hawkr.web-revalidate.timeout-seconds=${WEB_REVALIDATE_TIMEOUT_SECONDS:5}

# === DB Bootstrap 配置（部署即自動建立 DB 與 extension，詳見 38 號設計書 §3.4）===
hawkr.db.bootstrap.enabled=${DB_BOOTSTRAP_ENABLED:true}
hawkr.db.bootstrap.admin-url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/postgres
hawkr.db.bootstrap.admin-user=${DB_ADMIN_USER:${DB_USER}}
hawkr.db.bootstrap.admin-password=${DB_ADMIN_PASSWORD:${DB_PASSWORD}}
hawkr.db.bootstrap.target-database=${DB_NAME}
# 各服務按需透過 env var 啟用所需 extension（如 product 設 DB_EXT_PG_TRGM=true）
hawkr.db.bootstrap.extensions[0].name=pg_trgm
hawkr.db.bootstrap.extensions[0].enabled=${DB_EXT_PG_TRGM:false}

# === 時區配置（UTC 統一） ===
spring.jackson.time-zone=UTC
spring.datasource.hikari.connection-init-sql=SET timezone = 'UTC'

# === 支付配置（§2A.5 ATM 期限）===
# §2A.2 付款方式金額範圍規則改由 common-core/utils/code/helper/PaymentMethodLimitRules 硬編碼，
# 不再用 properties 配置（PayUni 規則屬外部 contract，僅 PayUni 公告變更時才動）。
# ATM 繳費期限（天）
hawkr.payment.atm.expire-days=${PAYMENT_ATM_EXPIRE_DAYS:2}
