# ============================================================
# observability-common 統一預設配置
# ============================================================
# 此檔案由 ObsAutoConfiguration 透過 @PropertySource 載入
# 優先級低於微服務的 application.yml，如有特殊需求可在服務內覆蓋
# 環境變數優先級最高，部署時可透過 env var 覆蓋
# ============================================================

# === OpenTelemetry SDK 配置 ===
otel.sdk.disabled=false
otel.service.name=${hawkr.obs.service}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:otlp}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}

# === Spring Boot Actuator 配置 ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# === Metrics Percentile Histogram 配置 ===
# 預設關閉，http_server_requests_seconds_bucket 是零 series，
# 導致 Grafana histogram_quantile(P95/P99) 對所有 Java job 永遠為空
# （見 monitoring/grafana/.../load-balance.json 的已知限制說明）
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# === Kubernetes Probes 配置 ===
# 啟用 Spring Boot 的 readiness/liveness probe endpoints
# 即使容器未自動偵測到 K8s 環境（如本地 docker-compose）也必須暴露
management.endpoint.health.probes.enabled=true
# readiness 群組：包含所有 health indicator（db / redis / rabbit / componentReadiness / readinessState ...）
# 任一未 ready → /actuator/health/readiness 報 DOWN → K8s readinessProbe 失敗 → pod 不接流量
management.endpoint.health.group.readiness.include=*
# liveness 群組：只看 Spring 的 livenessState（不檢查外部依賴），避免冷啟動觸發 restart loop
management.endpoint.health.group.liveness.include=livenessState

# === RabbitMQ Publisher Confirm 配置 ===
# correlated 模式：每則訊息帶 CorrelationData，可用 future 等待 broker ack/nack
# 搭配 publisher-returns + template.mandatory：unroutable 訊息觸發 return callback
# 供 ObsRabbitPublisher.publishConfirmed 等待確認投遞使用；correlated 為非破壞性，
# 既有直發 caller（convertAndSend 不帶 CorrelationData）不 block、語意不變
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# === Distributed Tracing 配置 ===
# sampling.probability: 1.0=100% 取樣（開發用），正式環境建議 0.1~0.5
management.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
# Spring Boot Actuator OTLP endpoint（需含 /v1/traces 路徑）
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

management.opentelemetry.resource-attributes.deployment.environment=${ENV:development}
