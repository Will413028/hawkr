# coordinator eval 的代表性 query 集（issue #3519 D2）
#
# expect 是「這句話應該落到哪個 specialist」，判準**不是我對賣家會問什麼的想像**，
# 而是各 specialist 在 specialists.go 裡宣告的 Description——那正是 coordinator 看到
# 的委派依據。所以每一條都可以逐字對回一個 Description；對不回去的就不該在這裡。
#
#   seller:order      查詢賣家訂單清單與單筆訂單詳情（依日期/狀態）
#   seller:inventory  檢查賣家庫存是否足以滿足未出貨訂單，列出不足品項
#   seller:payment    查詢賣家收款統計（已收/待收）與待收款訂單明細
#   buyer:order       查詢買家訂單清單與單筆訂單詳情
#   buyer:tracking    查詢買家配送中包裹的物流狀態
#
# buyer:seller_match 刻意不在集合內：它被 buyerCoordinatorFallbackExcluded 排除在
# coordinator 與 fallback 之外（只走按鈕路徑），放進來會測到一個不存在的委派。
#
# multi 的 expect 是集合，判準是「有沒有全部呼叫到」，不計順序。

seller_single:
  - q: "我這週有哪些訂單？"
    expect: [seller:order]
  - q: "幫我看昨天的已完成訂單"
    expect: [seller:order]
  - q: "訂單 1234567 的明細給我"
    expect: [seller:order]
  - q: "待出貨的訂單庫存夠不夠？"
    expect: [seller:inventory]
  - q: "有哪些品項要補貨"
    expect: [seller:inventory]
  - q: "庫存會不會不夠出"
    expect: [seller:inventory]
  - q: "這個月收了多少錢？"
    expect: [seller:payment]
  - q: "還有多少貨款沒收到"
    expect: [seller:payment]
  - q: "哪些訂單還沒付款給我"
    expect: [seller:payment]

seller_multi:
  - q: "這週待收多少？順便看庫存夠不夠"
    expect: [seller:payment, seller:inventory]
  - q: "待出貨的訂單有哪些，庫存能不能出"
    expect: [seller:order, seller:inventory]
  - q: "幫我看這個月的訂單和收款狀況"
    expect: [seller:order, seller:payment]

buyer_single:
  - q: "我的訂單在哪裡看"
    expect: [buyer:order]
  - q: "上週買的那筆訂單明細"
    expect: [buyer:order]
  - q: "我有幾張未完成的訂單"
    expect: [buyer:order]
  - q: "我的包裹到哪了？"
    expect: [buyer:tracking]
  - q: "貨還在配送中嗎"
    expect: [buyer:tracking]
  - q: "查一下物流進度"
    expect: [buyer:tracking]

# eval corpus 的 expect 必須是**從 Description 唯一推得出來**的；一句話能合理落到
# 兩個 specialist 時（例如「訂單到哪了」同時落在 buyer:order 與 buyer:tracking 的
# Description 之間），它量到的是主觀偏好，不是路由品質。
buyer_multi:
  - q: "包裹進度如何，還有我上次買什麼"
    expect: [buyer:tracking, buyer:order]
