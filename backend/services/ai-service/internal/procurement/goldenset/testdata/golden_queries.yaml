    這是設計決定不是缺陷，理由見 spec〈人工覆寫用 pinned，不是短路〉：短路會讓真想買荔枝品種的人搜不到。
    ⚠️ 不要把它「修」成直接定案——本輪已經為此繞了三圈（pricebook 別名、分類改名都不是成因）。

