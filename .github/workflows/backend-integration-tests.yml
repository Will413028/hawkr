name: backend integration tests

# Go 模組帶 //go:build integration 的測試：testcontainers 跑真 postgres，
# 斷言 mock 驗不到的 SQL 行為。
# 由 backend/.github/workflows/integration-tests.yml 搬來，差異：
#   - 原本各模組串成一條 needs 鏈（self-hosted 共用一台 VM，平行跑會把記憶體榨乾），
#     hosted runner 每個 job 各自一台，改成 matrix 平行
#   - 只跑這次動到的模組；動到 pkg（所有服務的共用模組）就全跑
#   - 直接從 Docker Hub 拉映像，不再經 ghcr 鏡像

on:
  pull_request:
    paths: &integration_paths
      - 'backend/pkg/**'
      - 'backend/services/seller-service/**'
      - 'backend/services/ai-service/**'
      - 'backend/services/crm-service/**'
      - 'backend/services/notification-service/**'
      - 'backend/services/social-service/**'
      - 'backend/services/im-service/**'
      - 'backend/services/invoice-service/**'
      - '.github/workflows/backend-integration-tests.yml'
  push:
    branches: [main]
    paths: *integration_paths
  workflow_dispatch:

concurrency:
  group: backend-integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - 'backend/pkg/**'
              - '.github/workflows/backend-integration-tests.yml'
            seller-service: ['backend/services/seller-service/**']
            ai-service: ['backend/services/ai-service/**']
            crm-service: ['backend/services/crm-service/**']
            notification-service: ['backend/services/notification-service/**']
            social-service: ['backend/services/social-service/**']
            im-service: ['backend/services/im-service/**']
            invoice-service: ['backend/services/invoice-service/**']
      # 手動觸發、或動到 pkg／本 workflow 時全跑。
      - name: Resolve modules to test
        id: modules
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.all == 'true' }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          services='["seller-service","ai-service","crm-service","notification-service","social-service","im-service","invoice-service"]'
          if [ "$ALL" = "true" ]; then
            modules=$(jq -c '["pkg"] + map("services/" + .)' <<<"$services")
          else
            modules=$(jq -c --argjson s "$services" '[.[] | select(. as $c | $s | index($c)) | "services/" + .]' <<<"$CHANGES")
          fi
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "將測試：$modules"

  integration:
    name: ${{ matrix.module }} integration
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        working-directory: backend/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: backend/**/go.sum
      - name: Run integration tests
        run: make test-integration
