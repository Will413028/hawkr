name: ui-text generated diff

# 守住共用文案目錄的單一來源與各端生成物同步：
#   來源：backend/internal/platform/uitext/catalog/{config,zh-TW,en}.json、各模組的 internal/text/*.json、api/ 的 proto（key 與說明）
#   生成：backend/cmd/uitext-gen 一次輸出 Go（catalog_gen.go、模組的 text_gen.go）、TS（messages、keys、zh-TW 編譯版）、
#         Dart（ui_text.g.dart）、三端共用的 golden 與守門用的 manifest（設計 backend/docs/plans/2026-09-29-a3-buyer-seller/step10e-Lprime-design.md §2）。
# 重新生成（`make -C backend uitext`，同時把兩份來源檔寫成正規形式）後與工作樹比對，有差異就失敗；不得手改生成檔。
# 生成器與 Go 執行期的單元測試在 backend-monolith.yml（go test ./...）；TS 套件在 ts-packages.yml、Dart 套件在 dart-packages.yml。

on:
  pull_request:
    paths: &ui_text_paths
      - 'api/**'
      - 'backend/cmd/uitext-gen/**'
      - 'backend/internal/platform/uitext/**'
      - 'backend/internal/modules/*/internal/text/**'
      - 'packages/hawkr-ui-text-ts/src/**'
      - 'packages/hawkr-ui-text-ts/tests/**'
      - 'packages/hawkr_ui_text/lib/**'
      - 'packages/hawkr_ui_text/tool/**'
      - 'packages/hawkr_ui_text/test/**'
      - 'backend/Makefile'
      - '.github/workflows/ui-text-generated-diff.yml'
  push:
    branches: [main]
    paths: *ui_text_paths
  workflow_dispatch:

concurrency:
  group: ui-text-generated-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-text-generated-diff:
    name: ui-text 生成物 regenerate + diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/.go-version
          cache: false

      - name: 讀取 buf 的版本
        id: buf
        run: echo "version=$(cat api/.buf-version)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ steps.buf.outputs.version }}
          setup_only: true

      - name: 重新生成
        run: make -C backend uitext

      - name: 與已提交的生成物和來源檔比對
        run: |
          set -euo pipefail
          paths=(
            backend/internal/platform/uitext
            'backend/internal/modules/*/internal/text'
            packages/hawkr-ui-text-ts/src
            packages/hawkr-ui-text-ts/tests
            packages/hawkr_ui_text/lib
            packages/hawkr_ui_text/tool
            packages/hawkr_ui_text/test
          )
          status=0
          if ! git diff --exit-code -- "${paths[@]}"; then
            status=1
          fi
          untracked=$(git ls-files --others --exclude-standard -- "${paths[@]}")
          if [ -n "$untracked" ]; then
            echo "重新生成多出沒有提交的檔案："
            echo "$untracked"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::ui-text 的生成物或來源檔與目錄不同步：在 backend 目錄執行 make uitext 後一併提交（來源檔會被寫成正規形式）"
            exit 1
          fi
