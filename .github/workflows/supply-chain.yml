name: supply chain

# 供應鏈檢查：已知漏洞（govulncheck、OSV-Scanner）、外洩的機敏資料（gitleaks）、workflow 本身的安全（zizmor）。
# OSV-Scanner、gitleaks、zizmor 不設 path 條件：它們掃整個 repo，任何依賴、設定、歷史的變動都可能引入問題。
# govulncheck 的結果只取決於 backend 的 Go 程式、go.mod／go.sum／go.work／.go-version 與漏洞資料庫：
# PR 只在改到這些時才跑；push 到 main、dev 與每週一的排程（預設分支）一律全量掃，接住資料庫新增的漏洞。
#
# 工具版本與下載雜湊都釘死在本檔；升版時兩邊一起改，且版本要發佈滿兩週（見根目錄 AGENTS.md）。
# 已知問題的基準（新的才擋）：
#   - govulncheck：scripts/govulncheck-allowlist.json（每筆有理由與期限）
#   - OSV-Scanner、shaded-jar-gate（shaded jar 內含的函式庫，scripts/shaded-jar-gate.py）：osv-scanner.toml 的 IgnoredVulns（每筆有理由與 ignoreUntil）
#   - gitleaks：.gitleaks.toml（誤報放行）與 .gitleaks-baseline.json（待人工確認的歷史命中）
#   - zizmor：.github/zizmor.yml（每條停用有理由）

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-changes:
    name: 判斷要不要跑 govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" -- \
              'backend/*.go' 'backend/**/*.go' 'backend/go.work' 'backend/go.work.sum' \
              'backend/.go-version' 'backend/**/go.mod' 'backend/**/go.sum' 'backend/go.mod' 'backend/go.sum' \
            | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  govulncheck:
    name: govulncheck（go.work 的所有 module）
    needs: go-changes
    if: needs.go-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go 版本以 backend/.go-version 為準，與 backend-go-checks 相同。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: backend/**/go.sum
      - name: 安裝 govulncheck（go module 校驗碼由 go.sum 資料庫驗證）
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: govulncheck（只擋允許清單以外、被呼叫到的漏洞）
        working-directory: backend
        env:
          # GOWORK=off：各服務的 Dockerfile 與單體都這樣建置，上線的是各 module 自己 go.mod 解析出的版本；
          # go.work 會把依賴抬到整個 workspace 的最高版，掃出來的漏洞會比實際上線的少。
          # 允許清單的產生也必須用同一個模式（見 scripts/govulncheck-allowlist.json 的說明）。
          GOWORK: 'off'
        # 逐一掃完所有 module 再判定，一個失敗不擋住其他 module 的結果。
        run: |
          set -uo pipefail
          failed=()
          for module in $(go work edit -json | jq -r '.Use[].DiskPath | ltrimstr("./")'); do
            echo "::group::govulncheck（$module）"
            report="$RUNNER_TEMP/govulncheck-${module//\//_}.json"
            if ! (cd "$module" && govulncheck -format json ./... > "$report") \
              || ! python3 "$GITHUB_WORKSPACE/scripts/govulncheck-gate.py" --module "$module" --report "$report"; then
              failed+=("$module")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::govulncheck 失敗的 module：${failed[*]}"
            exit 1
          fi

  osv-scanner:
    name: OSV-Scanner（所有 lockfile 與 pom.xml）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安裝 OSV-Scanner v2.7.0（驗證雜湊）
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # --no-resolve：pom.xml 不做傳遞依賴解析。Java 模組之間互相依賴 io.github.will413028.hawkr:*
      # （reactor 內部模組，不在 Maven Central），解析會對每個內部模組報 "not found"；
      # 只看 pom.xml 直接寫出的依賴與屬性插值後的版本。Java 服務是待退場的舊服務。
      - name: OSV-Scanner
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --recursive --no-resolve \
            --config osv-scanner.toml --format table .

  shaded-jar-gate:
    name: shaded jar 內含函式庫（OSV）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/services/java/**/pom.xml
      # osv-scanner 看不到被打包進別的 jar 的函式庫（grpc-netty-shaded 內含 netty 等）。
      # 先 package 讓 reactor 內部模組可解析，再把 runtime 依賴複製出來，由腳本讀 jar 內的版本資訊查 OSV。
      - name: 解析 Java 服務的 runtime jar
        working-directory: backend/services/java
        run: |
          ./mvnw -B -q -DskipTests package dependency:copy-dependencies \
            -DoutputDirectory="$RUNNER_TEMP/shaded-jars" -DincludeScope=runtime \
            -DexcludeGroupIds=io.github.will413028.hawkr
      - name: 腳本單元測試
        run: python3 -m unittest scripts/test_shaded_jar_gate.py
      - name: 查內含函式庫的漏洞
        run: python3 scripts/shaded-jar-gate.py --jars "$RUNNER_TEMP/shaded-jars"

  gitleaks:
    name: gitleaks（完整歷史）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 安裝 gitleaks v8.30.1（驗證雜湊）
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      # --redact：輸出不含秘密本體；--baseline-path：基準內的歷史命中不算失敗。
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json --redact --no-banner --verbose .

  zizmor:
    name: zizmor（workflow 安全）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # 以 --require-hashes 安裝釘死的 wheel（hash 在 scripts/ci/zizmor-requirements.txt）。
      - name: 安裝 zizmor 1.31.1
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r scripts/ci/zizmor-requirements.txt
      - name: zizmor（auditor：不隱藏低信心的發現）
        run: zizmor --no-progress --persona=auditor --min-severity=informational .

  gate:
    # The only required check on main: it passes when every other job in this workflow succeeded or was skipped.
    name: gate (supply-chain)
    if: always()
    needs: [go-changes, govulncheck, osv-scanner, shaded-jar-gate, gitleaks, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a needed job ended with: $r"; exit 1 ;; esac
          done
