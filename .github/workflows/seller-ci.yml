name: seller-app CI

on:
  pull_request:
    paths:
      - 'seller-app/**'
      - 'packages/hawkr_api/**'
      - 'packages/hawkr_auth/**'
      - 'packages/hawkr_app_update/**'
      - 'packages/hawkr_twaddr/**'
      # 共用文案目錄（hawkr_ui_text）。
      - 'packages/hawkr_ui_text/**'
      - '.github/workflows/seller-ci.yml'
      - '.github/workflows/_flutter-quality.yml'
  push:
    branches: [main]
    paths:
      - 'seller-app/**'
      - 'packages/hawkr_api/**'
      - 'packages/hawkr_auth/**'
      - 'packages/hawkr_app_update/**'
      - 'packages/hawkr_twaddr/**'
      # 共用文案目錄（hawkr_ui_text）。
      - 'packages/hawkr_ui_text/**'
      - '.github/workflows/seller-ci.yml'
      - '.github/workflows/_flutter-quality.yml'
  workflow_dispatch:

concurrency:
  group: seller-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/_flutter-quality.yml
    with:
      app: seller-app
      check-generated: true
      test-args: --concurrency=4
