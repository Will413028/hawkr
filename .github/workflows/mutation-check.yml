name: mutation check

# 變異清單（**/mutations/*.json）裡的每一筆改動都必須讓它的測試指令失敗（被殺掉）；
# 存活或改動套不上就失敗。腳本與格式見 scripts/mutation-check.py。
# 整合測試用 testcontainers 在 runner 上起 postgres，和 backend-integration-tests 一樣，不另設 service。
# 只在清單、腳本或本 workflow 變動時跑；變異會改工作區，只在 CI 的 checkout 跑。

on:
  pull_request:
    paths: &mutation_paths
      - '**/mutations/*.json'
      - 'scripts/mutation-check.py'
      - 'scripts/test_mutation_check.py'
      - '.github/workflows/mutation-check.yml'
  push:
    branches: [main, dev]
    paths: *mutation_paths
  workflow_dispatch:

concurrency:
  group: mutation-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: backend/**/go.sum
      - name: Script unit tests
        run: python3 -m unittest scripts/test_mutation_check.py
      - name: Every edit applies
        run: python3 scripts/mutation-check.py --check-only
      - name: Run mutations
        run: python3 scripts/mutation-check.py
