name: iOS lockfile check

# 攔下 pubspec.lock ↔ ios/Podfile.lock 不一致，避免到 iOS build 跑 pod install 才失敗。
#
# 目前只手動觸發（兩支 App 都檢查）：repo 是 private，macOS runner 以 10 倍計費，一次約 70 分鐘，
# 而上線前還沒有 iOS build（App CD 是路線的第 5 步）。建立 App CD 時恢復自動觸發：pull_request 與
# push 到 main，路徑是 *-app/pubspec.{yaml,lock}、*-app/ios/{Podfile,Gemfile}{,.lock} 與本檔。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/ios-lockfile-check.yml'
            buyer-app:
              - 'buyer-app/pubspec.*'
              - 'buyer-app/ios/Podfile*'
              - 'buyer-app/ios/Gemfile*'
            seller-app:
              - 'seller-app/pubspec.*'
              - 'seller-app/ios/Podfile*'
              - 'seller-app/ios/Gemfile*'
      # 手動觸發或 workflow 本身改動時兩個 App 都檢查。
      - name: Resolve apps to check
        id: apps
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflow == 'true' }}
          BUYER: ${{ steps.filter.outputs.buyer-app }}
          SELLER: ${{ steps.filter.outputs.seller-app }}
        run: |
          apps=()
          if [[ "$ALL" == "true" || "$BUYER" == "true" ]]; then apps+=('"buyer-app"'); fi
          if [[ "$ALL" == "true" || "$SELLER" == "true" ]]; then apps+=('"seller-app"'); fi
          echo "apps=[$(IFS=,; echo "${apps[*]}")]" >> "$GITHUB_OUTPUT"

  ios-lockfile-check:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - name: Read Flutter version from .fvmrc
        id: fvmrc
        run: echo "flutter_version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.flutter_version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ matrix.app }}/ios
      # --deployment 把 Podfile.lock 當唯讀，lock 與 dependency 不一致就直接失敗。
      - name: Verify Podfile.lock matches pubspec
        working-directory: ${{ matrix.app }}/ios
        run: bundle exec pod install --deployment
      - name: Suggest fix
        if: failure()
        run: |
          echo "::error title=Lockfile Mismatch::${{ matrix.app }} 的 Podfile.lock / pubspec.lock 與 dependency 不一致"
          echo "在 ${{ matrix.app }}/ 下執行後 commit 兩個 lock 檔："
          echo "  flutter pub get"
          echo "  cd ios && bundle install --quiet && bundle exec pod install --repo-update"
