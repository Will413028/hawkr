name: backend monolith

# Go modular monolith（backend/ 根 module）的檢查：gofmt、vet、race test（含 internal/arch
# 的依賴方向檢查）、帶 integration tag 的測試（testcontainers 起真的 Postgres，
# 含每個模組的 schema 隔離與 schema.sql 和 migration 的一致性）、Connect、sqlc、jet、CodeMeta 生成物
# drift（sqlc 另外確認 query 參照別的模組時生成會失敗）、go mod tidy drift。
# 遷移計畫：backend/docs/plans/2026-09-24-go-modular-monolith.md。
#
# GOWORK=off：單體必須能獨立建置，不能靠 go.work 借用舊服務的 module。
# 每一步都 if: always()，前面失敗也照跑，一次看到全部問題。

on:
  pull_request:
    paths: &monolith_paths
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/.go-version'
      - 'backend/.golangci.monolith.yml'
      - 'backend/.golangci-version'
      - 'backend/cmd/**'
      - 'backend/internal/**'
      - 'backend/Makefile'
      - 'backend/scripts/gen-sqlc.sh'
      - 'backend/scripts/integration-packages.py'
      - 'backend/scripts/test_integration_packages.py'
      - 'backend/docs/代碼管理（CodeMeta）/**'
      - 'backend/pkg/media/ref_type.go'
      - 'website/lib/codemeta/generated.ts'
      - 'admin/src/lib/codemeta/generated.ts'
      - 'buyer-app/lib/core/codemeta/code_meta.dart'
      - 'seller-app/lib/core/codemeta/code_meta.dart'
      - 'backend/buf.gen.connect.yaml'
      - 'backend/buf.gen.legacy.yaml'
      - 'backend/api/proto/media/**'
      - 'backend/infra/mq/topology/topology.yaml'
      - 'api/**'
      - '.github/workflows/backend-monolith.yml'
  push:
    branches: [main, dev]
    paths: *monolith_paths
  workflow_dispatch:

concurrency:
  group: backend-monolith-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  GOWORK: 'off'

jobs:
  lint:
    name: golangci-lint（${{ matrix.tags == '' && '一般' || matrix.tags }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tags: ['', integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安裝 libvips（media 模組以 cgo 連結）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: backend/go.sum
      - name: 讀取 golangci-lint 的版本
        id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: backend
          args: --config=.golangci.monolith.yml --build-tags=${{ matrix.tags }} ./cmd/... ./internal/...

  integration:
    name: integration test（testcontainers）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR history
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout default history
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: integration package selector tests
        run: python3 -m unittest scripts/test_integration_packages.py
      - name: 安裝 libvips（media 模組以 cgo 連結）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/.go-version
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-monolith-integration-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-monolith-integration-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-monolith-integration-${{ runner.os }}-
      - name: 讀取 PR 改動路徑
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only --no-renames "origin/$BASE_REF"...HEAD > "$RUNNER_TEMP/changed-files"
      # 只跑加上 integration tag 後測試執行檔會改變的 package（自己或連結進來的依賴有 tag 檔，
      # 見 scripts/integration-packages.py）；其餘 package 的測試執行檔和 check job 的 go test 相同，不重跑。
      # 壓力測試（testdb.RequireStress）只在上線前跑：要合併進 main 的 PR、main 的 push，與手動觸發。
      - name: integration test（testcontainers）
        env:
          # 各 package 行程之間在 -race 編譯大型 package 時可能空窗超過 10 秒；Ryuk 預設 10 秒沒人連線
          # 就會刪掉共用的 container。設成比下面 go test 的 -timeout 長，讓 Ryuk 撐到整輪結束。
          TESTCONTAINERS_RYUK_RECONNECTION_TIMEOUT: 15m
          HAWKR_STRESS_TESTS: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          args=()
          if [[ -f "$RUNNER_TEMP/changed-files" ]]; then
            args+=(--changed-files "$RUNNER_TEMP/changed-files")
          fi
          python3 scripts/integration-packages.py "${args[@]}" > "$RUNNER_TEMP/integration-packages"
          mapfile -t pkgs < "$RUNNER_TEMP/integration-packages"
          echo "integration packages: ${#pkgs[@]}"
          if [[ ${#args[@]} -gt 0 && ${#pkgs[@]} -eq 0 ]]; then
            echo "no affected integration packages; skipping go test"
            exit 0
          fi
          go test -race -timeout 15m -tags integration "${pkgs[@]}"
      - name: 刪掉 7 天沒用到的 build cache
        if: always() && github.event_name == 'push'
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -type f -mtime +7 -delete
          du -sh ~/.cache/go-build
      - name: 存 Go 快取（只有 main、dev 的 push）
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-monolith-integration-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}

  check:
    name: gofmt／vet／test／tidy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安裝 libvips（media 模組以 cgo 連結）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/.go-version
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-monolith-check-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-monolith-check-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            go-monolith-check-${{ runner.os }}-

      - name: gofmt -l
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::以下檔案未通過 gofmt，請在本機跑 gofmt -w 後重推："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet（含 integration、gateway tag 的測試檔）
        if: always()
        run: |
          go vet ./...
          go vet -tags integration ./...
          go vet -tags gateway ./internal/httpapi/...

      - name: go test（含依賴方向檢查）
        if: always()
        run: go test -race ./...

      - name: 讀取 buf 的版本
        if: always()
        id: buf
        run: echo "version=$(cat ../api/.buf-version)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        if: always()
        with:
          version: ${{ steps.buf.outputs.version }}
          setup_only: true
      - name: Connect 生成物 drift
        if: always()
        run: |
          make connect
          paths=(internal/httpapi/gen internal/legacy/gen)
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git status --short -- "${paths[@]}"
            echo "::error::internal/httpapi/gen 或 internal/legacy/gen 與 proto 不一致，請在本機跑 make connect 後 commit"
            exit 1
          fi

      - name: sqlc 生成物 drift 與 query 隔離
        if: always()
        run: |
          make sqlc
          if [ -n "$(git status --porcelain -- internal/modules)" ]; then
            git status --short -- internal/modules
            echo "::error::模組的 sqlc 生成物與 db/ 不一致，請在本機跑 make sqlc 後 commit"
            exit 1
          fi
          # 故意違規的 fixture：query 參照別的模組的 schema，生成必須失敗（ADR D3 的機械檢查）。
          image=$(sed -n 's/^IMAGE="\(.*\)"$/\1/p' scripts/gen-sqlc.sh)
          # 比對錯誤訊息，不只看 exit code：別的原因（例如 image 拉不到）失敗不算數。
          out=$(docker run --rm -v "$PWD/internal/arch/testdata/sqlc-foreign-schema:/work" -w /work "$image" generate 2>&1 || true)
          echo "$out"
          if ! grep -q 'schema "seller" does not exist' <<<"$out"; then
            echo "::error::參照別的模組 schema 的 query 沒有因為 schema 不存在而失敗，query 隔離檢查失效"
            exit 1
          fi

      - name: jet 生成物 drift
        if: always()
        run: |
          make jet
          if [ -n "$(git status --porcelain -- internal/modules)" ]; then
            git status --short -- internal/modules
            echo "::error::模組的 jet 生成物（internal/jet、internal/pubsql）與 db/ 不一致，請在本機跑 make jet 後 commit"
            exit 1
          fi

      - name: CodeMeta 生成物 drift
        if: always()
        run: |
          "./docs/代碼管理（CodeMeta）/scripts/generate.sh" --go --go-media --web --admin --flutter
          paths=(internal/platform/codemeta internal/modules/media pkg/media
            ../website/lib/codemeta/generated.ts ../admin/src/lib/codemeta/generated.ts
            ../buyer-app/lib/core/codemeta/code_meta.dart ../seller-app/lib/core/codemeta/code_meta.dart)
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git status --short -- "${paths[@]}"
            git diff --stat -- "${paths[@]}"
            echo "::error::CodeMeta 生成物與 docs/代碼管理（CodeMeta）不一致，請在本機跑 generate.sh --go --go-media --web --admin --flutter 後 commit"
            exit 1
          fi

      - name: go mod tidy drift
        if: always()
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            echo "::error::go mod tidy 產生了變更，請在本機跑 go mod tidy 後 commit"
            exit 1
          fi
      - name: 刪掉 7 天沒用到的 build cache
        if: always() && github.event_name == 'push'
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -type f -mtime +7 -delete
          du -sh ~/.cache/go-build
      - name: 存 Go 快取（只有 main、dev 的 push）
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-monolith-check-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
