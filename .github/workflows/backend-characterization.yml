name: backend characterization

# 特性測試：scripts/characterize.sh <模組> 在 runner 上起單體、gateway 與搬遷中模組的舊服務，
# 同一份情境以 REST 打舊服務、以 Connect 打單體（計畫 2026-10-18-a7-social.md A7-2v）。
# 每個有 internal/httpapi/<模組>/characterization/legacy.sh 的模組一個 matrix 項，清單由第一個 job 掃檔案得出，
# 不手抄。腳本只用 Docker 的 Postgres、Redis 與本機服務，不連外（服務以 env -i 啟動）。
# 終點：最後一個 legacy.sh 刪除時，連同本 workflow 一起刪除。
#
# 這裡不設 GOWORK：characterize.sh 自己決定哪一步用 go.work（gateway、舊服務）、哪一步 GOWORK=off（單體）。

on:
  pull_request:
    paths: &characterization_paths
      - 'backend/internal/**'
      - 'backend/cmd/**'
      - 'backend/gateway/**'
      - 'backend/services/**'
      - 'backend/pkg/**'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/go.work'
      - 'backend/.go-version'
      - 'backend/scripts/characterize.sh'
      - 'backend/docker-compose-infra.yml'
      - 'backend/scripts/init-databases.sh'
      - 'backend/infra/seed-data/**'
      - '.github/workflows/backend-characterization.yml'
  push:
    branches: [main, dev]
    paths: *characterization_paths
  workflow_dispatch:

concurrency:
  group: backend-characterization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  modules:
    name: 找出有舊服務的模組
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 沒有任何 legacy.sh 是合法的空結果（matrix 項為空，下一個 job 略過），不讓 step 變紅。
      - name: 掃描 legacy.sh
        id: modules
        run: |
          set -euo pipefail
          modules=$(
            for f in backend/internal/httpapi/*/characterization/legacy.sh; do
              [ -e "$f" ] || continue
              basename "$(dirname "$(dirname "$f")")"
            done | jq -R . | jq -sc .
          )
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "將跑特性測試：$modules"

  characterize:
    name: ${{ matrix.module }} 特性測試
    needs: modules
    if: needs.modules.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/.go-version
          cache-dependency-path: backend/**/go.sum
      # legacy.sh 用 atlas 套舊服務的 migration；版本與雜湊同 backend-db-proto-checks.yml。
      - name: 安裝 Atlas v1.3.3（驗證雜湊）
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.3
          echo "a41ea66b5aaad1e363fd829613a6725c3934378792d0be5591269c041c112b96  $RUNNER_TEMP/bin/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/atlas"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # characterize.sh 用 lsof 檢查 port；runner image 沒有時才裝。
      - name: 確認 lsof
        run: command -v lsof >/dev/null || sudo apt-get install -y lsof
      # 只起腳本要的 Postgres 與 Redis（容器名 hawkr-postgres 是腳本 docker exec 的目標）。
      - name: 起 Postgres 與 Redis
        run: docker compose -f docker-compose-infra.yml up -d --wait postgres redis
      - name: 特性測試
        env:
          ATLAS_NO_UPDATE_NOTIFIER: '1'
          MODULE: ${{ matrix.module }}
        run: scripts/characterize.sh "$MODULE"
      - name: 容器 log（失敗時）
        if: failure()
        run: docker compose -f docker-compose-infra.yml logs --no-color postgres redis | tail -n 200
