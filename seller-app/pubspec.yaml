# @format

name: hawkr_seller
description: "Hawkr Seller App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6
# build_number 不再寫死在 pubspec — 改由 scripts/local-testflight.sh 跑 build 時
# 動態帶 --build-number=$(git rev-list --count HEAD)。CI 同樣從 git rev-list 推導。
# version (1.0.0) 只在真版號變動時改（1.0.0 → 1.0.1）。

environment:
  sdk: ">=3.8.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  image_picker: ^1.2.0
  flutter_image_compress: ^2.3.0
  shared_preferences: ^2.5.3
  photo_manager: ^3.7.1
  video_player: ^2.10.0
  flutter_svg: ^2.2.0
  package_info_plus: ^9.0.1
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^18.0.0
  logger: ^2.4.0
  # 對外 API（根目錄 api/ 的 Protobuf＋Connect）：生成的 client、transport 與錯誤分派，與 buyer-app 共用。
  hawkr_api:
    path: ../packages/hawkr_api
  hawkr_auth:
    path: ../packages/hawkr_auth
  # App 版本門檻的檢查邏輯（設計書 54），與另一支 App 共用。
  hawkr_app_update:
    path: ../packages/hawkr_app_update
  # 內政部鄉鎮市區代碼表與查詢（由 backend/internal/platform/twaddr 生成），與另一支 App 共用。
  hawkr_twaddr:
    path: ../packages/hawkr_twaddr
  # 共用文案目錄（由 backend/internal/platform/uitext 生成），與另一支 App 共用。
  hawkr_ui_text:
    path: ../packages/hawkr_ui_text
  dio: ^5.4.0
  sentry_flutter: ^9.25.0
  sentry_dio: ^9.25.0
  rxdart: ^0.28.0 # BehaviorSubject for emit-on-subscribe chat streams (§6.6)
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  uuid: ^4.5.1
  photo_manager_image_provider: ^2.2.0

  # === 漸進式重構新增依賴 ===
  # State Management
  flutter_riverpod: ^3.0.0
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.2
  riverpod_annotation: ^4.0.0

  # Immutability / Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.8.1

  path: ^1.9.1
  flutter_screenutil: ^5.9.3
  palette_generator_plus: ^1.0.0
  sensors_plus: ^6.1.1
  # Clerk 的 OAuth（Google、LINE）在系統瀏覽器完成（iOS 的 ASWebAuthenticationSession）：Google 不允許在 App 內嵌的
  # WebView 登入。
  # 用於商品說明 rich text editor 的 inline hashtag chip 渲染
  extended_text_field: ^16.0.2

  vector_math: ^2.2.0
  firebase_analytics: ^12.4.2
  flutter_quill: ^11.5.0
dev_dependencies:
  protobuf: 6.1.0
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  firebase_core_platform_interface: ^7.0.1
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_flavorizr: ^2.1.3
  flutter_release_cli: ^0.1.19
  dependency_validator: ^5.0.2

  # === 漸進式重構新增 code generation 依賴 ===
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.2
  riverpod_generator: ^4.0.0
  dart_code_linter: ^3.1.1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

dependency_overrides:
  # 2.6.x uses the objective_c FFI/native-assets implementation on Darwin.
  # That currently fails to load on our iOS simulator runtime and breaks
  # CachedNetworkImage/path_provider during avatar refresh.
  path_provider_foundation: 2.4.2

# dependency_validator 的 ignore 白名單見 dart_dependency_validator.yaml

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/hawkrlogo.png
    - assets/rece_qr.png
    - assets/rece_qr2.png
    - assets/real_name/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ============================================================
# Flutter Flavorizr 配置
# ============================================================
flavorizr:
  app:
    ios:
      workspace: "Runner.xcworkspace"
  flavors:
    dev:
      app:
        name: "賣家版"
      ios:
        bundleId: "io.github.will413028.hawkr.seller.dev"
        productName: "賣家版"
        buildSettings:
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) FLUTTER_FLAVOR=dev"
    stage:
      app:
        name: "賣家版"
      ios:
        bundleId: "io.github.will413028.hawkr.seller.stage"
        productName: "賣家版"
        buildSettings:
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) FLUTTER_FLAVOR=stage"
    prod:
      app:
        name: "賣家版"
      ios:
        bundleId: "io.github.will413028.hawkr.seller"
        productName: "賣家版"
        buildSettings:
          GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) FLUTTER_FLAVOR=prod"
# 原生啟動畫面（對齊網頁品牌 splash：亮 #F8F6EF / 暗 #1F2933）
# 修改後執行：fvm dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F8F6EF"
  image: assets/brand/splash_mark.png
  color_dark: "#1F2933"
  image_dark: assets/brand/splash_mark_wheat.png
  android: false
